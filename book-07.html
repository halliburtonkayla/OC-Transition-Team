. Gia had texted: 'Did you hear what they said about you?'", "Jocquan immediately sat up. 'WHAT? Who said something about me?' Across the room, Max noticed his face. 'Uh-oh. Somebody mad.'", "Before Jocquan knew the whole story, he started typing a response\u2014and it was definitely not a friendly one.", "Just before he hit send, Ms. Kayla appeared. Jocquan groaned. 'Not today! I'm tired of y'all pulling me out of class!'", "During Transition, they talked about angry messages. Does a message have to be answered immediately? Is everything someone texts automatically true?", "Gia admitted, 'No.' Max shook his head too. Jocquan looked back at the message and decided not to send his response yet.", "Later, he talked directly to the person involved and discovered the whole situation had been a misunderstanding.", "'If I'd sent that message, I would've started all that drama for nothing,' Jocquan admitted. Max laughed. 'And probably got your phone taken too.'", "The next week, Jocquan still sighed dramatically when Ms. Kayla appeared\u2014but he was already getting out of his seat.", "TAKEAWAY: You don't have to react immediately when you're angry. Pause, check the facts, and choose a response that won't turn one bad moment into a bigger problem."];let p=0;function render(){document.getElementById('storyText').textContent=pages[p];document.getElementById('pageNo').textContent='Page '+(p+1)+' of '+pages.length;}function next(){if(p<pages.length-1){p++;render()}else location.href='../index.html'}function prev(){if(p>0){p--;render()}}render();</script></body></html>
