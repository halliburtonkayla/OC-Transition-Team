<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Drama | Transition Team</title><style>:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--paper:#fffdf7;--ink:#172033}*{box-sizing:border-box}body{margin:0;background:#e9edf5;font-family:Arial,sans-serif;color:var(--ink)}nav{background:var(--navy);padding:14px 18px}nav a{color:#fff;text-decoration:none;font-weight:800}main{max-width:980px;margin:auto;padding:24px}.cover,.book{background:var(--paper);border-radius:22px;box-shadow:0 15px 45px #102a5c25;overflow:hidden}.cover{padding:52px 34px;text-align:center;background:linear-gradient(145deg,#fffdf7,#edf3ff)}h1,h2{font-family:Georgia,serif;color:var(--navy)}h1{font-size:clamp(2.4rem,7vw,4.5rem);margin:10px}.sub{font-size:1.15rem;line-height:1.6;max-width:680px;margin:15px auto}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:25px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer;background:var(--navy);color:white}.btn.alt{background:#e7edf8;color:var(--navy)}.page{min-height:560px;padding:42px clamp(22px,6vw,70px)}.chapter{font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}.page h2{font-size:2.2rem}.page p{font-family:Georgia,serif;font-size:1.22rem;line-height:1.75}.dialogue{border-left:5px solid var(--blue);background:#f4f7fc;padding:18px 20px;margin:22px 0;border-radius:0 14px 14px 0}.voice-tag{display:inline-block;font-size:.75rem;border-radius:999px;padding:5px 9px;background:#dde8ff;color:#17376f;font-weight:900}.choicebox{margin-top:28px;padding:22px;background:#eef4ff;border-radius:16px}.choice{display:block;width:100%;text-align:left;margin:9px 0;border:2px solid #c6d4ee;background:white;padding:13px;border-radius:10px;font-weight:700;cursor:pointer}.feedback{font-weight:800;margin-top:12px}.lesson{background:#fff3d8;border:1px solid #e6c66c;padding:16px;border-radius:14px;margin:24px 0;font-weight:700;line-height:1.5}.footer{display:flex;justify-content:space-between;gap:10px;padding:18px 24px;background:#f3f6fb}.counter{align-self:center;font-weight:800;color:#53627c}@media(max-width:600px){main{padding:12px}.page{min-height:620px;padding:30px 20px}.page p{font-size:1.12rem}}</style></head><body><nav><a href="stories.html">← Interactive Stories</a></nav><main><section class="cover" id="cover"><div class="chapter">Self-Advocacy / Workplace Readiness</div><h1>The Drama</h1><p class="sub">A realistic story about privacy, rumors, social media, honesty, and rebuilding trust.</p><div class="controls"><button class="btn" onclick="start(true)">🔊 Read to Me</button><button class="btn alt" onclick="start(false)">Read Myself</button></div><p><b>Multiple character voices + narrator</b></p></section><section class="book" id="book" style="display:none"><div id="page"></div><div class="footer"><button class="btn alt" onclick="prev()">← Previous</button><span class="counter" id="count"></span><button class="btn" onclick="next()">Next →</button></div></section></main><script>const pages=[["A Secret",[["n","Your friend Maya tells you something personal and asks you not to repeat it."],["m","Please don't tell anybody. I'm not ready for everybody to know."],["n","Later, another friend starts asking questions because they can tell something is going on."]],["Tell them the whole story.","Say it is not your information to share.","Give enough hints for them to figure it out."],1,"Privacy is a boundary. If it is not your story, you do not need to tell it."],["Pressure",[["a","Come on. You know you can trust me. I won't tell anybody."],["n","That promise does not change the fact that Maya asked you to keep her information private."]],["Repeat your boundary.","Give in because they keep asking.","Post something vague online."],0,"You can repeat a boundary without arguing: 'It's not my information to share.'"],["The Rumor",[["n","Someone else posts a vague comment, and people begin guessing. Some of the guesses are completely wrong."],["m","Why is everybody talking about me?"],["n","You now have a choice about whether you add to the rumor or help stop it."]],["Correct every detail by revealing the secret.","Stop discussing the details and ask others to stop spreading it.","Stay involved because the rumor is interesting."],1,"Trying to 'correct' gossip can still expose private information. Stop feeding the rumor."],["Trust",[["n","You tell Maya that people were asking questions and explain that you did not share her private information."],["m","Thank you. I just needed somebody I could trust."],["n","Trust is often built through small decisions nobody else sees."]],null,null,"Skills practiced: privacy • boundaries • communication • trust • responsible social media use"]];pages.splice(pages.length-1,0,...[["The Screenshot Question",[["n","Another friend shows you a screenshot and asks whether the rumor is true."],["a","Just tell me yes or no. I'm not asking for the whole story."],["n","Even confirming one detail could reveal information Maya asked you to keep private."]],["Confirm only the part you think everybody already knows.","Say Maya can share her own information when she is ready.","Ask to see who else received the screenshot."],1,"A boundary does not disappear because part of a rumor is already circulating."],["Maya Gets Angry",[["m","I feel like everybody is staring at me. I don't even know who knows what anymore."],["n","Maya is frustrated and asks whether you know who started the rumor."],["n","You have heard guesses, but you do not actually know."]],["Name the person you suspect.","Tell Maya what you know for certain and separate it from what you only heard.","Repeat every rumor so Maya knows everything."],1,"Good support means separating facts from guesses instead of adding another accusation."],["The Group Chat",[["n","Someone creates a group chat to 'clear everything up' and adds Maya without asking."],["a","Maya, just tell everybody the truth so this can be over."],["m","I shouldn't have to explain something personal to a whole group just because people started talking."],["n","You decide whether to join the pressure or support Maya's boundary."]],["Tell Maya explaining everything is the fastest solution.","Say the group should stop discussing information Maya did not choose to share.","Stay silent while everyone pressures her."],1,"A person does not lose the right to privacy because other people became curious."],["After the Rumor Dies Down",[["n","A few days later, the gossip begins to fade because people stop feeding it."],["m","Thank you for not making me explain myself before I was ready."],["n","You learn that being a trustworthy friend sometimes means knowing information and choosing not to use it."]],null,null,"Skills practiced: privacy • fact versus rumor • boundaries • supporting a friend without taking over • responsible communication"]]);let i=0,auto=false;function lab(k){return k==='n'?'Narrator':({m:'Marcus',a:'Friend',s:'Student',f:'Family',r:'Friend',y:'You'}[k]||'Character')}function voices(k){let v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));if(!v.length)v=speechSynthesis.getVoices();let male=/male|david|daniel|alex|aaron|fred/i,female=/samantha|victoria|zira|ava|allison|female/i;if(['m','r','y'].includes(k))return v.find(x=>male.test(x.name))||v[0];if(['a','s','f'].includes(k))return v.find(x=>female.test(x.name))||v[v.length-1];return v.find(x=>/samantha|ava|allison|narrator/i.test(x.name))||v[0]}function render(){speechSynthesis.cancel();let p=pages[i],h='<article class="page"><div class="chapter">The Drama</div><h2>'+p[0]+'</h2>';p[1].forEach(x=>h+=(x[0]==='n'?'<div>':'<div class="dialogue">')+'<span class="voice-tag">'+lab(x[0])+'</span><p>'+x[1]+'</p></div>');if(p[2]){h+='<div class="choicebox"><h3>What would you do?</h3>';p[2].forEach((x,z)=>h+='<button class="choice" onclick="ans('+z+','+p[3]+')">'+String.fromCharCode(65+z)+' — '+x+'</button>');h+='<div class="feedback" id="fb"></div></div>'}if(p[4])h+='<div class="lesson">'+p[4]+'</div>';h+='</article>';document.getElementById('page').innerHTML=h;document.getElementById('count').textContent='Page '+(i+1)+' of '+pages.length;if(auto)setTimeout(read,250)}function ans(a,b){document.getElementById('fb').textContent=a===b?'✓ Strong choice. Think about why this protects your goals, safety, or relationships.':'Think it through again. What consequence could this choice create?'}function read(){speechSynthesis.cancel();let q=0,p=pages[i][1];function go(){if(q>=p.length)return;let x=p[q++],u=new SpeechSynthesisUtterance(x[1]);u.voice=voices(x[0]);u.rate=x[0]==='n'?.94:1;u.onend=go;speechSynthesis.speak(u)}go()}function start(r){auto=r;document.getElementById('cover').style.display='none';document.getElementById('book').style.display='block';render()}function next(){if(i<pages.length-1){i++;render()}else location.href='stories.html'}function prev(){if(i>0){i--;render()}}</script><script src="session.js"></script></body></html>
