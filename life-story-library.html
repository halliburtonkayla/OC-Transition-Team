<script>function friendlySpeak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices();
  const en=voices.filter(v=>/^en(-|_)/i.test(v.lang||''));
  const preferred=['Ava','Samantha','Zoe','Aria','Jenny','Emma','Joanna','Allison','Serena','Tessa','Victoria','Karen','Moira','Fiona','Siri Female'];
  let voice=preferred.map(n=>en.find(v=>(v.name||'').toLowerCase().includes(n.toLowerCase()))).find(Boolean);
  if(!voice) voice=en.find(v=>/female|woman|girl|natural|premium|enhanced/i.test(v.name||''));
  if(!voice) voice=en[0]||voices[0];
  if(voice) u.voice=voice;
  u.rate=1.03; u.pitch=1.12; u.volume=1;
  speechSynthesis.speak(u);
}

let current=null,page=0,score={planning:0,safety:0,money:0,communication:0};
const grid=document.querySelector('#grid'),lib=document.querySelector('#library'),book=document.querySelector('#book');
stories.forEach((s,i)=>{const c=document.createElement('article');c.className='card';c.innerHTML=`<div style="font-size:38px">${s[1]}</div><div class="tag">20-SCENE STORY • ${s[5].toUpperCase()}</div><h2>${s[2]}</h2><p class="muted">Main character: ${s[3]} — ${s[4]}. Choices change the outcome.</p><button type="button" data-i="${i}">START STORY →</button>`;grid.appendChild(c)});
grid.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;start(+b.dataset.i)});
function start(i){current=stories[i];page=0;score={planning:0,safety:0,money:0,communication:0};lib.classList.add('hidden');book.classList.remove('hidden');draw()}
function choice(kind){score[kind]++;page++;draw()}
function read(){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(document.querySelector('#sceneText').innerText))}
function draw(){if(page>=20){ending();return}const title=current[6][page], pct=Math.round((page/20)*100);book.innerHTML=`<div class="scene"><div class="sceneTop"><b>${current[1]} ${current[2]}</b><span>Page ${page+1} of 20</span></div><div class="meter"><i style="width:${pct}%"></i></div><div class="art"><div><div class="avatar">${current[1]} 🧑🏽</div><strong>${title}</strong><span class="muted">Animated-story scene • ${current[3]}</span></div></div><h2>${title}</h2><p id="sceneText">You are ${current[3]}. This part of your ${current[5]} story has reached <b>${title.toLowerCase()}</b>. Look at what is happening, think about what you need now and what could happen later, then choose how you will respond.</p><div class="stats"><span class="pill">Planning ${score.planning}</span><span class="pill">Safety ${score.safety}</span><span class="pill">Money ${score.money}</span><span class="pill">Communication ${score.communication}</span></div><div class="choices"><button type="button" onclick="choice('planning')">🧭 Pause, check the plan, then act</button><button type="button" onclick="choice('communication')">💬 Ask a question or communicate clearly</button><button type="button" onclick="choice('${page%2?'money':'safety'}')">⚡ Make the quick choice and deal with what follows</button></div><p><button class="read" type="button" onclick="read()">🔊 READ TO ME</button> <button class="back" type="button" onclick="quitStory()">← STORY LIBRARY</button></p></div>`}
function ending(){const total=Object.values(score).reduce((a,b)=>a+b,0);const strongest=Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0];book.innerHTML=`<div class="scene"><div class="art"><div><div class="avatar">🏁 ${current[1]}</div><strong>Here’s How Your Story Turned Out</strong></div></div><h1>${current[2]}</h1><div class="ending"><p>You completed all <b>20 scenes</b>. Your strongest decision area in this run was <b>${strongest}</b>.</p><p>Planning: ${score.planning} • Safety: ${score.safety} • Money: ${score.money} • Communication: ${score.communication}</p><p>The point is not to get a perfect score. Replay the story and see how changing earlier decisions changes what you practice.</p></div><p><button type="button" onclick="page=0;score={planning:0,safety:0,money:0,communication:0};draw()">🔄 REPLAY THIS STORY</button> <button class="back" type="button" onclick="quitStory()">📚 CHOOSE ANOTHER STORY</button></p></div>`}
function quitStory(){speechSynthesis&&speechSynthesis.cancel();book.classList.add('hidden');lib.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
