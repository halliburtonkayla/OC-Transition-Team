name: Letter Lane checks
on:
  push:
    branches: [main]
    paths: ['letter-lane.html', 'assets/letter-lane/**', 'tests/letter-lane.test.mjs', '.github/workflows/letter-lane-checks.yml']
  pull_request:
    paths: ['letter-lane.html', 'assets/letter-lane/**', 'assets/school-directory/catalogue.mjs', 'assets/classroom-monitor/student.js', 'cdc-center.html', 'game-zone.html', 'transition-town.html', 'tests/letter-lane.test.mjs', '.github/workflows/letter-lane-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Letter collection, retries, rewards, resume, player isolation and school links
        run: node --test tests/letter-lane.test.mjs
      - name: Game scripts
        run: |
          node --check assets/letter-lane/game.mjs
          node --check assets/letter-lane/core.mjs
          node --check assets/letter-lane/pictures.mjs
          node --check assets/letter-lane/voice.mjs
          node --check assets/letter-lane/voice-cues.mjs
