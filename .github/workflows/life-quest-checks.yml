name: Life Quest checks
on:
  pull_request:
    paths: ['transition-mission-2.html', 'assets/life-quest/**', 'assets/classroom-monitor/**', 'assets/school-directory/**', 'transition-town.html', 'game-zone.html', 'tests/life-quest*', 'tests/helpers/life-quest-player.mjs', 'tools/build-life-quest-review.mjs', '.github/workflows/life-quest-checks.yml']
  push:
    branches: [main]
    paths: ['transition-mission-2.html', 'assets/life-quest/**', 'tests/life-quest*', 'tests/helpers/life-quest-player.mjs', 'tools/build-life-quest-review.mjs']
permissions:
  contents: read
jobs:
  life-quest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated DOM test dependency
        run: npm install --prefix /tmp/life-quest-qa --no-save jsdom@26.1.0
      - name: All 20 missions, avatars, identity, saves, keyboard menus and reporting
        env:
          SCHOOL_JSDOM: /tmp/life-quest-qa/node_modules/jsdom
        run: node --test tests/life-quest.test.mjs tests/life-quest-polish.test.mjs tests/life-quest-dom.test.mjs tests/life-quest-keyboard-routes.test.mjs tests/transition-mission.test.mjs tests/school-release.test.mjs tests/job-missions.test.mjs tests/prism-pour-school.test.mjs
      - name: Existing classroom and student business compatibility
        run: |
          node tests/classroom-monitor.cjs
          node tests/student-shop-core.cjs
