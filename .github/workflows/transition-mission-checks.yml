name: Transition Mission checks
on:
  push:
    branches: [main]
    paths: ['transition-mission.html', 'assets/transition-mission/**', 'tests/transition-mission*', '.github/workflows/transition-mission-checks.yml']
  pull_request:
    paths: ['transition-mission.html', 'assets/transition-mission/**', 'assets/school-directory/**', 'assets/school/entrance.js', 'assets/classroom-monitor/student.js', 'transition-town.html', 'game-zone.html', 'school-directory.html', 'docs/school-inventory.json', 'tests/transition-mission*', '.github/workflows/transition-mission-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: All 30 careers, money, saves, identity isolation, physics and audio
        run: node --test tests/transition-mission.test.mjs
      - name: Install isolated browser-test dependencies
        run: npm install --prefix /tmp/mission-qa --no-save @playwright/test@1.51.1
      - name: Install Chromium
        run: /tmp/mission-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Real tasks for all 30 careers, touch layouts, checkpoints, maps and reports
        env:
          NODE_PATH: /tmp/mission-qa/node_modules
        run: node tests/transition-mission-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transition-mission-browser-evidence
          path: transition-mission-test-output/
          if-no-files-found: ignore
