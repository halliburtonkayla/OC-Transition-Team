<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parenting: Newborn to Toddler</title><style>:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--paper:#f7f9fc;--ink:#24324a;--green:#16794b}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header a{color:white;text-decoration:none;font-weight:800}main{max-width:980px;margin:auto;padding:18px}.book{background:white;border:1px solid #dce3ed;border-radius:22px;padding:24px;box-shadow:0 8px 24px #102a5c12;min-height:520px}.scene{animation:turn .35s ease}@keyframes turn{from{opacity:.2;transform:rotateY(-8deg) translateX(16px)}to{opacity:1;transform:none}}h1,h2{font-family:Georgia,serif;color:var(--navy)}.art{font-size:64px;text-align:center;background:linear-gradient(135deg,#eef5ff,#fff0f5);border-radius:18px;padding:28px;margin:12px 0}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.choices button,.btn{border:0;border-radius:13px;padding:14px 16px;background:var(--blue);color:white;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none}.choices button:nth-child(even){background:var(--navy)}.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#eef3fa;padding:10px 14px;border-radius:12px;margin-bottom:12px}.read{background:var(--green)!important}.muted{color:#66758a}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #dce3ed;border-radius:16px;padding:18px}.card a{display:inline-block;margin-top:8px}.result{background:#eef8f2;border-radius:14px;padding:14px;margin:12px 0}@media(max-width:600px){main{padding:10px}.book{padding:16px}.art{font-size:48px;padding:20px}}</style><link rel="stylesheet" href="session.css"></head><body><header><a href="index.html">← Home</a><a href="life-stories.html">Life Stories</a><strong>Parenting: Newborn to Toddler</strong></header><main><div class="book"><div class="bar"><span id="pg">Page 1 of 20</span><span id="status">Choices shape your story</span></div><div id="scene" class="scene"></div></div></main><script>function friendlySpeak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices();
  const en=voices.filter(v=>/^en(-|_)/i.test(v.lang||''));
  const preferred=['Ava','Samantha','Zoe','Aria','Jenny','Emma','Joanna','Allison','Serena','Tessa','Victoria','Karen','Moira','Fiona','Siri Female'];
  let voice=preferred.map(n=>en.find(v=>(v.name||'').toLowerCase().includes(n.toLowerCase()))).find(Boolean);
  if(!voice) voice=en.find(v=>/female|woman|girl|natural|premium|enhanced/i.test(v.name||''));
  if(!voice) voice=en[0]||voices[0];
  if(voice) u.voice=voice;
  u.rate=1.03; u.pitch=1.12; u.volume=1;
  speechSynthesis.speak(u);
}
const title="Parenting: Newborn to Toddler",icon="\ud83d\udc76",intro="You are the parent/parenting partner. The child grows as your story moves forward.",S=[{"text": "A newborn is coming home. What is your first priority?", "choices": ["Prepare a safe sleep space and supplies", "Buy mostly toys", "Assume you can figure everything out later"]}, {"text": "The baby wakes crying during the night.", "choices": ["Check feeding, diaper, comfort and safety needs", "Turn the TV louder", "Leave the baby in an unsafe place"]}, {"text": "You are exhausted and overwhelmed.", "choices": ["Put baby safely in the crib and get support/take a short reset", "Shake or yell at the baby", "Walk away without making sure baby is safe"]}, {"text": "The baby spits up after feeding.", "choices": ["Clean up, observe baby and follow care guidance", "Panic immediately", "Ignore concerning symptoms if they appear"]}, {"text": "Diapers are running low.", "choices": ["Plan the purchase before they run out", "Wait until the last diaper", "Spend supply money elsewhere"]}, {"text": "You have school/work tomorrow after a rough night.", "choices": ["Arrange shared care/support and plan ahead", "Just miss without contacting anyone", "Assume someone else will handle it"]}, {"text": "The baby has a routine medical appointment.", "choices": ["Keep the appointment and bring questions", "Skip routine care repeatedly", "Guess about every health question"]}, {"text": "The baby is starting solid foods.", "choices": ["Use age-appropriate foods and safe feeding guidance", "Give choking hazards", "Leave baby alone while eating"]}, {"text": "The baby begins crawling.", "choices": ["Babyproof reachable hazards", "Wait for an accident first", "Leave cleaners within reach"]}, {"text": "Childcare falls through unexpectedly.", "choices": ["Contact a trusted safe backup and communicate with work/school", "Leave the child with anyone available", "Leave the baby alone"]}, {"text": "The baby has a fever or seems unusually ill.", "choices": ["Check symptoms and contact an appropriate adult/medical professional as needed", "Give random medicine", "Ignore serious warning signs"]}, {"text": "Money is tight and baby needs supplies.", "choices": ["Prioritize needs and seek legitimate support/resources", "Buy wants first", "Skip necessary supplies"]}, {"text": "The child starts walking.", "choices": ["Secure stairs, furniture and hazards", "Assume they know what is dangerous", "Stop supervising"]}, {"text": "Your toddler throws food during dinner.", "choices": ["Stay calm, set a simple boundary and redirect", "Scream and scare them", "Give up on all routines"]}, {"text": "The toddler melts down in a store.", "choices": ["Keep them safe, stay calm and use a consistent response", "Leave them unattended", "Buy everything demanded"]}, {"text": "Bedtime becomes a battle.", "choices": ["Use a predictable routine and calm limits", "Change bedtime every night", "Use unsafe punishment"]}, {"text": "You want time with friends.", "choices": ["Plan safe childcare and personal time", "Leave without arranging care", "Take the toddler to an unsafe adult event"]}, {"text": "Your parenting partner disagrees about a rule.", "choices": ["Talk privately and make a consistent plan", "Argue in front of the child", "Undermine each other"]}, {"text": "Your toddler copies something you do.", "choices": ["Model the behavior you want to teach", "Say rules only apply to children", "Ignore your own example"]}, {"text": "Your child is now a toddler. What matters going forward?", "choices": ["Safety, consistency, support and learning as you go", "Being perfect all the time", "Doing everything alone"]}];let i=0,score=0,choices=[];function speak(){friendlySpeak(document.getElementById('copy').innerText)}function draw(){let s=S[i];document.getElementById('pg').textContent='Page '+(i+1)+' of '+S.length;let buttons=s.choices.map((c,j)=>`<button data-j="${j}">${c}</button>`).join('');document.getElementById('scene').innerHTML=`<div class="art">${icon}</div><h1>${i===0?title:'What happens next?'}</h1><p id="copy" style="font-size:19px;line-height:1.55">${i===0?intro+' ':''}${s.text}</p><div class="choices"><button class="read" id="read">🔊 READ TO ME</button>${buttons}</div>`;document.getElementById('read').onclick=speak;document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>pick(+b.dataset.j));}function pick(j){choices.push(j); if(j===0)score+=2; else if(j===1)score+=1; i++; if(i>=S.length)finish(); else draw();}function finish(){let level=score>=S.length*1.45?'You consistently protected your priorities and handled problems early.':score>=S.length*.9?'You made a mix of strong choices and choices that created extra challenges.':'Several early choices created harder consequences later. Replay and see how a different decision changes the story.';document.getElementById('pg').textContent='THE END';document.getElementById('scene').innerHTML=`<div class="art">🏁</div><h1>Here’s How Your Story Turned Out</h1><div class="result"><p style="font-size:19px">${level}</p><p>You completed <b>${S.length} scenes</b>. Your decisions—not a single pass/fail answer—shaped this ending.</p></div><div class="choices"><button id="again">🔄 WRITE A DIFFERENT STORY</button><button class="read" id="readEnd">🔊 READ RESULTS</button><button onclick="print()">🖨 PRINT RESULTS</button></div>`;document.getElementById('again').onclick=()=>{i=0;score=0;choices=[];draw()};document.getElementById('readEnd').onclick=speak;}draw();</script><script src="session.js"></script></body></html>
