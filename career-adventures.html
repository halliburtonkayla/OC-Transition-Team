<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Adventures</title><style>:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--paper:#f7f9fc;--ink:#24324a;--green:#16794b}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header a{color:white;text-decoration:none;font-weight:800}main{max-width:980px;margin:auto;padding:18px}.book{background:white;border:1px solid #dce3ed;border-radius:22px;padding:24px;box-shadow:0 8px 24px #102a5c12;min-height:520px}.scene{animation:turn .35s ease}@keyframes turn{from{opacity:.2;transform:rotateY(-8deg) translateX(16px)}to{opacity:1;transform:none}}h1,h2{font-family:Georgia,serif;color:var(--navy)}.art{font-size:64px;text-align:center;background:linear-gradient(135deg,#eef5ff,#fff0f5);border-radius:18px;padding:28px;margin:12px 0}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.choices button,.btn{border:0;border-radius:13px;padding:14px 16px;background:var(--blue);color:white;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none}.choices button:nth-child(even){background:var(--navy)}.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#eef3fa;padding:10px 14px;border-radius:12px;margin-bottom:12px}.read{background:var(--green)!important}.muted{color:#66758a}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #dce3ed;border-radius:16px;padding:18px}.card a{display:inline-block;margin-top:8px}.result{background:#eef8f2;border-radius:14px;padding:14px;margin:12px 0}@media(max-width:600px){main{padding:10px}.book{padding:16px}.art{font-size:48px;padding:20px}}</style><link rel="stylesheet" href="session.css"></head><body><header><a href="index.html">← Home</a><a href="career-explorer.html">Career A–Z</a><strong>Career Adventures</strong></header><main><div id="pick"><h1>🧰 Choose a Career Adventure</h1><p>Every adventure is a 20-scene workday. Choose a featured career or type any career title from Career A–Z.</p><div class="cards" id="featured"></div><p><input id="custom" style="font-size:16px;padding:12px;width:min(100%,520px)" placeholder="Type a career title"><button class="btn" id="go">START THIS CAREER</button></p></div><div id="book" class="book" hidden><div class="bar"><span id="pg"></span><span id="job"></span></div><div id="scene"></div></div></main><script>function friendlySpeak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices();
  const en=voices.filter(v=>/^en(-|_)/i.test(v.lang||''));
  const preferred=['Ava','Samantha','Zoe','Aria','Jenny','Emma','Joanna','Allison','Serena','Tessa','Victoria','Karen','Moira','Fiona','Siri Female'];
  let voice=preferred.map(n=>en.find(v=>(v.name||'').toLowerCase().includes(n.toLowerCase()))).find(Boolean);
  if(!voice) voice=en.find(v=>/female|woman|girl|natural|premium|enhanced/i.test(v.name||''));
  if(!voice) voice=en[0]||voices[0];
  if(voice) u.voice=voice;
  u.rate=1.03; u.pitch=1.12; u.volume=1;
  speechSynthesis.speak(u);
}
const S=[{"text": "Your shift is about to begin.", "choices": ["Arrive early enough to prepare", "Walk in exactly at start time", "Arrive late without calling"]}, {"text": "You review today\u2019s assignments.", "choices": ["Read directions and ask needed questions", "Guess what to do", "Ignore the assignment"]}, {"text": "You need job-specific equipment or supplies.", "choices": ["Check that tools/PPE are ready", "Use damaged equipment", "Skip required safety gear"]}, {"text": "A customer/patient/student/client approaches you.", "choices": ["Greet them professionally and listen", "Ignore them", "Interrupt before hearing the issue"]}, {"text": "You receive a task you have not done alone before.", "choices": ["Clarify expectations and use training", "Pretend you know everything", "Refuse without asking questions"]}, {"text": "A coworker is moving quickly and skips a step.", "choices": ["Follow the safe/proper process", "Copy the shortcut automatically", "Hide the issue"]}, {"text": "You notice a small mistake in your work.", "choices": ["Correct it and communicate if needed", "Cover it up", "Leave it for someone else"]}, {"text": "The workplace gets busy.", "choices": ["Prioritize tasks and communicate", "Rush unsafely", "Stop doing anything"]}, {"text": "Someone is frustrated with the service.", "choices": ["Stay calm, listen and follow workplace procedure", "Argue with them", "Post about them online"]}, {"text": "You handle private or sensitive information.", "choices": ["Protect privacy and follow policy", "Share it with friends", "Leave it visible"]}, {"text": "It is break time.", "choices": ["Take the allowed break and return on time", "Disappear for an hour", "Skip required handoff/coverage"]}, {"text": "A supervisor gives you feedback.", "choices": ["Listen, ask questions and apply it", "Argue immediately", "Ignore the feedback"]}, {"text": "A coworker starts gossiping about someone.", "choices": ["Keep it professional and redirect", "Add to the rumor", "Record and post it"]}, {"text": "An unexpected problem changes the plan.", "choices": ["Pause, assess and get appropriate help", "Panic and leave", "Make a risky guess"]}, {"text": "You have two tasks due soon.", "choices": ["Prioritize by urgency/safety and communicate", "Do only the easiest", "Hide unfinished work"]}, {"text": "You see a possible safety hazard.", "choices": ["Secure/report it using procedure", "Walk past it", "Dare a coworker to test it"]}, {"text": "The end of the shift is approaching.", "choices": ["Finish documentation/cleanup/handoff", "Leave everything out", "Clock out without telling anyone"]}, {"text": "A coworker needs a reasonable handoff.", "choices": ["Share the needed work information", "Say \u201cnot my problem\u201d", "Leave without explaining"]}, {"text": "You reflect on the day.", "choices": ["Identify one strength and one skill to improve", "Assume there is nothing to learn", "Only blame other people"]}, {"text": "Would you explore this career further?", "choices": ["Yes\u2014research training and next steps", "Maybe\u2014compare it with another career", "No\u2014try another career adventure"]}];const jobs=['Registered Nurse','Pediatric Nurse','Teacher','Automotive Mechanic','Diagnostic Medical Sonographer','CNA','Childcare Worker','Veterinary Technician','Welder','Electrician','Carpenter','Cosmetologist','Nail Technician','Photographer','Chef','Retail Associate','EMT','Dental Assistant','Medical Assistant','HVAC Technician','Plumber','Office Assistant','Police Officer','Construction Worker'];let i=0,score=0,title='';featured.innerHTML=jobs.map(j=>`<div class="card"><h2>${j}</h2><button class="btn" data-job="${j}">PLAY 20-SCENE BOOK →</button></div>`).join('');document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>start(b.dataset.job));go.onclick=()=>start(custom.value.trim()||'Career');function start(t){title=t;i=0;score=0;pick.hidden=true;book.hidden=false;draw()}function speak(){friendlySpeak(document.getElementById('copy').innerText)}function draw(){let s=S[i];pg.textContent=`Scene ${i+1} of ${S.length}`;job.textContent=title;scene.className='scene';scene.innerHTML=`<div class="art">🧑‍💼 🛠️</div><h1>${title}: Your Workday</h1><p id="copy" style="font-size:19px">${s.text} Think about how this would look in a real ${title} workplace.</p><div class="choices"><button class="read" id="read">🔊 READ TO ME</button>${s.choices.map((c,j)=>`<button data-c="${j}">${c}</button>`).join('')}</div>`;read.onclick=speak;document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{score+=2-(+b.dataset.c>1?2:+b.dataset.c);i++;i<S.length?draw():finish()})}function finish(){pg.textContent='END OF SHIFT';scene.innerHTML=`<div class="art">🏁</div><h1>How Your ${title} Workday Turned Out</h1><p>You completed 20 workplace scenes involving safety, communication, problem solving, time management and professionalism.</p><div class="choices"><button id="again">🔄 REPLAY THIS CAREER</button><button id="other">🧭 TRY ANOTHER CAREER</button><button onclick="print()">🖨 PRINT</button></div>`;again.onclick=()=>start(title);other.onclick=()=>{book.hidden=true;pick.hidden=false}}const q=new URLSearchParams(location.search).get('career');if(q)start(q);</script><script src="session.js"></script></body></html>
