<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Your Own Story</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff4fb,#eef8ff,#fff7dd);color:#1b2440}header{padding:18px;background:linear-gradient(120deg,#6f54dc,#f06da7,#43bde8);color:#fff}header a{color:#fff;font-weight:900;text-decoration:none}.wrap{max-width:920px;margin:auto;padding:20px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 25px #0001;border:3px solid #eee8ff}.themes,.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.theme,.choice,.read{border:0;border-radius:18px;padding:18px;font-weight:900;cursor:pointer}.theme{font-size:22px;min-height:120px}.theme:nth-child(1){background:#e8ddff}.theme:nth-child(2){background:#dff6ff}.theme:nth-child(3){background:#e5f9e9}.theme:nth-child(4){background:#fff0c8}.story{font-size:26px;line-height:1.45;font-weight:900;background:#faf8ff;border-radius:18px;padding:20px;margin:12px 0;border:3px solid #e5dcff}.choice{background:#eef7ff;font-size:21px;min-height:92px;position:relative;transition:.2s}.choice:nth-child(2){background:#fff0f7}.choice:nth-child(3){background:#edfff4}.choice:nth-child(4){background:#fff5d1}.choice.reading{transform:scale(1.07);box-shadow:0 0 0 6px #ffd85a,0 10px 25px #0002;z-index:2}.choiceNum{display:block;font-size:13px;letter-spacing:.08em;color:#6c7290;margin-bottom:5px}.read{background:#7256d8;color:#fff;margin:8px 6px 8px 0;font-size:18px}.read.answers{background:#ef6fab}.small{font-size:14px;color:#667}.status{font-weight:900;text-align:center;min-height:28px;color:#684dc9}@media(max-width:650px){.themes,.choices{grid-template-columns:1fr}.story{font-size:22px}.choice{font-size:20px}}</style></head><body>
<header><a href="transition-town.html?school=1">← Back to School</a><h1>Build Your Own Story</h1></header><main class="wrap">
<section id="themeScreen" class="card"><h2>Pick a story</h2><p class="small">Tap a story type. The game reads the story and can read each answer choice aloud.</p><div class="themes"><button class="theme" data-theme="adventure">Adventure</button><button class="theme" data-theme="mystery">Mystery</button><button class="theme" data-theme="school">School Day</button><button class="theme" data-theme="job">First Day at Work</button></div></section>
<section id="game" class="card" style="display:none"><div><button id="readStory" class="read">Read Story</button><button id="readAnswers" class="read answers">Read My Choices</button></div><div id="status" class="status" aria-live="polite"></div><div id="story" class="story"></div><div id="choices" class="choices"></div></section>
</main><script>
(()=>{const data={adventure:[['You find a map tucked under a park bench. What do you do?',['Follow the map','Show it to a friend','Take it to a trusted adult']],['The map leads to a locked gate. What do you do next?',['Look for another path','Climb the gate','Go back and get help']],['You hear a strange sound nearby. What do you do?',['Check carefully with a friend','Run toward it','Stay back and listen']]],mystery:[['A classroom prize is missing. What do you do first?',['Look for clues','Accuse someone','Ask what happened']],['You find a note under a desk. What do you do?',['Read it with the teacher','Hide it','Throw it away']],['A clue points to the library. What do you do?',['Go investigate','Ignore it','Ask a friend to come']]],school:[['You get to school and realize you forgot your pencil. What do you do?',['Ask politely for one','Take one without asking','Refuse to work']],['A classmate drops their papers. What do you do?',['Help pick them up','Walk away','Kick the papers']],['The teacher gives a new direction. What do you do?',['Listen and follow it','Talk over the teacher','Do something else']]],job:[['It is your first day at work. Your supervisor gives you a task. What do you do?',['Listen and ask questions','Ignore the directions','Leave the area']],['You finish your task early. What do you do?',['Ask what to do next','Sit and do nothing','Leave without telling anyone']],['You make a mistake at work. What do you do?',['Tell the supervisor and fix it','Hide it','Blame someone else']]]};
let theme='',step=0,currentText='',reading=false;const story=document.querySelector('#story'),choices=document.querySelector('#choices'),status=document.querySelector('#status');
function speak(text,onend){if(!('speechSynthesis'in window)){status.textContent='Read-aloud is not available on this device.';onend&&onend();return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.82;u.onend=()=>onend&&onend();speechSynthesis.speak(u)}
function clearHighlights(){choices.querySelectorAll('.choice').forEach(b=>b.classList.remove('reading'))}
function readStory(){clearHighlights();status.textContent='Reading the story...';speak(currentText,()=>status.textContent='Now choose what happens next.')}
function readChoices(){if(reading)return;const buttons=[...choices.querySelectorAll('.choice')];if(!buttons.length)return;reading=true;clearHighlights();let i=0;function next(){if(i>=buttons.length){reading=false;clearHighlights();status.textContent='Tap the answer you want.';return;}const b=buttons[i];b.classList.add('reading');status.textContent='Choice '+(i+1);speak('Choice '+(i+1)+'. '+b.dataset.choice,()=>{b.classList.remove('reading');i++;setTimeout(next,180)})}next()}
function show(){const s=data[theme][step];currentText=s[0];story.textContent=currentText;choices.innerHTML='';s[1].forEach((c,i)=>{const b=document.createElement('button');b.className='choice';b.dataset.choice=c;b.innerHTML='<span class="choiceNum">CHOICE '+(i+1)+'</span>'+c;b.onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();step++;if(step>=data[theme].length){currentText='The End! You finished your story.';story.textContent=currentText;choices.innerHTML='<button class="choice" id="again"><span class="choiceNum">PLAY AGAIN</span>Choose Another Story</button>';document.querySelector('#again').onclick=()=>location.reload();status.textContent='Story complete!';speak(currentText)}else{show();setTimeout(readStory,250)}};choices.appendChild(b)});status.textContent='Listen, then pick what happens next.'}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;step=0;document.querySelector('#themeScreen').style.display='none';document.querySelector('#game').style.display='block';show();setTimeout(readStory,250)});
document.querySelector('#readStory').onclick=readStory;document.querySelector('#readAnswers').onclick=readChoices})();
</script><script src="assets/classroom-monitor/student.js?v=20261030release" defer></script></body></html>
