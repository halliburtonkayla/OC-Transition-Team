<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Your Own Story</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff4fb,#eef8ff,#fff7dd);color:#1b2440}header{padding:18px;background:linear-gradient(120deg,#6f54dc,#f06da7,#43bde8);color:#fff}header a{color:#fff;font-weight:900;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:20px}.themes,.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.theme,.choice,.read{border:0;border-radius:18px;padding:18px;font-weight:900;cursor:pointer}.theme{font-size:22px;min-height:110px}.theme:nth-child(1){background:#e8ddff}.theme:nth-child(2){background:#dff6ff}.theme:nth-child(3){background:#e5f9e9}.theme:nth-child(4){background:#fff0c8}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 25px #0001;border:3px solid #eee8ff}.story{font-size:24px;line-height:1.45;font-weight:800;background:#faf8ff;border-radius:18px;padding:20px;margin:12px 0}.choice{background:#eef7ff;font-size:18px}.choice:nth-child(2){background:#fff0f7}.choice:nth-child(3){background:#edfff4}.choice:nth-child(4){background:#fff5d1}.read{background:#7256d8;color:white;margin:8px 0}.small{font-size:14px;color:#667}</style></head><body><header><a href="transition-town.html?school=1">← Back to School</a><h1>Build Your Own Story</h1></header><main class="wrap"><section id="themeScreen" class="card"><h2>Pick a story</h2><p class="small">Students can tap the Read to Me button if they want the story read aloud.</p><div class="themes"><button class="theme" data-theme="adventure">Adventure</button><button class="theme" data-theme="mystery">Mystery</button><button class="theme" data-theme="school">School Day</button><button class="theme" data-theme="job">First Day at Work</button></div></section><section id="game" class="card" style="display:none"><button id="read" class="read">Read to Me</button><div id="story" class="story"></div><div id="choices" class="choices"></div></section></main><script>
(()=>{const data={
adventure:[['You find a map tucked under a park bench. What do you do?',['Follow the map','Show it to a friend','Take it to a trusted adult']],['The map leads to a locked gate. What next?',['Look for another path','Climb the gate','Go back and get help']],['You hear a strange sound nearby.',['Check carefully with a friend','Run toward it','Stay back and listen']]],
mystery:[['A classroom prize is missing. What do you do first?',['Look for clues','Accuse someone','Ask what happened']],['You find a note under a desk.',['Read it with the teacher','Hide it','Throw it away']],['A clue points to the library.',['Go investigate','Ignore it','Ask a friend to come']]],
school:[['You arrive at school and realize you forgot your pencil.',['Ask politely for one','Take one without asking','Refuse to work']],['A classmate drops their papers.',['Help pick them up','Walk away','Kick the papers']],['The teacher gives a new direction.',['Listen and follow it','Talk over the teacher','Do something else']]],
job:[['It is your first day at work. Your supervisor gives you a task.',['Listen and ask questions','Ignore the directions','Leave the area']],['You finish your task early.',['Ask what to do next','Sit and do nothing','Leave without telling anyone']],['You make a mistake.',['Tell the supervisor and fix it','Hide it','Blame someone else']]]};
let theme='',step=0,text='';const story=document.querySelector('#story'),choices=document.querySelector('#choices');
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;step=0;document.querySelector('#themeScreen').style.display='none';document.querySelector('#game').style.display='block';show()});
function show(){let s=data[theme][step%data[theme].length];text=s[0];story.textContent=text;choices.innerHTML='';s[1].forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>{step++; if(step>=data[theme].length){story.textContent='The End! You made your own '+theme+' story.';choices.innerHTML='<button class="choice" id="again">Choose Another Story</button>';document.querySelector('#again').onclick=()=>location.reload();}else show()};choices.appendChild(b)})}
document.querySelector('#read').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.rate=.9;speechSynthesis.speak(u)}}})();
</script><script src="assets/classroom-monitor/student.js?v=20261026story" defer></script></body></html>
