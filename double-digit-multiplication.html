<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Double-Digit Multiplication</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff4fb,#eef9ff,#fff8dc);color:#18213d}header{padding:18px;background:linear-gradient(120deg,#7657e5,#ef70ac,#45bee8);color:#fff}header a{color:#fff;font-weight:900;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 25px #0001;border:3px solid #eee8ff}.q{font-size:clamp(48px,10vw,88px);font-weight:1000;text-align:center;margin:12px}.mode{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.mode button,.ans,.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:900;cursor:pointer}.mode button{background:#ece8ff}.mode button.active{background:#7256d8;color:white}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ans{font-size:28px;background:#eef7ff;min-height:80px}.ans:nth-child(2){background:#fff0f7}.ans:nth-child(3){background:#edfff4}.ans:nth-child(4){background:#fff5d1}.good{outline:5px solid #48d689}.bad{animation:shake .3s 2;background:#ffd5d5!important}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.pill{padding:10px 14px;border-radius:999px;background:#fff;font-weight:900}.feedback{text-align:center;font-weight:900;padding:14px;margin-top:14px}.btn{background:#7256d8;color:#fff}</style></head><body><header><a href="transition-town.html?school=1">← Back to School</a><h1>Double-Digit Multiplication</h1></header><main class="wrap"><div class="mode"><button data-mode="2x1" class="active">2-digit × 1-digit</button><button data-mode="2x2">2-digit × 2-digit</button></div><div class="stats"><div class="pill">Correct: <span id="score">0</span></div><div class="pill">Streak: <span id="streak">0</span></div></div><section class="card"><div class="q" id="q">24 × 3 = ?</div><div id="answers" class="answers"></div><div id="feedback" class="feedback">Pick the right answer.</div></section></main><script>
(()=>{let mode='2x1',score=0,streak=0,current=0;const q=document.querySelector('#q'),answers=document.querySelector('#answers'),fb=document.querySelector('#feedback'),s=document.querySelector('#score'),st=document.querySelector('#streak');
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function make(){let a=rnd(10,99),b=mode==='2x1'?rnd(2,9):rnd(10,25);current=a*b;q.textContent=a+' × '+b+' = ?';let set=new Set([current]);while(set.size<4){let off=rnd(-30,30);if(off&&current+off>0)set.add(current+off)}let arr=[...set].sort(()=>Math.random()-.5);answers.innerHTML='';arr.forEach(n=>{let x=document.createElement('button');x.className='ans';x.textContent=n;x.onclick=()=>pick(n,x);answers.appendChild(x)});fb.textContent='Pick the right answer.'}
function pick(n,x){if(n===current){score++;streak++;s.textContent=score;st.textContent=streak;x.classList.add('good');fb.textContent='Correct!';setTimeout(make,550)}else{streak=0;st.textContent=0;x.classList.add('bad');fb.textContent='Try again.';setTimeout(()=>x.classList.remove('bad'),500)}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(z=>z.classList.toggle('active',z===b));make()});make()})();
</script><script src="assets/classroom-monitor/student.js?v=20261026ddm" defer></script></body></html>
