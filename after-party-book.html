<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The After-Party | Transition Team</title><style>:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--paper:#fffdf7;--ink:#172033}*{box-sizing:border-box}body{margin:0;background:#e9edf5;font-family:Arial,sans-serif;color:var(--ink)}nav{background:var(--navy);padding:14px 18px}nav a{color:#fff;text-decoration:none;font-weight:800}main{max-width:980px;margin:auto;padding:24px}.cover,.book{background:var(--paper);border-radius:22px;box-shadow:0 15px 45px #102a5c25;overflow:hidden}.cover{padding:52px 34px;text-align:center;background:linear-gradient(145deg,#fffdf7,#edf3ff)}h1,h2{font-family:Georgia,serif;color:var(--navy)}h1{font-size:clamp(2.4rem,7vw,4.5rem);margin:10px}.sub{font-size:1.15rem;line-height:1.6;max-width:680px;margin:15px auto}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:25px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer;background:var(--navy);color:white}.btn.alt{background:#e7edf8;color:var(--navy)}.page{min-height:560px;padding:42px clamp(22px,6vw,70px)}.chapter{font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}.page h2{font-size:2.2rem}.page p{font-family:Georgia,serif;font-size:1.22rem;line-height:1.75}.dialogue{border-left:5px solid var(--blue);background:#f4f7fc;padding:18px 20px;margin:22px 0;border-radius:0 14px 14px 0}.voice-tag{display:inline-block;font-size:.75rem;border-radius:999px;padding:5px 9px;background:#dde8ff;color:#17376f;font-weight:900}.choicebox{margin-top:28px;padding:22px;background:#eef4ff;border-radius:16px}.choice{display:block;width:100%;text-align:left;margin:9px 0;border:2px solid #c6d4ee;background:white;padding:13px;border-radius:10px;font-weight:700;cursor:pointer}.feedback{font-weight:800;margin-top:12px}.lesson{background:#fff3d8;border:1px solid #e6c66c;padding:16px;border-radius:14px;margin:24px 0;font-weight:700;line-height:1.5}.footer{display:flex;justify-content:space-between;gap:10px;padding:18px 24px;background:#f3f6fb}.counter{align-self:center;font-weight:800;color:#53627c}@media(max-width:600px){main{padding:12px}.page{min-height:620px;padding:30px 20px}.page p{font-size:1.12rem}}</style></head><body><nav><a href="stories.html">← Interactive Stories</a></nav><main><section class="cover" id="cover"><div class="chapter">Self-Advocacy / Workplace Readiness</div><h1>The After-Party</h1><p class="sub">A realistic story about peer pressure, transportation, boundaries, and making your own decisions.</p><div class="controls"><button class="btn" onclick="start(true)">🔊 Read to Me</button><button class="btn alt" onclick="start(false)">Read Myself</button></div><p><b>Multiple character voices + narrator</b></p></section><section class="book" id="book" style="display:none"><div id="page"></div><div class="footer"><button class="btn alt" onclick="prev()">← Previous</button><span class="counter" id="count"></span><button class="btn" onclick="next()">Next →</button></div></section></main><script>const pages=[["Game Night",[["n","Your school just won a big basketball game. As everyone leaves the gym, your friend Marcus says there is an after-party at an older student's house."],["m","Everybody's going. Come on. Don't be the only one who misses it."],["n","You want to have fun, but you do not know who is driving, who will be at the house, or how you will get home."]],["Go without asking any questions.","Ask who is driving and make a ride-home plan first.","Say no just because someone told you to."],1,"Planning ahead is not being boring. It is making sure you stay in control of your own transportation and safety."],["Getting the Details",[["n","You ask a few questions. Marcus admits the host's parents are gone and nobody has really planned a ride home yet."],["m","We'll figure it out later. It's not that serious."],["n","Now you have more information than you had a minute ago."]],["Go anyway and hope a ride appears.","Make a clear transportation plan before deciding.","Let Marcus make the decision for you."],1,"Self-advocacy includes asking questions before you agree to something."],["At the Party",[["n","You decide to go after arranging for a trusted adult to pick you up at a set time. At the house, someone offers you an open drink."],["m","Just hold it. Nobody's going to care."],["n","You do not have to accept something just to make another person comfortable."]],["Take it because everyone is watching.","Choose your own sealed drink and keep it with you.","Argue with everybody in the room."],1,"A clear, calm no is enough. You do not owe anyone a long explanation."],["The Ride Home",[["n","Later, you notice the person who originally offered to drive has been drinking. Your scheduled ride is still available."],["m","You're really calling somebody? We can get you home."],["n","This is the moment when your earlier plan matters."]],["Ride with the original driver anyway.","Use the sober ride you already arranged.","Get in the car and ask the driver to be careful."],1,"Never depend on an impaired driver. Use a safe ride and encourage friends to do the same."],["Your Own Path",[["n","You leave safely using the ride you arranged. You realize that you can enjoy yourself without handing your decisions over to the group."],["n","The strongest part of the night was not one perfect choice. It was asking questions, making a plan, and changing course when the situation changed."]],null,null,"Skills practiced: planning • boundaries • safe transportation • asking questions • resisting peer pressure"]];pages.splice(pages.length-1,0,...[["The Text Before You Go",[["n","While you are getting ready, Marcus texts that the party has moved to a different house across town."],["m","New address. Don't tell everybody because the guy's parents don't know how many people are coming."],["n","That changes the plan you made earlier. Your ride knows the first address, not this one."]],["Go to the new address without telling your ride.","Send the new address to your ride and confirm the pickup plan.","Turn off your location so nobody bothers you."],1,"A safety plan only works if the people involved have accurate information."],["When the Mood Changes",[["n","At first the party feels normal. Music is playing and people are talking. Later, more people arrive and an argument starts near the kitchen."],["m","Ignore it. We're staying."],["n","You notice people crowding around and recording instead of moving away."]],["Move away from the conflict and decide whether it is time to leave.","Get closer so you can see what happens.","Start recording and post it."],0,"You are allowed to leave a situation before it becomes dangerous. You do not need to wait for something bad to happen."],["A Friend Wants a Ride",[["n","When your safe ride arrives, Marcus quietly asks if he can come too."],["m","The person I came with has been drinking. I don't want to ride with them now."],["n","Your ride has room for Marcus, but you need to ask rather than assume."]],["Tell Marcus to get in without asking the driver.","Ask your driver whether Marcus can ride too.","Tell Marcus he has to stay because he chose to come."],1,"Helping a friend make a safer choice can include asking a trusted adult for help."],["The Next Morning",[["n","The next morning, social media is full of clips from the argument. Some students are bragging about staying until police arrived."],["m","I'm glad we left. Last night I thought you were overthinking everything."],["n","You realize that planning did not ruin the night. It gave you options when the situation changed."]],null,null,"Strong decisions are not about predicting every problem. They are about keeping enough control to respond when circumstances change."]]);let i=0,auto=false;function lab(k){return k==='n'?'Narrator':({m:'Marcus',a:'Friend',s:'Student',f:'Family',r:'Friend',y:'You'}[k]||'Character')}function voices(k){let v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));if(!v.length)v=speechSynthesis.getVoices();let male=/male|david|daniel|alex|aaron|fred/i,female=/samantha|victoria|zira|ava|allison|female/i;if(['m','r','y'].includes(k))return v.find(x=>male.test(x.name))||v[0];if(['a','s','f'].includes(k))return v.find(x=>female.test(x.name))||v[v.length-1];return v.find(x=>/samantha|ava|allison|narrator/i.test(x.name))||v[0]}function render(){speechSynthesis.cancel();let p=pages[i],h='<article class="page"><div class="chapter">The After-Party</div><h2>'+p[0]+'</h2>';p[1].forEach(x=>h+=(x[0]==='n'?'<div>':'<div class="dialogue">')+'<span class="voice-tag">'+lab(x[0])+'</span><p>'+x[1]+'</p></div>');if(p[2]){h+='<div class="choicebox"><h3>What would you do?</h3>';p[2].forEach((x,z)=>h+='<button class="choice" onclick="ans('+z+','+p[3]+')">'+String.fromCharCode(65+z)+' — '+x+'</button>');h+='<div class="feedback" id="fb"></div></div>'}if(p[4])h+='<div class="lesson">'+p[4]+'</div>';h+='</article>';document.getElementById('page').innerHTML=h;document.getElementById('count').textContent='Page '+(i+1)+' of '+pages.length;if(auto)setTimeout(read,250)}function ans(a,b){document.getElementById('fb').textContent=a===b?'✓ Strong choice. Think about why this protects your goals, safety, or relationships.':'Think it through again. What consequence could this choice create?'}function read(){speechSynthesis.cancel();let q=0,p=pages[i][1];function go(){if(q>=p.length)return;let x=p[q++],u=new SpeechSynthesisUtterance(x[1]);u.voice=voices(x[0]);u.rate=x[0]==='n'?.94:1;u.onend=go;speechSynthesis.speak(u)}go()}function start(r){auto=r;document.getElementById('cover').style.display='none';document.getElementById('book').style.display='block';render()}function next(){if(i<pages.length-1){i++;render()}else location.href='stories.html'}function prev(){if(i>0){i--;render()}}</script><script src="session.js"></script></body></html>
