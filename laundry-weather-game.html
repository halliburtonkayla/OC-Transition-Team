<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laundry Weather Match</title><style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff4fb,#eef8ff,#fff7dd);color:#17213b}header{padding:18px;background:linear-gradient(120deg,#7256d8,#ef6fab,#45bee8);color:#fff}header a{color:#fff;font-weight:900;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:18px}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 25px #0001;border:3px solid #eee8ff}.top{display:grid;grid-template-columns:1fr 1fr;gap:16px}.weather{text-align:center;background:#f5f3ff;border-radius:20px;padding:18px}.weather h2{font-size:38px;margin:8px}.weather p{font-size:22px;font-weight:900}.character{background:linear-gradient(#c5ebff 0 60%,#9ad17a 60%);border-radius:20px;min-height:300px;display:flex;align-items:flex-end;justify-content:center;position:relative}.person{position:relative;width:150px;height:245px}.head{position:absolute;top:4px;left:39px;width:72px;height:72px;border-radius:50%;background:#9b694d;border:4px solid #664735}.hair{position:absolute;top:-7px;left:-7px;width:86px;height:35px;border-radius:50%;background:#2a211f}.body{position:absolute;top:74px;left:24px;width:102px;height:100px;border-radius:22px;background:#58b7df;border:4px solid #fff}.legs{position:absolute;top:166px;left:36px;width:78px;height:74px;border-left:30px solid #354c78;border-right:30px solid #354c78}.coat,.hat,.scarf,.shorts,.boots,.rain{display:none;position:absolute;z-index:5}.show{display:block}.coat{top:72px;left:18px;width:114px;height:112px;border-radius:22px;background:#ef6fab;border:5px solid #fff}.hat{top:-12px;left:29px;width:92px;height:28px;border-radius:40px 40px 8px 8px;background:#7256d8}.scarf{top:68px;left:32px;width:86px;height:20px;border-radius:20px;background:#ff9b54}.shorts{top:154px;left:30px;width:90px;height:40px;border-radius:10px;background:#ffd75e}.boots{bottom:0;left:26px;width:98px;height:27px;border-left:40px solid #563b2d;border-right:40px solid #563b2d}.rain{top:72px;left:18px;width:114px;height:112px;border-radius:22px;background:#48c6b2;border:5px solid #fff}.reaction{position:absolute;right:12px;top:12px;background:#fff;border:3px solid #e6dcff;border-radius:16px;padding:10px;font-weight:900;max-width:190px;text-align:center}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.choice{border:0;border-radius:17px;padding:15px;min-height:110px;font-size:18px;font-weight:900;background:#eef7ff}.choice:nth-child(even){background:#fff0f7}.choice small{display:block;color:#69748c;margin-top:6px}.choice.reading{outline:6px solid #ffd75a;transform:scale(1.04)}.feedback{margin-top:14px;padding:14px;border-radius:16px;text-align:center;font-weight:900;background:#fff6c9;border:3px solid #ffd75a}.good{background:#eafff1;border-color:#4ed98b}.hot{background:#fff0dd;border-color:#ff9b54}.cold{background:#eaf6ff;border-color:#51bde8}.wet{background:#eafbf7;border-color:#48c6b2}.buttons{display:flex;gap:8px;flex-wrap:wrap}.read{border:0;border-radius:14px;padding:11px 14px;background:#7256d8;color:#fff;font-weight:900}.reward{display:none;text-align:center;margin-top:16px;background:#f4efff;border:4px solid #d9ccff;border-radius:22px;padding:22px}.reward button{border:0;border-radius:14px;padding:13px 17px;font-weight:900;margin:5px}.bonus{background:#ef6fab;color:white}.next{background:#36c97a;color:white}.socks{display:none;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.sock{border:0;border-radius:14px;padding:18px;font-weight:900;background:#ece8ff}.sock.open{outline:5px solid #ffd75a}.sock.done{background:#dcffe9;opacity:.6}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.pill{background:#fff;border-radius:999px;padding:9px 13px;font-weight:900}@media(max-width:700px){.top{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.socks{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<header><a href="transition-town.html?school=1">← Back to School</a><h1>Laundry & Dress for the Weather</h1></header><main class="wrap"><div class="stats"><span class="pill">Level <b id="level">1</b>/4</span><span class="pill">Correct <b id="score">0</b></span><span class="pill">Round <b id="round">1</b>/4</span></div><section id="game" class="panel"><div class="top"><div class="weather"><b id="season">SUMMER</b><h2 id="weather">Sunny and hot</h2><p id="temp">95°F</p><div class="buttons"><button class="read" id="readWeather">Read Weather</button><button class="read" id="readChoices" style="background:#ef6fab">Read Choices</button></div></div><div class="character"><div class="reaction" id="reaction">Help me get dressed!</div><div class="person"><div id="hat" class="hat"></div><div id="coat" class="coat"></div><div id="scarf" class="scarf"></div><div id="shorts" class="shorts"></div><div id="boots" class="boots"></div><div id="rain" class="rain"></div><div class="head"><div class="hair"></div></div><div class="body"></div><div class="legs"></div></div></div></div><div id="choices" class="choices"></div><div id="feedback" class="feedback">Pick the outfit that matches the weather.</div></section><section id="reward" class="reward"><h2>Level Complete!</h2><p>You earned a Laundry Star.</p><button id="bonus" class="bonus">Play Sock Match Bonus</button><button id="next" class="next">Skip Reward & Keep Going</button><div id="socks" class="socks"></div></section></main>
<script>
(()=>{const outfits={summer:['T-shirt + shorts + sneakers',['shorts'],'cool'],spring:['T-shirt + light pants + sneakers',[],'mild'],fall:['Sweater + long pants + sneakers',['coat'],'mild'],winter:['Coat + pants + hat + scarf + boots',['coat','hat','scarf','boots'],'warm'],rain:['Rain jacket + pants + rain boots',['rain','boots'],'rain'],snow:['Heavy coat + hat + scarf + boots',['coat','hat','scarf','boots'],'warm']};const levels=[[['SUMMER','Sunny and hot','95°F','summer'],['SUMMER','Hot and humid','90°F','summer'],['SPRING','Warm and breezy','72°F','spring'],['SUMMER','Very hot outside','98°F','summer']],[['WINTER','Cold and windy','30°F','winter'],['WINTER','Snowing outside','25°F','snow'],['FALL','Cool and cloudy','55°F','fall'],['WINTER','Very cold morning','20°F','winter']],[['SPRING','Rainy and cool','58°F','rain'],['SPRING','Sunny but cool','64°F','spring'],['FALL','Rainy and windy','50°F','rain'],['FALL','Cool fall afternoon','60°F','fall']],[['MIXED','Sunny and chilly','48°F','fall'],['MIXED','Warm rain shower','70°F','rain'],['MIXED','Cold with snow','28°F','snow'],['MIXED','Hot sunny afternoon','92°F','summer']]];let lv=0,rd=0,score=0,lock=false;const ids=x=>document.getElementById(x),choices=ids('choices');function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.8;speechSynthesis.speak(u)}}function clear(){['hat','coat','scarf','shorts','boots','rain'].forEach(x=>ids(x).classList.remove('show'))}function dress(k){clear();outfits[k][1].forEach(x=>ids(x).classList.add('show'))}function render(){lock=false;ids('level').textContent=lv+1;ids('round').textContent=rd+1;let s=levels[lv][rd];ids('season').textContent=s[0];ids('weather').textContent=s[1];ids('temp').textContent=s[2];ids('reaction').textContent='Help me get dressed!';clear();choices.innerHTML='';let keys=Object.keys(outfits).sort(()=>Math.random()-.5);keys.forEach((k,i)=>{let b=document.createElement('button');b.className='choice';b.dataset.k=k;b.innerHTML=outfits[k][0]+'<small>Choice '+(i+1)+'</small>';b.onclick=()=>pick(k);choices.appendChild(b)});ids('feedback').className='feedback';ids('feedback').textContent='Pick the outfit that matches the weather.'}function pick(k){if(lock)return;let right=levels[lv][rd][3];dress(k);if(k===right){lock=true;score++;ids('score').textContent=score;ids('reaction').textContent='Good job! I feel just right.';ids('feedback').className='feedback good';ids('feedback').textContent='Good job! This outfit matches the weather.';speak('Good job! This outfit matches the weather.');setTimeout(nextRound,1000)}else{let need=outfits[right][2],got=outfits[k][2];if(need==='warm'&&(got==='cool'||got==='mild')){ids('reaction').textContent='Brrr! I am too cold.';ids('feedback').className='feedback cold';ids('feedback').textContent='Too cold! Pick warmer clothes.';speak('Brrr! I am too cold. Pick warmer clothes.')}else if((need==='cool'||need==='mild')&&got==='warm'){ids('reaction').textContent='Whew! I am too hot.';ids('feedback').className='feedback hot';ids('feedback').textContent='Too hot! Pick something lighter.';speak('Whew! I am too hot. Pick something lighter.')}else if(need==='rain'&&k!=='rain'){ids('reaction').textContent='I am getting wet!';ids('feedback').className='feedback wet';ids('feedback').textContent='I need clothes for rain.';speak('I am getting wet. I need clothes for rain.')}else{ids('reaction').textContent='That does not feel right.';ids('feedback').className='feedback hot';ids('feedback').textContent='Try a different outfit.';speak('Try a different outfit.')}}}function nextRound(){rd++;if(rd===4){ids('game').style.display='none';ids('reward').style.display='block';ids('next').textContent=lv===3?'Finish Game':'Skip Reward and Keep Going'}else render()}function goNext(){ids('reward').style.display='none';ids('socks').style.display='none';if(lv===3){ids('game').style.display='block';choices.innerHTML='';ids('season').textContent='GREAT JOB';ids('weather').textContent='All Levels Complete!';ids('temp').textContent='';ids('reaction').textContent='You did it!';ids('feedback').className='feedback good';ids('feedback').textContent='You finished with '+score+' correct outfits.';return}lv++;rd=0;ids('game').style.display='block';render()}function bonus(){ids('socks').style.display='grid';ids('bonus').style.display='none';let vals=['A','A','B','B','C','C','D','D'].sort(()=>Math.random()-.5),first=null,hold=false,done=0;ids('socks').innerHTML='';vals.forEach(v=>{let b=document.createElement('button');b.className='sock';b.textContent='SOCK';b.dataset.v=v;b.onclick=()=>{if(hold||b.classList.contains('done')||b===first)return;b.textContent=v;b.classList.add('open');if(!first){first=b;return}if(first.dataset.v===b.dataset.v){first.classList.add('done');b.classList.add('done');first=null;done++;if(done===4){speak('Great matching! Reward complete.');setTimeout(goNext,700)}}else{hold=true;let old=first;first=null;setTimeout(()=>{old.textContent='SOCK';b.textContent='SOCK';old.classList.remove('open');b.classList.remove('open');hold=false},600)}};ids('socks').appendChild(b)})}ids('readWeather').onclick=()=>{let s=levels[lv][rd];speak(s[0]+'. '+s[1]+'. '+s[2])};ids('readChoices').onclick=()=>{let bs=[...choices.querySelectorAll('.choice')],i=0;function read(){if(i>=bs.length)return;bs.forEach(x=>x.classList.remove('reading'));let b=bs[i];b.classList.add('reading');speak('Choice '+(i+1)+'. '+outfits[b.dataset.k][0]);setTimeout(()=>{b.classList.remove('reading');i++;read()},1450)}read()};ids('bonus').onclick=bonus;ids('next').onclick=goNext;render()})();
</script><script src="assets/classroom-monitor/student.js?v=20261026laundry" defer></script></body></html>
