nd maybe getting to eat the mistakes. Her first Saturday shift changed that idea fast.", "Before the doors even opened, Kaylee arrived to pick up a birthday cake. Alyssa checked the order twice and realized the name on the box was wrong.", "Then Jocquan walked in hungry. He ordered a muffin, changed to a cinnamon roll, then decided he wanted both. Alyssa laughed, but kept the order straight.", "At the same time, Cameron grabbed a bag from the pickup shelf. 'Wait!' Alyssa called. 'That belongs to somebody else.' Crisis number two avoided.", "Soon there was a line. Alyssa wanted to do everything herself, but the faster she rushed, the easier it was to make a mistake.", "She stopped, made a quick list, and handled one task at a time: fix Kaylee's cake label, ring up Jocquan, check Cameron's order, then restock the counter.", "When a customer asked about an ingredient, Alyssa didn't guess. She checked the recipe information before answering. That made the customer feel taken care of.", "By lunchtime the rush was over. Kaylee had the right cake, Jocquan had finally stopped changing his order, and Cameron had the correct bag.", "Alyssa looked at the bakery and smiled. The fun part wasn't just decorating. She liked solving problems and making customers happy.", "TAKEAWAY: A job can be fun and still require organization, communication, accuracy, and teamwork. Alyssa discovered that those skills are part of running a successful bakery."];let p=0;function render(){document.getElementById('storyText').textContent=pages[p];document.getElementById('pageNo').textContent='Page '+(p+1)+' of '+pages.length;}function next(){if(p<pages.length-1){p++;render()}else location.href='../index.html'}function prev(){if(p>0){p--;render()}}render();</script></body></html>
