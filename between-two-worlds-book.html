<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Between Two Worlds | Transition Team</title><style>:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--paper:#fffdf7;--ink:#172033}*{box-sizing:border-box}body{margin:0;background:#e9edf5;font-family:Arial,sans-serif;color:var(--ink)}nav{background:var(--navy);padding:14px 18px}nav a{color:#fff;text-decoration:none;font-weight:800}main{max-width:980px;margin:auto;padding:24px}.cover,.book{background:var(--paper);border-radius:22px;box-shadow:0 15px 45px #102a5c25;overflow:hidden}.cover{padding:52px 34px;text-align:center;background:linear-gradient(145deg,#fffdf7,#edf3ff)}h1,h2{font-family:Georgia,serif;color:var(--navy)}h1{font-size:clamp(2.4rem,7vw,4.5rem);margin:10px}.sub{font-size:1.15rem;line-height:1.6;max-width:680px;margin:15px auto}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:25px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer;background:var(--navy);color:white}.btn.alt{background:#e7edf8;color:var(--navy)}.page{min-height:560px;padding:42px clamp(22px,6vw,70px)}.chapter{font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}.page h2{font-size:2.2rem}.page p{font-family:Georgia,serif;font-size:1.22rem;line-height:1.75}.dialogue{border-left:5px solid var(--blue);background:#f4f7fc;padding:18px 20px;margin:22px 0;border-radius:0 14px 14px 0}.voice-tag{display:inline-block;font-size:.75rem;border-radius:999px;padding:5px 9px;background:#dde8ff;color:#17376f;font-weight:900}.choicebox{margin-top:28px;padding:22px;background:#eef4ff;border-radius:16px}.choice{display:block;width:100%;text-align:left;margin:9px 0;border:2px solid #c6d4ee;background:white;padding:13px;border-radius:10px;font-weight:700;cursor:pointer}.feedback{font-weight:800;margin-top:12px}.lesson{background:#fff3d8;border:1px solid #e6c66c;padding:16px;border-radius:14px;margin:24px 0;font-weight:700;line-height:1.5}.footer{display:flex;justify-content:space-between;gap:10px;padding:18px 24px;background:#f3f6fb}.counter{align-self:center;font-weight:800;color:#53627c}@media(max-width:600px){main{padding:12px}.page{min-height:620px;padding:30px 20px}.page p{font-size:1.12rem}}</style></head><body><nav><a href="stories.html">← Interactive Stories</a></nav><main><section class="cover" id="cover"><div class="chapter">Self-Advocacy / Postsecondary Education</div><h1>Between Two Worlds</h1><p class="sub">A young-adult story about family expectations, friends, college or training choices, money, and finding your own path.</p><div class="controls"><button class="btn" onclick="start(true)">🔊 Read to Me</button><button class="btn alt" onclick="start(false)">Read Myself</button></div><p><b>Multiple character voices + narrator</b></p></section><section class="book" id="book" style="display:none"><div id="page"></div><div class="footer"><button class="btn alt" onclick="prev()">← Previous</button><span class="counter" id="count"></span><button class="btn" onclick="next()">Next →</button></div></section></main><script>const pages=[["Everybody Has a Plan",[["n","Graduation is getting closer. Your family wants you to stay near home. Your friends keep talking about moving away together."],["f","You can save money if you stay close. You don't have to rush off somewhere."],["r","We're all going away. You should come with us."],["n","Both groups care about you, but neither group has to live with your decision the way you do."]],["Choose whatever your friends choose.","Agree with your family immediately.","Give yourself time to compare real options."],2,"Advice matters, but self-advocacy means learning enough to participate in your own decision."],["Compare the Facts",[["n","You compare a local technical program, a two-year college, and a university. The prices, programs, transportation needs, and housing costs are very different."],["n","One option is cheaper. Another offers the exact program you want. A third has the campus experience your friends keep talking about."]],["Choose only by which campus looks fun.","Compare cost, program fit, transportation, housing, and career goals.","Let somebody else pick so you do not have to decide."],1,"A strong postsecondary choice connects your goals with the practical details of getting there."],["The Family Conversation",[["n","You sit down with your family and explain what you have learned."],["f","We're worried about the cost and how far away you'd be."],["y","I understand. I want to look at the cost with you, but I also want a program that fits what I want to do."],["n","The conversation becomes less about winning and more about building a workable plan."]],null,null,"Self-advocacy is not ignoring advice. It is listening, gathering facts, asking questions, and explaining what matters to you."],["Own Your Plan",[["n","You choose a path you can explain: what it costs, how you will get there, what support you need, and how it connects to your career goal."],["n","Your future does not have to look exactly like your family's plan or your friends' plan. It needs to be a plan you understand and can take responsibility for."]],null,null,"Skills practiced: postsecondary planning • decision-making • budgeting • communication • self-advocacy"]];let i=0,auto=false;function lab(k){return k==='n'?'Narrator':({m:'Marcus',a:'Friend',s:'Student',f:'Family',r:'Friend',y:'You'}[k]||'Character')}function voices(k){let v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));if(!v.length)v=speechSynthesis.getVoices();let male=/male|david|daniel|alex|aaron|fred/i,female=/samantha|victoria|zira|ava|allison|female/i;if(['m','r','y'].includes(k))return v.find(x=>male.test(x.name))||v[0];if(['a','s','f'].includes(k))return v.find(x=>female.test(x.name))||v[v.length-1];return v.find(x=>/samantha|ava|allison|narrator/i.test(x.name))||v[0]}function render(){speechSynthesis.cancel();let p=pages[i],h='<article class="page"><div class="chapter">Between Two Worlds</div><h2>'+p[0]+'</h2>';p[1].forEach(x=>h+=(x[0]==='n'?'<div>':'<div class="dialogue">')+'<span class="voice-tag">'+lab(x[0])+'</span><p>'+x[1]+'</p></div>');if(p[2]){h+='<div class="choicebox"><h3>What would you do?</h3>';p[2].forEach((x,z)=>h+='<button class="choice" onclick="ans('+z+','+p[3]+')">'+String.fromCharCode(65+z)+' — '+x+'</button>');h+='<div class="feedback" id="fb"></div></div>'}if(p[4])h+='<div class="lesson">'+p[4]+'</div>';h+='</article>';document.getElementById('page').innerHTML=h;document.getElementById('count').textContent='Page '+(i+1)+' of '+pages.length;if(auto)setTimeout(read,250)}function ans(a,b){document.getElementById('fb').textContent=a===b?'✓ Strong choice. Think about why this protects your goals, safety, or relationships.':'Think it through again. What consequence could this choice create?'}function read(){speechSynthesis.cancel();let q=0,p=pages[i][1];function go(){if(q>=p.length)return;let x=p[q++],u=new SpeechSynthesisUtterance(x[1]);u.voice=voices(x[0]);u.rate=x[0]==='n'?.94:1;u.onend=go;speechSynthesis.speak(u)}go()}function start(r){auto=r;document.getElementById('cover').style.display='none';document.getElementById('book').style.display='block';render()}function next(){if(i<pages.length-1){i++;render()}else location.href='stories.html'}function prev(){if(i>0){i--;render()}}</script><script src="session.js"></script></body></html>
