<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transition Town</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#26334c;background:#9bd9f4;overflow-x:hidden}button{font:inherit}.sky{min-height:100vh;background:linear-gradient(#8ed7f7 0 35%,#d9f1bd 35% 100%);position:relative}.cloud{position:absolute;background:#fff;border-radius:60px;width:150px;height:45px;opacity:.85}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:60px;height:60px;left:25px;top:-30px}.cloud:after{width:75px;height:75px;right:20px;top:-38px}.c1{left:8%;top:8%}.c2{right:10%;top:13%;transform:scale(.8)}header{height:74px;background:#ffffffee;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;position:relative;z-index:20;box-shadow:0 3px 14px #25325022}.logo{font:900 30px Georgia;color:#5b439d}.topbtn{border:0;border-radius:14px;padding:11px 14px;background:#5b439d;color:white;font-weight:900;margin-left:5px}.town{position:relative;max-width:1250px;margin:auto;padding:35px 18px 100px;z-index:2}.welcome{width:min(560px,94%);margin:0 auto 22px;text-align:center;background:#ffffffdf;border:4px solid white;border-radius:28px;padding:17px;box-shadow:0 12px 30px #31466c2a}.welcome h1{font:900 44px Georgia;margin:0;color:#5b439d}.welcome p{margin:8px}.road{background:#5e6470;border:8px solid #eee;min-height:650px;border-radius:70px;padding:34px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;position:relative;box-shadow:0 14px 35px #33445b44}.road:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:5px dashed #f7df74;opacity:.7;pointer-events:none}.lot{z-index:2;min-height:180px;border:0;border-radius:24px;padding:14px;background:#fff;box-shadow:0 8px 18px #26334c44;cursor:pointer;position:relative;text-align:center;transition:.18s}.lot:hover{transform:translateY(-5px) scale(1.02)}.building{height:100px;border-radius:18px 18px 8px 8px;display:flex;align-items:center;justify-content:center;font-size:52px;border:5px solid #fff;box-shadow:inset 0 -18px #00000010}.bank{background:#f7d36d}.city{background:#f2b8d2}.medical{background:#b9e5f7}.jobs{background:#c8e9c4}.biz{background:#f6c58b}.safety{background:#bfcff4}.creative{background:#d7c7f5}.home{background:#ffd7bd}.shop{background:#c8ebdf}.school{background:#ffe99f}.lot b{display:block;font-size:18px;margin-top:9px}.lot small{display:block;margin-top:4px;color:#5b6372}.phone{position:fixed;right:18px;bottom:18px;z-index:40;width:62px;height:62px;border:0;border-radius:50%;background:#20263b;color:#fff;font-size:28px;box-shadow:0 7px 20px #0006}.badge{position:absolute;background:#e8425d;color:white;border-radius:20px;font-size:12px;padding:3px 7px;right:-2px;top:-2px}.sheet{position:fixed;inset:0;background:#1f294988;z-index:60;display:none;align-items:flex-end;justify-content:center}.sheet.show{display:flex}.window{width:min(850px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:24px;box-shadow:0 -8px 35px #0004}.window h2{font:900 30px Georgia;color:#5b439d;margin:0 0 8px}.close{float:right;border:0;background:#eee;border-radius:50%;width:38px;height:38px;font-weight:bold}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0}.action{border:0;border-radius:16px;padding:16px;background:#f3efff;text-align:left;font-weight:800;min-height:72px}.action:hover{background:#e7ddff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid #e0e3ea;border-radius:16px;padding:14px}.money{font-size:28px;font-weight:900;color:#24815c}.chat{background:#f2f4f8;border-radius:16px;padding:12px;max-height:280px;overflow:auto}.bubble{background:#fff;border-radius:14px;padding:10px;margin:7px;box-shadow:0 2px 8px #0001}.field{width:100%;padding:12px;border:1px solid #ccd1dc;border-radius:12px;margin:5px 0}.primary{border:0;border-radius:12px;background:#5b439d;color:white;padding:11px 14px;font-weight:900}.green{background:#24815c}.red{background:#bd4b62}.character{display:flex;align-items:center;gap:14px;background:#fff6fb;border-radius:18px;padding:12px}.face{font-size:52px}.meeting{background:#f7f3ff;border-radius:20px;padding:16px}.table{height:100px;border-radius:50%;background:#b87c52;margin:18px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold}.tiny{font-size:12px;color:#667}.notice{background:#fff5c8;border-left:5px solid #d8a300;padding:11px;border-radius:10px;margin:8px 0}@media(max-width:850px){.road{grid-template-columns:repeat(2,1fr);padding:20px;gap:18px}.road:after{display:none}.welcome h1{font-size:36px}}@media(max-width:480px){.road{grid-template-columns:1fr 1fr}.lot{min-height:155px}.building{height:80px;font-size:42px}.lot b{font-size:15px}}</style></head><body><div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div><header><div class="logo">Transition Town</div><div><button class="topbtn" onclick="resident()">Resident</button><button class="topbtn" onclick="teacher()">Miss Kayla</button><button class="topbtn" onclick="location.href='index.html'">Hub</button></div></header><main class="town"><section class="welcome"><h1>Welcome to Town</h1><p id="status">Choose a resident and step into your life.</p></section><section class="road">
<button class="lot" onclick="place('bank')"><div class="building bank">🏦</div><b>Transition Town Bank</b><small>Miss Kayla • Branch Manager</small></button>
<button class="lot" onclick="place('city')"><div class="building city">🏛️</div><b>City Hall</b><small>Mayor Kayla • Utilities • Town Events</small></button>
<button class="lot" onclick="place('medical')"><div class="building medical">🏥</div><b>Medical Center</b><small>Sonography • Nursing • Healthcare</small></button>
<button class="lot" onclick="place('jobs')"><div class="building jobs">💼</div><b>Career & Job Center</b><small>Applications • Interviews • Promotions</small></button>
<button class="lot" onclick="place('business')"><div class="building biz">🏪</div><b>Business District</b><small>Student-owned businesses</small></button>
<button class="lot" onclick="place('safety')"><div class="building safety">🚓</div><b>Police & Fire</b><small>Calls • Reports • Career Ladder</small></button>
<button class="lot" onclick="place('creative')"><div class="building creative">🎥</div><b>Creative District</b><small>Gaming • Content • Photography • Media</small></button>
<button class="lot" onclick="place('housing')"><div class="building home">🏠</div><b>Neighborhoods</b><small>Rent • Buy • Choose Your Home</small></button>
<button class="lot" onclick="place('shops')"><div class="building shop">🛒</div><b>Town Shops</b><small>Groceries • Cars • Furniture • Restaurants</small></button>
<button class="lot" onclick="place('school')"><div class="building school">🎓</div><b>Training & College</b><small>Education • Certifications • Career Training</small></button>
</section></main></div><button class="phone" onclick="phone()">📱<span class="badge" id="badge">0</span></button><div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="window"><button class="close" onclick="closeSheet()">×</button><div id="content"></div></div></div>
<script>
let current=localStorage.ttCurrent||'';const get=()=>JSON.parse(localStorage.ttWorld||'{"residents":{},"messages":[],"businesses":{"Cool Vibes":{"owners":["Olivia","Jocquan","Kaylee","Alyssa"],"balance":5000,"alerts":[]},"3K Tire Shop":{"owners":["Allen","Nick"],"balance":5000,"alerts":[]}},"events":[]}');const put=w=>{localStorage.ttWorld=JSON.stringify(w);updateBadge()};function open(html){content.innerHTML=html;sheet.classList.add('show')}function closeSheet(){sheet.classList.remove('show')}function ensure(n){let w=get();if(!w.residents[n])w.residents[n]={checking:10000,savings:0,sessions:0,career:"Not selected",job:"Needs a job",home:"Not selected",car:"Not selected",history:[],notifications:[]};put(w);return w.residents[n]}function resident(){open('<h2>Who is entering Transition Town?</h2><input class=field id=name placeholder="Student name"><button class=primary onclick="login()">Enter My Life</button><p class=tiny>On a shared device, switch residents without signing Miss Kayla out.</p>')}function login(){let n=document.querySelector('#name').value.trim();if(!n)return;ensure(n);current=n;localStorage.ttCurrent=n;status.textContent=n+" is in Transition Town.";profile()}function profile(){let r=ensure(current);open('<h2>'+current+"’s Life</h2><div class=cards><div class=card><b>Checking</b><div class=money>$"+r.checking.toFixed(2)+'</div><small>Savings $'+r.savings.toFixed(2)+'</small></div><div class=card><b>Career</b><p>'+r.career+'</p></div><div class=card><b>Job</b><p>'+r.job+'</p><small>Payday every 2 completed sessions</small></div><div class=card><b>Home</b><p>'+r.home+'</p></div></div><div class=actions><button class=action onclick="place(\'jobs\')">💼 Go to Career & Job Center</button><button class=action onclick="place(\'bank\')">🏦 Go to Bank</button><button class=action onclick="place(\'housing\')">🏠 Go Home / Housing</button><button class=action onclick="phone()">📱 Open Phone</button></div><button class="primary green" onclick="endSession()">End Session & Create Report</button>')}function need(){if(!current){resident();return false}return true}
const data={bank:['Transition Town Bank','Miss Kayla is the Branch Manager. Manage real money choices without a right-answer scoreboard.'],city:['City Hall','Turn on water, handle town services, permits and community events with Mayor Kayla.'],medical:['Medical Center','Explore sonography, nursing, patient care and other healthcare careers through day-at-work situations.'],jobs:['Career & Job Center','Find openings, apply, interview, work, earn pay and compete for promotions with greater responsibility.'],business:['Business District','Enter shared student businesses, review alerts, hire staff, serve customers and call owner meetings.'],safety:['Police & Fire','Respond to fictional town incidents, interview witnesses, complete reports and move through career ladders.'],creative:['Creative & Digital District','Gaming, content creation, photography, video, design, coding and freelance client work.'],housing:['Neighborhoods','Choose a home, rent or buy, set up utilities and furnish it. Housing affects your real budget.'],shops:['Town Shops','Spend real simulation money on groceries, transportation, furniture, restaurants and services.'],school:['Training & College','Explore education, certifications, technical training and postsecondary costs tied to your career.']};
function place(k){let [title,desc]=data[k];let extra='';if(k==='bank')extra='<div class=actions><button class=action onclick="cash(\'deposit\')">Deposit</button><button class=action onclick="cash(\'withdraw\')">Withdraw</button><button class=action onclick="cash(\'save\')">Move to Savings</button><button class=action onclick="alert(\'Miss Kayla reviews amount, interest rate, term, monthly payment and total repayment before a loan is added.\')">Ask About a Loan</button></div>';if(k==='jobs')extra='<div class=actions><button class=action onclick="career()">Choose / Explore My Career</button><button class=action onclick="job()">Jobs Hiring Now</button><button class=action>My Applications</button><button class=action>Promotions</button></div>';if(k==='business')extra=businesses();if(k==='housing')extra='<div class=actions><button class=action onclick="home(\'Apartment\',850)">Apartment • $850 rent</button><button class=action onclick="home(\'Townhome\',1250)">Townhome • $1,250 rent</button><button class=action onclick="place(\'bank\')">Buy a Home • Talk to Bank</button></div>';if(k==='creative')extra='<div class=cards><div class=card><b>Gaming & Esports</b><p>Competition, testing, development and team roles.</p></div><div class=card><b>Content Creator</b><p>Plan, produce, edit, pitch clients and manage irregular income.</p></div><div class=card><b>Photography</b><p>Town businesses can hire photographers for real simulation contracts.</p></div><div class=card><b>Freelance Media</b><p>Take contracts without owning a full business.</p></div></div>';open('<h2>'+title+'</h2><p>'+desc+'</p>'+extra)}
function career(){if(!need())return;let c=prompt('What career do you want to explore?');if(!c)return;let w=get();w.residents[current].career=c;w.residents[current].history.push('Career goal: '+c);put(w);profile()}function job(){if(!need())return;let j=prompt('Choose a simulated job: cashier, childcare assistant, healthcare aide, auto shop worker, photographer, content assistant, restaurant worker, police trainee');if(!j)return;let w=get();w.residents[current].job=j;w.residents[current].history.push('Accepted job: '+j);put(w);profile()}function cash(t){if(!need())return;let a=Number(prompt('Amount'));if(!a||a<0)return;let w=get(),r=w.residents[current];if((t==='withdraw'||t==='save')&&a>r.checking)return alert('That amount is not available in checking.');if(t==='deposit')r.checking+=a;if(t==='withdraw')r.checking-=a;if(t==='save'){r.checking-=a;r.savings+=a}r.history.push(t+' $'+a);put(w);profile()}function home(n,c){if(!need())return;let w=get(),r=w.residents[current];if(r.checking<c)return alert('Your current balance cannot cover this move-in cost.');r.checking-=c;r.home=n+' • $'+c+'/month';r.history.push('Housing: '+r.home);put(w);profile()}
function businesses(){let w=get();return '<div class=cards>'+Object.entries(w.businesses).map(([n,b])=>'<div class=card><b>'+n+'</b><p>Owners: '+b.owners.join(', ')+'</p><div class=money>$'+b.balance.toFixed(2)+'</div><button class=primary onclick="meeting(\''+n.replaceAll("'","\\'")+'\')">Owner Meeting</button></div>').join('')+'</div>'}
function meeting(b){let w=get(),x=w.businesses[b];open('<h2>'+b+' Owners’ Meeting</h2><div class=meeting><div class=table>'+x.owners.join(' • ')+'</div><p>Review the problem together. Each owner can make a choice before the group decides what action the business will take.</p><input class=field id=issue placeholder="Meeting issue (manager, complaint, staffing, inventory...)"><button class=primary onclick="recordMeeting(\''+b.replaceAll("'","\\'")+'\')">Record Meeting Decision</button></div>')}function recordMeeting(b){let issue=document.querySelector('#issue').value.trim();if(!issue)return;let w=get();w.events.unshift({type:'Business meeting',business:b,issue,date:new Date().toLocaleString()});put(w);alert('Meeting recorded. This decision remains in the town history.');place('business')}
function phone(){let w=get(),mine=w.messages.filter(m=>m.to===current||m.from===current||m.to==='Everyone');open('<h2>📱 Transition Town Phone</h2><div class=chat>'+mine.map(m=>'<div class=bubble><b>'+m.from+' → '+m.to+'</b><br>'+m.text+'<br><small>'+m.date+'</small></div>').join('')+'</div><input class=field id=to placeholder="To"><textarea class=field id=msg placeholder="Message"></textarea><button class=primary onclick="send()">Send</button><p class=tiny>Transition Town messages are monitored instructional communication and are visible to Miss Kayla.</p>')}function send(){if(!need())return;let to=document.querySelector('#to').value.trim(),text=document.querySelector('#msg').value.trim();if(!to||!text)return;let w=get();w.messages.push({from:current,to,text,date:new Date().toLocaleString()});put(w);phone()}function updateBadge(){let w=get();badge.textContent=current?w.messages.filter(m=>m.to===current||m.to==='Everyone').length:0}
function teacher(){let w=get();open('<div class=character><div class=face>👩🏾‍💼</div><div><h2>Miss Kayla Control Center</h2><b>Transition Specialist • Mayor • Bank Branch Manager</b></div></div><div class=actions><button class=action onclick="group()">👥 Start Group Session</button><button class=action onclick="teacherMessages()">📱 Message Monitor</button><button class=action onclick="eventMaker()">⚡ Life Happens Event</button><button class=action onclick="teacherResidents()">🏘️ Residents</button></div><div class=notice>Teacher controls do not erase student consequences. The town continues from session to session.</div>')}function group(){let names=prompt('Students present, separated by commas');if(!names)return;open('<h2>Live Group Session</h2><p><b>Present:</b> '+names+'</p><div class=meeting><div class=table>GROUP MEETING</div><p>Pass the device, discuss a shared business/town problem, or switch resident profiles while keeping the group session together.</p><button class=primary onclick="place(\'business\')">Go to Business District</button></div>')}function teacherMessages(){let w=get();open('<h2>Message Monitor</h2><div class=chat>'+w.messages.slice().reverse().map(m=>'<div class=bubble><b>'+m.from+' → '+m.to+'</b><br>'+m.text+'<br><small>'+m.date+'</small></div>').join('')+'</div>')}function eventMaker(){let who=prompt('Student, business, or Everyone');let ev=prompt('What happens? (flat tire, complaint, inspection, emergency expense, party invitation, call-out, etc.)');if(!who||!ev)return;let w=get();w.messages.push({from:'Transition Town',to:who,text:ev,date:new Date().toLocaleString()});w.events.unshift({type:'Life Happens',who,issue:ev,date:new Date().toLocaleString()});put(w);alert('Event added to the town.')}function teacherResidents(){let w=get();open('<h2>Residents</h2>'+Object.entries(w.residents).map(([n,r])=>'<div class=card><b>'+n+'</b><p>$'+r.checking.toFixed(2)+' checking • '+r.job+' • '+r.career+' • '+r.home+'</p></div>').join(''))}
function endSession(){if(!need())return;let w=get(),r=w.residents[current];r.sessions++;if(r.sessions%2===0&&r.job!=='Needs a job'){r.checking+=500;r.history.push('Payday +$500');r.notifications.push('Payday deposited: $500')}put(w);let x=window.open('','_blank');x.document.write('<h1>Transition Town Session Report</h1><h2>'+current+'</h2><p>'+new Date().toLocaleString()+'</p><p>Career: '+r.career+'</p><p>Job: '+r.job+'</p><p>Home: '+r.home+'</p><p>Checking: $'+r.checking.toFixed(2)+'</p><p>Savings: $'+r.savings.toFixed(2)+'</p><p>Completed sessions: '+r.sessions+'</p><h3>Recent actions</h3><p>'+r.history.slice(-8).join('<br>')+'</p><hr><p>Pre-ETS / session note: __________________________________________</p><script>window.print()<\/script>')}updateBadge();if(current)status.textContent=current+' is in Transition Town.';
</script></body></html>
