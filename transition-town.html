function medicalState(){let w=get(),r=w.residents[current];r.medical=r.medical||{stage:'checkin',visits:0};if(!r.ttContact){r.ttContact={address:r.home&&r.home!=='Not selected'?r.home:'742 Oak Street, Transition Town, TN 38201',phone:'(731) 555-'+String(1000+Math.floor(Math.random()*8999)),insurance:'TownCare Basic',member:'TT-'+String(Math.floor(100000+Math.random()*899999))}}put(w);return r.medical}

function medicalScene(stage){if(!need())return;let m=medicalState();stage=stage||m.stage||'checkin';m.stage=stage;medicalSave(m);medicalClose();let files={checkin:'medical-check-in.png',triage:'medical-triage.png',waiting:'medical-waiting-room.png',doctor:'medical-exam-room.png',discharge:'medical-discharge.png',billing:'medical-billing.png'},labels={checkin:'Walk Up to Front Desk',triage:'Talk to Triage Nurse',waiting:'Wait for My Name',doctor:'See the Doctor',discharge:'Go to Discharge Desk',billing:'Open Billing'},actions={checkin:'medicalDesk()',triage:'medicalTriage()',waiting:'medicalWait()',doctor:'medicalDoctor()',discharge:'medicalDischarge()',billing:'medicalBill()'},s=document.createElement('section');s.id='medicalScene';s.className='cityhallscene';s.innerHTML='<div class="cityhallgame medicalroom" style="background-image:url(\'./'+files[stage]+'?v=20261001smooth\')">'+medicalHud()+'<div class="medicalStep">Step '+({checkin:1,triage:2,waiting:3,doctor:4,discharge:5,billing:6}[stage])+' of 6</div><button class="medicalHotspot" onclick="'+actions[stage]+'"><span>'+labels[stage]+'</span></button><aside id="townIDPanel" class="townIDPanel"></aside></div>';document.body.appendChild(s)}

function medicalDesk(){let m=medicalState();if(m.stage!=='checkin')return medicalScene(m.stage);let reason=prompt('FRONT DESK\n\nHow can I help you today?\n\nExamples: I am sick; I am throwing up; I fell; I think I broke something; I have chest pain; I need a checkup.');if(!reason||!reason.trim())return;let w=get(),r=w.residents[current],x=r.ttContact;if(!confirm('PATIENT INTAKE\n\nName: '+current+'\nAddress: '+x.address+'\nPhone: '+x.phone+'\nReason: '+reason+'\n\nSubmit this fictional Transition Town intake form?'))return;let plan=prompt('Choose fictional insurance:\n1 - TownCare Basic ($30 copay)\n2 - TownCare Plus ($20 copay)\n3 - No Insurance','1');m.reason=reason.trim();m.insurance=plan==='2'?'TownCare Plus':plan==='3'?'No Insurance':'TownCare Basic';m.stage='triage';r.medical=m;r.history.push('Medical intake completed');put(w);medicalScene('triage')}
function medicalTriage(){let w=get(),r=w.residents[current],m=r.medical||medicalState();if(m.stage!=='triage')return medicalScene(m.stage||'checkin');let symptom=prompt('TRIAGE NURSE\n\nTell me more about the fictional problem:');if(!symptom||!symptom.trim())return;let pain=prompt('Pain level from 0 to 10:','3');m.symptom=symptom.trim();m.pain=pain||'0';m.stage='waiting';r.medical=m;r.history.push('Medical triage completed');put(w);medicalScene('waiting')}
function medicalWait(){let w=get(),r=w.residents[current],m=r.medical||{stage:'waiting'};m.stage='doctor';r.medical=m;r.history=r.history||[];r.history.push('Called to exam room');w.messages=w.messages||[];w.messages.push({from:'Transition Town Medical Center',to:current,text:'Your name has been called. The doctor is ready to see you in the exam room.',date:new Date().toLocaleString()});put(w);medicalScene('doctor');setTimeout(function(){try{updateBadge()}catch(e){}},50)}
function medicalDoctor(){let w=get(),r=w.residents[current],m=r.medical||medicalState();if(m.stage!=='doctor')return medicalScene(m.stage||'checkin');let scenarios=[['Minor sprain','Rest, use ice as instructed, and follow up if symptoms worsen.'],['Seasonal allergies','Avoid known triggers and follow your fictional care instructions.'],['Mild stomach virus','Rest, drink fluids, and follow the fictional return precautions.'],['Routine checkup','Continue healthy routines and follow up as directed.']];let x=scenarios[Math.floor(Math.random()*scenarios.length)];m.diagnosis=x[0];m.instructions=x[1];m.stage='discharge';r.medical=m;r.history.push('Doctor visit completed: '+x[0]);put(w);alert('Doctor visit complete.\n\nPractice diagnosis: '+x[0]+'\n\nInstructions: '+x[1]);medicalScene('discharge')}
function medicalDischarge(){let w=get(),r=w.residents[current],m=r.medical||medicalState();if(m.stage!=='discharge')return medicalScene(m.stage||'checkin');let sig=prompt('DISCHARGE PAPERWORK\n\nDiagnosis: '+m.diagnosis+'\nInstructions: '+m.instructions+'\n\nType your first name to sign:');if(!sig||!sig.trim())return;m.signature=sig.trim();m.stage='billing';r.medical=m;r.history.push('Discharge paperwork signed');put(w);medicalScene('billing')}
function medicalBill(){let w=get(),r=w.residents[current],m=r.medical||medicalState();if(m.stage!=='billing'&&m.stage!=='complete')return medicalScene(m.stage||'checkin');if(!m.billCreated){let total=500,covered=m.insurance==='TownCare Plus'?400:m.insurance==='TownCare Basic'?350:0,copay=m.insurance==='TownCare Plus'?20:m.insurance==='TownCare Basic'?30:0;m.billDue=total-covered+copay;m.billTotal=total;m.covered=covered;m.billCreated=true;m.stage='billing';r.medical=m;r.history.push('Medical bill created: $'+m.billDue);w.messages.push({from:'Medical Center Billing',to:current,text:'Your medical statement is ready. Patient responsibility: $'+m.billDue+'.',date:new Date().toLocaleString()});put(w);updateBadge();alert('Your bill is ready. Patient responsibility: $'+m.billDue+'.');return medicalScene('billing')}medicalPayBill()}
function medicalPayBill(){let w=get(),r=w.residents[current],m=r.medical||medicalState(),amt=Number(m.billDue||0);if(!amt){m.stage='complete';r.medical=m;put(w);return alert('This medical visit is complete.')}if(r.checking<amt)return alert('Not enough money in checking. The bill will stay due.');if(!confirm('Pay $'+amt+' from checking?'))return;r.checking-=amt;m.billDue=0;m.stage='complete';r.medical=m;r.history.push('Medical bill paid -$'+amt);put(w);alert('Bill paid. Your medical visit is complete.');medicalClose()}

function mayorForm(type){
 if(!need())return;
 let promptText={Complaint:'What happened, and what would you like the town to do?',Compliment:'Who or what would you like to recognize?',Suggestion:'What could make Transition Town better?', 'Help Request':'What do you need help with?', 'Town Idea':'Describe your idea for Transition Town.', 'Meeting Request':'What would you like to discuss with Mayor Kayla?'}[type]||'What would you like Mayor Kayla to know?';
 let msg=prompt(type+'\n\n'+promptText);if(!msg||!msg.trim())return;
 let w=get();w.mayorInbox=w.mayorInbox||[];w.mayorInbox.unshift({from:current,type:type,text:msg.trim(),date:new Date().toLocaleString()});
 w.residents[current].history.push('Mayor’s Office: '+type+' submitted');
 w.messages.push({from:'Mayor Kayla’s Office',to:current,text:'Your '+type.toLowerCase()+' was received. Thank you for communicating with City Hall.',date:new Date().toLocaleString()});
 put(w);updateBadge();alert(type+' submitted to Mayor Kayla. A confirmation was sent to your Transition Town phone.');cityDept('mayor')
}
function cityServiceForm(dept,type){if(!need())return;let msg=prompt(type+'\n\nTell '+dept+' what you need:');if(!msg||!msg.trim())return;let w=get();w.cityHallInbox=w.cityHallInbox||[];w.cityHallInbox.unshift({from:current,department:dept,type,text:msg.trim(),date:new Date().toLocaleString()});w.residents[current].history.push(dept+': '+type+' submitted');put(w);alert(type+' submitted.')}
function utilityApplication(kind){if(!need())return;let label=kind==='water'?'Water':'Electric',deposit=kind==='water'?160:200;let address=prompt(label+' Service Application\n\nEnter your Transition Town home/address or housing choice:');if(!address)return;let agree=confirm('The '+label.toLowerCase()+' service deposit is $'+deposit+'. Submit application and pay deposit from checking?');if(!agree)return;utilityPay(kind+'Deposit',deposit);let w=get();w.residents[current].history.push(label+' service application: '+address);put(w)}
function utilityEarlyPay(kind){let amount=kind==='water'?45:85;if(!confirm('Pay the next '+kind+' bill early for $'+amount+'?'))return;utilityPay(kind+'Bill',amount)}
function utilityLatePay(kind){if(!need())return;let base=kind==='water'?45:85,fee=15,total=base+fee;if(!confirm('Late payment: $'+base+' bill + $'+fee+' late fee = $'+total+'. Pay now?'))return;let w=get(),r=w.residents[current];if(r.checking<total)return alert('Not enough money in checking.');r.checking-=total;r.utilities[kind==='water'?'lastWaterPaid':'lastElectricPaid']=r.sessions;r.history.push((kind==='water'?'Water':'Electric')+' late bill -$'+total+' (includes $15 late fee)');put(w);alert('Late bill and fee paid.');cityDept(kind)}
function utilityDisconnect(kind){if(!need())return;let w=get(),r=w.residents[current],u=r.utilities;let water=kind==='water',base=water?45:85,on=water?u.waterOn:u.electricOn;if(!on)return alert('That service is already off.');let due=r.sessions-(water?u.lastWaterPaid:u.lastElectricPaid)>=2;if(due){if(!confirm('A final $'+base+' bill is still due. Your deposit cannot be returned until the final bill is paid. Pay it now and disconnect?'))return; if(r.checking<base)return alert('Not enough money to pay the final bill. The deposit remains held.');r.checking-=base;r.history.push((water?'Water':'Electric')+' final bill -$'+base)}let deposit=water?160:200;r.checking+=deposit;if(water){u.waterOn=false;u.waterDeposit=false;u.lastWaterPaid=r.sessions}else{u.electricOn=false;u.electricDeposit=false;u.lastElectricPaid=r.sessions}r.history.push((water?'Water':'Electric')+' disconnected; deposit returned +$'+deposit);put(w);alert('Service disconnected. Final bill is clear and your $'+deposit+' deposit was returned to checking.');cityDept(kind)}
function utilityPay(kind,amount){if(!need())return;let w=get(),r=w.residents[current];r.utilities=r.utilities||{};if(r.checking<amount)return alert('Not enough money in checking for this payment.');r.checking-=amount;let u=r.utilities;if(kind==='electricDeposit'){u.electricDeposit=true;u.electricOn=true;u.lastElectricPaid=r.sessions;r.history.push('Electric service deposit -$'+amount)}if(kind==='waterDeposit'){u.waterDeposit=true;u.waterOn=true;u.lastWaterPaid=r.sessions;r.history.push('Water service deposit -$'+amount)}if(kind==='electricBill'){u.lastElectricPaid=r.sessions;r.history.push('Electric bill -$'+amount)}if(kind==='waterBill'){u.lastWaterPaid=r.sessions;r.history.push('Water bill -$'+amount)}r.notifications=(r.notifications||[]).filter(n=>!n.includes(kind.startsWith('electric')?'electric bill':'water bill'));put(w);alert('Payment recorded. $'+amount+' was paid from checking.');cityDept(kind.startsWith('electric')?'electric':'water')}
function recreationApply(){if(!need())return;let sport=prompt('Recreational Sports Application\n\nWhat sport would you like to play?');if(!sport)return;let w=get(),r=w.residents[current];if(r.checking<50)return alert('You need $50 in checking for the application fee.');if(!confirm('Submit your '+sport+' application and pay the $50 registration fee?'))return;r.checking-=50;r.recreation=r.recreation||[];r.recreation.push({sport,date:new Date().toLocaleString()});r.history.push('Recreation application: '+sport+' -$50');put(w);alert('Application submitted and $50 fee paid.');cityDept('recreation')}
function propertyTax(){if(!need())return;let w=get(),r=w.residents[current];let amount=Number(prompt('Property Tax / Bill\n\nEnter the simulated bill amount shown by your instructor, or enter 100 for the standard practice bill:','100'));if(!amount||amount<0)return;if(r.checking<amount)return alert('Not enough money in checking.');if(!confirm('Pay $'+amount+' property bill from checking?'))return;r.checking-=amount;r.history.push('Property tax / bill -$'+amount);put(w);alert('Property payment recorded.');cityDept('property')}
function ordinanceForm(type){cityServiceForm('Public Safety - City Ordinance',type)}
function schoolClearance(){if(!need())return;let w=get(),r=w.residents[current];let issue=confirm('Does this resident currently have unresolved school trouble or a school hold? Click OK for YES or Cancel for NO.');r.schoolClearance=issue?'REVIEW NEEDED':'CLEARED';r.history.push('Board of Education school clearance: '+r.schoolClearance);w.messages.push({from:'Board of Education',to:current,text:issue?'Your school clearance needs review before the Transition Town license process can continue.':'Your school status is cleared for the Transition Town license process.',date:new Date().toLocaleString()});put(w);updateBadge();alert('School clearance result: '+r.schoolClearance);cityDept('boe')}
function career(){if(!need())return;let goal=prompt('What career do you want to explore?');if(!goal)return;let w=get();w.residents[current].career=goal;w.residents[current].history.push('Career goal: '+goal);put(w);profile()}
function job(){if(!need())return;let j=prompt('Choose a simulated job: cashier, childcare assistant, healthcare aide, auto shop worker, photographer, content assistant, restaurant worker, police trainee');if(!j)return;let w=get();w.residents[current].job=j;w.residents[current].history.push('Accepted job: '+j);put(w);profile()}
function cash(t){if(!need())return;let a=Number(prompt('Amount'));if(!a||a<0)return;let w=get(),r=w.residents[current];if((t==='withdraw'||t==='save')&&a>r.checking)return alert('That amount is not available in checking.');if(t==='deposit')r.checking+=a;if(t==='withdraw')r.checking-=a;if(t==='save'){r.checking-=a;r.savings+=a}r.history.push(t+' $'+a);put(w);profile()}
function home(n,cost){if(!need())return;let w=get(),r=w.residents[current];if(r.checking<cost)return alert('Your current balance cannot cover this move-in cost.');r.checking-=cost;r.home=n+' • $'+cost+'/month';r.history.push('Housing: '+r.home);put(w);profile()}
function businesses(){let w=get();let colors=['#e8afd0','#b8c8ef','#f2c28c','#bfe3b8','#d2c1ef','#ffe08a'];return '<div class="storegrid">'+Object.entries(w.businesses).map(function(entry,i){let n=entry[0],b=entry[1];let cls=n==="Cool Vibes"?"coolvibes":n==="3K Tire Shop"?"threek":n==="The Zoo"?"thezoo":n==="Guardian Angel"?"guardian":n==="The Main Attraction"?"mainattraction":"";return '<button class="store '+cls+'" onclick="meeting(\''+n.replaceAll("'","\\'")+'\')"><div class="storeart" style="--store:'+colors[i%colors.length]+'"><span class="brandSign">'+n+'</span></div><b>'+n+'</b><p>Owners: '+b.owners.join(', ')+'</p><small>'+(b.type||'Student-owned business')+'</small></button>'}).join('')+'</div>'}
function meeting(b){let w=get(),x=w.businesses[b];open('<h2>'+b+' Owners’ Meeting</h2><div class=meeting><div class=table>'+x.owners.join(' • ')+'</div><p>Review the problem together. Each owner can make a choice before the group decides what action the business will take.</p><input class=field id=issue placeholder="Meeting issue (manager, complaint, staffing, inventory...)"><button class=primary onclick="recordMeeting(\''+b.replaceAll("'","\\'")+'\')">Record Meeting Decision</button></div>')}function recordMeeting(b){let issue=document.querySelector('#issue').value.trim();if(!issue)return;let w=get();w.events.unshift({type:'Business meeting',business:b,issue,date:new Date().toLocaleString()});put(w);alert('Meeting recorded. This decision remains in the town history.');place('business')}
function phone(){let w=get(),mine=w.messages.filter(m=>m.to===current||m.from===current||m.to==='Everyone');open('<h2>📱 Transition Town Phone</h2><div class=chat>'+mine.map(m=>'<div class=bubble><b>'+m.from+' → '+m.to+'</b><br>'+m.text+'<br><small>'+m.date+'</small></div>').join('')+'</div><input class=field id=to placeholder="To"><textarea class=field id=msg placeholder="Message"></textarea><button class=primary onclick="send()">Send</button><p class=tiny>Transition Town messages are monitored instructional communication and are visible to Miss Kayla.</p>')}function send(){if(!need())return;let to=document.querySelector('#to').value.trim(),text=document.querySelector('#msg').value.trim();if(!to||!text)return;let w=get();w.messages.push({from:current,to,text,date:new Date().toLocaleString()});put(w);phone()}function updateBadge(){let w=get();badge.textContent=current?w.messages.filter(m=>m.to===current||m.to==='Everyone').length:0}
function teacher(){let w=get();open('<div class=character><div class="face">MK</div><div><h2>Miss Kayla Control Center</h2><b>Transition Specialist • Mayor • Bank Branch Manager</b></div></div><div class=actions><button class=action onclick="group()">👥 Start Group Session</button><button class=action onclick="teacherMessages()">📱 Message Monitor</button><button class=action onclick="eventMaker()">⚡ Life Happens Event</button><button class=action onclick="teacherResidents()">🏘️ Residents</button></div><div class=notice>Teacher controls do not erase student consequences. The town continues from session to session.</div>')}function group(){let names=prompt('Students present, separated by commas');if(!names)return;activeGroup=names.split(',').map(n=>n.trim()).filter(Boolean);activeGroup.forEach(ensure);localStorage.ttActiveGroup=JSON.stringify(activeGroup);groupRoom()}function groupRoom(){if(!activeGroup.length){try{activeGroup=JSON.parse(localStorage.ttActiveGroup||'[]')}catch(e){activeGroup=[]}}if(!activeGroup.length)return group();open('<h2>Live Group Session</h2><p><b>Present:</b> '+activeGroup.join(', ')+'</p><p class=tiny>Tap a student before an individual choice. Each resident keeps separate money, career, job, housing and history.</p><div class=actions>'+activeGroup.map(n=>'<button class=action data-n="'+encodeURIComponent(n)+'" onclick="switchGroupResident(this.dataset.n)">'+n+'</button>').join('')+'</div><div class=meeting><div class=table>GROUP MEETING</div><button class=primary onclick="place(\'business\')">Go to Business District</button> <button class=primary onclick="endGroup()">End Group</button></div>')}function switchGroupResident(encoded){let n=decodeURIComponent(encoded);ensure(n);current=n;localStorage.ttCurrent=n;status.textContent=n+" is active in the group session.";profile()}function endGroup(){activeGroup=[];localStorage.removeItem('ttActiveGroup');teacher()}function teacherMessages(){let w=get();open('<h2>Message Monitor</h2><div class=chat>'+w.messages.slice().reverse().map(m=>'<div class=bubble><b>'+m.from+' → '+m.to+'</b><br>'+m.text+'<br><small>'+m.date+'</small></div>').join('')+'</div>')}function eventMaker(){let who=prompt('Student, business, or Everyone');let ev=prompt('What happens? (flat tire, complaint, inspection, emergency expense, party invitation, call-out, etc.)');if(!who||!ev)return;let w=get();w.messages.push({from:'Transition Town',to:who,text:ev,date:new Date().toLocaleString()});w.events.unshift({type:'Life Happens',who,issue:ev,date:new Date().toLocaleString()});put(w);alert('Event added to the town.')}function teacherResidents(){let w=get();open('<h2>Residents</h2>'+Object.entries(w.residents).map(([n,r])=>'<div class=card><b>'+n+'</b><p>$'+r.checking.toFixed(2)+' checking • '+r.job+' • '+r.career+' • '+r.home+'</p></div>').join(''))}
try{activeGroup=JSON.parse(localStorage.ttActiveGroup||'[]')}catch(e){activeGroup=[]}
(function resetKaylaTestMoney(){if(localStorage.ttKaylaMoneyReset20261001)return;let w=get();let changed=false;Object.keys(w.residents).forEach(function(n){if(/^kayla( halliburton)?$/i.test(n.trim())||/^miss kayla$/i.test(n.trim())){w.residents[n].checking=10000;w.residents[n].savings=0;w.residents[n].history.push('Test money reset');changed=true}});if(changed)put(w);localStorage.ttKaylaMoneyReset20261001='1'})()
function endSession(){if(!need())return;let w=get(),r=w.residents[current];r.sessions++;r.utilities=r.utilities||{electricOn:false,waterOn:false,electricDeposit:false,waterDeposit:false,lastElectricPaid:0,lastWaterPaid:0};if(r.sessions%2===0&&r.job!=='Needs a job'){r.checking+=500;r.history.push('Payday +$500');r.notifications.push('Payday deposited: $500')}if(r.utilities.electricOn&&r.sessions-r.utilities.lastElectricPaid>=2&&!r.notifications.includes('CITY HALL: Your electric bill of $85 is due. Visit the Electricity Department to pay it.')){r.notifications.push('CITY HALL: Your electric bill of $85 is due. Visit the Electricity Department to pay it.');w.messages.push({from:'City Hall - Electricity Department',to:current,text:'Your electric bill of $85 is due. Visit the Electricity Department to pay it.',date:new Date().toLocaleString()})}if(r.utilities.waterOn&&r.sessions-r.utilities.lastWaterPaid>=2&&!r.notifications.includes('CITY HALL: Your water bill of $45 is due. Visit the Water Department to pay it.')){r.notifications.push('CITY HALL: Your water bill of $45 is due. Visit the Water Department to pay it.');w.messages.push({from:'City Hall - Water Department',to:current,text:'Your water bill of $45 is due. Visit the Water Department to pay it.',date:new Date().toLocaleString()})}put(w);let x=window.open('','_blank');x.document.write('<h1>Transition Town Session Report</h1><h2>'+current+'</h2><p>'+new Date().toLocaleString()+'</p><p>Career: '+r.career+'</p><p>Job: '+r.job+'</p><p>Home: '+r.home+'</p><p>Checking: $'+r.checking.toFixed(2)+'</p><p>Savings: $'+r.savings.toFixed(2)+'</p><p>Completed sessions: '+r.sessions+'</p><h3>Recent actions</h3><p>'+r.history.slice(-8).join('<br>')+'</p><hr><p>Pre-ETS / session note: __________________________________________</p><script>window.print()<\/script>')}updateBadge();if(current)status.textContent=current+' is in Transition Town. Choose a building on the map.';
</script><script>
(function(){
  function forceTownArt(){
    var map=document.querySelector('.townmap'), img=document.querySelector('.townMasterArt');
    if(!map||!img)return;
    map.style.setProperty('height','calc(100vh - 54px)','important');
    map.style.setProperty('min-height','calc(100vh - 54px)','important');
    map.style.setProperty('background','#9ed6f3','important');
    img.style.cssText='position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:contain!important;object-position:center top!important;display:block!important;visibility:visible!important;opacity:1!important;z-index:1!important;';
    img.onerror=function(){
      map.style.setProperty('background','#9ed6f3 url("transition-town-map.png.png") center/cover no-repeat','important');
      this.style.display='none';
    };
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',forceTownArt);else forceTownArt();
})();
</script></body></html>
