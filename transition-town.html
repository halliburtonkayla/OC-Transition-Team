function saveTownJobApplication(job){let g=id=>document.getElementById(id)?.value.trim()||'';if(!document.getElementById('maAgree')?.checked)return alert('Please check the practice application box.');let required=['maName','maAvail','maEdu','maExp','maSkills','maWhy'];if(required.some(id=>!g(id)))return alert('Please complete the main application questions before submitting.');let w=get(),r=w.residents[current],a={job:job,name:g('maName'),phone:g('maPhone'),availability:g('maAvail'),education:g('maEdu'),experience:g('maExp'),skills:g('maSkills'),why:g('maWhy'),reference:g('maRef'),status:'Ready for Miss Kayla review',date:new Date().toLocaleString()};r.applications=r.applications||[];r.applications.push(a);r.history.push('Completed mock application: '+job);w.messages=w.messages||[];w.messages.push({from:'Career & Job Center',to:current,text:'Mock application completed for '+job+'. Tell Miss Kayla so she can review or print it.',date:new Date().toLocaleString()});put(w);careerPanel('Mock Application Complete','<div class="roomcard" style="max-width:700px;margin:20px auto;text-align:center"><h3>'+job+'</h3><p>Your mock application has been saved.</p><p><b>Your application notification is being sent to Miss Kayla’s Central Hub.</b></p><button onclick="printMockApplication(\''+job.replace(/'/g,"\\'")+'\')">Print Mock Application</button><button onclick="townJobs()">Back to Town Employers</button></div>')}

function trainingRoomScene(title,body){document.querySelector('#centerScene')?.remove();let d=document.createElement('div');d.id='centerScene';d.style='position:fixed;inset:0;z-index:9400;overflow:auto;background:linear-gradient(135deg,#eef2ff,#fff7ed)';d.innerHTML='<style>#centerScene .roomwrap{max-width:1100px;margin:auto;padding:24px}.roomhead{background:#172554;color:white;padding:22px;border-radius:22px}.roomgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}.roomcard{background:white;border-radius:20px;padding:20px;box-shadow:0 10px 30px #0002;border:1px solid #ddd}.roomcard button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:12px;background:#5b21b6;color:white;font-weight:800}.roomback{padding:12px 16px;border:0;border-radius:12px;font-weight:800;margin-bottom:15px}</style><div class="roomwrap"><button class="roomback" onclick="trainingCollege()">← Training & College Lobby</button><div class="roomhead"><h2>'+title+'</h2></div>'+body+'</div>';document.body.appendChild(d)}
function shortTraining(){let rooms=[['CPR / First Aid','CPR first aid basics high school students'],['Child Care Training','child care career training high school students'],['Police Academy / Public Safety','law enforcement career training high school students'],['Medical Careers','healthcare careers high school students'],['Welding & Skilled Trades','welding career high school students'],['Gaming & Esports','esports gaming careers students'],['Photography & Media','photography career students'],['Teacher Training','teaching career high school students']];let cards='<div class="roomgrid">'+rooms.map(x=>'<div class="roomcard"><h3>'+x[0]+'</h3><p>Enter this training room for a short lesson and completion activity.</p><button onclick="trainingRoom(\''+x[0].replace(/'/g,"\\'")+'\',\''+x[1]+'\')">Enter Room</button></div>').join('')+'</div>';trainingRoomScene('Short Training Video Lab',cards)}
function trainingRoom(name,q){let base='https://www.youtube.com/results?search_query=',qs=[q+' career overview 3 minutes',q+' day in the life short',q+' skills training short'];let vids=qs.map((x,i)=>'<div class="roomcard"><h3>Short Film '+(i+1)+'</h3><p>Open a short video choice for '+name+'.</p><a href="'+base+encodeURIComponent(x)+'" target="_blank" rel="noopener" style="display:block;text-align:center;padding:13px;border-radius:12px;background:#5b21b6;color:white;font-weight:800;text-decoration:none">Open Short Film '+(i+1)+'</a></div>').join('');trainingRoomScene(name,'<p style="font-size:1.05rem">Choose one or more short films, then complete your reflection.</p><div class="roomgrid">'+vids+'<div class="roomcard"><h3>Finished Watching?</h3><p>Complete your questionnaire so Miss Kayla can print it for today’s work.</p><button onclick="trainingCheck(\''+name.replace(/'/g,"\\'")+'\')">Complete My Questionnaire</button></div></div>')}
function trainingCheck(name){if(!need())return;let esc=name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');trainingRoomScene(name+' Reflection','<p>Complete this after watching one or more short films.</p><div class="roomcard" style="max-width:800px;margin:18px auto"><label><b>How did you feel about this job/career?</b></label><select id="trFeel" style="width:100%;padding:12px;margin:8px 0 16px"><option>I really liked it</option><option>I liked some parts</option><option>I am not sure yet</option><option>I do not think it is for me</option></select><label><b>Would you consider this career?</b></label><select id="trInterest" style="width:100%;padding:12px;margin:8px 0 16px"><option>Yes</option><option>Maybe</option><option>No</option></select><label><b>What is one thing you learned?</b></label><textarea id="trLearned" rows="3" style="width:100%;padding:10px"></textarea><label><b>What skill or responsibility is important for this job?</b></label><textarea id="trSkill" rows="3" style="width:100%;padding:10px"></textarea><label><b>What looked interesting or enjoyable?</b></label><textarea id="trLike" rows="3" style="width:100%;padding:10px"></textarea><label><b>What might be difficult or challenging?</b></label><textarea id="trChallenge" rows="3" style="width:100%;padding:10px"></textarea><button id="finishTrainingBtn">Finish & Save Training</button></div>');setTimeout(()=>{let b=document.getElementById('finishTrainingBtn');if(b)b.onclick=()=>finishTraining(name)},0)}
function finishTraining(name){let ids=['trLearned','trSkill','trLike','trChallenge'];if(ids.some(id=>!document.getElementById(id)?.value.trim()))return alert('Please answer all four written questions before finishing.');let w=get(),r=w.residents[current],rec={name:name,feel:document.getElementById('trFeel').value,interest:document.getElementById('trInterest').value,learned:document.getElementById('trLearned').value.trim(),skill:document.getElementById('trSkill').value.trim(),liked:document.getElementById('trLike').value.trim(),challenge:document.getElementById('trChallenge').value.trim(),date:new Date().toLocaleString()};r.training=r.training||[];r.training.push(rec);r.history.push('Completed short training: '+name);w.messages=w.messages||[];w.messages.push({from:'Training & College Center',to:current,text:'You completed '+name+'. Tell Miss Kayla so she can print your completed training reflection for today.',date:new Date().toLocaleString()});put(w);trainingComplete(rec)}
function trainingComplete(rec){openSheet('<h2>Training Complete!</h2><div class=card><h3>'+rec.name+'</h3><p><b>'+current+'</b>, your questionnaire has been saved.</p><p style="font-size:1.15rem"><b>Tell Miss Kayla you finished this training.</b> She can print your completed questionnaire and add it to today’s work.</p><div class=actions><button class=primary onclick="printTraining(\''+rec.name.replace(/'/g,"\\'")+'\')">Print My Questionnaire</button><button class=action onclick="shortTraining()">Choose Another Training</button></div></div>')}
function printTraining(name){let w=get(),r=w.residents[current],a=(r.training||[]).filter(x=>x.name===name).slice(-1)[0];if(!a)return alert('No completed questionnaire found.');let p=window.open('','_blank');p.document.write('<html><head><title>'+name+' Training Reflection</title><style>body{font-family:Arial;padding:35px;line-height:1.5}h1{border-bottom:3px solid #222;padding-bottom:10px}.q{margin:18px 0}.answer{border:1px solid #999;padding:10px;min-height:30px}</style></head><body><h1>Transition Town Training Reflection</h1><p><b>Student:</b> '+current+'<br><b>Training:</b> '+a.name+'<br><b>Completed:</b> '+a.date+'</p><div class=q><b>How did you feel about this job/career?</b><div class=answer>'+a.feel+'</div></div><div class=q><b>Would you consider this career?</b><div class=answer>'+a.interest+'</div></div><div class=q><b>One thing I learned:</b><div class=answer>'+a.learned+'</div></div><div class=q><b>Important skill or responsibility:</b><div class=answer>'+a.skill+'</div></div><div class=q><b>What looked interesting or enjoyable?</b><div class=answer>'+a.liked+'</div></div><div class=q><b>What might be difficult or challenging?</b><div class=answer>'+a.challenge+'</div></div><script>window.onload=()=>window.print()<\/script></body></html>');p.document.close()}

function careerJobMenu(){if(!need())return;let w=get(),r=w.residents[current];r.applications=r.applications||[];let realJobs=['Union City area jobs','Martin area jobs','Obion County jobs','Fulton County area jobs','Tiptonville / Lake County jobs','Dyersburg area jobs','Dresden area jobs'];let townJobs=['Bank Teller','City Hall Assistant','Pizza Shop Worker','Grocery Store Worker','Coffee Shop Worker','Teacher Assistant','Police Trainee','Fire Department Trainee','Cool Vibes Café','The Zoo Pet Sitting','3K Tire Shop','Guardian Angel Childcare','The Main Attraction'];openSheet('<h2>Career & Job Center</h2><p>Welcome to the Job Fair. Explore local-area opportunities or practice applying for jobs inside Transition Town.</p><div class=cards><div class=card><b>Local Job Fair</b><p>'+realJobs.join(' • ')+'</p><button class=primary onclick="career()">Explore a Career</button></div><div class=card><b>Transition Town Jobs — Hiring Now</b><p>'+townJobs.join(' • ')+'</p><button class=primary onclick="townJobApplication()">Practice Application</button></div><div class=card><b>My Applications</b><p>'+(r.applications.length?r.applications.map(a=>a.job+' — '+a.status).join('<br>'):'No applications yet.')+'</p><button class=primary onclick="reviewApplications()">Review Applications</button></div></div>')}function townJobApplication(){let job=prompt('Which Transition Town job do you want to apply for?\n\nBank Teller, City Hall Assistant, Pizza, Grocery, Coffee, Teacher Assistant, Police, Fire, Cool Vibes, The Zoo, 3K Tire Shop, Guardian Angel, or The Main Attraction');if(!job)return;let why=prompt('Practice application: Why would you be a good fit for '+job+'?');if(!why)return;let w=get(),r=w.residents[current];r.applications=r.applications||[];r.applications.push({job:job,answer:why,status:'Ready for review',date:new Date().toLocaleString()});r.history.push('Job application submitted: '+job);w.messages.push({from:'Career & Job Center',to:current,text:'Your application for '+job+' was received and is ready for review.',date:new Date().toLocaleString()});put(w);updateBadge();careerJobCenter()}
function reviewApplications(){let w=get(),r=w.residents[current];r.applications=r.applications||[];let pending=r.applications.filter(a=>a.status==='Ready for review');if(!pending.length)return alert('You do not have an application waiting for review.');let a=pending[0];if(confirm('Application: '+a.job+'\n\nAnswer: '+a.answer+'\n\nMove this student forward to an interview?')){a.status='Interview';w.messages.push({from:'Career & Job Center',to:current,text:'Good news! Your '+a.job+' application moved forward to an interview.',date:new Date().toLocaleString()});r.history.push('Interview offered: '+a.job);put(w);updateBadge();careerJobCenter()}}

const ttStoryBooks=[
 {t:"Alyssa's First Day at the Bakery",sub:"Customer service • teamwork",pages:["Alyssa walked into the bakery excited for her first shift. She thought the hardest decision would be which cupcake looked best.","Kaylee showed Alyssa the morning order list. There were cakes to box, cupcakes to stock, and customers already waiting.","Jocquan changed his order at the last minute. Alyssa wanted to rush, but she stopped and repeated the new order back to him.","Then Cameron handed a customer the wrong bag. Instead of blaming him, Alyssa checked the labels and helped fix the mistake.","The lunch rush started. Alyssa organized the orders into WAITING, MAKING, and READY so everybody could see what came next.","A customer asked a question Alyssa did not know. She said, “Let me find out for you,” instead of guessing.","Kaylee noticed the line moving faster. Jocquan checked each finished order before it went out.","Cameron apologized for the mix-up and helped remake the order. The customer thanked the team for fixing it quickly.","By closing time, Alyssa realized bakery work was much more than decorating cupcakes. Communication mattered just as much.","Alyssa's takeaway: Good workers do not have to know everything. They listen, ask questions, fix mistakes, and work as a team."]},
 {t:"Jasmine & Gia's Daycare Disaster",sub:"Childcare • safety • patience",pages:["Jasmine and Gia started their daycare shift thinking the day would be mostly toys, coloring, and cute kids.","Within minutes, one child could not find a shoe, another wanted a snack, and somebody was asking the same question again and again.","Aubry helped search for the missing shoe while Jasmine counted every child in the room.","Noah needed help with an activity. Gia slowed down, gave one direction at a time, and made sure he understood.","Jacob noticed a child climbing where they should not. He calmly redirected the child to a safer activity.","Adon brought the backpack list over. The missing backpack had been placed by the wrong cubby.","Instead of everybody trying to solve every problem, Jasmine divided the jobs: supervision, activities, belongings, and cleanup.","Gia checked the room again. Every child was safe, accounted for, and where they were supposed to be.","At pickup time, the room was not perfectly clean, but the children were safe and the team knew what had happened during the day.","Their takeaway: Childcare is fun, but safety comes first. Stay calm, communicate, count carefully, and ask for help when you need it."]},
 {t:"Haley's Very Busy Vet Clinic",sub:"Animal care • prioritizing",pages:["Haley opened the vet clinic expecting a normal day. Then the waiting room filled up all at once.","Jayden arrived with a puppy that would not stop scratching. Clark had a cat that was refusing food.","Dalton brought in a nervous dog, Allen had questions about pet medicine, and Olivia was worried about a pet that seemed weak.","Max was talking the loudest, but Haley remembered something important: the loudest problem is not always the most urgent.","She asked questions, looked at the symptoms, and decided which animal needed attention first.","Kaylee helped record the information while Haley explained to each owner why they might have to wait.","The nervous animals were kept apart and given quieter spaces. Everyone worked to keep the clinic calm.","Haley asked the veterinarian when she was unsure instead of pretending she knew the answer.","By the end of the shift, every pet had been checked and every owner knew what to do next.","Haley's takeaway: Animal-care workers need compassion, observation, teamwork, and the ability to decide what needs attention first."]},
 {t:"Chevi Becomes an Art Teacher",sub:"Teaching • planning • creativity",pages:["Chevi walked into the art room with a lesson she thought everybody would love.","Aubry wanted to paint. Jasmine wanted markers. Cameron said he could not draw, and Alyssa finished the first direction before everyone else.","Chevi realized teaching one lesson did not mean everybody would learn it the same way.","She demonstrated the project slowly and showed an example without telling students their art had to look exactly like hers.","When Cameron got frustrated, Chevi broke the drawing into smaller steps.","Aubry helped organize supplies while Jasmine showed another student how to clean a brush.","Alyssa finished early, so Chevi gave her an extra design challenge instead of letting her sit bored.","Paint spilled on a table. Chevi stayed calm, handled the cleanup, and kept the class moving.","At the end, every project looked different—and that was exactly what Chevi wanted.","Chevi's takeaway: Good teachers plan ahead, explain clearly, adjust when people need help, and make room for different strengths."]},
 {t:"Nick Has NO Idea What He Wants to Be",sub:"Career exploration • trying options",pages:["Everybody seemed to be asking Nick the same question: “What do you want to be?” Nick's answer was always, “I have no idea.”","Dalton talked about technology. Allen talked about hands-on work. Jacob mentioned jobs where you help people.","Nick wondered if he was behind because he did not have one perfect career picked out.","At the Career Center, he learned that choosing a career does not have to start with a job title.","He made three lists: things I like, things I do not like, and things I want to try.","Nick tried a technology activity. Some parts were interesting and some were definitely not for him.","He tried a hands-on task next. That gave him a completely different idea about what kind of work environment he liked.","Instead of choosing a career just to have an answer, Nick started asking better questions about schedules, training, pay, and daily duties.","By the end of the day, Nick still did not know exactly what he wanted to be—and that was okay.","Nick's takeaway: Undecided is not the same as stuck. Try things, ask questions, notice what fits, and narrow your choices over time."]},
 {t:"I Can't Wait Till I'm Grown!",sub:"Money • bills • responsibility",pages:["Cameron said being grown sounded easy: your own place, your own money, and nobody telling you what to do.","Allen, Adon, Jasmine, and Aubry agreed that getting a paycheck sounded pretty good.","Then they received a pretend $800 paycheck and started planning restaurants, clothes, games, and fun.","First came rent. Then the phone bill, electricity, insurance, gas, and groceries.","A surprise tire problem showed up too. Suddenly the fun-money pile was getting very small.","Cameron looked at what was left and said, “Wait… that's it?”","They compared needs and wants and decided which purchases could wait until the next paycheck.","Then a work schedule showed a Saturday shift. Being grown meant managing time as well as money.","Cameron still liked the idea of independence, but now he understood what came with it.","Takeaway: Growing up gives you more choices, but those choices come with bills, schedules, planning, and consequences."]},
 {t:"The Text That Almost Ruined Friday",sub:"School drama • good choices",audio:true,pages:["Friday afternoon was going fine until Jocquan's phone buzzed with a message from Gia: “Did you hear what they said about you?”","Jocquan felt angry before he even knew the whole story. He started typing a response he knew would start an argument.","Max noticed and told him he might want to wait before pressing send.","Then Ms. Kayla appeared to pull Jocquan for Transition. Jocquan sighed dramatically because he wanted to stay in class.","During the session, they talked about what can happen when you respond while you are angry.","Jocquan decided not to send the message yet. First, he wanted to find out whether the rumor was even true.","Later, he learned that part of the story had been misunderstood.","Max joked that Jocquan had almost talked himself into getting his phone taken.","Jocquan admitted waiting had saved him a whole lot of unnecessary drama—even if he still teased Ms. Kayla about pulling him from class.","Takeaway: One pause can keep one bad moment from turning into a much bigger problem."]},
 {t:"Dalton's First Coding Job",sub:"Technology • problem-solving",pages:["Dalton started his first coding assignment feeling confident. Then the program refused to work.","He stared at the screen and tried the same thing again. Nothing changed.","Nick suggested checking the instructions. Clark suggested testing one small part at a time.","Jayden noticed a tiny mistake in one line. Fixing it helped—but there was still another problem.","Dalton wrote down what he had already tried so he would not keep repeating the same steps.","He searched the project notes and found a clue about the second error.","When he was still unsure, Dalton asked for help and explained exactly what was happening.","Together, they fixed the problem and tested the program again.","This time it worked. Dalton realized the best part was not getting it perfect the first time—it was figuring out why it failed.","Dalton's takeaway: Technology careers require patience, problem-solving, testing, and knowing when to ask for help."]},
 {t:"Olivia's First Day in Sonography",sub:"Healthcare • professionalism",pages:["Olivia arrived for her sonography career experience excited and a little nervous.","Kaylee reminded her that healthcare workers protect privacy and speak professionally around patients.","Olivia learned how the room was prepared and why equipment has to be checked before an appointment.","Alyssa played the role of a nervous patient. Olivia practiced explaining what would happen in simple, calm language.","Gia asked what Olivia should do if she did not know the answer to a medical question.","Olivia learned not to guess. Some questions need to be answered by the appropriate medical professional.","She practiced following directions, positioning equipment carefully, and paying attention to patient comfort.","When something on the schedule changed, Olivia adjusted without getting flustered.","At the end of the experience, she had more questions about the training required to become a sonographer.","Olivia's takeaway: Healthcare careers combine technical skills with privacy, communication, professionalism, and compassion."]},
 {t:"Kaylee Takes Charge",sub:"Nursing • staying calm",pages:["Kaylee's practice nursing shift became busy fast. Several people needed help at the same time.","Olivia had a question, Jasmine needed supplies, and Noah needed directions explained more clearly.","Kaylee wanted to handle everything herself, but that quickly became overwhelming.","She stopped and decided what needed attention first and what could safely wait.","Olivia helped gather information while Jasmine located the supplies.","Kaylee gave Noah one clear direction at a time and checked that he understood.","When she was unsure about something medical, she asked the supervising nurse instead of guessing.","The room became calmer because everybody knew their role.","Kaylee realized taking charge did not mean doing everything alone. It meant helping the team stay organized.","Kaylee's takeaway: Strong healthcare workers stay calm, communicate, prioritize, and ask for help when something is outside their role."]},
 {t:"Jayden & Clark Get a Job",sub:"Workplace behavior • directions",pages:["Jayden and Clark arrived for their first work shift ready to earn money.","Their supervisor gave them several directions. Jayden remembered the first one. Clark remembered the last one.","Instead of pretending they understood everything, they asked the supervisor to repeat the steps.","Noah showed them how he used a short checklist to remember what came next.","Jacob reminded them to check their work before saying a task was finished.","Allen noticed they were getting faster once they stopped rushing.","When Jayden made a mistake, he corrected it instead of hiding it.","Clark finished early and asked what he should work on next.","At the end of the shift, their supervisor complimented them for improving and communicating.","Their takeaway: Being a good employee means listening, asking questions, following directions, checking your work, and staying productive."]},
 {t:"The Group Project Nobody Wanted",sub:"Teamwork • different strengths",pages:["Jacob looked at the group assignment and immediately knew nobody was excited about it.","Adon wanted to get it over with. Aubry had ideas but did not want to present. Max wanted to make it funny. Nick was not sure where to start.","For the first few minutes, everybody talked but nothing actually got done.","Jacob suggested splitting the project into jobs instead of forcing everybody to do the same thing.","Aubry worked on the visual part. Nick researched information. Adon organized the materials.","Max helped with the presentation and kept the group from making it too boring.","Jacob checked the requirements and noticed they had forgotten one important section.","The group fixed it before turning the project in.","Nobody suddenly decided group projects were their favorite thing, but they were proud that they finished it together.","Takeaway: Teamwork gets easier when people use different strengths, communicate, and take responsibility for their part."]

const transitionGoodChoicesStory=`Okay, y'all, gather around. Ava, Marcus, Sofia, and Eli are already sitting down, because today's story is about the students of Transition Town — and yes, there is school drama.

It was another school morning. Jaden Cole and Clark Taylor were getting settled. Noah Webb was ready for his routine. Olivia Waycaster, Jocquan Eaton, Kaylee Johnson, and Alyssa Lilacker were in class. Gia and Jacob Batts were working. Jasmine Cruz, Aubrey, Chevi, Cameron Long, Dalton Lewis, Aiden Rushin, Allen Abel, Nicholas Burks, Bradley — better known as Max — and Haley were all trying to enjoy their school day.

Then somebody spotted a familiar face at the classroom door.

Jocquan leaned over and said, “Oh no. Ms. Kayla is here again. I actually LIKE this class!”

Olivia laughed. “Don't make eye contact. Maybe she won't see us.”

Kaylee said, “Girl, she already saw us.”

And just when everybody thought they were safe, somebody else whispered, “Wait — is that Ms. Mindy coming down the hall?”

Alyssa said, “And Ms. Autumn is behind her! We are DONE.”

Across the hall, Max saw them coming and said, “Why do y'all always find me when I'm doing something I actually want to do?”

Haley laughed and said, “Max, just go. She's not leaving.”

Meanwhile, Gia was trying to finish what she was doing before getting pulled. She gathered her things, looked at Jacob, and said, “Come on. If we go now, maybe we'll get back before class is over.”

Jacob said, “That's what y'all said last time.”

Jaden tried the classic strategy: suddenly looking extremely busy. Clark started laughing because everybody knew exactly what he was doing.

Noah just looked at the group like, “Are we going or not?”

Cameron, Dalton, Aiden, Allen, Nicholas, Jasmine, Aubrey, and Chevi had all heard some version of the same complaint: Why today? Why this class? Can we do it later?

But that day's session was about making good choices — especially when you're mad, embarrassed, tired, pressured by friends, or just completely over everybody.

Ms. Kayla gave them a situation: Somebody posts something messy about you online. Everybody is tagging you. Your friends are telling you to clap back immediately. What do you do?

Jocquan said, “I'm not gonna lie. My first thought is probably to say something back.”

Gia said, “But then everybody screenshots it, and now the problem is bigger.”

Max shook his head and said, “Just don't put me in the group chat in the first place.”

Everybody laughed.

Olivia said she might type the response but wait before sending it. Kaylee said sometimes you need to ask somebody you trust before reacting. Alyssa pointed out that walking away doesn't mean you're scared. Jacob said if you know something will get you in trouble, proving a point might not be worth it.

Dalton and Aiden connected it to work. If you blow up at a coworker or supervisor, you can't always undo it afterward. Jasmine and Aubrey talked about how tone can change a whole conversation. Cameron said sometimes the smartest choice is just staying out of drama that has nothing to do with you.

Then Ms. Kayla gave them three questions: What could happen next? Is this helping me get where I want to go? And will tomorrow-me be glad I did this?

That got everybody quiet.

Because good choices aren't always the fun choices. Sometimes the good choice is going to a session when you'd rather stay in your favorite class. Sometimes it's finishing what you started. Sometimes it's apologizing first. Sometimes it's leaving the group chat alone. Sometimes it's telling the truth when the truth is uncomfortable.

And sometimes it's seeing Ms. Kayla, Ms. Mindy, or Ms. Autumn standing at the classroom door and thinking, “Not AGAIN,” but getting up and going anyway.

At the end of the day, everybody went back to class. Nobody suddenly started cheering when they got pulled. Let's not get carried away.

But later, Jocquan had a moment when he wanted to react fast — and he remembered to pause. Gia had to make a decision and thought about what would happen next. Max was dealing with something irritating and, even though he had something to say, decided every thought did not need to become an argument.

Olivia, Kaylee, Alyssa, Jacob, Jaden, Clark, Noah, Jasmine, Aubrey, Chevi, Cameron, Dalton, Aiden, Allen, Nicholas, Haley, and the rest of the crew started noticing the same thing. Those sessions they complained about were showing up when they actually needed them.

That was the whole point.

Ms. Kayla, Ms. Mindy, and Ms. Autumn weren't trying to ruin their favorite classes. They were helping them practice decisions while adults were around to help — so when real life showed up, they could handle things themselves.

Were they still going to sigh the next time somebody appeared at the classroom door? Absolutely.

Was somebody still going to say, “Can you come back next period?” Probably.

But at the end of the day, they knew something they didn't always want to admit.

It was worth it.

Now enjoy the rest of the park before Ms. Kayla comes back with another worksheet.`

 let style=document.createElement('style');style.textContent='.pgVideoScene{background:#14222d!important}.pgActivityVideo,.pgActivityStill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:center/cover no-repeat}.pgBuddyBadge{position:absolute;z-index:9;right:14px;top:78px;width:108px;background:#ffffffee;color:#26334c;border-radius:18px;padding:6px;text-align:center;box-shadow:0 6px 18px #0006}.pgBuddyBadge .pgKid{position:relative!important;left:auto!important;top:auto!important;width:96px!important;height:125px!important;filter:none!important}.pgBuddyBadge b{display:block}.pgCredit{display:block;opacity:.65;margin-top:4px}.pgWatching{font-weight:900;color:#5b439d}@media(max-width:760px){.pgBuddyBadge{width:74px;top:72px}.pgBuddyBadge .pgKid{width:62px!important;height:82px!important}.pgActivityVideo{object-fit:cover}}';document.querySelector('#parkGame').appendChild(style);

 }

 }else{
  parkGame.timer=setInterval(function(){remaining--;let el=document.querySelector('#pgClock');if(el)el.innerHTML='<b>'+Math.max(0,remaining)+' seconds</b>';if(remaining<=0)finishActivity()},1000)
 }

function parkActivityDone(){
 clearInterval(parkGame.timer);
 let next={swing:'sandbox',sandbox:'slide',slide:'climb',climb:'snack',snack:'leave'}[parkGame.activity];

 let names={sandbox:'sandbox',slide:'slide',climb:'climbing structure',snack:'snack break'};
 document.querySelector('#parkGame .pgPanel').innerHTML='<h2>Nice job!</h2><p>'+parkGame.buddy.name+' finished that activity.</p><p><b>Energy is now '+Math.round(parkGame.energy)+'%.</b></p><button class="pgBig" onclick="parkGameRender(\''+next+'\')">GO TO '+names[next].toUpperCase()+'</button><button class="pgChoice" onclick="parkLeaveCheck()">CHECK IF IT IS TIME TO LEAVE</button>'

function updateParkMeters(){

function parkLeaveCheck(){
 clearInterval(parkGame.timer);
 let tired=parkGame.energy<=35;
 let img=tired?'a_bright_colorful_photorealistic_3d_rendered_chi.png':'wide_bright_colorful_cartoon_realistic_illustra.png';
 parkGameShell('<div class="pgTop"><button class="pgBack" onclick="parkGameExit()">Back to Playground</button><div class="pgMeters"><div class="pgMeter"><b>HAPPINESS</b><div class="pgTrack"><div class="pgFill pgHappy" style="width:'+parkGame.happy+'%"></div></div></div><div class="pgMeter"><b>ENERGY '+Math.round(parkGame.energy)+'%</b><div class="pgTrack"><div class="pgFill" style="width:'+parkGame.energy+'%;background:'+(tired?'#ef233c':'#38b000')+'"></div></div></div></div></div><div class="pgScene" style="background-image:url(\''+img+'\')">'+parkBuddyHTML(parkGame.buddy)+'<div class="pgPanel">'+(tired?'<h2>'+parkGame.buddy.name+' is tired — good time to go!</h2><p>Help your buddy finish the park routine.</p><button class="pgBig" onclick="parkFinish(true)">GRAB THINGS + CLEAN UP + LEAVE</button>':'<h2>Uh-oh — '+parkGame.buddy.name+' is NOT ready to leave!</h2><p>Their energy is still '+Math.round(parkGame.energy)+'%. They are upset and want more play time. What should you do?</p><button class="pgChoice" onclick="parkReturnToPlay()">Give a warning and choose one last active play</button><button class="pgChoice" onclick="parkCalmChoice()">Acknowledge feelings and offer a leaving choice</button><button class="pgChoice" onclick="parkBadLeave()">Say “We are leaving because I said so.”</button>')+'</div></div>');

function parkReturnToPlay(){parkGame.happy=Math.min(100,parkGame.happy+8);parkGameRender(parkGame.energy>55?'climb':'slide')}
function parkCalmChoice(){parkGame.happy=Math.min(100,parkGame.happy+12);alert('Good transition support. '+parkGame.buddy.name+' feels heard, but still needs a little more active play before leaving.');parkGameRender('slide')}
function parkBadLeave(){parkGame.happy=Math.max(5,parkGame.happy-25);alert(parkGame.buddy.name+' becomes more upset. Try a calm warning, acknowledge the feeling, and give a simple choice.');parkLeaveCheck()}

 document.querySelector('#parkGame .pgPanel').innerHTML='<h2>Park Trip Complete!</h2><p>You kept '+parkGame.buddy.name+' active, watched the Happiness and Energy meters, and recognized when it was time to leave.</p><button class="pgBig" onclick="parkGameExit()">BACK TO PLAYGROUND</button>'
}

const daycareParkScenarios=[
{title:'Swing + Supervision',text:'You brought 5 daycare children to the park. Johnny wants you to push him on the swing. Little Katie is standing beside your leg. Maya and Ava are on the slide, and Eli is in the sandbox. While you are pushing Johnny, you notice Eli starting to walk toward the park gate. What should you do?',choices:[['Keep pushing Johnny and yell for Eli to come back.',0,'You noticed Eli, but yelling from the swing leaves the group spread out and does not restore close supervision.'],['Stop pushing, keep Katie with you, call the other children together, and redirect Eli away from the gate.',2,'Strong supervision. You stopped the activity, kept the closest child with you, accounted for the group, and addressed the immediate safety risk.'],['Run to Eli immediately and leave the other four where they are.',0,'Eli needs attention, but leaving the other four unsupervised creates another safety problem.']]},
{title:'Bathroom Request',text:'Ava says she has to use the restroom right now. The other four children are playing in different areas. What is the safest next step?',choices:[['Take Ava inside and tell the other four to stay where they are.',0,'The other children still require active supervision.'],['Gather and count the whole group, follow the daycare restroom/supervision procedure, and keep required supervision for every child.',2,'Good judgment. You accounted for everyone and followed a plan that does not leave children unattended.'],['Tell Ava she has to wait until the trip is over.',0,'A bathroom need should be handled promptly while maintaining safe supervision.']]},
{title:'Unknown Adult',text:'An adult you do not recognize walks up and says, “I am Eli’s uncle. I can take him home.” Eli seems to know the person. What do you do?',choices:[['Let Eli leave because he recognizes the adult.',0,'Recognition alone does not verify that the adult is authorized to pick up the child.'],['Keep Eli with the group and follow the daycare’s authorized-pickup verification procedure before releasing him.',2,'Correct. Child release should follow the program’s authorized pickup procedure.'],['Ask Eli if he wants to go and let him decide.',0,'A young child cannot replace the daycare’s pickup authorization process.']]},
{title:'Two Problems at Once',text:'Katie falls near the slide and begins crying. At the same time Johnny and Maya start arguing over a ball. What should you do first?',choices:[['Deal with the argument first because they are being loud.',0,'The argument matters, but first check whether Katie is injured while maintaining supervision of the group.'],['Keep the group in view, quickly assess Katie for injury, secure the immediate area, then address the argument.',2,'Good prioritizing: immediate health/safety first while maintaining supervision, then resolve the conflict.'],['Send Ava to check on Katie while you handle the argument.',0,'Do not give another child responsibility for assessing an injured child.']]},
{title:'Head Count',text:'It is time to return to daycare. Your count says 4 children, but you arrived with 5. What should you do?',choices:[['Leave with the four children and call the park later.',0,'Never leave when a child in your care is unaccounted for.'],['Stop the transition, keep the four children together and supervised, recount, identify who is missing, and follow the missing-child/emergency procedure immediately.',2,'Correct. Stop, secure the children you have, identify the missing child, and follow the program’s emergency procedure.'],['Have the four children split up and search the park.',0,'Splitting the children creates more supervision risks.']]},
{title:'Weather Change',text:'You hear thunder while the children are playing. Some of them want one more turn on the slide. What do you do?',choices:[['Let them finish because it is not raining yet.',0,'Thunder is a signal to follow the program’s severe-weather safety procedure rather than extending outdoor play.'],['End outdoor play, gather and count all children, and move to the designated safe location according to daycare policy.',2,'Good safety decision. You ended the activity, accounted for everyone, and followed the safety plan.'],['Stand under a tree and wait to see if it rains.',0,'A tree is not an appropriate lightning shelter.']]}];

function mayorForm(type){
 if(!need())return;
 let promptText={Complaint:'What happened, and what would you like the town to do?',Compliment:'Who or what would you like to recognize?',Suggestion:'What could make Transition Town better?', 'Help Request':'What do you need help with?', 'Town Idea':'Describe your idea for Transition Town.', 'Meeting Request':'What would you like to discuss with Mayor Kayla?'}[type]||'What would you like Mayor Kayla to know?';

 let w=get();w.mayorInbox=w.mayorInbox||[];w.mayorInbox.unshift({from:current,type:type,text:msg.trim(),date:new Date().toLocaleString()});

 w.messages.push({from:'Mayor Kayla’s Office',to:current,text:'Your '+type.toLowerCase()+' was received. Thank you for communicating with City Hall.',date:new Date().toLocaleString()});

}

function utilityApplication(kind){if(!need())return;let label=kind==='water'?'Water':'Electric',deposit=kind==='water'?160:200;let address=prompt(label+' Service Application\n\nEnter your Transition Town home/address or housing choice:');if(!address)return;let agree=confirm('The '+label.toLowerCase()+' service deposit is $'+deposit+'. Submit application and pay deposit from checking?');if(!agree)return;utilityPay(kind+'Deposit',deposit);let w=get();w.residents[current].history.push(label+' service application: '+address);put(w)}

function utilityDisconnect(kind){if(!need())return;let w=get(),r=w.residents[current],u=r.utilities;let water=kind==='water',base=water?45:85,on=water?u.waterOn:u.electricOn;if(!on)return alert('That service is already off.');let due=r.sessions-(water?u.lastWaterPaid:u.lastElectricPaid)>=2;if(due){if(!confirm('A final $'+base+' bill is still due. Your deposit cannot be returned until the final bill is paid. Pay it now and disconnect?'))return; if(r.checking<base)return alert('Not enough money to pay the final bill. The deposit remains held.');r.checking-=base;r.history.push((water?'Water':'Electric')+' final bill -$'+base)}let deposit=water?160:200;r.checking+=deposit;if(water){u.waterOn=false;u.waterDeposit=false;u.lastWaterPaid=r.sessions}else{u.electricOn=false;u.electricDeposit=false;u.lastElectricPaid=r.sessions}r.history.push((water?'Water':'Electric')+' disconnected; deposit returned +$'+deposit);put(w);alert('Service disconnected. Final bill is clear and your $'+deposit+' deposit was returned to checking.');cityDept(kind)}
function utilityPay(kind,amount){if(!need())return;let w=get(),r=w.residents[current];r.utilities=r.utilities||{};if(r.checking<amount)return alert('Not enough money in checking for this payment.');r.checking-=amount;let u=r.utilities;if(kind==='electricDeposit'){u.electricDeposit=true;u.electricOn=true;u.lastElectricPaid=r.sessions;r.history.push('Electric service deposit -$'+amount)}if(kind==='waterDeposit'){u.waterDeposit=true;u.waterOn=true;u.lastWaterPaid=r.sessions;r.history.push('Water service deposit -$'+amount)}if(kind==='electricBill'){u.lastElectricPaid=r.sessions;r.history.push('Electric bill -$'+amount)}if(kind==='waterBill'){u.lastWaterPaid=r.sessions;r.history.push('Water bill -$'+amount)}r.notifications=(r.notifications||[]).filter(n=>!n.includes(kind.startsWith('electric')?'electric bill':'water bill'));put(w);alert('Payment recorded. $'+amount+' was paid from checking.');cityDept(kind.startsWith('electric')?'electric':'water')}

function allJobApplications(){
 let w=get(),out=[];
 (w.groceryApplications||[]).forEach(function(a,i){out.push({source:'Transition Town Grocery',job:a.position||'Grocery Position',applicant:a.resident||a.name||'Unknown',status:a.status||'Pending',date:a.submitted||a.date||'',data:a,key:'grocery',index:i})});
 (w.pizzaApplications||[]).forEach(function(a,i){out.push({source:'Transition Town Pizza Shop',job:a.position||'Pizza Shop Position',applicant:a.resident||a.name||'Unknown',status:a.status||'Pending',date:a.submitted||a.date||'',data:a,key:'pizza',index:i})});
 (w.fireApplications||[]).forEach(function(a,i){out.push({source:'Transition Town Fire Department',job:a.position||'Firefighter Recruit',applicant:a.resident||a.name||'Unknown',status:a.status||'Pending',date:a.submitted||a.date||'',data:a,key:'fire',index:i})});
 Object.entries(w.residents||{}).forEach(function(entry){
  let n=entry[0],r=entry[1];
  (r.applications||[]).forEach(function(a,i){out.push({source:a.employer||a.business||a.company||'Career & Job Center',job:a.job||a.position||'Job Application',applicant:n,status:a.status||'Pending',date:a.date||a.submitted||'',data:a,key:'resident',resident:n,index:i})});
 });
 return out.sort(function(a,b){return String(b.date).localeCompare(String(a.date))});
}
function applicationEsc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function teacherApplications(){
 let apps=allJobApplications();
 let groups={};apps.forEach(function(a){let k=a.source+'|||'+a.job;(groups[k]=groups[k]||[]).push(a)});
 let html='<h2>📋 Transition Town Application Center</h2><p>All job applications come here. They are separated by employer and position so new Transition Town jobs can use the same review center.</p>';
 if(!apps.length)html+='<div class=notice>No job applications have been submitted on this device yet.</div>';
 Object.keys(groups).sort().forEach(function(k){
  let parts=k.split('|||'),arr=groups[k];
  html+='<div class=card style="margin:12px 0"><h3>'+applicationEsc(parts[0])+'</h3><p><b>'+applicationEsc(parts[1])+'</b> • '+arr.length+' application'+(arr.length===1?'':'s')+'</p>';
  arr.forEach(function(a){
   let ref=encodeURIComponent(JSON.stringify({key:a.key,index:a.index,resident:a.resident||''}));
   html+='<button class=action data-ref="'+ref+'" onclick="viewJobApplication(this.dataset.ref)" style="width:100%;margin:5px 0;text-align:left"><b>'+applicationEsc(a.applicant)+'</b><br><small>'+applicationEsc(a.status)+(a.date?' • '+applicationEsc(a.date):'')+'</small></button>';
  });
  html+='</div>';
 });
 openSheet(html);
}
function findJobApplication(ref){
 let x;try{x=JSON.parse(decodeURIComponent(ref))}catch(e){return null}
 let w=get(),a=null;
 if(x.key==='grocery')a=(w.groceryApplications||[])[x.index];
 else if(x.key==='pizza')a=(w.pizzaApplications||[])[x.index];
 else if(x.key==='fire')a=(w.fireApplications||[])[x.index];
 else if(x.key==='resident'&&w.residents[x.resident])a=(w.residents[x.resident].applications||[])[x.index];
 return a?{ref:x,a:a,w:w}:null;
}
function viewJobApplication(ref){
 let found=findJobApplication(ref);if(!found)return teacherApplications();
 let a=found.a,ignore={status:1,submitted:1},fields=Object.keys(a).filter(function(k){return !ignore[k]&&a[k]!==''&&a[k]!=null});
 let title=a.position||a.job||'Job Application',employer=a.employer||a.business||a.company||(found.ref.key==='grocery'?'Transition Town Grocery':found.ref.key==='pizza'?'Transition Town Pizza Shop':found.ref.key==='fire'?'Transition Town Fire Department':'Career & Job Center');
 let html='<h2>📄 '+applicationEsc(title)+'</h2><p><b>Employer:</b> '+applicationEsc(employer)+'</p><p><b>Status:</b> '+applicationEsc(a.status||'Pending')+'</p><div class=card>';
 fields.forEach(function(k){let label=k.replace(/^avail_/,'Availability - ').replace(/_/g,' ');label=label.charAt(0).toUpperCase()+label.slice(1);html+='<p><b>'+applicationEsc(label)+':</b> '+applicationEsc(a[k])+'</p>'});
 html+='</div><div class=actions><button class=action data-ref="'+ref+'" data-status="Approved / Hired" onclick="setJobApplicationStatus(this.dataset.ref,this.dataset.status)">✅ Approve / Hire</button><button class=action data-ref="'+ref+'" data-status="Interview Requested" onclick="setJobApplicationStatus(this.dataset.ref,this.dataset.status)">🗓️ Interview</button><button class=action data-ref="'+ref+'" data-status="Pending Ms. Kayla Review" onclick="setJobApplicationStatus(this.dataset.ref,this.dataset.status)">⏳ Pending</button><button class=action data-ref="'+ref+'" data-status="Declined" onclick="setJobApplicationStatus(this.dataset.ref,this.dataset.status)">❌ Decline</button><button class=action onclick="teacherApplications()">← All Applications</button></div>';
 openSheet(html);
}
function setJobApplicationStatus(ref,status){
 let found=findJobApplication(ref);if(!found)return;
 found.a.status=status;localStorage.ttWorld=JSON.stringify(found.w);
 if(status==='Approved / Hired'){
  let applicant=found.a.resident||found.a.name||found.ref.resident||'',job=found.a.position||found.a.job||'New Job';
  if(applicant&&found.w.residents&&found.w.residents[applicant]){
   let rr=found.w.residents[applicant];rr.job=job;rr.notifications=rr.notifications||[];
   if(found.ref.key==='grocery'){
    rr.employment=rr.employment||{};rr.employment.grocery={employer:'Transition Town Grocery',position:/stocker/i.test(job)?'Stocker':'Cashier',wage:12,schedule:'Schedule pending — see Miss Kayla',active:true,shifts:[]};
    rr.job='Transition Town Grocery — '+rr.employment.grocery.position;
   }
   if(found.ref.key==='pizza'){
    rr.employment=rr.employment||{};rr.employment.pizza={employer:'Transition Town Pizza Shop',position:job,wage:12,schedule:'Schedule pending — see Miss Kayla',active:true,training:{},pin:null,shifts:[]};
    rr.job='Transition Town Pizza Shop — '+job;
   }
   if(found.ref.key==='fire'){
    rr.employment=rr.employment||{};rr.employment.fire={employer:'Transition Town Fire Department',position:job||'Firefighter Recruit',wage:15,schedule:'8:00 AM–4:00 PM simulation shift',active:true,training:{},shifts:[],rank:'Firefighter Recruit'};
    rr.job='Transition Town Fire Department — '+(job||'Firefighter Recruit');
   }
   if(found.a.employer==='Home & Beyond'&&window.TTLifeCatalog){let role=TTLifeCatalog.roles.find(x=>x.id===found.a.role);if(role){rr.employment=rr.employment||{};rr.employment.homeBeyond={employer:'Home & Beyond',position:role.name,role:role.id,wage:role.wage,schedule:found.a.availability||'See Miss Kayla for your schedule',active:true,shifts:rr.employment.homeBeyond?.shifts||[]};rr.job='Home & Beyond — '+role.name;}}
   rr.notifications.push('JOB UPDATE: You were hired for '+rr.job+'.');localStorage.ttWorld=JSON.stringify(found.w)
  }
 }
 alert('Application status updated to: '+status);teacherApplications();
}
function teacherResidents(){let w=get();openSheet('<h2>Residents</h2>'+Object.entries(w.residents).map(([n,r])=>'<div class=card><b>'+n+'</b><p>$'+r.checking.toFixed(2)+' checking • '+r.job+' • '+r.career+' • '+r.home+'</p></div>').join(''))}
try{activeGroup=JSON.parse(localStorage.ttActiveGroup||'[]')}catch(e){activeGroup=[]}
function endSession(){if(!need())return;let w=get(),r=w.residents[current];r.sessions++;r.utilities=r.utilities||{electricOn:false,waterOn:false,electricDeposit:false,waterDeposit:false,lastElectricPaid:0,lastWaterPaid:0};if(r.sessions%2===0&&r.job!=='Needs a job'&&!/^Home & Beyond/.test(r.job)){r.checking+=500;r.history.push('Payday +$500');r.notifications.push('Payday deposited: $500')}if(!r.life?.housing&&r.utilities.electricOn&&r.sessions-r.utilities.lastElectricPaid>=2&&!r.notifications.includes('CITY HALL: Your electric bill of $85 is due. Visit the Electricity Department to pay it.')){r.notifications.push('CITY HALL: Your electric bill of $85 is due. Visit the Electricity Department to pay it.');w.messages.push({from:'City Hall - Electricity Department',to:current,text:'Your electric bill of $85 is due. Visit the Electricity Department to pay it.',date:new Date().toLocaleString()})}if(!r.life?.housing&&r.utilities.waterOn&&r.sessions-r.utilities.lastWaterPaid>=2&&!r.notifications.includes('CITY HALL: Your water bill of $45 is due. Visit the Water Department to pay it.')){r.notifications.push('CITY HALL: Your water bill of $45 is due. Visit the Water Department to pay it.');w.messages.push({from:'City Hall - Water Department',to:current,text:'Your water bill of $45 is due. Visit the Water Department to pay it.',date:new Date().toLocaleString()})}put(w);let x=window.open('','_blank');x.document.write('<h1>Transition Town Session Report</h1><h2>'+current+'</h2><p>'+new Date().toLocaleString()+'</p><p>Career: '+r.career+'</p><p>Job: '+r.job+'</p><p>Home: '+r.home+'</p><p>Checking: $'+r.checking.toFixed(2)+'</p><p>Savings: $'+r.savings.toFixed(2)+'</p><p>Completed sessions: '+r.sessions+'</p><h3>Recent actions</h3><p>'+r.history.slice(-8).join('<br>')+'</p><hr><p>Pre-ETS / session note: __________________________________________</p><script>window.print()<\/script>')}updateBadge();if(current)status.textContent=current+' is in Transition Town. Choose a building on the map.';

(function restoreOpeningLoginAndKaylaBalance(){
 // Existing balances are preserved; Transition Life never issues another starting balance.
 const params=new URLSearchParams(location.search);const passed=params.get('resident')||'';const returning=passed||localStorage.ttCurrent||sessionStorage.ttCurrent||'';if(returning&&returning!=='Guest'){localStorage.ttCurrent=returning;sessionStorage.ttCurrent=returning}
 if(returning&&townLoginProfiles.includes(returning)){
  current=returning;
  ensure(current);
  if(/^(?:miss|ms\.) kayla$/i.test(current))teacherView();else studentView();
 }else{
  document.body.classList.add('login-required');
  resident();
 }
})();
