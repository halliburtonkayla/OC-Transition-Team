order-radius:18px;padding:12px}.face{font-size:52px}.meeting{background:#f7f3ff;border-radius:20px;padding:16px}.table{height:100px;border-radius:50%;background:#b87c52;margin:18px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold}.tiny{font-size:12px;color:#667}.notice{background:#fff5c8;border-left:5px solid #d8a300;padding:11px;border-radius:10px;margin:8px 0}@media(max-width:850px){.road{grid-template-columns:repeat(2,1fr);padding:20px;gap:18px}.road:after{display:none}.welcome h1{font-size:36px}}@media(max-width:480px){.road{grid-template-columns:repeat(2,1fr);grid-template-rows:auto;padding:16px;gap:18px}.mapmark{height:90px}.phone{right:10px;bottom:10px}.road:before{font-size:22px}header{height:auto;min-height:74px;align-items:flex-start;gap:8px;flex-wrap:wrap}.logo{font-size:24px}.topbtn{padding:9px 10px;margin:2px;font-size:13px}.town{padding-left:10px;padding-right:10px}.road{grid-template-columns:1fr 1fr;padding:12px;gap:12px;border-width:5px;border-radius:34px}.lot{min-height:150px;padding:9px}.building{height:76px;font-size:40px}.lot b{font-size:14px}.lot small{font-size:11px}.window{padding:18px;max-height:92vh}.actions{grid-template-columns:1fr}.table{margin:12px 0;height:auto;min-height:84px;padding:16px;text-align:center}}.mapmark{display:grid;place-items:center;width:82%;height:72%;border-radius:18px;background:linear-gradient(145deg,#fff,#dfe7f5);box-shadow:8px 9px 0 #0002;border:5px solid #fff;font:900 17px Georgia;color:#4d3b85;letter-spacing:1px}.building{font-size:16px}.storegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.store{border:0;border-radius:20px;padding:12px;background:#fff8f1;box-shadow:0 7px 18px #0002;text-align:center}.storeart{height:80px;border-radius:16px 16px 6px 6px;background:linear-gradient(145deg,#fff8,#fff0),var(--store,#e7b5cf);border:4px solid #fff;box-shadow:6px 7px 0 #0002;position:relative;margin-bottom:12px}.storeart:before{content:"";position:absolute;left:-4px;right:-4px;top:-12px;height:18px;background:repeating-linear-gradient(90deg,#5b439d 0 22px,#fff 22px 44px);border-radius:8px}.storeart:after{content:"";position:absolute;left:38%;bottom:0;width:24%;height:48%;background:#795a48;border:3px solid #fff;border-bottom:0}.creator{display:grid;grid-template-columns:150px 1fr;gap:18px}.preview{height:220px;border-radius:25px;background:linear-gradient(#bce7ff 0 60%,#9fd080 60%);display:grid;place-items:center}.avatar3d{width:86px;height:155px;position:relative}.avatar3d .head{width:62px;height:62px;border-radius:48%;background:var(--skin);margin:auto;box-shadow:inset -7px -5px #0001}.avatar3d .hair{position:absolute;top:-4px;left:10px;width:66px;height:27px;border-radius:50% 50% 30% 30%;background:var(--hair)}.avatar3d .body{position:absolute;top:60px;left:4px;width:78px;height:78px;border-radius:18px;background:var(--shirt);box-shadow:inset -8px -5px #0001}.avatar3d .legs{position:absolute;top:132px;left:15px;width:56px;height:23px;border-left:20px solid var(--pants);border-right:20px solid var(--pants)}.creatorFields{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:560px){.creator{grid-template-columns:1fr}.creatorFields{grid-template-columns:1fr}}</style></head><body><div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div><header><div class="logo">Transition Town</div><div><button class="topbtn" onclick="studentView()">Student View</button><button class="topbtn" onclick="teacherView()">Miss Kayla View</button><button class="topbtn" onclick="location.href='index.html'">Hub</button></div></header><main class="town"><section class="welcome"><h1>Welcome to Town</h1><p id="status">Choose a resident and step into your life.</p></section><section class="road">

</section></main></div><button class="phone" onclick="phone()">PHONE<span class="badge" id="badge">0</span></button><div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="window"><button class="close" onclick="closeSheet()">×</button><div id="content"></div></div></div>
<script>
let current=localStorage.ttCurrent||'';let activeGroup=[];const get=()=>{let w;try{w=JSON.parse(localStorage.ttWorld||'null')}catch(e){w=null}if(!w||typeof w!=='object')w={residents:{},messages:[],businesses:{"Cool Vibes":{owners:["Olivia","Jocquan","Kaylee","Alyssa"],balance:5000,alerts:[]},"3K Tire Shop":{owners:["Allen","Nick"],balance:5000,alerts:[]}},events:[]};w.residents=w.residents||{};w.messages=w.messages||[];w.events=w.events||[];w.businesses=w.businesses||{};[
["Cool Vibes",["Olivia","Jocquan","Kaylee","Alyssa"],"Food & drinks"],
["3K Tire Shop",["Allen","Nick"],"Tire & auto service"],
["Your Pet, Our Pack",["Max / Bradley","Jaden","Haley"],"Pet sitting & pet care"],
["Jasmine, Aubrey & Chevi Services",["Jasmine","Aubrey","Chevi"],"Student service business"],
["Gia & Jacob Business",["Gia","Jacob"],"Student business"],
["Dalton & Aiden Business",["Dalton","Aiden"],"Student business"]
].forEach(function(x){if(!w.businesses[x[0]])w.businesses[x[0]]={owners:x[1],balance:5000,alerts:[],type:x[2]};});try{let old=JSON.parse(localStorage.ttResidents||'{}');Object.entries(old).forEach(([n,r])=>{if(!w.residents[n])w.residents[n]={checking:Number(r.checking)||10000,savings:Number(r.savings)||0,sessions:Number(r.sessions)||0,career:r.career||"Not selected",job:r.job||"Needs a job",home:r.home||"Not selected",car:r.car||"Not selected",history:[],notifications:[]}})}catch(e){}return w};const put=w=>{localStorage.ttWorld=JSON.stringify(w);updateBadge()};function open(html){content.innerHTML=html;sheet.classList.add('show')}function closeSheet(){sheet.classList.remove('show')}function ensure(n){let w=get();if(!w.residents[n])w.residents[n]={checking:10000,savings:0,sessions:0,career:"Not selected",job:"Needs a job",home:"Not selected",car:"Not selected",history:[],notifications:[],avatar:null};if(!("avatar" in w.residents[n]))w.residents[n].avatar=null;put(w);return w.residents[n]}function resident(){let w=get(),recent=Object.keys(w.residents).slice(-12).reverse();open('<h2>Who is entering Transition Town?</h2><input class=field id=name placeholder="Student name"><button class=primary onclick="login()">Enter My Life</button>'+(recent.length?'<h3>Saved residents</h3><div class=actions>'+recent.map(n=>'<button class=action data-n="'+encodeURIComponent(n)+'" onclick="switchResident(this.dataset.n)">'+n+'</button>').join('')+'</div>':'')+'<p class=tiny>On a shared device, switch residents without signing Miss Kayla out.</p>')}function switchResident(encoded){let n=decodeURIComponent(encoded);ensure(n);current=n;localStorage.ttCurrent=n;status.textContent=n+" is in Transition Town.";profile()}function login(){let n=document.querySelector('#name').value.trim();if(!n)return;let r=ensure(n);current=n;localStorage.ttCurrent=n;status.textContent=n+' is in Transition Town.';if(r.avatar)studentView();else characterCreator()}
function studentView(){document.body.classList.remove('teacher-mode');if(!current){resident();return}status.textContent=current+' is exploring Transition Town. Choose a place on the city map.';closeSheet()}
function teacherView(){document.body.classList.add('teacher-mode');teacher()}
function characterCreator(){if(!current){resident();return}let r=ensure(current);let a=r.avatar||{skin:'#9b654b',hair:'#33231f',shirt:'#6c57a7',pants:'#33435e'};open('<h2>Create '+current+'’s Character</h2><p>Build a character that will follow this resident throughout Transition Town.</p><div class="creator"><div class="preview"><div class="avatar3d" id="avatarPreview" style="--skin:'+a.skin+';--hair:'+a.hair+';--shirt:'+a.shirt+';--pants:'+a.pants+'"><div class="head"></div><div class="hair"></div><div class="body"></div><div class="legs"></div></div></div><div class="creatorFields"><label>Skin tone<input class="field" id="skin" type="color" value="'+a.skin+'" oninput="previewAvatar()"></label><label>Hair color<input class="field" id="hair" type="color" value="'+a.hair+'" oninput="previewAvatar()"></label><label>Shirt<input class="field" id="shirt" type="color" value="'+a.shirt+'" oninput="previewAvatar()"></label><label>Pants<input class="field" id="pants" type="color" value="'+a.pants+'" oninput="previewAvatar()"></label><label>Hair style<select class="field" id="hairStyle"><option>Classic</option><option>Short</option><option>Curls</option><option>Long</option><option>Braids</option></select></label><label>Outfit<select class="field" id="outfit"><option>Everyday</option><option>Work Ready</option><option>Sporty</option><option>Dressy</option></select></label></div></div><div class="actions"><button class="primary green" onclick="saveAvatar()">Save Character & Enter Town</button></div>')}
function previewAvatar(){let p=document.querySelector('#avatarPreview');if(p)p.style.cssText='--skin:'+skin.value+';--hair:'+hair.value+';--shirt:'+shirt.value+';--pants:'+pants.value}
function saveAvatar(){let w=get();w.residents[current].avatar={skin:skin.value,hair:hair.value,shirt:shirt.value,pants:pants.value,hairStyle:hairStyle.value,outfit:outfit.value};put(w);studentView()}function profile(){let r=ensure(current);open('<h2>'+current+"’s Life</h2><div class=cards><div class=card><b>Checking</b><div class=money>$"+r.checking.toFixed(2)+'</div><small>Savings $'+r.savings.toFixed(2)+'</small></div><div class=card><b>Career</b><p>'+r.career+'</p></div><div class=card><b>Job</b><p>'+r.job+'</p><small>Payday every 2 completed sessions</small></div><div class=card><b>Home</b><p>'+r.home+'</p></div></div><div class=actions><button class=action onclick="place(\'jobs\')">💼 Go to Career & Job Center</button><button class=action onclick="place(\'bank\')">🏦 Go to Bank</button><button class=action onclick="place(\'housing\')">🏠 Go Home / Housing</button><button class=action onclick="phone()">📱 Open Phone</button></div><button class="primary" onclick="characterCreator()">Edit My Character</button> <button class="primary green" onclick="endSession()">End Session & Create Report</button>')}function need(){if(!current){resident();return false}return true}
const data={bank:['Transition Town Bank','Miss Kayla is the Branch Manager. Manage real money choices without a right-answer scoreboard.'],city:['City Hall','Turn on water, handle town services, permits and community events with Mayor Kayla.'],medical:['Medical Center','Explore sonography, nursing, patient care and other healthcare careers through day-at-work situations.'],jobs:['Career & Job Center','Find openings, apply, interview, work, earn pay and compete for promotions with greater responsibility.'],business:['Business District','Enter shared student businesses, review alerts, hire staff, serve customers and call owner meetings.'],safety:['Police & Fire','Respond to fictional town incidents, interview witnesses, complete reports and move through career ladders.'],creative:['Creative & Digital District','Gaming, content creation, photography, video, design, coding and freelance client work.'],housing:['Neighborhoods','Choose a home, rent or buy, set up utilities and furnish it. Housing affects your real budget.'],shops:['Town Shops','Spend real simulation money on groceries, transportation, furniture, restaurants and services.'],school:['Training & College','Explore education, certifications, technical training and postsecondary costs tied to your career.']};
function place(k){let [title,desc]=data[k];let extra='';if(k==='bank')extra='<div class=actions><button class=action onclick="cash(\'deposit\')">Deposit</button><button class=action onclick="cash(\'withdraw\')">Withdraw</button><button class=action onclick="cash(\'save\')">Move to Savings</button><button class=action onclick="alert(\'Miss Kayla reviews amount, interest rate, term, monthly payment and total repayment before a loan is added.\')">Ask About a Loan</button></div>';if(k==='jobs')extra='<div class=actions><button class=action onclick="career()">Choose / Explore My Career</button><button class=action onclick="job()">Jobs Hiring Now</button><button class=action>My Applications</button><button class=action>Promotions</button></div>';if(k==='business')extra=businesses();if(k==='housing')extra='<div class=actions><button class=action onclick="home(\'Apartment\',850)">Apartment • $850 rent</button><button class=action onclick="home(\'Townhome\',1250)">Townhome • $1,250 rent</button><button class=action onclick="place(\'bank\')">Buy a Home • Talk to Bank</button></div>';if(k==='creative')extra='<div class=cards><div class=card><b>Gaming & Esports</b><p>Competition, testing, development and team roles.</p></div><div class=card><b>Content Creator</b><p>Plan, produce, edit, pitch clients and manage irregular income.</p></div><div class=card><b>Photography</b><p>Town businesses can hire photographers for real simulation contracts.</p></div><div class=card><b>Freelance Media</b><p>Take contracts without owning a full business.</p></div></div>';open('<h2>'+title+'</h2><p>'+desc+'</p>'+extra)}
function career(){if(!need())return;let c=prompt('What career do you want to explore?');if(!c)return;let w=get();w.residents[current].career=c;w.residents[current].history.push('Career goal: '+c);put(w);profile()}function job(){if(!need())return;let j=prompt('Choose a simulated job: cashier, childcare assistant, healthcare aide, auto shop worker, photographer, content assistant, restaurant worker, police trainee');if(!j)return;let w=get();w.residents[current].job=j;w.residents[current].history.push('Accepted job: '+j);put(w);profile()}function cash(t){if(!need())return;let a=Number(prompt('Amount'));if(!a||a<0)return;let w=get(),r=w.residents[current];if((t==='withdraw'||t==='save')&&a>r.checking)return alert('That amount is not available in checking.');if(t==='deposit')r.checking+=a;if(t==='withdraw')r.checking-=a;if(t==='save'){r.checking-=a;r.savings+=a}r.history.push(t+' $'+a);put(w);profile()}function home(n,c){if(!need())return;let w=get(),r=w.residents[current];if(r.checking<c)return alert('Your current balance cannot cover this move-in cost.');r.checking-=c;r.home=n+' • $'+c+'/month';r.history.push('Housing: '+r.home);put(w);profile()}
function businesses(){let w=get();let colors=['#e8afd0','#b8c8ef','#f2c28c','#bfe3b8','#d2c1ef','#ffe08a'];return '<div class="storegrid">'+Object.entries(w.businesses).map(function(entry,i){let n=entry[0],b=entry[1];return '<button class="store" onclick="meeting(\''+n.replaceAll("'","\\'")+'\')"><div class="storeart" style="--store:'+colors[i%colors.length]+'"></div><b>'+n+'</b><p>Owners: '+b.owners.join(', ')+'</p><small>'+(b.type||'Student-owned business')+'</small></button>'}).join('')+'</div>'}
function meeting(b){let w=get(),x=w.businesses[b];open('<h2>'+b+' Owners’ Meeting</h2><div class=meeting><div class=table>'+x.owners.join(' • ')+'</div><p>Review the problem together. Each owner can make a choice before the group decides what action the business will take.</p><input class=field id=issue placeholder="Meeting issue (manager, complaint, staffing, inventory...)"><button class=primary onclick="recordMeeting(\''+b.replaceAll("'","\\'")+'\')">Record Meeting Decision</button></div>')}function recordMeeting(b){let issue=document.querySelector('#issue').value.trim();if(!issue)return;let w=get();w.events.unshift({type:'Business meeting',business:b,issue,date:new Date().toLocaleString()});put(w);alert('Meeting recorded. This decision remains in the town history.');place('business')}
function phone(){let w=get(),mine=w.messages.filter(m=>m.to===current||m.from===current||m.to==='Everyone');open('<h2>📱 Transition Town Phone</h2><div class=chat>'+mine.map(m=>'<div class=bubble><b>'+m.from+' → '+m.to+'</b><br>'+m.text+'<br><small>'+m.date+'</small></div>').join('')+'</div><input class=field id=to placeholder="To"><textarea class=field id=msg placeholder="Message"></textarea><button class=primary onclick="send()">Send</button><p class=tiny>Transition Town messages are monitored instructional communication and are visible to Miss Kayla.</p>')}function send(){if(!need())return;let to=document.querySelector('#to').value.trim(),text=document.querySelector('#msg').value.trim();if(!to||!text)return;let w=get();w.messages.push({from:current,to,text,date:new Date().toLocaleString()});put(w);phone()}function updateBadge(){let w=get();badge.textContent=current?w.messages.filter(m=>m.to===current||m.to==='Everyone').length:0}
function teacher(){let w=get();open('<div class=character><div class="face">MK</div><div><h2>Miss Kayla Control Center</h2><b>Transition Specialist • Mayor • Bank Branch Manager</b></div></div><div class=actions><button class=action onclick="group()">👥 Start Group Session</button><button class=action onclick="teacherMessages()">📱 Message Monitor</button><button class=action onclick="eventMaker()">⚡ Life Happens Event</button><button class=action onclick="teacherResidents()">🏘️ Residents</button></div><div class=notice>Teacher controls do not erase student consequences. The town continues from session to session.</div>')}function group(){let names=prompt('Students present, separated by commas');if(!names)return;activeGroup=names.split(',').map(n=>n.trim()).filter(Boolean);activeGroup.forEach(ensure);localStorage.ttActiveGroup=JSON.stringify(activeGroup);groupRoom()}function groupRoom(){if(!activeGroup.length){try{activeGroup=JSON.parse(localStorage.ttActiveGroup||'[]')}catch(e){activeGroup=[]}}if(!activeGroup.length)return group();open('<h2>Live Group Session</h2><p><b>Present:</b> '+activeGroup.join(', ')+'</p><p class=tiny>Tap a student before an individual choice. Each resident keeps separate money, career, job, housing and history.</p><div class=actions>'+activeGroup.map(n=>'<button class=action data-n="'+encodeURIComponent(n)+'" onclick="switchGroupResident(this.dataset.n)">'+n+'</button>').join('')+'</div><div class=meeting><div class=table>GROUP MEETING</div><button class=primary onclick="place(\'business\')">Go to Business District</button> <button class=primary onclick="endGroup()">End Group</button></div>')}function switchGroupResident(encoded){let n=decodeURIComponent(encoded);ensure(n);current=n;localStorage.ttCurrent=n;status.textContent=n+" is active in the group session.";profile()}function endGroup(){activeGroup=[];localStorage.removeItem('ttActiveGroup');teacher()}function teacherMessages(){let w=get();open('<h2>Message Monitor</h2><div class=chat>'+w.messages.slice().reverse().map(m=>'<div class=bubble><b>'+m.from+' → '+m.to+'</b><br>'+m.text+'<br><small>'+m.date+'</small></div>').join('')+'</div>')}function eventMaker(){let who=prompt('Student, business, or Everyone');let ev=prompt('What happens? (flat tire, complaint, inspection, emergency expense, party invitation, call-out, etc.)');if(!who||!ev)return;let w=get();w.messages.push({from:'Transition Town',to:who,text:ev,date:new Date().toLocaleString()});w.events.unshift({type:'Life Happens',who,issue:ev,date:new Date().toLocaleString()});put(w);alert('Event added to the town.')}function teacherResidents(){let w=get();open('<h2>Residents</h2>'+Object.entries(w.residents).map(([n,r])=>'<div class=card><b>'+n+'</b><p>$'+r.checking.toFixed(2)+' checking • '+r.job+' • '+r.career+' • '+r.home+'</p></div>').join(''))}
try{activeGroup=JSON.parse(localStorage.ttActiveGroup||'[]')}catch(e){activeGroup=[]}
(function resetKaylaTestMoney(){if(localStorage.ttKaylaMoneyReset20261001)return;let w=get();let changed=false;Object.keys(w.residents).forEach(function(n){if(/^kayla( halliburton)?$/i.test(n.trim())||/^miss kayla$/i.test(n.trim())){w.residents[n].checking=10000;w.residents[n].savings=0;w.residents[n].history.push('Test money reset');changed=true}});if(changed)put(w);localStorage.ttKaylaMoneyReset20261001='1'})()
function endSession(){if(!need())return;let w=get(),r=w.residents[current];r.sessions++;if(r.sessions%2===0&&r.job!=='Needs a job'){r.checking+=500;r.history.push('Payday +$500');r.notifications.push('Payday deposited: $500')}put(w);let x=window.open('','_blank');x.document.write('<h1>Transition Town Session Report</h1><h2>'+current+'</h2><p>'+new Date().toLocaleString()+'</p><p>Career: '+r.career+'</p><p>Job: '+r.job+'</p><p>Home: '+r.home+'</p><p>Checking: $'+r.checking.toFixed(2)+'</p><p>Savings: $'+r.savings.toFixed(2)+'</p><p>Completed sessions: '+r.sessions+'</p><h3>Recent actions</h3><p>'+r.history.slice(-8).join('<br>')+'</p><hr><p>Pre-ETS / session note: __________________________________________</p><script>window.print()<\/script>')}updateBadge();if(current)status.textContent=current+' is in Transition Town.';
</script></body></html>
