<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Transition Town Grocery</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f0e7;color:#172018}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px}.top{position:sticky;top:0;z-index:20;background:#173b2b;color:#fff;padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top b{font-size:19px;margin-right:auto}.top button,.pill{border:0;border-radius:12px;padding:9px 12px;font-weight:800}.music{background:#fff;color:#173b2b}.back{background:#f2c14e;color:#172018}.cartbtn{background:#e6f3ea;color:#173b2b}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 60px)}aside{background:#fff;border-right:1px solid #d9ded8;padding:12px;position:sticky;top:60px;align-self:start;max-height:calc(100vh - 60px);overflow:auto}aside h3{margin:2px 0 8px}.dept{width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:700}.dept:hover,.dept.active{background:#e8f3ec}.main{padding:14px;min-width:0}.hero{position:relative;max-width:1200px;margin:auto}.hero img,.aisleimg{display:block;width:100%;height:auto;border-radius:18px}.overlay{position:absolute;inset:auto 3% 4% 3%;display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.overlay button,.action{border:0;border-radius:13px;padding:12px 16px;font-weight:900;box-shadow:0 3px 10px #0003}.apply{background:#f2c14e}.shop{background:#1f6b45;color:#fff}.budget{background:#fff}.panel{max-width:1050px;margin:14px auto;background:#fff;border-radius:18px;padding:16px;box-shadow:0 5px 20px #0001}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.product{border:1px solid #dce2dc;border-radius:14px;padding:12px;background:#fff}.product h4{margin:0 0 5px}.product button{width:100%;border:0;background:#1f6b45;color:#fff;border-radius:10px;font-weight:800}.muted{color:#667;font-size:13px}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formgrid label,.full{font-weight:700}.formgrid input,.formgrid select,.formgrid textarea,.full input,.full textarea{width:100%;padding:10px;border:1px solid #aeb8ae;border-radius:9px;margin-top:4px}.wide{grid-column:1/-1}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.receipt{font-family:ui-monospace,monospace;background:#fffdf4;border:1px dashed #888;padding:15px;max-width:480px;margin:12px auto}.scanrow{display:flex;justify-content:space-between;border-bottom:1px dotted #bbb;padding:6px 0}.total{font-size:26px;font-weight:900}.notice{padding:11px;border-radius:10px;background:#fff4c9}.success{background:#e5f5e9}.danger{background:#ffe4e4}.checkoutActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.checkoutActions button{border:0;border-radius:12px;padding:12px 16px;font-weight:900}.primary{background:#1f6b45;color:#fff}.secondary{background:#e8ece9}.red{background:#a92c2c;color:#fff}.mobileDir{display:none}.badge{display:inline-block;background:#b12626;color:#fff;border-radius:999px;padding:2px 7px;font-size:12px}.modal{position:fixed;inset:0;background:#0009;z-index:50;overflow:auto;padding:18px}.modalbox{max-width:900px;margin:auto;background:#fff;border-radius:18px;padding:18px}.closex{float:right;border:0;background:#eee;border-radius:10px;font-weight:900}.checkoutScene{max-width:1100px;margin:auto}.checkoutScene img{width:100%;border-radius:18px;display:block}
@media(max-width:760px){.layout{display:block}aside{display:none}.mobileDir{display:block;width:100%;padding:10px;border:0;border-radius:10px;margin-bottom:10px}.main{padding:9px}.formgrid{grid-template-columns:1fr}.days{grid-template-columns:1fr 1fr}.overlay{position:static;margin-top:10px}.hero img,.aisleimg{border-radius:12px}.top{position:sticky;top:0}.panel{padding:12px}}
</style></head><body>
<header class="top"><b>Transition Town Grocery</b><button class="back" onclick="location.href='transition-town.html'">← Town Map</button><button class="music" id="musicBtn">♪ Music On</button><button class="cartbtn" onclick="showCart()">Cart <span class="badge" id="cartCount">0</span></button></header>
<audio id="radio" loop preload="auto"><source src="Transition-Town-Grocery-Radio.mp3" type="audio/mpeg"></audio>
<div class="layout"><aside><h3>Grocery Directory</h3><div id="directory"></div><button class="dept" onclick="checkout()">Checkout</button></aside>
<main class="main"><select id="mobileDir" class="mobileDir" aria-label="Grocery department"></select><div id="view"></div></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><button class="closex" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const departments=[
['01','Produce','01-produce.png'],['02','Bread & Bakery','02-bread-bakery.png'],['03','Meat & Seafood','03-meat-seafood.png'],['04','Dairy & Eggs','04-dairy-eggs.png'],['05','Breakfast','05-breakfast.png'],['06','Pasta & Sauces','06-pasta-sauces.png'],['07','Canned Foods & Soup','07-canned-foods-soup.png'],['08','Baking','08-baking.png'],['09','Snacks','09-snacks.png'],['10','Beverages','10-beverages.png'],['11','Frozen Foods','11-frozen-foods.png'],['12','Household','12-household.png'],['13','Paper Goods','13-paper-goods.png'],['14','Personal Care','14-personal-care.png'],['15','Deli & Prepared Foods','15-deli-prepared-foods.png']];
const catalog={
'01':[['Bananas','1 lb',0.69],['Gala Apples','3 lb bag',4.49],['Strawberries','1 lb',3.79],['Romaine Hearts','3 ct',3.49],['Russet Potatoes','5 lb bag',4.29]],
'02':[['Sandwich Bread','20 oz',2.49],['Whole Wheat Bread','20 oz',3.29],['Hamburger Buns','8 ct',2.79],['Bagels','6 ct',3.49],['Bakery Muffins','4 ct',4.99]],
'03':[['Chicken Breasts','1 lb',3.49],['Ground Beef','1 lb',5.49],['Pork Chops','1 lb',4.29],['Tilapia Fillets','1 lb',6.49],['Smoked Sausage','14 oz',3.99]],
'04':[['Whole Milk','1 gallon',3.69],['Large Eggs','12 ct',3.29],['Cheddar Cheese','8 oz',2.79],['Butter','1 lb',4.49],['Greek Yogurt','4 pack',4.29]],
'05':[['Corn Flakes','18 oz',3.49],['Oatmeal','10 packets',3.29],['Pancake Mix','32 oz',3.49],['Breakfast Bars','6 ct',3.79],['Maple Syrup','24 oz',4.99]],
'06':[['Spaghetti','16 oz',1.49],['Penne Pasta','16 oz',1.69],['Pasta Sauce','24 oz',2.79],['Alfredo Sauce','15 oz',2.99],['Mac & Cheese','4 pack',4.49]],
'07':[['Chicken Noodle Soup','18 oz',2.19],['Tomato Soup','10 oz',1.49],['Green Beans','14.5 oz',1.19],['Black Beans','15 oz',1.29],['Canned Corn','15 oz',1.19]],
'08':[['All-Purpose Flour','5 lb',3.49],['Sugar','4 lb',3.69],['Brownie Mix','18 oz',2.49],['Cooking Oil','48 oz',4.99],['Chocolate Chips','12 oz',3.29]],
'09':[['Potato Chips','8 oz',3.49],['Pretzels','12 oz',2.99],['Crackers','13 oz',3.29],['Popcorn','6 bags',3.49],['Trail Mix','10 oz',4.49]],
'10':[['Bottled Water','24 pack',4.99],['Orange Juice','52 oz',4.29],['Apple Juice','64 oz',3.49],['Lemonade','52 oz',3.29],['Sports Drink','8 pack',6.99]],
'11':[['Frozen Pizza','1 ct',5.49],['Mixed Vegetables','12 oz',1.99],['Chicken Nuggets','24 oz',6.49],['French Fries','32 oz',3.99],['Ice Cream','48 oz',4.99]],
'12':[['Laundry Detergent','50 oz',8.99],['Dish Soap','24 oz',3.49],['Trash Bags','30 ct',6.99],['All-Purpose Cleaner','32 oz',3.99],['Sponges','6 ct',3.49]],
'13':[['Paper Towels','6 rolls',8.49],['Toilet Paper','12 rolls',9.99],['Napkins','200 ct',3.49],['Paper Plates','50 ct',4.99],['Storage Bags','40 ct',3.99]],
'14':[['Shampoo','12 oz',4.99],['Body Wash','18 oz',4.49],['Toothpaste','4 oz',3.29],['Deodorant','2.6 oz',4.49],['Hand Soap','10 oz',2.49]],
'15':[['Rotisserie Chicken','1 ct',7.99],['Deli Turkey','1 lb',8.49],['Deli Ham','1 lb',7.99],['Potato Salad','1 lb',4.49],['Prepared Sandwich','1 ct',5.49]]
};
let cart=JSON.parse(localStorage.ttGroceryCart||'[]'),mode=localStorage.ttGroceryMode||'',budget=Number(localStorage.ttGroceryBudget||0),scanned=[],scanIndex=0,totalRevealed=false;
const radio=document.getElementById('radio');radio.volume=.24;
function residentName(){return localStorage.ttCurrent||'Guest'}
function world(){try{return JSON.parse(localStorage.ttWorld||'{}')||{}}catch(e){return {}}}
function saveWorld(w){localStorage.ttWorld=JSON.stringify(w)}
function money(n){return '$'+Number(n||0).toFixed(2)}
function saveCart(){localStorage.ttGroceryCart=JSON.stringify(cart);document.getElementById('cartCount').textContent=cart.reduce((a,x)=>a+x.qty,0)}
function initDirectory(){directory.innerHTML=departments.map(d=>'<button class="dept" data-id="'+d[0]+'" onclick="aisle(\''+d[0]+'\')">'+d[0]+' — '+d[1]+'</button>').join('');mobileDir.innerHTML='<option value="">Choose a department…</option>'+departments.map(d=>'<option value="'+d[0]+'">'+d[0]+' — '+d[1]+'</option>').join('')+'<option value="checkout">Checkout</option>';mobileDir.onchange=()=>mobileDir.value==='checkout'?checkout():mobileDir.value&&aisle(mobileDir.value)}
function entrance(){document.querySelectorAll('.dept').forEach(x=>x.classList.remove('active'));view.innerHTML='<div class="hero"><img src="00-grocery-store-entrance-now-hiring.png" alt="Transition Town Grocery entrance with Now Hiring sign"><div class="overlay"><button class="apply" onclick="application()">NOW HIRING — Apply</button><button class="budget" onclick="chooseBudget()">Make a Budget</button><button class="shop" onclick="startFree()">Shop Freely</button></div></div><div class="panel"><h2>Welcome, '+residentName()+'!</h2><p>Choose how you want to shop. You can make a grocery budget first or shop freely. Your cart will show your items, but <b>it will not show a running total</b>. You will find out your total after every item is scanned at checkout.</p><p class="muted">Music is intentionally kept at a low background level. Use the Music button at the top anytime.</p></div>';tryStartRadio()}
function tryStartRadio(){if(localStorage.ttGroceryMusic==='off')return;radio.play().then(()=>musicBtn.textContent='♪ Music Off').catch(()=>musicBtn.textContent='♪ Tap for Music')}
musicBtn.onclick=()=>{if(radio.paused){radio.volume=.24;radio.play().then(()=>{musicBtn.textContent='♪ Music Off';localStorage.ttGroceryMusic='on'}).catch(()=>{})}else{radio.pause();musicBtn.textContent='♪ Music On';localStorage.ttGroceryMusic='off'}}
function chooseBudget(){modal.classList.remove('hidden');modalContent.innerHTML='<h2>Make Your Grocery Budget</h2><p>Decide how much you plan to spend <b>before</b> you start shopping.</p><label class="full">My grocery budget ($)<input id="budgetInput" type="number" min="1" step=".01" value="'+(budget||'')+'" inputmode="decimal"></label><p class="muted">You still will not see a running cart total while shopping.</p><button class="action primary" onclick="saveBudget()">Save Budget & Start Shopping</button>'}
function saveBudget(){let n=Number(budgetInput.value);if(!(n>0))return alert('Enter a budget greater than $0.');budget=n;mode='budget';localStorage.ttGroceryBudget=String(n);localStorage.ttGroceryMode=mode;closeModal();aisle('01')}
function startFree(){mode='free';budget=0;localStorage.ttGroceryMode=mode;localStorage.removeItem('ttGroceryBudget');aisle('01')}
function aisle(id){let d=departments.find(x=>x[0]===id);if(!d)return;document.querySelectorAll('.dept').forEach(x=>x.classList.toggle('active',x.dataset.id===id));mobileDir.value=id;let ps=catalog[id]||[];view.innerHTML='<img class="aisleimg" src="'+d[2]+'" alt="'+d[1]+' aisle"><div class="panel"><h2>Aisle '+d[0]+' — '+d[1]+'</h2><p>'+(mode==='budget'?'You made a budget before shopping. Keep track of your spending yourself—the store will not total it yet.':'Shop thoughtfully. Your final total stays hidden until checkout.')+'</p><div class="products">'+ps.map((p,i)=>'<div class="product"><h4>'+p[0]+'</h4><div>'+p[1]+'</div><p><b>'+money(p[2])+'</b></p><button onclick="addItem(\''+id+'\','+i+')">Add to Cart</button></div>').join('')+'</div></div>';tryStartRadio();scrollTo({top:0,behavior:'smooth'})}
function addItem(id,i){let p=catalog[id][i],key=id+'-'+i,x=cart.find(z=>z.key===key);if(x)x.qty++;else cart.push({key,name:p[0],size:p[1],price:p[2],qty:1});saveCart();let b=document.getElementById('cartCount');b.animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:300})}
function showCart(){modal.classList.remove('hidden');modalContent.innerHTML='<h2>Your Cart</h2>'+(cart.length?cart.map((x,i)=>'<div class="scanrow"><span><b>'+x.name+'</b><br><small>'+x.size+' × '+x.qty+'</small></span><span><button onclick="changeQty('+i+',-1)">−</button> <button onclick="changeQty('+i+',1)">+</button></span></div>').join(''):'<p>Your cart is empty.</p>')+'<p class="notice"><b>No running total shown.</b> Estimate your spending as you shop.</p><button class="action primary" onclick="closeModal();checkout()">Go to Checkout</button>'}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);saveCart();showCart()}
function closeModal(){modal.classList.add('hidden')}
function checkout(){document.querySelectorAll('.dept').forEach(x=>x.classList.remove('active'));mobileDir.value='checkout';scanned=[];scanIndex=0;totalRevealed=false;view.innerHTML='<div class="checkoutScene"><img src="16-checkout-area.png" alt="Transition Town Grocery checkout area"></div><div class="panel"><h2>Checkout</h2><p>At this register, <b>you scan every item yourself, one at a time.</b> Your final total stays hidden until every item is scanned.</p><div id="register"></div></div>';renderRegister();tryStartRadio();scrollTo({top:0,behavior:'smooth'})}
function expandedCart(){let a=[];cart.forEach(x=>{for(let i=0;i<x.qty;i++)a.push({name:x.name,size:x.size,price:x.price,key:x.key})});return a}
function renderRegister(){let all=expandedCart(),r=document.getElementById('register');if(!all.length){r.innerHTML='<p class="notice">Your cart is empty. Choose an aisle and add groceries first.</p>';return}let rows=scanned.map(x=>'<div class="scanrow"><span>'+x.name+'</span><b>'+money(x.price)+'</b></div>').join('');let done=scanIndex>=all.length;r.innerHTML='<div class="receipt"><b>TRANSITION TOWN GROCERY</b><p class="muted">Items scanned: '+scanIndex+' of '+all.length+'</p>'+rows+(totalRevealed?finalReceipt():done?'<p><b>All items scanned.</b> The total is still hidden until you finish.</p>':'<p>Scan the next item.</p>')+'</div><div class="checkoutActions">'+(!done?'<button class="primary" onclick="scanNext()">SCAN NEXT ITEM</button>':!totalRevealed?'<button class="primary" onclick="finishCheckout()">FINISH & GET TOTAL</button>':'')+'<button class="secondary" onclick="showCart()">Review Cart</button></div>'}
function beep(){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=1050;g.gain.value=.045;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.07)}catch(e){}}
function scanNext(){let all=expandedCart();if(scanIndex>=all.length)return;scanned.push(all[scanIndex++]);beep();renderRegister()}
function subtotal(){return expandedCart().reduce((a,x)=>a+x.price,0)}
function finalReceipt(){let t=subtotal(),diff=budget-t;return '<hr><div class="scanrow total"><span>TOTAL</span><span>'+money(t)+'</span></div>'+(mode==='budget'?'<p class="'+(diff>=0?'success':'danger')+' notice">Budget: '+money(budget)+'<br>'+(diff>=0?'You are '+money(diff)+' under budget.':'You are '+money(-diff)+' over budget.')+'</p>':'<p class="notice">Shop Freely mode — no budget comparison.</p>')+'<div id="payArea">'+paymentChoices(t)+'</div>'}
function paymentChoices(t){let w=world(),n=residentName(),r=w.residents&&w.residents[n],bal=r?Number(r.checking||0):0;if(!r)return '<p class="danger notice">Return to Transition Town and log in to a resident profile before paying.</p>';if(bal<t)return '<p class="danger notice">Checking balance: '+money(bal)+'. There is not enough money to complete this purchase. Put items back or cancel.</p><button class="secondary" onclick="showCart()">Put Items Back</button>';return '<p>Checking available: '+money(bal)+'</p>'+(mode==='budget'&&t>budget?'<p class="danger notice">This purchase is over your budget. You can put items back, or pay anyway if your checking account can cover it.</p>':'')+'<button class="primary" onclick="pay()">Pay '+money(t)+'</button> <button class="secondary" onclick="showCart()">Put Items Back</button>'}
function finishCheckout(){totalRevealed=true;renderRegister()}
function pay(){let t=subtotal(),w=world(),n=residentName(),r=w.residents&&w.residents[n];if(!r||Number(r.checking||0)<t)return alert('There is not enough money in checking.');r.checking=Number(r.checking)-t;r.history=r.history||[];r.history.push({type:'Grocery purchase',amount:-t,date:new Date().toLocaleString(),items:expandedCart().map(x=>x.name)});saveWorld(w);cart=[];saveCart();localStorage.removeItem('ttGroceryBudget');localStorage.removeItem('ttGroceryMode');view.innerHTML='<div class="panel"><h2>Purchase Complete!</h2><p class="success notice">Your groceries were paid for from your Transition Town checking account.</p><p><b>Total paid:</b> '+money(t)+'</p><p><b>New checking balance:</b> '+money(r.checking)+'</p><button class="action primary" onclick="entrance()">Return to Store Front</button> <button class="action secondary" onclick="location.href=\'transition-town.html\'">Return to Town</button></div>'}
function application(){modal.classList.remove('hidden');modalContent.innerHTML='<h2>Transition Town Grocery Employment Application</h2><p class="notice">Practice application. Do not enter a real Social Security number, bank information or passwords.</p><form id="jobForm" class="formgrid" onsubmit="submitApplication(event)"><label>Full Name<input name="name" required value="'+residentName().replace(/"/g,'&quot;')+'"></label><label>Phone / Practice Contact<input name="phone" placeholder="Practice information"></label><label class="wide">Practice Address<input name="address" placeholder="Transition Town address"></label><label>Position<select name="position" required><option>Cashier</option><option>Stocker</option><option>Either Cashier or Stocker</option></select></label><label>Desired Hours Per Week<input name="hours" type="number" min="1" max="40"></label><div class="wide"><h3>Availability</h3><div class="days">'+['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d=>'<label>'+d+'<input name="avail_'+d+'" placeholder="Example: 4–8 PM"></label>').join('')+'</div></div><label>Highest Grade / Education<input name="education"></label><label>School / Program<input name="school"></label><label class="wide">Previous Employment<textarea name="employment" rows="3" placeholder="Employer, position, dates, duties — or write None"></textarea></label><label class="wide">Skills & Qualifications<textarea name="skills" rows="3" placeholder="Customer service, math, organization, teamwork, stocking, etc."></textarea></label><label class="wide">References<textarea name="references" rows="3" placeholder="Practice reference names and relationship"></textarea></label><label>Reliable Transportation?<select name="transport"><option>Yes</option><option>No</option><option>Working on it</option></select></label><label>Can you reliably arrive on time?<select name="attendance"><option>Yes</option><option>No</option></select></label><label class="wide">Scenario: A customer says an item rang up at the wrong price. What would you do?<textarea name="scenario1" required rows="3"></textarea></label><label class="wide">Scenario: You notice a spill in an aisle while stocking shelves. What would you do?<textarea name="scenario2" required rows="3"></textarea></label><label class="wide">Why would you be a good employee for Transition Town Grocery?<textarea name="why" required rows="3"></textarea></label><label class="wide"><input type="checkbox" required> I certify that this practice application represents my own answers.</label><label>Signature / Type Name<input name="signature" required></label><label>Date<input name="date" type="date" required></label><div class="wide"><button class="action primary" type="submit">Submit Application to Ms. Kayla</button></div></form>'}
function submitApplication(e){e.preventDefault();let fd=new FormData(e.target),obj={};fd.forEach((v,k)=>obj[k]=v);obj.resident=residentName();obj.status='Pending Ms. Kayla Review';obj.submitted=new Date().toISOString();let w=world();w.groceryApplications=w.groceryApplications||[];w.groceryApplications.push(obj);saveWorld(w);modalContent.innerHTML='<h2>Application Submitted</h2><p class="success notice">Your application for <b>'+obj.position+'</b> was sent to Ms. Kayla for review.</p><p>Status: <b>Pending</b></p><button class="action primary" onclick="closeModal()">Continue Shopping</button>'}
initDirectory();saveCart();entrance();
</script></body></html>
