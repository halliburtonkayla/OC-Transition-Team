function loadCart(){
 const raw=localStorage.ttGroceryCart;if(!raw)return [];
 try{const saved=JSON.parse(raw);if(!Array.isArray(saved))throw Error('Cart must be a list');if(saved.some(x=>!x||typeof x.name!=='string'||!Number.isFinite(x.price)||x.price<0||!Number.isInteger(x.qty)||x.qty<1))throw Error('Invalid cart items');return saved}
 catch(e){localStorage.ttGroceryCartUnreadable=raw;return []}
}

function aisle(id){let d=departments.find(x=>x[0]===id);if(!d)return;let ps=catalog[id]||[];view.innerHTML='<div class="aisleWrap"><img class="aisleimg" src="'+d[2]+'" alt="'+d[1]+' aisle">'+artworkDirectoryHotspots(id)+'</div><div class="panel"><h2>Aisle '+d[0]+' — '+d[1]+'</h2><p>'+(mode==='budget'?'You made a budget before shopping. Keep track of your spending yourself—the store will not total it yet.':'Shop thoughtfully. Your final total stays hidden until checkout.')+'</p><div class="products">'+ps.map((p,i)=>'<div class="product"><h4>'+p[0]+'</h4><div>'+p[1]+'</div><p><b>'+money(p[2])+'</b></p><button onclick="addItem(\''+id+'\','+i+')">Add to Cart</button></div>').join('')+'</div></div>';wireArtworkDirectory();tryStartRadio();scrollTo({top:0,behavior:'smooth'})}
function addItem(id,i){let p=catalog[id][i],key=id+'-'+i,x=cart.find(z=>z.key===key);if(x)x.qty++;else cart.push({key,name:p[0],size:p[1],price:p[2],qty:1});saveCart();invalidateRegister();let b=document.getElementById('cartCount');b.animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:300})}
function showCart(){modal.classList.remove('hidden');modalContent.innerHTML='<h2>Your Cart</h2>'+(cart.length?cart.map((x,i)=>'<div class="scanrow"><span><b>'+x.name+'</b><br><small>'+x.size+' × '+x.qty+'</small></span><span><button onclick="changeQty('+i+',-1)">−</button> <button onclick="changeQty('+i+',1)">+</button></span></div>').join(''):'<p>Your cart is empty.</p>')+'<p class="notice"><b>No running total shown.</b> Estimate your spending as you shop.</p><button class="action primary" onclick="closeModal();checkout()">Go to Checkout</button>'}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);saveCart();invalidateRegister();showCart()}
function closeModal(){modal.classList.add('hidden')}
function checkout(){scanned=[];scanIndex=0;totalRevealed=false;view.innerHTML='<div class="checkoutScene aisleWrap"><img src="16-checkout-area.png" alt="Transition Town Grocery checkout area">'+artworkDirectoryHotspots('16')+'</div><div class="panel"><h2>Checkout</h2><p>At this register, <b>you scan every item yourself, one at a time.</b> Your final total stays hidden until every item is scanned.</p><div id="register"></div></div>';renderRegister();wireArtworkDirectory();tryStartRadio();scrollTo({top:0,behavior:'smooth'})}
function invalidateRegister(){scanned=[];scanIndex=0;totalRevealed=false;if(document.getElementById('register'))renderRegister()}
function expandedCart(){let a=[];cart.forEach(x=>{for(let i=0;i<x.qty;i++)a.push({name:x.name,size:x.size,price:x.price,key:x.key})});return a}
function renderRegister(){let all=expandedCart(),r=document.getElementById('register');if(!all.length){r.innerHTML='<p class="notice">Your cart is empty. Choose an aisle and add groceries first.</p>';return}let rows=scanned.map(x=>'<div class="scanrow"><span>'+x.name+'</span><b>'+money(x.price)+'</b></div>').join('');let done=scanIndex>=all.length;r.innerHTML='<div class="receipt"><b>TRANSITION TOWN GROCERY</b><p class="muted">Items scanned: '+scanIndex+' of '+all.length+'</p>'+rows+(totalRevealed?finalReceipt():done?'<p><b>All items scanned.</b> The total is still hidden until you finish.</p>':'<p>Scan the next item.</p>')+'</div><div class="checkoutActions">'+(!done?'<button class="primary" onclick="scanNext()">SCAN NEXT ITEM</button>':!totalRevealed?'<button class="primary" onclick="finishCheckout()">Finish Checkout</button>':'')+'<button class="secondary" onclick="showCart()">Review Cart</button></div>'}
function beep(){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=1050;g.gain.value=.045;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.07)}catch(e){}}
function scanNext(){let all=expandedCart();if(scanIndex>=all.length)return;scanned.push(all[scanIndex++]);beep();renderRegister()}
function subtotal(){return expandedCart().reduce((a,x)=>a+Math.round(x.price*100),0)/100}
function finalReceipt(){let t=subtotal(),diff=budget-t;return '<hr><div class="scanrow total"><span>TOTAL</span><span>'+money(t)+'</span></div>'+(mode==='budget'?'<p class="'+(diff>=0?'success':'danger')+' notice">Budget: '+money(budget)+'<br>'+(diff>=0?'You are '+money(diff)+' under budget.':'You are '+money(-diff)+' over budget.')+'</p>':'<p class="notice">Shop Freely mode — no budget comparison.</p>')+'<div id="payArea">'+paymentChoices(t)+'</div>'}
function paymentChoices(t){let w=world(),n=residentName(),r=w.residents&&w.residents[n],bal=r?Number(r.checking||0):0;if(!r)return '<p class="danger notice">Return to Transition Town and log in to a resident profile before paying.</p>';if(bal<t)return '<p class="danger notice">Checking balance: '+money(bal)+'. There is not enough money to complete this purchase. Put items back or cancel.</p><button class="secondary" onclick="showCart()">Put Items Back</button>';return '<p>Checking available: '+money(bal)+'</p>'+(mode==='budget'&&t>budget?'<p class="danger notice">This purchase is over your budget. You can put items back, or pay anyway if your checking account can cover it.</p>':'')+'<button class="primary" onclick="pay()">Pay '+money(t)+'</button> <button class="secondary" onclick="showCart()">Put Items Back</button>'}
function finishCheckout(){if(!expandedCart().length||scanIndex!==expandedCart().length||JSON.stringify(scanned)!==JSON.stringify(expandedCart()))return;totalRevealed=true;renderRegister()}
function pay(){if(!totalRevealed||JSON.stringify(scanned)!==JSON.stringify(expandedCart()))return;let t=subtotal(),w=world(),n=residentName(),r=w.residents&&w.residents[n];if(!r||Number(r.checking||0)<t)return alert('There is not enough money in checking.');r.checking=Math.round((Number(r.checking)-t)*100)/100;r.history=r.history||[];r.history.push('Grocery purchase -'+money(t)+' — '+expandedCart().map(x=>x.name).join(', '));saveWorld(w);cart=[];saveCart();localStorage.removeItem('ttGroceryBudget');localStorage.removeItem('ttGroceryMode');view.innerHTML='<div class="panel"><h2>Purchase Complete!</h2><p class="success notice">Your groceries were paid for from your Transition Town checking account.</p><p><b>Total paid:</b> '+money(t)+'</p><p><b>New checking balance:</b> '+money(r.checking)+'</p><button class="action primary" onclick="entrance()">Return to Store Front</button> <button class="action secondary" onclick="location.href=\'transition-town.html\'">Return to Town</button></div>'}

r says an item rang up at the wrong price. What would you do?<textarea name="scenario1" required rows="3"></textarea></label><label class="wide">Scenario: You notice a spill in an aisle while stocking shelves. What would you do?<textarea name="scenario2" required rows="3"></textarea></label><label class="wide">Why would you be a good employee for Transition Town Grocery?<textarea name="why" required rows="3"></textarea></label><label class="wide"><input type="checkbox" required> I certify that this practice application represents my own answers.</label><label>Signature / Type Name<input name="signature" required></label><label>Date<input name="date" type="date" required></label><div class="wide"><button class="action primary" type="submit">Submit Application to Ms. Kayla</button></div></form>'}
function submitApplication(e){e.preventDefault();let fd=new FormData(e.target),obj={};fd.forEach((v,k)=>obj[k]=v);obj.resident=residentName();obj.status='Pending Ms. Kayla Review';obj.submitted=new Date().toISOString();let w=world();w.groceryApplications=w.groceryApplications||[];w.groceryApplications.push(obj);saveWorld(w);modalContent.innerHTML='<h2>Application Submitted</h2><p class="success notice">Your application for <b>'+obj.position+'</b> was sent to Ms. Kayla for review.</p><p>Status: <b>Pending</b></p><button class="action primary" onclick="closeModal()">Continue Shopping</button>'}
