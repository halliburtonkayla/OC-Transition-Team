<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Projects</title><link rel="stylesheet" href="assets/session.css"><style>body{font-family:system-ui;margin:0;background:#f7f9fc;color:#24324a}header{background:#102a5c;color:white;padding:28px}main{max-width:1000px;margin:auto;padding:22px}.tools,.card{background:white;border:1px solid #dce3ee;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}button,input,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #bccbe0}button{background:#e1192f;color:white;font-weight:900}.out{font-weight:800;color:#102a5c}</style><link rel="stylesheet" href="assets/game-ui.css">
</head><body class="game-ui"><header><a href="index.html" style="color:white">← Home</a><h1>👥 Group Project Lab</h1><p>Business-building projects with roles, budgeting, teamwork and presentations.</p></header><main><div class="tools"><h2>Randomize Teams</h2><textarea id="names" style="width:100%;min-height:90px" placeholder="Paste student first names or initials, one per line"></textarea><p>Group size <select id="size"><option>2</option><option>3</option><option selected>4</option></select> <button id="make">Make Teams</button></p><div id="teams" class="out"></div></div><div class="grid" id="projects"></div></main><script src="assets/session.js"></script><script>const ps=['🍦 Build an Ice Cream Shop','🍕 Create a Restaurant','👕 Start a Clothing Brand','🎪 Plan a School Event','🏨 Run a Hotel','🐾 Start a Pet Business','🔧 Create an Auto Shop','🎨 Craft Business','🧁 Bakery','📱 Marketing Agency','🛋️ Interior Design Company','💼 Create Your Own Business'];document.getElementById('projects').innerHTML=ps.map(x=>`<div class="card"><h2>${x}</h2><p>Choose roles → name the business → design product/service → research supplies → set prices → budget → advertise → practice customer service → present.</p><b>Suggested roles:</b> Manager, Budget, Marketing, Design, Customer Service, Inventory/Sales.</div>`).join('');document.getElementById('make').onclick=()=>{let a=document.getElementById('names').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}let n=+document.getElementById('size').value,o=[];for(let i=0;i<a.length;i+=n)o.push(`<p>Team ${o.length+1}: ${a.slice(i,i+n).join(', ')}</p>`);document.getElementById('teams').innerHTML=o.join('');if(window.TTSession)TTSession.logActivity('Group project team randomizer')};</script></body></html>
