y. Max looked at Nick. Nobody looked excited.", "'I'll do the easy part,' Max said immediately. 'There is no easy part yet,' Jacob answered. They hadn't even read the directions.", "Aubrey wanted to make the project look good. Nick wanted to research. Adon wanted to build something. Jacob realized they actually had useful differences.", "Instead of everybody doing the same thing, they divided the project by strengths. Nick researched, Aubrey designed, Adon built, and Jacob organized the pieces.", "Max was supposed to present. Suddenly the 'easy part' didn't seem so easy. He had to understand what everyone else had done.", "Halfway through, one piece didn't fit the plan. The group started blaming each other, then stopped and looked at the actual problem.", "They changed the design instead of arguing about whose idea had caused it. The new version was better than the first one.", "When presentation day came, Max explained the project while everyone else answered questions about their sections.", "Jacob realized teamwork didn't mean everyone doing everything together. It meant everyone contributing toward the same goal.", "TAKEAWAY: Teams work better when people communicate, use different strengths, solve problems without blaming, and take responsibility for their part."];let p=0;function render(){document.getElementById('storyText').textContent=pages[p];document.getElementById('pageNo').textContent='Page '+(p+1)+' of '+pages.length;}function next(){if(p<pages.length-1){p++;render()}else location.href='../index.html'}function prev(){if(p>0){p--;render()}}render();</script></body></html>
