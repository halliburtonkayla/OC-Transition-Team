inary clinic sounded perfect. Then seven people arrived at once with seven different problems.", "Jayden brought in a puppy that would not stop scratching. Clark had a cat that refused to come out of its carrier. Dalton said his dog had stopped eating.", "Allen's pretend rabbit had hurt its leg. Olivia was worried about a sleepy kitten. Max announced that his giant dog was 'probably fine' while the dog acted anything but fine.", "Kaylee calmly asked, 'Which animal needs help first?' Haley realized loving animals wasn't enough. She had to prioritize.", "She checked for emergencies first, then organized the remaining patients. Dalton's dog needed quick attention because not eating could be important.", "While waiting, Haley explained to everyone why the clinic couldn't simply go in arrival order. Some problems were more urgent than others.", "Clark's cat finally came out of the carrier. Max's dog knocked over an empty cup. Everybody laughed, including Haley.", "Haley also learned that veterinarians talk to people almost as much as animals. Owners need clear instructions and reassurance too.", "At the end of the shift, Haley was tired\u2014but excited. The busy clinic hadn't changed her mind. It made her want to learn more.", "TAKEAWAY: Veterinary careers combine animal care, science, communication, decision-making, and teamwork. Loving animals is the beginning, not the whole job."];let p=0;function render(){document.getElementById('storyText').textContent=pages[p];document.getElementById('pageNo').textContent='Page '+(p+1)+' of '+pages.length;}function next(){if(p<pages.length-1){p++;render()}else location.href='../index.html'}function prev(){if(p>0){p--;render()}}render();</script></body></html>
