<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Count to 100 · Transition Town School</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f1fff5,#eef8ff,#fff6dc);color:#18243c}header{padding:18px;background:linear-gradient(120deg,#2ea86e,#4bc2e5,#7256d8);color:#fff}header a{color:#fff;font-weight:900;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:20px}.panel{background:#fff;border-radius:24px;border:3px solid #e1eee8;padding:20px;box-shadow:0 10px 25px #0001}.levels{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.level{border:0;border-radius:14px;padding:12px 16px;font-weight:900;background:#e8f4ff;cursor:pointer}.level.active{background:#2ea86e;color:white}.lesson{font-size:24px;font-weight:900;text-align:center;padding:14px;background:#f7fbff;border-radius:18px}.numberLine{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:16px 0}.n{min-height:54px;border:0;border-radius:12px;font-size:20px;font-weight:1000;background:#eef4ff;cursor:pointer}.n:nth-child(5n+1){background:#ffe4ef}.n:nth-child(5n+2){background:#e8e2ff}.n:nth-child(5n+3){background:#e1f5ff}.n:nth-child(5n+4){background:#e5faeb}.n:nth-child(5n){background:#fff2c7}.n.focus{outline:5px solid #ffd75a;transform:scale(1.08)}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{border:0;border-radius:16px;padding:16px;font-size:24px;font-weight:1000;background:#eef7ff;cursor:pointer}.choice.good{background:#dcffe9;outline:4px solid #49d687}.choice.bad{background:#ffd8d8}.feedback{text-align:center;font-weight:900;min-height:32px;margin-top:12px;color:#236f4e}.read{border:0;border-radius:14px;padding:11px 15px;background:#7256d8;color:#fff;font-weight:900;margin-top:10px}@media(max-width:650px){.numberLine{grid-template-columns:repeat(5,1fr)}.choices{grid-template-columns:1fr}}</style></head><body>
<header><a href="transition-town.html?school=1">← Back to School</a><h1>Count to 100</h1></header><main class="wrap"><section class="panel"><div class="levels"><button class="level active" data-max="30">21–30</button><button class="level" data-max="50">31–50</button><button class="level" data-max="75">51–75</button><button class="level" data-max="100">76–100</button></div><div id="lesson" class="lesson">We already know 1 through 20. Now let's learn what comes next.</div><button id="read" class="read">Read It To Me</button><div id="line" class="numberLine"></div><div id="prompt" class="lesson">What comes after 20?</div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div></section></main><script>
(()=>{let start=21,end=30,current=21;const line=document.querySelector('#line'),prompt=document.querySelector('#prompt'),choices=document.querySelector('#choices'),fb=document.querySelector('#feedback'),lesson=document.querySelector('#lesson');function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.8;speechSynthesis.speak(u)}}function rangeFor(max){if(max===30)return[21,30];if(max===50)return[31,50];if(max===75)return[51,75];return[76,100]}function buildLine(){line.innerHTML='';for(let n=start;n<=end;n++){let b=document.createElement('button');b.className='n';b.textContent=n;b.onclick=()=>{document.querySelectorAll('.n').forEach(x=>x.classList.remove('focus'));b.classList.add('focus');speak(String(n))};line.appendChild(b)}}function make(){if(current>end){lesson.textContent='You finished this level!';prompt.textContent='Great job! Pick the next level.';choices.innerHTML='';fb.textContent='';speak('Great job! You finished this level.');return;}prompt.textContent='What number comes after '+(current-1)+'?';let opts=new Set([current]);while(opts.size<3){let n=current+(Math.floor(Math.random()*5)-2);if(n>=start&&n<=end&&n!==current)opts.add(n)}choices.innerHTML='';[...opts].sort(()=>Math.random()-.5).forEach(n=>{let b=document.createElement('button');b.className='choice';b.textContent=n;b.onclick=()=>pick(n,b);choices.appendChild(b)});lesson.textContent='Say it, hear it, then find it: '+current;document.querySelectorAll('.n').forEach(x=>x.classList.toggle('focus',Number(x.textContent)===current));}
function pick(n,b){if(n===current){b.classList.add('good');fb.textContent='Yes! '+current+' comes next.';speak('Yes! '+current+' comes next.');current++;setTimeout(make,700)}else{b.classList.add('bad');fb.textContent='Try again. Listen for the next number.';speak('Try again. What comes after '+(current-1)+'?');setTimeout(()=>b.classList.remove('bad'),500)}}
document.querySelectorAll('[data-max]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-max]').forEach(x=>x.classList.toggle('active',x===btn));[start,end]=rangeFor(Number(btn.dataset.max));current=start;buildLine();make()});document.querySelector('#read').onclick=()=>speak(lesson.textContent+' '+prompt.textContent);buildLine();make()})();
</script><script src="assets/classroom-monitor/student.js?v=20261026count100" defer></script></body></html>
