raphy showed her there was much more behind the image.", "Kaylee played the patient and immediately asked, 'So can you tell me what's wrong?' Olivia realized she couldn't just make up medical answers.", "She practiced introducing herself, explaining the procedure, and helping Kaylee feel comfortable before beginning.", "Alyssa watched the monitor and said, 'How do you even know what you're looking at?' That was exactly why sonographers need training in anatomy and imaging.", "Gia reminded Olivia to check the patient's information. Olivia caught that she had almost skipped an important step.", "The pretend scan required concentration. Olivia had to position the equipment correctly while also communicating with the patient.", "When she couldn't get the image she wanted, she adjusted instead of pretending everything was fine.", "Olivia realized healthcare workers need both technical skills and people skills. Patients may be nervous, uncomfortable, or full of questions.", "By the end, she was even more interested in sonography\u2014but now she understood the education and responsibility involved.", "TAKEAWAY: Sonography combines healthcare knowledge, technology, communication, accuracy, and patient care. Career exploration helps you see the real job behind the title."];let p=0;function render(){document.getElementById('storyText').textContent=pages[p];document.getElementById('pageNo').textContent='Page '+(p+1)+' of '+pages.length;}function next(){if(p<pages.length-1){p++;render()}else location.href='../index.html'}function prev(){if(p>0){p--;render()}}render();</script></body></html>
