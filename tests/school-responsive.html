<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School responsive layout check</title><style>body{margin:0;background:#e7e8ef;color:#24384c;font:14px Arial}header{display:flex;align-items:center;gap:12px;padding:12px;flex-wrap:wrap}button{padding:9px 12px;border:1px solid #aaa;border-radius:8px;cursor:pointer}main{padding:12px;overflow:auto}iframe{display:block;border:1px solid #999;border-radius:12px;background:white;width:390px;height:844px}#result{font-weight:bold}</style></head><body><header><b>School layout regression check</b><button data-width="390">Phone · 390px</button><button data-width="768">Tablet · 768px</button><button data-width="1280">Desktop · 1280px</button><span id="result" role="status">Opening classrooms…</span></header><main><iframe title="School classroom preview" src="../transition-town.html?school=classrooms"></iframe></main><script>
const frame=document.querySelector('iframe'),out=document.querySelector('#result');
function verify(){const d=frame.contentDocument,cards=[...d.querySelectorAll('.school-classroom-card')];if(!cards.length){out.textContent='Choose Guest in the preview, then reload this check.';return}const failures=[];for(const card of cards){const r=card.getBoundingClientRect(),p=card.querySelector('p:not(.school-eyebrow):not(.school-progress)'),b=card.querySelector('button');if(frame.contentWindow.getComputedStyle(card).display!=='block')failures.push('Card is not stacked');if(r.width<240||r.right>Number(frame.style.width.replace('px','')||390)+1)failures.push('Card exceeds viewport');if(p.getBoundingClientRect().width<190)failures.push('Paragraph too narrow');if(b.getBoundingClientRect().top<p.getBoundingClientRect().bottom)failures.push('Button overlaps description');}out.textContent=failures.length?'FAIL: '+[...new Set(failures)].join('; '):'PASS · '+cards.length+' readable classroom cards at '+frame.clientWidth+'px';}
frame.addEventListener('load',verify);document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';requestAnimationFrame(verify)});
</script></body></html>
