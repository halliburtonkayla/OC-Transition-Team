<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animated Stories</title>
<style>body{font-family:Arial;margin:0;background:#eef4ff;color:#172033}header{padding:24px;background:#153e75;color:white}main{max-width:950px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.storycard,#stage{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0002}button{padding:12px 16px;margin:6px;border:0;border-radius:12px;background:#1d4ed8;color:white;font-weight:800}#stage{display:none;margin-top:20px}.screen{min-height:230px;border-radius:16px;background:linear-gradient(135deg,#dbeafe,#fef3c7);display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:1.35rem}.choices button{display:block;width:100%;text-align:left}</style></head>
<body><header><h1>🎬 Animated Stories</h1><p>Watch, listen, make a choice, and see what happens next.</p></header><main><div class="grid"><article class="storycard"><h2>Payday Gone Wrong</h2><p>Workplace Readiness Training</p><button onclick='playStory("Payday Gone Wrong","Workplace Readiness Training",[{"title": "Friday feels rich", "text": "Maya gets her first full paycheck and wants to celebrate.", "choices": ["Spend most of it tonight", "Make a quick bills-and-fun plan", "Give a friend half"]}, {"title": "The bills arrive", "text": "Rent, phone, transportation and groceries are due.", "choices": ["Ignore them until next week", "Pay priorities first", "Buy new shoes first"]}, {"title": "An unexpected cost", "text": "Her tire needs repair before Monday's shift.", "choices": ["Use the emergency money she kept", "Skip work without calling", "Use rent money"]}, {"title": "Monday morning", "text": "Maya reviews what her choices changed.", "choices": ["Write down what worked", "Pretend nothing happened", "Borrow without a plan"]}])'>▶ Start Animated Story</button></article><article class="storycard"><h2>First Day at Work</h2><p>Workplace Readiness Training</p><button onclick='playStory("First Day at Work","Workplace Readiness Training",[{"title": "Before the shift", "text": "Jordan starts at a busy local store at 4:00 PM.", "choices": ["Arrive 10 minutes early", "Walk in at 4:08", "Text a friend in the parking lot"]}, {"title": "I don't understand", "text": "The supervisor gives Jordan a task that is unclear.", "choices": ["Ask a specific question", "Guess and hide mistakes", "Leave the task"]}, {"title": "A customer is upset", "text": "A customer complains about an item.", "choices": ["Listen and get appropriate help", "Argue back", "Walk away laughing"]}, {"title": "End of shift", "text": "Jordan finishes the first day.", "choices": ["Check out with the supervisor", "Disappear when the clock hits", "Post about coworkers online"]}])'>▶ Start Animated Story</button></article><article class="storycard"><h2>My First Apartment</h2><p>Workplace Readiness Training</p><button onclick='playStory("My First Apartment","Workplace Readiness Training",[{"title": "Apartment search", "text": "Alex compares rent, utilities and transportation.", "choices": ["Compare total monthly cost", "Choose only by bedroom size", "Ignore utilities"]}, {"title": "The lease", "text": "A long lease is ready to sign.", "choices": ["Read it and ask questions", "Sign without reading", "Let a friend sign"]}, {"title": "Move-in week", "text": "Alex needs food, cleaning supplies and furniture.", "choices": ["Buy needs first and phase in wants", "Finance everything immediately", "Spend grocery money on decor"]}, {"title": "Maintenance problem", "text": "The sink starts leaking.", "choices": ["Report it correctly and protect belongings", "Ignore it for weeks", "Try a dangerous repair"]}])'>▶ Start Animated Story</button></article></div>
<section id="stage"><div class="screen" id="screen"></div><h2 id="sceneTitle"></h2><p id="caption"></p><button onclick="readScene()">🔊 Read to Me</button><div class="choices" id="storyChoices"></div><p id="storyProgress"></p></section></main>
<script>
let currentStory='',currentArea='',scenes=[],idx=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function playStory(title,area,data){currentStory=title;currentArea=area;scenes=data;idx=0;document.getElementById('stage').style.display='block';render();document.getElementById('stage').scrollIntoView({behavior:'smooth'});}
function render(){let x=scenes[idx];document.getElementById('screen').innerHTML='🎞️<br><b>'+x.title+'</b>';document.getElementById('sceneTitle').textContent=x.title;document.getElementById('caption').textContent=x.text;let c=document.getElementById('storyChoices');c.innerHTML='';shuffle([...x.choices]).forEach(choice=>{let b=document.createElement('button');b.textContent=choice;b.onclick=()=>choose(choice);c.appendChild(b)});document.getElementById('storyProgress').textContent='Scene '+(idx+1)+' of '+scenes.length;}
function choose(choice){if(window.TTPreETS)TTPreETS.recordChoice(currentStory,choice,'Story decision');idx++;if(idx>=scenes.length){document.getElementById('screen').innerHTML='⭐ <b>Story Complete!</b>';document.getElementById('caption').textContent='Review the decisions you made and what you would do in real life.';document.getElementById('storyChoices').innerHTML='<button onclick="TTPreETS&&TTPreETS.summary()">📋 View Pre-ETS Session Data</button>';return}render();}
function readScene(){let u=new SpeechSynthesisUtterance(document.getElementById('sceneTitle').textContent+'. '+document.getElementById('caption').textContent);u.rate=1.02;u.pitch=1.08;speechSynthesis.cancel();speechSynthesis.speak(u);}
</script><script src="session.js"></script></body></html>
