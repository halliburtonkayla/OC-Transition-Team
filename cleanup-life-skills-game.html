<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Do I Need? | Life Skills Challenge</title><style>
:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--pink:#f5c5d8;--paper:#fbfafb;--ink:#25324a}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:#fff;padding:20px;text-align:center}header h1{margin:4px;font-size:30px}main{max-width:850px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #e1e6ef;border-radius:20px;padding:22px;box-shadow:0 6px 20px #0011}.progress{height:12px;background:#e9edf4;border-radius:99px;overflow:hidden;margin:12px 0 22px}.bar{height:100%;background:var(--blue);width:0;transition:.3s}.scene{text-align:center}.scene-icon{font-size:88px;line-height:1.1}.tag{display:inline-block;background:#edf4fc;color:var(--navy);padding:6px 12px;border-radius:99px;font-weight:800}.question{font-size:27px;color:var(--navy);font-weight:900;margin:14px 0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{min-height:105px;border:2px solid #d9e1ed;border-radius:16px;background:#fff;font-size:19px;font-weight:800;padding:14px;cursor:pointer}.choice:hover,.choice:focus{border-color:var(--blue);background:#f4f8ff}.choice .ico{font-size:34px;display:block;margin-bottom:5px}.feedback{margin-top:16px;padding:15px;border-radius:14px;background:#f6f7fa;font-size:18px;font-weight:700;min-height:56px}.next,.restart{margin-top:14px;border:0;border-radius:999px;background:var(--red);color:#fff;font-size:17px;font-weight:900;padding:13px 24px;cursor:pointer}.next[hidden]{display:none}.score{text-align:center}.score .big{font-size:64px}.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin-top:15px}.skill{background:#f5f7fb;border-radius:12px;padding:10px}.home{display:inline-block;color:white;margin-top:8px}@media(max-width:600px){.choices{grid-template-columns:1fr}.question{font-size:23px}.scene-icon{font-size:70px}}</style><link rel="stylesheet" href="assets/session.css"><link rel="stylesheet" href="assets/game-ui.css">
</head><body class="game-ui">
<header><h1>🧹 What Do I Need?</h1><div>CDC Life Skills Challenge • Look → Choose → Learn</div><a class="home" href="index.html">← Back to Transition Center</a></header>
<main><div class="panel"><div id="game"><div><strong id="count">1 of 12</strong></div><div class="progress"><div class="bar" id="bar"></div></div><div class="scene"><span class="tag" id="cat"></span><div class="scene-icon" id="sceneIcon"></div><div class="question" id="question"></div></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite">Choose the best answer.</div><button class="next" id="next" hidden>Next →</button></div><div id="result" hidden></div></div></main>
<script>
const qs=[
{c:'Cleaning',i:'🥤💦',q:'A drink spilled on the floor. What should you grab?',a:[['🧻','Paper towels'],['🧹','Broom'],['👕','Clean shirt'],['🍴','Fork']],ok:0,good:'Good choice! Paper towels can soak up a small wet spill.',hint:'Look for something that can soak up liquid.'},
{c:'Cleaning',i:'🍪⬇️',q:'There are dry cracker crumbs on the floor. What should you use?',a:[['🧹','Broom and dustpan'],['🧴','Shampoo'],['🪥','Toothbrush'],['🥛','Cup']],ok:0,good:'Yes! Sweep dry crumbs with a broom and dustpan.',hint:'Dry crumbs need to be swept up.'},
{c:'Cleaning',i:'🗑️⬆️',q:'The trash can is full. What should you do?',a:[['🗑️','Tie/remove the bag and replace it'],['👣','Push trash onto the floor'],['💧','Pour water in it'],['🙈','Ignore it']],ok:0,good:'Right! Remove the full bag and put a clean bag in the can.',hint:'A full trash can needs a fresh bag.'},
{c:'Taking Care of Myself',i:'🥵💧',q:'You are thirsty. What should you do?',a:[['💧','Get a safe drink of water'],['🧼','Drink soap'],['🙈','Ignore it all day'],['🧴','Drink cleaner']],ok:0,good:'Yes! Get water or another safe drink. Ask for help if you need it.',hint:'Choose something safe to drink.'},
{c:'Hygiene',i:'👐🦠',q:'Your hands are dirty after using the restroom. What do you need?',a:[['🧼','Soap and water'],['🧹','Broom'],['👟','Shoes'],['📺','TV']],ok:0,good:'Correct! Wash your hands with soap and water.',hint:'Think about what cleans germs from your hands.'},
{c:'Hygiene',i:'👕👃',q:'Your shirt is dirty and smells before work. What should you do?',a:[['👕','Put on a clean shirt'],['🗑️','Wear it anyway'],['🧹','Sweep it'],['🍝','Put sauce on it']],ok:0,good:'Good job! Clean clothes are part of getting ready for work.',hint:'Choose clean clothing before work.'},
{c:'Kitchen',i:'🍽️🫧',q:'You finished eating and the plate is dirty. What should you do?',a:[['🧽','Wash it or put it in the dishwasher'],['🛏️','Put it under the bed'],['👕','Wipe it on your shirt'],['📚','Put it with books']],ok:0,good:'Yes! Dirty dishes belong in the sink/dishwasher for cleaning.',hint:'Where do dirty dishes go to get clean?'},
{c:'Laundry',i:'🧺👚',q:'You have dirty clothes on the floor. What should you do?',a:[['🧺','Put them in the hamper'],['🍽️','Put them on the table'],['🚪','Throw them outside'],['🧊','Put them in the freezer']],ok:0,good:'Right! Put dirty clothing in the hamper until laundry time.',hint:'Find the place meant for dirty clothes.'},
{c:'Workplace',i:'⚠️💦',q:'There is a large wet spill where people are walking. What should you do first?',a:[['⚠️','Warn others/block the area and get help/supplies'],['🏃','Run through it'],['🙈','Walk away without telling anyone'],['🧹','Sweep the liquid']],ok:0,good:'Great safety choice! Warn people so no one slips, then clean it with the proper supplies.',hint:'First keep people from slipping.'},
{c:'Cleaning',i:'🪟✋',q:'A table has sticky juice on it. What would help clean it?',a:[['🧽','Damp cloth/paper towel and appropriate cleaner'],['🧹','Broom only'],['👟','Shoe'],['✏️','Pencil']],ok:0,good:'Yes! Wipe a sticky surface with an appropriate damp cloth or paper towel.',hint:'You need something that can wipe a surface.'},
{c:'Taking Care of Myself',i:'🤕🙋',q:'You do not feel well at school or work. What should you do?',a:[['🙋','Tell a trusted adult/supervisor and ask for help'],['🤐','Hide it no matter what'],['🧴','Drink cleaner'],['🏃','Leave without telling anyone']],ok:0,good:'Good choice! Tell the appropriate person when you need help.',hint:'Safe adults and supervisors can help you.'},
{c:'Workplace',i:'📦🚧',q:'A box is blocking the walkway. What should you do?',a:[['📦','Move it safely to the correct place or ask for help'],['🦵','Kick it'],['🙈','Leave a trip hazard'],['💦','Pour water on it']],ok:0,good:'Correct! Keep walkways clear. If it is heavy, ask for help.',hint:'Walkways should be clear and safe.'}
];
let n=0,score=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;$('count').textContent=`${n+1} of ${qs.length}`;$('bar').style.width=`${n/qs.length*100}%`;let x=qs[n];$('cat').textContent=x.c;$('sceneIcon').textContent=x.i;$('question').textContent=x.q;$('feedback').textContent='Choose the best answer.';$('next').hidden=true;$('choices').innerHTML='';x.a.forEach((a,k)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="ico">${a[0]}</span>${a[1]}`;b.onclick=()=>pick(k,b);$('choices').appendChild(b)})}function pick(k,b){if(locked)return;let x=qs[n];if(k===x.ok){locked=true;score++;b.style.borderColor='#26834a';b.style.background='#effaf2';$('feedback').textContent='✓ '+x.good;$('next').hidden=false;[...$('choices').children].forEach(z=>z.disabled=true)}else{b.disabled=true;b.style.opacity='.5';$('feedback').textContent='Try again. '+x.hint}}$('next').onclick=()=>{n++;if(n<qs.length)render();else finish()};function finish(){$('game').hidden=true;$('result').hidden=false;let pct=Math.round(score/qs.length*100);$('result').innerHTML=`<div class="score"><div class="big">🌟</div><h2>Life Skills Challenge Complete!</h2><h3>${score} of ${qs.length} situations completed</h3><p>You practiced choosing safe tools and actions for cleaning, hygiene, kitchen, laundry, workplace, and self-care situations.</p><div class="skills"><div class="skill">🧹 Cleaning</div><div class="skill">🧼 Hygiene</div><div class="skill">🍽️ Kitchen</div><div class="skill">👕 Laundry</div><div class="skill">💼 Workplace Safety</div><div class="skill">🙋 Self-Care</div></div><button class="restart" onclick="location.reload()">Play Again ↻</button></div>`}render();
</script><script src="assets/session.js"></script></body></html>
