<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relax & Tap Color | Transition Team</title><style>
:root{--navy:#102a5c}*{box-sizing:border-box}body{margin:0;background:#eef2f7;font-family:Arial;color:#25324a}nav{background:var(--navy);padding:14px 18px}nav a{color:white;text-decoration:none;font-weight:900}main{max-width:1050px;margin:auto;padding:22px}.hero,.game{background:white;border-radius:20px;padding:22px;box-shadow:0 6px 22px #102a5c18}.hero{text-align:center}.hero h1{font-family:Georgia,serif;color:var(--navy);font-size:36px;margin:5px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}.pick{border:2px solid #ccd5e3;background:white;border-radius:12px;padding:12px;font-weight:900;cursor:pointer}.pick.active{background:var(--navy);color:white}.game h2{text-align:center}.instructions{text-align:center}.palette{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:14px}.sw{width:62px;height:48px;border:3px solid white;outline:1px solid #777;border-radius:9px;font-size:20px;font-weight:900;cursor:pointer}.sw.active{outline:4px solid #111}.board{display:grid;grid-template-columns:repeat(12,1fr);max-width:720px;margin:auto;border:4px solid #111;background:#fff}.cell{aspect-ratio:1;border:1px solid #aab2bd;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;cursor:pointer;user-select:none}.controls{text-align:center;margin:16px}.controls button{padding:11px 16px;border:0;border-radius:9px;background:var(--navy);color:white;font-weight:900;margin:4px}.quote{text-align:center;font-family:Georgia,serif;font-size:23px;font-weight:bold;color:var(--navy);margin:16px}.progress{text-align:center;font-weight:bold}@media(max-width:650px){.board{grid-template-columns:repeat(12,1fr)}.cell{font-size:12px}.sw{width:52px}} 
</style></head><body><nav><a href="index.html">← Home</a></nav><main><section class="hero"><h1>Relax & Tap Color</h1><p>Pick a picture, tap a color, then tap the matching numbered squares. No scribbling—just tap and relax while you listen or talk.</p></section><div id="gallery" class="gallery"></div><section class="game"><h2 id="title"></h2><div class="instructions">Choose a color below. Then tap squares with that number.</div><div id="palette" class="palette"></div><div id="board" class="board"></div><div id="progress" class="progress"></div><div id="quote" class="quote"></div><div class="controls"><button onclick="reset()">Start Over</button><button onclick="newRandom()">Surprise Me</button></div></section></main><script>
const C=['#59bdf2','#ef3340','#42a62a','#f2d33b','#8b5a2b','#222'];
const pics=[
{name:'Football Stadium',q:'Stay focused. Your next play matters.',map:[

{name:'Smartphone',q:'Protect your peace. You do not have to answer everything immediately.',map:[

{name:'Headphones',q:'Sometimes quiet is productive.',map:[
'111111111111','111555555111','115111115511','151111111151','551111111155','551111111155','551111111155','551111111155','151111111151','115111115511','111555555111','111111111111']},
{name:'Game Controller',q:'Reset. Refocus. Try again.',map:[
'666666666666','661111111166','611111111116','611155551116','611155551116','611111111116','611111111116','611155551116','611155551116','661111111166','666666666666','666666666666']},
{name:'Pickup Truck',q:'Slow progress is still progress.',map:[
'111111111111','111111111111','111111111111','111222211111','112222222111','122222222211','122222222221','122222222221','166222226661','166111116661','111111111111','333333333333']},
{name:'Sneakers',q:'Small steps still move you forward.',map:[
'111111111111','111111111111','111111111111','111555111111','115555511111','155555551111','155555555111','155555555511','115555555551','111555555551','111111111111','111111111111']},
{name:'Fishing Dock',q:'A slower moment can help you think clearly.',map:[
'111111111111','111111111111','111111111111','111111111111','111111111111','111111111111','222222222222','222222222222','555555111111','555555111111','555555111111','555555111111']},
{name:'Sunset',q:'One hard day is not your whole story.',map:[
'111111111111','111111111111','111144111111','111444411111','114444441111','222222222222','222222222222','222222222222','555555555555','555555555555','555555555555','555555555555']},
{name:'Football Jersey',q:'Discipline today creates options tomorrow.',map:[

{name:'Calm Nature',q:'You can pause without giving up.',map:[

{name:'School Spirit',q:'Your choices today help build your tomorrow.',map:[
'666666666666','662222222266','622222222226','622666666226','622666666226','622222222226','622222222226','622666666226','622666666226','622222222226','662222222266','666666666666']}
];
let current=0,selected=1;
function renderGallery(){gallery.innerHTML='';pics.forEach((p,i)=>{let b=document.createElement('button');b.className='pick'+(i===current?' active':'');b.textContent=p.name;b.onclick=()=>load(i);gallery.appendChild(b)})}
function load(i){current=i;selected=1;title.textContent=pics[i].name;quote.textContent='“'+pics[i].q+'”';renderGallery();palette.innerHTML='';C.forEach((c,j)=>{let b=document.createElement('button');b.className='sw'+(j===0?' active':'');b.style.background=c;b.style.color=j===5?'white':'black';b.textContent=j+1;b.onclick=()=>{selected=j+1;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('active'));b.classList.add('active')};palette.appendChild(b)});board.innerHTML='';pics[i].map.join('').split('').forEach(n=>{let d=document.createElement('div');d.className='cell';d.dataset.n=n;d.textContent=n;d.onclick=()=>{if(+n===selected){d.style.background=C[n-1];d.textContent='';d.dataset.done=1;progressNow()}else d.animate([{transform:'scale(.9)'},{transform:'scale(1)'}],{duration:160})};board.appendChild(d)});progressNow()}
function progressNow(){let done=board.querySelectorAll('[data-done]').length,total=144;progress.textContent=done+' of '+total+' squares filled'+(done===total?' — Finished!':'')}
function reset(){load(current)} function newRandom(){let n;do{n=Math.floor(Math.random()*pics.length)}while(n===current);load(n)}load(0);
</script><script src="session.js"></script></body></html>
