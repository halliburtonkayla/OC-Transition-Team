<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Grocery Trip | Transition Team</title><style>
:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--paper:#f6f8fc;--ink:#25324a;--green:#16784a;--gold:#f3b61f}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:15px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}header a{color:white;text-decoration:none;font-weight:800}main{max-width:900px;margin:auto;padding:18px}.book{background:white;border:1px solid #dbe3ef;border-radius:22px;padding:24px;box-shadow:0 8px 28px #102a5c18;min-height:560px;position:relative;overflow:hidden}.turn{animation:turn .38s ease}@keyframes turn{0%{opacity:.25;transform:perspective(800px) rotateY(-12deg) translateX(18px)}100%{opacity:1;transform:none}}h1,h2{font-family:Georgia,serif;color:var(--navy)}h1{font-size:38px;margin:4px 0 8px}.scene{font-size:72px;text-align:center;background:linear-gradient(180deg,#eaf4ff,#fff);border-radius:18px;padding:20px;margin:14px 0}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:18px 0}.choices button,.btn{border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:850;cursor:pointer;background:var(--blue);color:white;min-height:52px}.choices button.alt{background:var(--green)}.choices button.warn{background:#8a5b00}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.pill{background:#edf4fc;border-radius:12px;padding:10px;text-align:center;font-weight:800}.list{background:#f8fafc;border:1px solid #dde5ef;border-radius:14px;padding:14px}.itemgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.item{border:2px solid #d7dfeb;background:white;border-radius:12px;padding:12px;cursor:pointer;text-align:left;font-weight:750}.item.sel{border-color:var(--green);background:#edfff6}.small{color:#66758a;font-size:14px}.read{background:#5b3f91;color:white;border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.feedback{padding:14px;border-radius:12px;background:#fff4c9;margin:12px 0}.good{background:#eafff1}.receipt{font-family:ui-monospace,monospace;background:#fffdf5;border:1px dashed #999;padding:18px;border-radius:10px}.progress{height:10px;background:#e5eaf1;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}@media(max-width:560px){main{padding:10px}.book{padding:16px}.scene{font-size:54px}.status{grid-template-columns:1fr}h1{font-size:30px}}
</style><link rel="stylesheet" href="session.css"></head><body><header><a href="index.html">← Transition Team Home</a><a href="simulators.html">Game Zone</a></header><main><div id="book" class="book"></div></main><script>function friendlySpeak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices();
  const en=voices.filter(v=>/^en(-|_)/i.test(v.lang||''));
  const preferred=['Ava','Samantha','Zoe','Aria','Jenny','Emma','Joanna','Allison','Serena','Tessa','Victoria','Karen','Moira','Fiona','Siri Female'];
  let voice=preferred.map(n=>en.find(v=>(v.name||'').toLowerCase().includes(n.toLowerCase()))).find(Boolean);
  if(!voice) voice=en.find(v=>/female|woman|girl|natural|premium|enhanced/i.test(v.name||''));
  if(!voice) voice=en[0]||voices[0];
  if(voice) u.voice=voice;
  u.rate=1.03; u.pitch=1.12; u.volume=1;
  speechSynthesis.speak(u);
}

const meals={
'Taco Night':{emoji:'🌮',budget:30,needed:['Ground beef','Taco seasoning','Tortillas','Shredded cheese','Lettuce','Tomatoes','Salsa']},
'Spaghetti Dinner':{emoji:'🍝',budget:25,needed:['Spaghetti noodles','Pasta sauce','Ground beef','Parmesan cheese','Garlic bread']},
'Cheeseburgers':{emoji:'🍔',budget:30,needed:['Ground beef','Hamburger buns','Cheese slices','Lettuce','Tomatoes','Ketchup']},
'Breakfast':{emoji:'🥞',budget:25,needed:['Eggs','Bacon','Pancake mix','Milk','Syrup']},
'Chicken Dinner':{emoji:'🍗',budget:35,needed:['Chicken','Potatoes','Green beans','Dinner rolls','Seasoning']},
'Tortilla Pizza':{emoji:'🍕',budget:22,needed:['Tortillas','Pizza sauce','Pepperoni','Shredded cheese']}}
const aisle={
'Produce':['Lettuce','Tomatoes','Bananas','Apples','Potatoes','Onions'],
'Meat':['Ground beef','Chicken','Bacon','Pork chops'],
'Dairy':['Shredded cheese','Cheese slices','Parmesan cheese','Eggs','Milk','Yogurt'],
'Pantry':['Taco seasoning','Salsa','Spaghetti noodles','Pasta sauce','Pancake mix','Syrup','Ketchup','Seasoning'],
'Bread & Tortillas':['Tortillas','Hamburger buns','Garlic bread','Dinner rolls','Bread'],
'Frozen':['Frozen pizza','Ice cream','Frozen vegetables'],
'Household':['Paper towels','Dish soap','Trash bags'],
'Sporting Goods':['Basketball','Fishing lure','Water bottle']};
const price={'Ground beef':5.49,'Taco seasoning':0.89,'Tortillas':2.29,'Shredded cheese':2.49,'Lettuce':1.99,'Tomatoes':1.79,'Salsa':2.39,'Spaghetti noodles':1.49,'Pasta sauce':2.19,'Parmesan cheese':2.89,'Garlic bread':2.49,'Hamburger buns':2.39,'Cheese slices':2.79,'Ketchup':2.49,'Eggs':2.99,'Bacon':4.99,'Pancake mix':2.69,'Milk':3.19,'Syrup':2.99,'Chicken':6.49,'Potatoes':3.49,'Green beans':1.39,'Dinner rolls':2.49,'Seasoning':1.29,'Pizza sauce':1.79,'Pepperoni':3.29,'Bananas':1.49,'Apples':3.49,'Onions':1.29,'Pork chops':6.99,'Yogurt':1.19,'Bread':2.29,'Frozen pizza':5.99,'Ice cream':4.49,'Frozen vegetables':2.19,'Paper towels':6.99,'Dish soap':3.49,'Trash bags':8.49,'Basketball':12.99,'Fishing lure':5.99,'Water bottle':7.99};
let s={meal:null,list:[],cart:[],budget:0,wrong:0,extras:0,page:0};const book=document.getElementById('book');
function speak(){friendlySpeak(book.innerText.replace(/READ TO ME/g,''))}function render(html){book.classList.remove('turn');void book.offsetWidth;book.innerHTML=html;book.classList.add('turn');const r=book.querySelector('#read');if(r)r.onclick=speak;window.scrollTo({top:0,behavior:'smooth'})}function money(n){return '$'+n.toFixed(2)}function total(){return s.cart.reduce((a,x)=>a+(price[x]||0),0)}function status(){return `<div class="status"><div class="pill">💵 Budget<br>${money(s.budget)}</div><div class="pill">🛒 Cart<br>${s.cart.length} items</div><div class="pill">💰 Remaining<br>${money(s.budget-total())}</div></div>`}
function start(){render(`<div class="scene">🛒📖</div><h1>My Grocery Trip</h1><p>Build your own shopping story. Pick a meal, make your grocery list, drive to the store, choose aisles, shop, and see how your choices turn out.</p><button id="read" class="read">🔊 READ TO ME</button><h2>What are you cooking?</h2><div class="choices">${Object.entries(meals).map(([m,v])=>`<button onclick="chooseMeal('${m}')">${v.emoji} ${m}</button>`).join('')}</div>`)}
function chooseMeal(m){s={meal:m,list:[],cart:[],budget:meals[m].budget,wrong:0,extras:0,page:1};buildList()}
function buildList(){let n=meals[s.meal].needed;let distract=['Ice cream','Paper towels','Bananas','Dish soap','Frozen pizza','Water bottle'].filter(x=>!n.includes(x));let opts=[...n,...distract].sort();render(`<div class="scene">${meals[s.meal].emoji} 📝</div><h1>Make Your Grocery List</h1><p>You chose <b>${s.meal}</b>. Click everything you think you need. Some choices do not belong in this meal.</p><button id="read" class="read">🔊 READ TO ME</button><div class="itemgrid">${opts.map(x=>`<button class="item ${s.list.includes(x)?'sel':''}" onclick="toggleList('${x.replaceAll("'","\\'")}')">${s.list.includes(x)?'✓ ':''}${x}</button>`).join('')}</div><div class="choices"><button class="alt" onclick="listReady()">MY LIST IS READY →</button></div><p class="small">Selected: ${s.list.length} items. Your choices become the list you take into the store.</p>`)}
function toggleList(x){s.list.includes(x)?s.list=s.list.filter(i=>i!==x):s.list.push(x);buildList()}
function listReady(){if(!s.list.length){alert('Choose at least one item for your grocery list.');return}s.page=2;render(`<div class="scene">🚗 🛒</div><h1>Your List Is Ready</h1><div class="list"><b>${s.meal}</b><br>${s.list.map(x=>'☐ '+x).join('<br>')}</div><p>You have <b>${money(s.budget)}</b> to shop. Now it's time to go to the store.</p><button id="read" class="read">🔊 READ TO ME</button><div class="choices"><button onclick="arrive()">🚗 GO TO THE STORE →</button></div>`)}
function arrive(){render(`<div class="scene">🚗🏪</div><h1>You Pulled Up to the Grocery Store</h1><p>You parked safely. Your grocery list is with you and you have a budget.</p><button id="read" class="read">🔊 READ TO ME</button><div class="choices"><button onclick="entrance()">GET OUT OF THE CAR →</button></div>`)}
function entrance(){render(`<div class="scene">🏪🛒</div><h1>Welcome to the Store</h1><p>You grab a cart. Which section will you visit first?</p>${status()}<button id="read" class="read">🔊 READ TO ME</button><div class="choices">${Object.keys(aisle).map(a=>`<button onclick="visit('${a}')">${a==='Produce'?'🥬':a==='Meat'?'🥩':a==='Dairy'?'🥛':a==='Pantry'?'🥫':a==='Bread & Tortillas'?'🍞':a==='Frozen'?'❄️':a==='Household'?'🧴':'⚽'} ${a}</button>`).join('')}<button class="alt" onclick="checkout()">🧾 GO TO CHECKOUT</button></div>`)}
function visit(a){let wanted=aisle[a].filter(x=>s.list.includes(x)&&!s.cart.includes(x));if(!wanted.length)s.wrong++;let msg=wanted.length?`You found something from your list in this section.`:`You look around, but none of the items still on your list are here. Check your list before spending money.`;render(`<div class="scene">${a==='Produce'?'🥬':a==='Meat'?'🥩':a==='Dairy'?'🥛':a==='Pantry'?'🥫':a==='Bread & Tortillas'?'🍞':a==='Frozen'?'❄️':a==='Household'?'🧴':'⚽'} 🛒</div><h1>${a}</h1><div class="feedback ${wanted.length?'good':''}">${msg}</div>${status()}<button id="read" class="read">🔊 READ TO ME</button><div class="itemgrid">${aisle[a].map(x=>`<button class="item ${s.cart.includes(x)?'sel':''}" onclick="add('${x.replaceAll("'","\\'")}','${a}')">${s.cart.includes(x)?'✓ ':''}${x}<br><span class="small">${money(price[x])}</span></button>`).join('')}</div><div class="choices"><button onclick="entrance()">← CHOOSE ANOTHER AISLE</button><button class="alt" onclick="checkout()">🧾 CHECKOUT</button></div>`)}
function add(x,a){if(s.cart.includes(x))return; if(total()+price[x]>s.budget){alert('That would put you over your budget. You can still choose a different item or go to checkout.');return}s.cart.push(x);if(!s.list.includes(x))s.extras++;visit(a)}
function checkout(){let missing=s.list.filter(x=>!s.cart.includes(x));let mealNeeded=meals[s.meal].needed;let forgotten=mealNeeded.filter(x=>!s.list.includes(x));let success=missing.length===0&&forgotten.length===0&&total()<=s.budget;render(`<div class="scene">🧾 ${success?'🎉':'🤔'}</div><h1>Checkout — Your Story</h1><div class="receipt"><b>${s.meal}</b><br><br>${s.cart.map(x=>`${x.padEnd(20,'.')} ${money(price[x])}`).join('<br>')}<hr><b>TOTAL: ${money(total())}</b><br>BUDGET: ${money(s.budget)}<br>LEFT: ${money(s.budget-total())}</div><p><b>List items found:</b> ${s.list.length-missing.length} of ${s.list.length}<br><b>Extra purchases:</b> ${s.extras}<br><b>Wrong/unhelpful aisles visited:</b> ${s.wrong}</p>${missing.length?`<div class="feedback">Still on your list: ${missing.join(', ')}</div>`:''}${forgotten.length?`<div class="feedback">When you planned your list, you left out: <b>${forgotten.join(', ')}</b>. Would your meal still work?</div>`:''}<button id="read" class="read">🔊 READ TO ME</button><div class="choices">${missing.length?'<button onclick="entrance()">🛒 GO BACK & KEEP SHOPPING</button>':''}<button class="alt" onclick="start()">🔄 WRITE A NEW GROCERY STORY</button><button onclick="window.print()">🖨 PRINT MY RESULTS</button></div>`)}start();
</script><script src="session.js"></script></body></html>
