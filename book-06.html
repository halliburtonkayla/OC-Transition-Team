<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I Can&#x27;t Wait Till I&#x27;m Grown!</title><style>

lls you what to do, you get paid, and you buy whatever you want.' Allen agreed immediately.", "Adon added, 'And you can stay up all night.' Jasmine wanted her own apartment. Aubrey wanted to eat out whenever she felt like it.", "So they played a game: everybody was officially grown for the day. Cameron received a pretend $800 paycheck and smiled like he'd won the lottery.", "Then rent took $450. His phone bill took $90. Electricity took $110. Car insurance took another $100. Cameron's smile slowly disappeared.", "'Hold up. I still need gas,' he said. Jasmine reminded him about groceries. Allen reminded him that tires don't magically replace themselves.", "Adon said he'd just skip work whenever he was tired. Aubrey laughed. 'Then your next paycheck might be zero dollars.'", "They started seeing the difference between freedom and responsibility. Adults can make choices, but those choices still have consequences.", "Jasmine decided learning to cook might be cheaper than eating out every day. Allen started talking about saving money before buying extras.", "Cameron looked at what remained of his pretend paycheck. 'So adulting is basically paying everybody first?' Everyone cracked up.", "TAKEAWAY: Growing up brings freedom, but also bills, work, planning, and consequences. Independence means learning to manage both."];let p=0;function render(){document.getElementById('storyText').textContent=pages[p];document.getElementById('pageNo').textContent='Page '+(p+1)+' of '+pages.length;}function next(){if(p<pages.length-1){p++;render()}else location.href='../index.html'}function prev(){if(p>0){p--;render()}}render();</script></body></html>
