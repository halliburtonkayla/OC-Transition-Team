*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#8bd3ff,#8fd16a);min-height:100vh;color:#292441}.wrap{max-width:1050px;margin:auto;padding:18px}.book{background:#fff9ef;border-radius:30px;box-shadow:0 18px 50px #0003;overflow:hidden;border:7px solid #fff}.scene{min-height:470px;position:relative;padding:42px;background:linear-gradient(#bce8ff 0 45%,#8bcf70 45%);display:flex;align-items:center;justify-content:center}.art{width:min(92%,820px);height:340px;border-radius:30px;background:linear-gradient(135deg,#fff7,#ffffff22);border:4px solid #fff8;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;box-shadow:inset 0 0 50px #fff7}.emoji{font-size:100px}.cast{font-size:22px;font-weight:900;margin-top:10px}.text{padding:26px 34px;font-size:25px;line-height:1.45;min-height:190px}.top,.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:16px 24px;background:#49347f;color:#fff}h1{font-size:25px;margin:0}button,a.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:900;font-size:16px;cursor:pointer;text-decoration:none;background:#fff;color:#49347f}.pageNo{font-weight:900}@media(max-width:650px){.scene{min-height:330px;padding:20px}.art{height:245px}.emoji{font-size:72px}.text{font-size:20px;padding:22px}h1{font-size:20px}}</style></head><body><div class="wrap"><div class="book"><div class="top"><h1>Chevi Becomes an Art Teacher</h1><a class="btn" href="../index.html">Library</a></div><div class="scene"><div class="art"><div><div class="emoji">🎨</div><div class="cast">Starring Chevi<br><small>with Aubrey, Jasmine, Cameron, Alyssa</small></div></div></div></div><div id="storyText" class="text"></div><div class="nav"><button onclick="prev()">← Previous</button><span id="pageNo" class="pageNo"></span><button onclick="next()">Next →</button></div></div></div><script>const pages=["Chevi imagined her first art class would be peaceful: music playing, everyone painting, and beautiful pictures drying by the window.", "Five minutes into class, Aubrey wanted a different brush, Jasmine couldn't decide what to draw, Cameron had paint on the table, and Alyssa wanted to start over.", "Chevi almost tried to fix everyone's artwork herself. Then she remembered that a teacher's job isn't to make the project for the student.", "She showed Aubrey where the supplies were organized, gave Jasmine three ideas to choose from, and handed Cameron a towel before the paint reached the floor.", "When Alyssa said her picture looked wrong, Chevi asked, 'What part do YOU want to change?' Alyssa thought about it and found her own solution.", "The room was still busy, but it wasn't out of control. Chevi began moving around the class, checking progress and giving help without taking over.", "Cameron discovered a new way to mix colors. Jasmine finally chose a design. Aubrey helped clean brushes without being asked.", "At the end, none of the pictures looked the same\u2014and Chevi realized that was the best part.", "Teaching art wasn't about creating twenty perfect copies. It was about helping twenty different people learn and create.", "TAKEAWAY: Good teachers guide, explain, encourage, organize, and adapt. Helping someone learn is different from doing the work for them."];let p=0;function render(){document.getElementById('storyText').textContent=pages[p];document.getElementById('pageNo').textContent='Page '+(p+1)+' of '+pages.length;}function next(){if(p<pages.length-1){p++;render()}else location.href='../index.html'}function prev(){if(p>0){p--;render()}}render();</script></body></html>
