d help finding information, and Noah was getting nervous about what was happening.", "Kaylee's first instinct was to move faster. Instead, she stopped and figured out what needed attention first.", "She made sure Olivia was safe and seated. Then she asked clear questions instead of guessing what was wrong.", "Jasmine noticed how calm Kaylee sounded. 'You're not freaking out at all.' Kaylee laughed. 'I am on the inside.'", "Noah needed simple directions and reassurance. Kaylee explained what was happening without overwhelming him with too much information.", "When Kaylee reached something outside her pretend role, she asked for help. Being responsible didn't mean pretending she knew everything.", "Once the urgent problem was handled, she returned to the other tasks instead of forgetting about them.", "Olivia said, 'Okay, I see why nurses have to keep track of a million things.' Kaylee agreed.", "Kaylee liked helping people, but she also discovered nursing requires organization, communication, training, and staying calm under pressure.", "TAKEAWAY: Strong workers know how to prioritize, communicate, follow procedures, and ask for help when something is beyond their role."];let p=0;function render(){document.getElementById('storyText').textContent=pages[p];document.getElementById('pageNo').textContent='Page '+(p+1)+' of '+pages.length;}function next(){if(p<pages.length-1){p++;render()}else location.href='../index.html'}function prev(){if(p>0){p--;render()}}render();</script></body></html>
