<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After Graduation: My College Story</title><style>:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--paper:#f7f9fc;--ink:#24324a;--green:#16794b}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header a{color:white;text-decoration:none;font-weight:800}main{max-width:980px;margin:auto;padding:18px}.book{background:white;border:1px solid #dce3ed;border-radius:22px;padding:24px;box-shadow:0 8px 24px #102a5c12;min-height:520px}.scene{animation:turn .35s ease}@keyframes turn{from{opacity:.2;transform:rotateY(-8deg) translateX(16px)}to{opacity:1;transform:none}}h1,h2{font-family:Georgia,serif;color:var(--navy)}.art{font-size:64px;text-align:center;background:linear-gradient(135deg,#eef5ff,#fff0f5);border-radius:18px;padding:28px;margin:12px 0}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.choices button,.btn{border:0;border-radius:13px;padding:14px 16px;background:var(--blue);color:white;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none}.choices button:nth-child(even){background:var(--navy)}.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#eef3fa;padding:10px 14px;border-radius:12px;margin-bottom:12px}.read{background:var(--green)!important}.muted{color:#66758a}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #dce3ed;border-radius:16px;padding:18px}.card a{display:inline-block;margin-top:8px}.result{background:#eef8f2;border-radius:14px;padding:14px;margin:12px 0}@media(max-width:600px){main{padding:10px}.book{padding:16px}.art{font-size:48px;padding:20px}}</style><link rel="stylesheet" href="session.css"></head><body><header><a href="index.html">← Home</a><a href="life-stories.html">Life Stories</a><strong>After Graduation: My College Story</strong></header><main><div class="book"><div class="bar"><span id="pg">Page 1 of 20</span><span id="status">Choices shape your story</span></div><div id="scene" class="scene"></div></div></main><script>function friendlySpeak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices();
  const en=voices.filter(v=>/^en(-|_)/i.test(v.lang||''));
  const preferred=['Ava','Samantha','Zoe','Aria','Jenny','Emma','Joanna','Allison','Serena','Tessa','Victoria','Karen','Moira','Fiona','Siri Female'];
  let voice=preferred.map(n=>en.find(v=>(v.name||'').toLowerCase().includes(n.toLowerCase()))).find(Boolean);
  if(!voice) voice=en.find(v=>/female|woman|girl|natural|premium|enhanced/i.test(v.name||''));
  if(!voice) voice=en[0]||voices[0];
  if(voice) u.voice=voice;
  u.rate=1.03; u.pitch=1.12; u.volume=1;
  speechSynthesis.speak(u);
}
const title="After Graduation: My College Story",icon="\ud83c\udf93",intro="You are finishing high school. Your decisions will carry you from senior year through college graduation.",S=[{"text": "Senior year is ending. What do you do first?", "choices": ["Compare programs, costs and admission requirements", "Pick only by parties", "Wait until deadlines pass"]}, {"text": "You have several postsecondary options.", "choices": ["Compare fit: program, cost, location and support", "Choose only because a friend goes there", "Ignore the program you want"]}, {"text": "Financial aid paperwork is due.", "choices": ["Complete it carefully and ask for help if needed", "Skip it because it looks confusing", "Borrow without comparing costs"]}, {"text": "You choose a school/path. Housing is next.", "choices": ["Compare dorm/commute/housing costs and rules", "Pick the fanciest option regardless of cost", "Sign without reading"]}, {"text": "Orientation day arrives.", "choices": ["Learn the campus, supports and schedule", "Skip everything", "Only look for parties"]}, {"text": "You meet your roommate.", "choices": ["Discuss boundaries, guests, cleaning and quiet time", "Assume you agree on everything", "Use their things without asking"]}, {"text": "Classes begin.", "choices": ["Use a calendar and locate each class", "Skip the first week", "Wait for someone to remind you"]}, {"text": "Student organizations are recruiting.", "choices": ["Explore groups that fit your interests and time", "Join everything", "Avoid every opportunity"]}, {"text": "You are interested in a fictional fraternity/sorority.", "choices": ["Learn expectations, costs and values first", "Join only for status", "Agree to anything without asking"]}, {"text": "A new-member activity becomes coercive and unsafe.", "choices": ["Refuse, leave and contact appropriate campus support", "Participate because \u201ceveryone does it\u201d", "Pressure another student to do it"]}, {"text": "You are invited to a big party.", "choices": ["Decide your boundaries and safe transportation before going", "Go with no plan", "Promise to drive after drinking"]}, {"text": "At the party, someone pressures you to drink/use drugs.", "choices": ["Hold your boundary and stay with safe people", "Use something unknown to fit in", "Accept an open drink from a stranger"]}, {"text": "A friend who has been drinking wants to drive.", "choices": ["Keep them from driving and find a safe ride/help", "Ride with them", "Hand them the keys"]}, {"text": "You have an 8 AM class after a late night.", "choices": ["Protect enough sleep and get to class", "Skip because friends are sleeping", "Stop attending morning classes"]}, {"text": "Your first exam grade is lower than expected.", "choices": ["Review mistakes and use tutoring/professor office hours", "Quit the course immediately", "Pretend the grade did not happen"]}, {"text": "You start questioning your major.", "choices": ["Research alternatives and talk with an adviser", "Change randomly every week", "Stay only because others expect it"]}, {"text": "Money gets tight midsemester.", "choices": ["Review spending and consider appropriate campus/work options", "Use high-cost debt for wants", "Ignore account notices"]}, {"text": "An internship opportunity appears.", "choices": ["Check requirements and apply", "Assume you are not qualified", "Skip it because it sounds like work"]}, {"text": "Senior year arrives.", "choices": ["Connect coursework, experience and career plans", "Wait until graduation to think about work", "Stop checking degree requirements"]}, {"text": "College graduation is here.", "choices": ["Review what you learned and plan the next step", "Assume a diploma handles everything automatically", "Avoid making any next-step plan"]}];let i=0,score=0,choices=[];function speak(){friendlySpeak(document.getElementById('copy').innerText)}function draw(){let s=S[i];document.getElementById('pg').textContent='Page '+(i+1)+' of '+S.length;let buttons=s.choices.map((c,j)=>`<button data-j="${j}">${c}</button>`).join('');document.getElementById('scene').innerHTML=`<div class="art">${icon}</div><h1>${i===0?title:'What happens next?'}</h1><p id="copy" style="font-size:19px;line-height:1.55">${i===0?intro+' ':''}${s.text}</p><div class="choices"><button class="read" id="read">🔊 READ TO ME</button>${buttons}</div>`;document.getElementById('read').onclick=speak;document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>pick(+b.dataset.j));}function pick(j){choices.push(j); if(j===0)score+=2; else if(j===1)score+=1; i++; if(i>=S.length)finish(); else draw();}function finish(){let level=score>=S.length*1.45?'You consistently protected your priorities and handled problems early.':score>=S.length*.9?'You made a mix of strong choices and choices that created extra challenges.':'Several early choices created harder consequences later. Replay and see how a different decision changes the story.';document.getElementById('pg').textContent='THE END';document.getElementById('scene').innerHTML=`<div class="art">🏁</div><h1>Here’s How Your Story Turned Out</h1><div class="result"><p style="font-size:19px">${level}</p><p>You completed <b>${S.length} scenes</b>. Your decisions—not a single pass/fail answer—shaped this ending.</p></div><div class="choices"><button id="again">🔄 WRITE A DIFFERENT STORY</button><button class="read" id="readEnd">🔊 READ RESULTS</button><button onclick="print()">🖨 PRINT RESULTS</button></div>`;document.getElementById('again').onclick=()=>{i=0;score=0;choices=[];draw()};document.getElementById('readEnd').onclick=speak;}draw();</script><script src="session.js"></script>
<script>
(function(){
  const KEY='tt_sound_on';
  let ctx=null;
  function enabled(){ return localStorage.getItem(KEY)!=='0'; }
  function tone(freq,dur,type='sine',vol=.035){
    if(!enabled()) return;
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.setValueAtTime(vol,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
    }catch(e){}
  }
  window.TTSound={
    click:()=>tone(520,.055,'sine',.025),
    success:()=>{tone(660,.10,'sine',.035);setTimeout(()=>tone(880,.13,'sine',.03),90)},
    consequence:()=>tone(330,.11,'triangle',.025)
  };
  document.addEventListener('click',e=>{
    const b=e.target.closest('button,.choice,.option,[role="button"]');
    if(b && !b.id?.startsWith('ttSound')) TTSound.click();
  },true);
  function addToggle(){
    if(document.getElementById('ttSoundToggle')) return;
    const b=document.createElement('button');
    b.id='ttSoundToggle';
    b.type='button';
    b.setAttribute('aria-label','Turn website sounds on or off');
    b.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99998;border:0;border-radius:999px;padding:10px 14px;background:#111827;color:white;font-weight:800;box-shadow:0 3px 12px #0003';
    function label(){b.textContent=enabled()?'🔊 Sound On':'🔇 Sound Off'}
    label();
    b.onclick=()=>{localStorage.setItem(KEY,enabled()?'0':'1');label();if(enabled())TTSound.success();}
    document.body.appendChild(b);
  }
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',addToggle):addToggle();
})();
</script>


<script id="ttUniversalChoiceShuffle">
(function(){
  const selectors=[
    '.choices','.options','.choice-grid','.answer-grid','.answers',
    '.decision-options','.response-options','.scenario-options',
    '#choices','#options','#answers'
  ];
  const itemSel='button,.choice,.option,.answer,[role="button"],label';

  function shuffleArray(a){
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function signature(c){
    return [...c.children].map(x=>(x.textContent||'').trim()).join('|');
  }
  function shuffleContainer(c){
    const kids=[...c.children].filter(x=>x.matches(itemSel));
    if(kids.length<2) return;
    const sig=signature(c);
    if(c.dataset.ttShuffleSig===sig) return;
    shuffleArray(kids).forEach(k=>c.appendChild(k));
    c.dataset.ttShuffleSig=signature(c);
  }
  function scan(root=document){
    selectors.forEach(sel=>root.querySelectorAll(sel).forEach(shuffleContainer));
    // Also detect ordinary containers holding 2–6 answer buttons.
    root.querySelectorAll('div,section,article,form').forEach(c=>{
      const kids=[...c.children].filter(x=>x.matches('button'));
      if(kids.length>=2 && kids.length<=6){
        const txt=(c.className+' '+c.id).toLowerCase();
        if(/choice|answer|option|decision|response|scenario|quiz|question/.test(txt))
          shuffleContainer(c);
      }
    });
  }
  let queued=false;
  function queue(){
    if(queued)return; queued=true;
    requestAnimationFrame(()=>{queued=false;scan();});
  }
  document.addEventListener('DOMContentLoaded',()=>{scan();});
  new MutationObserver(queue).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
