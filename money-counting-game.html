<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Counting Game</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#effff4,#f5f0ff,#fff7dd);color:#193047}header{padding:18px;background:linear-gradient(120deg,#23845d,#4cc98c,#6d5be0);color:#fff}header a{color:#fff;font-weight:900;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 25px #0001;border:3px solid #dcf2e6}.moneytray{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;min-height:170px;align-items:center;background:#f6fff8;border-radius:22px;padding:18px}.bill{width:150px;height:72px;border:4px solid #23845d;border-radius:10px;background:#dff5df;display:grid;place-items:center;font-size:30px;font-weight:1000}.coin{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-weight:1000;border:4px solid #888;background:#ddd}.coin.penny{background:#d98b5f}.coin.nickel{background:#d9dde0}.coin.dime{width:62px;height:62px}.coin.quarter{background:#d0d5d8}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.ans{border:0;border-radius:16px;padding:16px;font-size:25px;font-weight:1000;background:#eef7ff}.ans:nth-child(2){background:#fff0f7}.ans:nth-child(3){background:#edfff4}.ans:nth-child(4){background:#fff5d1}.feedback{text-align:center;font-weight:900;padding:14px}.stats{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.pill{background:#fff;border-radius:999px;padding:10px 14px;font-weight:900}.good{outline:5px solid #48d689}.bad{background:#ffd5d5!important}</style></head><body><header><a href="transition-town.html?school=1">← Back to School</a><h1>Money Counting Game</h1></header><main class="wrap"><div class="stats"><div class="pill">Correct: <span id="score">0</span></div><div class="pill">Level: Bills + Coins</div></div><section class="card"><h2 style="text-align:center">How much money is here?</h2><div id="tray" class="moneytray"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback">Count the money and choose the total.</div></section></main><script>
(()=>{const items=[{v:1,t:'$1',c:'bill'},{v:5,t:'$5',c:'bill'},{v:10,t:'$10',c:'bill'},{v:.25,t:'25¢',c:'coin quarter'},{v:.10,t:'10¢',c:'coin dime'},{v:.05,t:'5¢',c:'coin nickel'},{v:.01,t:'1¢',c:'coin penny'}];let current=0,score=0;const tray=document.querySelector('#tray'),answers=document.querySelector('#answers'),fb=document.querySelector('#feedback');
function money(n){return '$'+n.toFixed(2)}
function make(){tray.innerHTML='';current=0;let count=Math.floor(Math.random()*4)+3;for(let i=0;i<count;i++){let it=items[Math.floor(Math.random()*items.length)];current+=it.v;let d=document.createElement('div');d.className=it.c;d.textContent=it.t;tray.appendChild(d)}current=Math.round(current*100)/100;let set=new Set([current]);while(set.size<4){let delta=(Math.floor(Math.random()*15)+1)*.05;let n=Math.max(.01,Math.round((current+(Math.random()<.5?-delta:delta))*100)/100);set.add(n)}answers.innerHTML='';[...set].sort(()=>Math.random()-.5).forEach(n=>{let b=document.createElement('button');b.className='ans';b.textContent=money(n);b.onclick=()=>pick(n,b);answers.appendChild(b)});fb.textContent='Count the money and choose the total.'}
function pick(n,b){if(n===current){score++;document.querySelector('#score').textContent=score;b.classList.add('good');fb.textContent='Correct! '+money(current);setTimeout(make,650)}else{b.classList.add('bad');fb.textContent='Try again. Count each bill and coin.';setTimeout(()=>b.classList.remove('bad'),450)}}make()})();
</script><script src="assets/classroom-monitor/student.js?v=20261026money" defer></script></body></html>
