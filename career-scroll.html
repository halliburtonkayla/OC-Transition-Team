let liked=new Set();
function render(){feed.innerHTML='';jobs.forEach((j,i)=>{let s=document.createElement('section');s.className='card';s.style.setProperty('--a',j[9]);s.style.setProperty('--b',j[10]);s.innerHTML='<div class="bg"><div class="shape"></div><div class="icon">'+j[2]+'</div></div><div class="shade"></div><button class="sound" aria-label="Read career aloud">🔊</button><div class="content"><div class="cat">'+j[1]+'</div><h1>'+j[0]+'</h1>'+(videos[j[0]]?'<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/'+videos[j[0]]+'?rel=0" title="'+j[0]+' career video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>':'')+'<div class="hook">'+j[3]+'</div><div class="facts"><div class="fact"><b>WHERE YOU MIGHT WORK</b>'+j[4]+'</div><div class="fact"><b>TRAINING PATH</b>'+j[5]+'</div><div class="fact"><b>SKILLS</b>'+j[6]+'</div><div class="fact"><b>THINK ABOUT IT</b>'+j[7]+'</div></div><div class="actions"><button data-v="yes">♥ I’d try it</button><button data-v="maybe">? Tell me more</button><button data-v="no">Not for me</button></div></div>';s.querySelector('.sound').onclick=()=>speak(j);s.querySelectorAll('.actions button').forEach(b=>b.onclick=()=>choose(i,b));feed.appendChild(s)})}
function speak(j){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(j[0]+'. '+j[3]+' Where you might work: '+j[4]+'. Training path: '+j[5]+'. Think about it: '+j[7]);u.rate=.95;speechSynthesis.speak(u)}
function choose(i,b){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');if(b.dataset.v==='yes'||b.dataset.v==='maybe')liked.add(i);else liked.delete(i);saved.textContent=liked.size+' career'+(liked.size===1?'':'s')+' saved';if(window.TTSession)TTSession.recordChoice({activity:'Career Scroll',scene:jobs[i][0],choice:b.textContent,quality:'career interest response'})}
