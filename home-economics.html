<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Economics | Transition Town</title><style>
:root{font-family:system-ui,Arial;color:#203128;background:#e9f2eb}*{box-sizing:border-box}body{margin:0}header{background:#163c32;color:white;padding:15px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}header a{color:white}h1{font-size:1.4rem;margin:0 auto 0 0}button,a.action{cursor:pointer;border:0;border-radius:13px;padding:13px 17px;font:inherit;font-weight:700;background:#176548;color:white;min-height:48px}button:focus-visible,a:focus-visible{outline:4px solid orange}button.secondary{background:#e4ede6;color:#163c32}main{max-width:1050px;margin:auto;padding:20px}.card{background:white;border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 4px 15px #163c3212}.scene{position:relative;min-height:300px;border-radius:18px;background:linear-gradient(#c9e8ee 0 50%,#c3aa86 50%);overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr);gap:15px;align-items:end;padding:24px}.station{background:#fffef0e8;border:5px solid #8e6c50;border-radius:20px;min-height:135px;color:#163c32;font-size:1.15rem}.station span{display:block;font-size:3rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.item{border:2px solid #dae5df;border-radius:14px;padding:15px}.item span{font-size:2.6rem;display:block}.steps{display:flex;gap:5px}.steps i{height:8px;flex:1;background:#dbe4dc;border-radius:5px}.steps i.done{background:#16845c}.muted{color:#53635a}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#message{font-weight:700;min-height:1.5em}.walk{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:8px;margin:15px}.walk button{font-size:1.4rem}.walk .blank{visibility:hidden}#avatar{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);font-size:2.4rem;filter:drop-shadow(0 2px 2px #333);transition:top .2s,left .2s;pointer-events:none}.hidden{display:none}ul{line-height:1.9}label{display:block;margin:8px 0}input[type=checkbox]{width:22px;height:22px;vertical-align:middle} @media(max-width:550px){.scene{padding:9px;gap:5px;min-height:240px}.station{font-size:.9rem;padding:5px}.station span{font-size:2rem}}
</style></head><body><header><h1>🏠 Home Economics & Life Skills</h1><a href="transition-town.html">← Town</a><a href="grocery-store.html">Existing Grocery Store</a></header><main><div class="card toolbar"><strong>Explore mode:</strong><button id="tapMode" class="secondary">Tap to explore</button><button id="walkMode" class="secondary">Walk around</button><span id="saveStatus" aria-live="polite"></span></div><section class="card"><h2>Welcome to Home Ec</h2><p>Choose a station. All activities are practice only; no student bank money is changed.</p><div class="scene" id="scene"><button class="station" data-room="kitchen"><span>🍳</span>Kitchen</button><button class="station" data-room="laundry"><span>🧺</span>Laundry</button><button class="station" data-room="shopping"><span>🛒</span>Grocery</button><span id="avatar" class="hidden" style="--x:45;--y:58" aria-hidden="true">🧑‍🍳</span></div><div id="walkControls" class="walk hidden"><span class="blank"></span><button data-move="up" aria-label="Move up">↑</button><span class="blank"></span><button data-move="left" aria-label="Move left">←</button><button data-move="enter" aria-label="Enter station">●</button><button data-move="right" aria-label="Move right">→</button><span class="blank"></span><button data-move="down" aria-label="Move down">↓</button></div><p id="message" role="status"></p></section><section class="card" id="activity"><h2>Pick a station to begin!</h2></section></main>
<script>
(()=>{'use strict';const KEY='tt-home-economics-pilot-v1';const ingredients=[{id:'butter',name:'Butter',amount:'3 tablespoons',package:'1 box',price:4.49,icon:'🧈'},{id:'marshmallows',name:'Mini marshmallows',amount:'4 cups',package:'1 bag',price:2.49,icon:'🍬'},{id:'cereal',name:'Rice Krispies cereal',amount:'6 cups',package:'1 box',price:4.29,icon:'🥣'}];const steps=[['🧼','Wash hands','Use soap and water for 20 seconds, rinse and dry.'],['🥄','Get tools','Find a large microwave-safe bowl, measuring cups, tablespoon, spatula and pan.'],['🧈','Measure butter','Measure 3 tablespoons of butter into the bowl.'],['🍬','Measure marshmallows','Measure 4 cups of mini marshmallows.'],['♨️','Melt with adult help','Ask an adult to supervise microwave heating in short intervals, stirring until smooth. The bowl and mixture may be very hot.'],['🥣','Add cereal','Measure 6 cups of cereal and gently stir.'],['🍽️','Press and cool','Transfer to a lightly greased 9×13-inch pan, press gently, let cool and cut.'],['🧽','Clean up','Wash tools, wipe surfaces and put supplies away.']];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=state&&typeof state==='object'?state:{};state.cart=Array.isArray(state.cart)?state.cart.filter(id=>ingredients.some(i=>i.id===id)):[];state.step=Math.max(0,Math.min(steps.length,Number(state.step)||0));state.laundry=Array.isArray(state.laundry)?state.laundry:[];let mode='tap',room='';let pos=1;const el=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));el('saveStatus').textContent='✓ Saved on this device'}catch{el('saveStatus').textContent='Progress cannot be saved in this browser'}};const say=t=>{el('message').textContent=t};const speak=t=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.85;speechSynthesis.speak(u)};const setMode=m=>{mode=m;el('walkControls').classList.toggle('hidden',m!=='walk');el('avatar').classList.toggle('hidden',m!=='walk');el('tapMode').setAttribute('aria-pressed',String(m==='tap'));el('walkMode').setAttribute('aria-pressed',String(m==='walk'));say(m==='walk'?'Use arrows to move and the center button to enter a station.':'Tap any station to explore.')};function enter(r){room=r;if(r==='kitchen')kitchen();if(r==='shopping')shopping();if(r==='laundry')laundry()}function kitchen(){const s=steps[state.step],ready=ingredients.every(i=>state.cart.includes(i.id));el('activity').innerHTML='<h2>🍳 Kitchen · Rice Krispie Treats</h2><p>Recipe: 6 cups cereal + 4 cups mini marshmallows + 3 tablespoons butter. Makes about 12 squares.</p><div class="grid">'+ingredients.map(i=>'<div class="item"><span>'+i.icon+'</span><strong>'+i.name+'</strong><p>'+i.amount+'</p><small>'+(state.cart.includes(i.id)?'✓ In shopping bag':'Not purchased yet')+'</small></div>').join('')+'</div><p><button id="shopNow">🛒 Shop for ingredients</button></p><div class="steps">'+steps.map((_,i)=>'<i class="'+(i<=state.step?'done':'')+'"></i>').join('')+'</div><h3>Step '+(state.step+1)+' of '+steps.length+': '+s[1]+'</h3><p style="font-size:2rem">'+s[0]+'</p><p>'+s[2]+'</p><div class="toolbar"><button id="read">🔊 Read aloud</button><button id="previous" class="secondary">← Back</button><button id="next">'+(state.step===steps.length-1?'Finish lesson':'Next step →')+'</button></div><p class="muted">Practice instructions only. An adult must supervise real food preparation, heat and allergy precautions.</p>';el('shopNow').onclick=()=>enter('shopping');el('read').onclick=()=>speak(s[1]+'. '+s[2]);el('previous').onclick=()=>{state.step=Math.max(0,state.step-1);save();kitchen()};el('next').onclick=()=>{if(!ready&&state.step>=1){say('First collect all three ingredients from the grocery store.');return}if(state.step===steps.length-1){state.step=0;say('🎉 Recipe completed! You can practice again.')}else state.step++;save();kitchen()}}function shopping(){const total=ingredients.filter(i=>state.cart.includes(i.id)).reduce((n,i)=>n+i.price,0);el('activity').innerHTML='<h2>🛒 Home Ec Grocery Practice</h2><p>Use the recipe list to find every ingredient. Prices and checkout are simulated and do not affect Town accounts.</p><div class="grid">'+ingredients.map(i=>'<div class="item"><span>'+i.icon+'</span><strong>'+i.name+'</strong><p>Recipe needs '+i.amount+' · Store sells '+i.package+'</p><p>$'+i.price.toFixed(2)+'</p><button data-add="'+i.id+'">'+(state.cart.includes(i.id)?'✓ In cart':'Add to cart')+'</button></div>').join('')+'</div><h3>Cart total: $'+total.toFixed(2)+'</h3><div class="toolbar"><button id="checkout">Practice checkout and return to kitchen</button><button id="clear" class="secondary">Empty practice cart</button><a href="grocery-store.html">Visit original grocery store ↗</a></div>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(!state.cart.includes(b.dataset.add))state.cart.push(b.dataset.add);save();shopping()});el('clear').onclick=()=>{state.cart=[];save();shopping()};el('checkout').onclick=()=>{if(!ingredients.every(i=>state.cart.includes(i.id))){say('Your shopping list is not complete yet.');return}state.checkedOut=true;save();say('Receipt complete! Back in the kitchen with your ingredients.');enter('kitchen')}}function laundry(){const tasks=[['Sort clothes','Put light and dark clothing into separate piles.'],['Read care labels','Check the washing instructions on clothing.'],['Load washer','Put an appropriate amount of laundry in the washer.'],['Add detergent','Follow the detergent label. Never mix cleaning products.'],['Choose wash settings','Select settings that match the care labels.'],['Dry safely','Check labels and move suitable clothes to the dryer.'],['Fold and put away','Fold clothes and return them to their storage places.']];el('activity').innerHTML='<h2>🧺 Laundry Lab</h2><p>Check each step as you practice. Select the speaker to hear instructions.</p>'+tasks.map((t,i)=>'<div class="item"><label><input type="checkbox" data-task="'+i+'" '+(state.laundry.includes(i)?'checked':'')+'> <strong>'+t[0]+'</strong></label><p>'+t[1]+'</p><button class="secondary" data-read="'+i+'">🔊 Hear step</button></div>').join('')+'<p><button id="resetLaundry" class="secondary">Restart laundry practice</button></p>';document.querySelectorAll('[data-task]').forEach(c=>c.onchange=()=>{const i=Number(c.dataset.task);state.laundry=c.checked?[...new Set([...state.laundry,i])]:state.laundry.filter(x=>x!==i);save()});document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>speak(tasks[Number(b.dataset.read)].join('. ')));el('resetLaundry').onclick=()=>{state.laundry=[];save();laundry()}}document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{if(mode==='tap')enter(b.dataset.room);else{pos=['kitchen','laundry','shopping'].indexOf(b.dataset.room);say('Press the center button to enter '+b.dataset.room)}});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let d=b.dataset.move;if(d==='enter'){enter(['kitchen','laundry','shopping'][pos]);return}if(d==='left'||d==='up')pos=Math.max(0,pos-1);else pos=Math.min(2,pos+1);const avatar=el('avatar');avatar.style.setProperty('--x',String(15+pos*34));avatar.style.setProperty('--y','58');say('Near '+['Kitchen','Laundry','Grocery'][pos]+'. Press the center button to enter.')});el('tapMode').onclick=()=>setMode('tap');el('walkMode').onclick=()=>setMode('walk');setMode('tap');save()})();
</script></body></html>
