<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expanded Resource Library</title><style>body{font-family:Arial,sans-serif;margin:0;background:#fbfafb;color:#25324a}header{background:#102a5c;color:white;text-align:center;padding:24px}main{max-width:1100px;margin:auto;padding:22px}.search{width:100%;padding:14px;font-size:17px;border:2px solid #cbd6e7;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:18px}.r{background:white;border:1px solid #dbe3ee;border-left:6px solid #e1192f;border-radius:12px;padding:14px}.r b{color:#102a5c}.tag{font-size:12px;background:#edf4fc;padding:4px 7px;border-radius:99px;display:inline-block;margin:3px 2px}.r button{border:0;background:#0751bd;color:white;border-radius:8px;padding:8px 10px;font-weight:bold;cursor:pointer;margin-top:8px}.sheet{display:none;background:white;border:1px solid #dbe3ee;border-radius:15px;padding:20px;margin-top:18px}.sheet textarea{width:100%;min-height:75px;margin:6px 0 14px}.back{background:#e1192f!important}@media print{header,.search,.grid,.back{display:none!important}.sheet{display:block!important;border:0}}</style><link rel="stylesheet" href="assets/session.css"></head><body><header><h1>🖨️ Expanded Transition Resource Library</h1><p>Open a resource, complete it digitally, or print it.</p></header><main><input class="search" id="q" placeholder="Search career, money, hygiene, driving, childcare..."><div class="grid" id="grid"></div><section class="sheet" id="sheet"><button class="back" id="back">← Library</button><h2 id="st"></h2><p id="sd"></p><div id="fields"></div><button onclick="window.print()">🖨️ Print</button></section></main><script>
const items=[
['Career Values Inventory','Career','Individual','What matters most to you in a future job?',['List 5 things you want from a job.','Which matters more: pay, schedule, helping others, creativity, stability, or advancement?','Name 3 careers that may match your values.']],
['My Top 3 Careers','Career','30-Minute','Narrow career exploration to three choices.',['Career #1 and why','Career #2 and why','Career #3 and why','What will you research next?']],
['Career Salary vs. Lifestyle','Career','Money','Connect earnings with adult-life expenses.',['Career and expected pay','Housing estimate','Transportation estimate','Food estimate','What did you notice?']],
['Job Shadow Question Sheet','Career','WBL','Prepare questions for a workplace visit.',['What does a normal day look like?','What training is needed?','What is challenging about this job?','What advice would you give a student?']],
['First Job Starter Pack','Job Readiness','Individual','Prepare for applying, interviewing, and starting a first job.',['Where will you apply?','What will you wear to an interview?','How will you get to work?','Who can be a reference?']],
['What To Do When You Are Late','Job Readiness','No-Prep','Practice professional communication and problem solving.',['What should you do first?','What should you tell your supervisor?','How can you prevent it next time?']],
['Cell Phone at Work','Job Readiness','Scenario','Explore appropriate phone use at work.',['When is phone use appropriate?','What could happen if you ignore workplace rules?','Write a personal phone-at-work plan.']],
['Workplace Boundaries','Job Readiness','Social Skills','Recognize professional boundaries.',['Give an example of a healthy boundary.','What can you say when you are uncomfortable?','Who can you ask for help?']],
['Credit vs. Debit','Money','Adulting','Compare common payment methods.',['What is debit?','What is credit?','What can happen if credit is not repaid?','Which would you use for a planned purchase and why?']],
['Emergency Fund Starter','Money','Adulting','Plan for unexpected expenses.',['Name 3 emergencies that cost money.','How much could you save each month?','Where could you keep emergency savings?']],
['Car Ownership Costs','Money','Driving','Look beyond the car payment.',['Estimate payment/purchase cost','Insurance','Fuel','Maintenance/repairs','Total monthly estimate']],
['Subscription Trap','Money','No-Prep','Find recurring expenses that add up.',['List 5 possible subscriptions.','Which are needs vs wants?','What is the monthly total?','What is the yearly total?']],
['Apartment Move-In Checklist','Independent Living','Adulting','Plan what is needed for a first apartment.',['Kitchen items','Bathroom items','Bedroom items','Cleaning supplies','Utilities/services to set up']],
['Household Cleaning Schedule','Independent Living','CDC/Regular','Plan daily and weekly cleaning.',['Daily tasks','Weekly tasks','Monthly tasks','Which task do you need to learn?']],
['Which Cleaning Tool?','Independent Living','CDC/Visual','Match common messes with tools.',['Wet spill →','Dry crumbs →','Dirty dishes →','Full trash →','Dusty table →']],
['Laundry Symbols & Clothing Care','Independent Living','Life Skills','Practice sorting and clothing care.',['What gets washed together?','What should be checked before washing?','What does air dry mean?','How can you prevent shrinking/damage?']],
['Work-Ready Hygiene Checklist','Hygiene','CDC/Regular','Build a routine for arriving clean and prepared.',['Body/skin clean','Teeth brushed','Deodorant used if appropriate','Hair/grooming','Clean clothes','Anything else I need?']],
['Morning Routine Planner','Hygiene','CDC/Visual','Sequence a before-school/work routine.',['Step 1','Step 2','Step 3','Step 4','Step 5']],
['Kitchen Tool Identification','Cooking','CDC/Visual','Identify common kitchen tools and their uses.',['Measuring cup','Measuring spoon','Spatula','Colander','Pot/pan']],
['Recipe Conversion Practice','Cooking','Challenge','Practice doubling and halving simple measurements.',['½ cup doubled =','1 cup halved =','1 Tbsp doubled =','2 tsp halved =']],
['Food Storage & Expiration','Cooking','Safety','Practice safe food-storage decisions.',['What foods need refrigeration?','What should you do with questionable food?','Why label leftovers?']],
['What Went Wrong With This Meal?','Cooking','Game','Reason through cooking and measurement mistakes.',['Too salty: what may have happened?','Too dry: what may have happened?','Too watery: what may have happened?','How would you prevent the mistake?']],
['Personal Space & Greetings','Self-Advocacy','CDC/Visual','Practice respectful greetings and consent.',['Ways I can greet someone','What do I do before a hug?','What do I do if someone says no?']],
['Anger Trigger Plan','Self-Advocacy','Social Skills','Identify triggers and safe responses.',['My trigger','What I notice in my body','A safe action I can take','Who can help me?']],
['Gossip & Rumor Reality Check','Social Skills','No-Prep','Slow down before reacting to secondhand information.',['What do I actually know?','Did I hear it firsthand?','What could happen if I spread it?','What is a calmer next step?']],
['Saying No & Peer Pressure','Self-Advocacy','Scenario','Practice clear refusal and exit strategies.',['Write one way to say no.','Write one way to leave.','Who could you call?']],
['College vs. TCAT vs. Work','Postsecondary','Career','Compare common paths after high school.',['What does each pathway offer?','Which careers need college?','Which careers use technical training?','What do you want to explore?']],
['FAFSA Prep Checklist','Postsecondary','Senior','Prepare questions and information for financial aid.',['Create/confirm StudentAid.gov account','Identify required contributors/information','List colleges/training programs','Write questions for a counselor/financial-aid office']],
['Scholarship Tracker','Postsecondary','Senior','Track scholarship opportunities and deadlines.',['Scholarship name','Deadline','Requirements','Status / next step']],
['Before You Drive Checklist','Driving','Visual','Practice the sequence before moving a vehicle.',['Seat belt','Seat/mirrors','Surrounding area','Brake/start','Signal/check before moving']],
['Dashboard Warning Lights','Driving','Safety','Build awareness of common vehicle warnings.',['Name a warning light you recognize.','What should you do if you do not understand a warning?','Why should warning lights not be ignored?']],
['Safe Ride Backup Plan','Driving','Adulting','Plan alternatives when a ride becomes unsafe.',['Who can I call?','What safe transportation options exist?','What would make me refuse a ride?']],
['Childcare Career Interest','Childcare','Career','Explore fit with early-childhood work.',['Which age group interests you?','What do you think childcare workers do all day?','What skills would you need?','What childcare career will you research?']],
['Childcare Daily Routine','Childcare','Simulation','Think through a childcare workday.',['Arrival/check-in','Play/learning activity','Meal/snack routine','Cleanup','Family communication']],
['Childcare Safety Scan','Childcare','Visual','Practice spotting potential hazards.',['What could be a choking hazard?','What could cause a fall?','What needs adult supervision?','Who should you tell about a hazard?']],
['Childcare Activity Planner','Childcare','Project','Plan a simple age-appropriate activity.',['Age group','Activity goal','Materials','Steps','Safety/supervision plan','Cleanup plan']],
['30-Minute Session Planner','Staff Tool','Staff','Plan one focused transition session.',['Student/service area','Objective','One activity','Student response/progress','Next-session plan']],
['Student Interest Tracker','Staff Tool','Staff','Track careers and activities a student responds to.',['Interested careers','Maybe careers','Not interested','Preferred hands-on activities','Next exploration target']]
];const grid=document.getElementById('grid'),q=document.getElementById('q'),sheet=document.getElementById('sheet');function draw(filter=''){grid.innerHTML='';items.filter(x=>x.join(' ').toLowerCase().includes(filter.toLowerCase())).forEach((x,idx)=>{let d=document.createElement('div');d.className='r';d.innerHTML=`<b>${x[0]}</b><p>${x[3]}</p><span class="tag">${x[1]}</span><span class="tag">${x[2]}</span><br><button>OPEN / PRINT</button>`;d.querySelector('button').onclick=()=>openItem(x);grid.appendChild(d)})}function openItem(x){grid.style.display='none';q.style.display='none';sheet.style.display='block';document.getElementById('st').textContent=x[0];document.getElementById('sd').textContent=x[3];document.getElementById('fields').innerHTML=x[4].map(f=>`<label><strong>${f}</strong></label><textarea></textarea>`).join('');window.scrollTo(0,0)}document.getElementById('back').onclick=()=>{sheet.style.display='none';grid.style.display='grid';q.style.display='block'};q.oninput=()=>draw(q.value);draw();</script><script src="assets/session.js"></script></body></html>
