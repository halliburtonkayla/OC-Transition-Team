<style>:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--pink:#ef4a9a;--paper:#f7f9fd;--ink:#25324a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#fff7fb);color:var(--ink)}header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}header a{color:white;text-decoration:none;font-weight:800}.wrap{max-width:980px;margin:auto;padding:20px}.hero{text-align:center}.hero h1{font:900 42px Georgia,serif;color:var(--navy);margin:10px}.episodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.episode{border:0;border-radius:18px;padding:20px;text-align:left;background:white;box-shadow:0 8px 25px #102a5c18;cursor:pointer}.episode b{display:block;font-size:21px;color:var(--navy);margin:8px 0}.book{display:none;perspective:1400px}.page{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 18px 50px #102a5c2b;transform-origin:left center;animation:turn .48s ease}.sceneArt{min-height:300px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:white;font-size:90px;background:linear-gradient(135deg,#193b77,#e1192f)}.sceneArt.party{background:linear-gradient(135deg,#132b55,#8338ec)}.sceneArt.school{background:linear-gradient(135deg,#0751bd,#59a5ff)}.sceneArt.home{background:linear-gradient(135deg,#7a4b2b,#f0a45d)}.sceneArt.work{background:linear-gradient(135deg,#155e75,#22a6b3)}.story{padding:24px}.story h2{font:900 30px Georgia,serif;color:var(--navy);margin:0 0 10px}.story p{font-size:19px;line-height:1.55}.choices{display:grid;gap:10px;margin-top:18px}.choice,.speak,.back{border:0;border-radius:14px;padding:15px 16px;font-weight:900;font-size:16px;cursor:pointer}.choice{background:var(--blue);color:white;text-align:left}.choice:nth-child(2){background:var(--red)}.choice:nth-child(3){background:#6f42c1}.choice:nth-child(4){background:#198754}.speak{background:#17233d;color:white}.back{background:#e9eef7;color:var(--navy)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.progress{font-weight:800;color:#66758a;margin:8px 0}.ending{background:#fff6cf;border:2px solid #f1ce55;border-radius:14px;padding:14px}.hidden{display:none}@keyframes turn{0%{transform:rotateY(-12deg);opacity:.35}100%{transform:rotateY(0);opacity:1}}@media(max-width:600px){.sceneArt{min-height:220px;font-size:70px}.story{padding:18px}.story p{font-size:17px}.hero h1{font-size:34px}}</style><link rel="stylesheet" href="session.css"></head><body>

<script>function friendlySpeak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices();
  const en=voices.filter(v=>/^en(-|_)/i.test(v.lang||''));
  const preferred=['Ava','Samantha','Zoe','Aria','Jenny','Emma','Joanna','Allison','Serena','Tessa','Victoria','Karen','Moira','Fiona','Siri Female'];
  let voice=preferred.map(n=>en.find(v=>(v.name||'').toLowerCase().includes(n.toLowerCase()))).find(Boolean);
  if(!voice) voice=en.find(v=>/female|woman|girl|natural|premium|enhanced/i.test(v.name||''));
  if(!voice) voice=en[0]||voices[0];
  if(voice) u.voice=voice;
  u.rate=1.03; u.pitch=1.12; u.volume=1;
  speechSynthesis.speak(u);
}

const S={
party:{title:'The After-Party',nodes:{start:{art:'🏀 🎉',cls:'party',h:'Friday Night — After the Game',t:'The basketball game just ended. Your friends are excited and someone says there is an after-party nearby. You arrive and everything feels fun: music is pumping, food is out, people are laughing, and drinks are being passed around. A friend walks over with a cup and asks, “You want one?”',c:[['Take the drink','drink'],['No thanks — I’ll get punch','sober'],['I’m driving tonight — I’m good','driver']]},drink:{art:'🥤 😵',cls:'party',h:'Later That Night',t:'One drink turned into several. You feel dizzy and sick. Suddenly you hear yelling. Someone has fallen and may be hurt. A friend says, “Don’t call anybody. We’ll all get in trouble.”',c:[['Call 911 / get help','help'],['Find a sober trusted person','help'],['Leave and say nothing','leave']]},sober:{art:'🔑 🚗',cls:'party',h:'Your Friend Wants the Keys',t:'You stayed sober. Now your friend is clearly impaired and says, “I’m fine. Give me my keys.” They are getting angry and insisting they can drive.',c:[['Give them the keys','keys'],['Keep the keys and find a safe ride','safe'],['Get a trusted adult to help','safe']]},driver:{art:'🚙 👥',cls:'party',h:'Everybody Needs a Ride',t:'Because you said you were driving, three friends now want rides. One person is sick and another wants you to take more people than your car safely holds.',c:[['Pack everybody in','crowd'],['Only take the number of safe seats','safe'],['Get more safe drivers or rides','safe']]},help:{art:'🚑 ❤️',cls:'party',h:'You Got Help',t:'Emergency help is called and the injured person is not left alone. You may still have difficult conversations about what happened, but getting help mattered.',end:'Getting help in an emergency is more important than avoiding embarrassment or trouble.'},leave:{art:'📞 🚓',cls:'party',h:'The Problem Did Not Disappear',t:'You went home, but emergency services were eventually called. The next day you are asked what you witnessed. Avoiding the situation did not erase it.',end:'Leaving a serious situation does not necessarily remove your responsibility to tell the truth or help someone get care.'},keys:{art:'🚗 ⚠️',cls:'party',h:'A Dangerous Decision',t:'Your friend drives away impaired. Even if nothing happens immediately, the decision put your friend, passengers, and other people on the road at risk.',end:'A safer choice is to prevent impaired driving and involve a sober, trusted person when needed.'},crowd:{art:'🚙 ⚠️',cls:'party',h:'Too Many People',t:'There are not enough seat belts for everyone. The ride becomes distracting and unsafe.',end:'Being the designated driver also means setting limits and making sure every passenger can ride safely.'},safe:{art:'🏠 ✅',cls:'party',h:'Everyone Gets Home Safely',t:'You set a boundary, arrange safe transportation, and make sure nobody drives impaired.',end:'Good judgment sometimes means disappointing a friend for a few minutes to protect everyone for much longer.'}}},
bully:{title:'It Was Just a Joke…',nodes:{start:{art:'🎒 📱',cls:'school',h:'Before the Bell',t:'Your friends start making fun of Jordan’s clothes and the way Jordan talks. Someone pulls out a phone and says, “We should post this. Everybody would die laughing.”',c:[['Join in','join'],['Record and post it','post'],['Tell them to stop','stop']]},join:{art:'😂 😟',cls:'school',h:'Jordan Heard You',t:'You did not start the joke, but you laughed and added comments. Later Jordan asks, “Why were you laughing at me too? I thought we were cool.”',c:[['Say it was only a joke','blame'],['Own it and apologize','repair'],['Avoid Jordan','avoid']]},post:{art:'📲 🔥',cls:'school',h:'It Is Spreading',t:'The video is getting views and comments. Then Jordan gets tagged and sees it. People are now adding harsher comments you never expected.',c:[['Delete it and tell people to stop sharing','repair'],['Leave it up','consequence'],['Blame the friend who suggested it','blame']]},stop:{art:'✋ 🤝',cls:'school',h:'You Changed the Moment',t:'Your friends roll their eyes, but you refuse to participate. You check on Jordan later instead of helping the joke spread.',end:'You cannot control everyone, but you can choose whether your attention helps bullying grow.'},repair:{art:'💬 ❤️',cls:'school',h:'Trying to Repair It',t:'You apologize and take responsibility. Jordan says, “I appreciate that, but I’m still mad. Give me some space.”',c:[['Give Jordan space and change your behavior','goodrepair'],['Demand forgiveness','badrepair'],['Tell people Jordan is dramatic','consequence']]},avoid:{art:'🚪 😔',cls:'school',h:'Avoiding It',t:'You avoid Jordan, but the tension is still there and the situation has not been repaired.',end:'Not starting the bullying does not mean your participation had no effect.'},blame:{art:'👉 😬',cls:'school',h:'Passing the Blame',t:'You focus on what everyone else did instead of your own part. The conflict continues because nobody is taking responsibility.',end:'Accountability means being truthful about your own actions even when other people also made poor choices.'},consequence:{art:'🏫 🗣️',cls:'school',h:'There Are Consequences',t:'A teacher and administrator become involved. Jordan is upset, families are contacted, and you are asked directly what you did.',end:'Online actions can become school and real-life problems very quickly.'},goodrepair:{art:'🌱 🤝',cls:'school',h:'Change Takes Time',t:'You give Jordan space and stop participating in the behavior. You cannot force forgiveness, but you can show change through what you do next.',end:'An apology matters most when your behavior changes afterward.'},badrepair:{art:'😠 💬',cls:'school',h:'An Apology Is Not a Demand',t:'Jordan becomes more upset because the apology now feels like pressure to make you feel better.',end:'The person who was hurt gets to decide when—or whether—they are ready to forgive.'}}},
drama:{title:'The Drama',nodes:{start:{art:'🤫 📱',cls:'school',h:'It Starts Here',t:'At lunch, your friend tells you a private story about another student and says, “You cannot tell anybody.” Before the next class, another friend asks why you look shocked.',c:[['Keep the secret','quiet'],['Tell just one friend','one'],['Post a vague hint online','post']]},one:{art:'💬 ➡️ 💬',cls:'school',h:'Now It Is Spreading',t:'The friend you told says they will not repeat it. By the end of the day, three people text you asking whether the rumor is true. One version now includes details you never even said.',c:[['Tell everyone to stop repeating it','repair'],['Add more details','worse'],['Pretend you know nothing','deny']]},post:{art:'📱 👀',cls:'school',h:'Everybody Wants the Tea',t:'Your vague post makes people curious. Screenshots spread and classmates start guessing who you meant. The student realizes the posts are about them.',c:[['Delete it and own what you did','repair'],['Keep posting','worse'],['Blame someone else','deny']]},quiet:{art:'🤐 ✅',cls:'school',h:'The Story Stops With You',t:'You do not repeat the private information. When someone asks, you say it is not your story to tell.',end:'Not every piece of information you hear needs an audience.'},repair:{art:'🧹 💬',cls:'school',h:'Cleaning Up the Mess',t:'You tell people you should not have repeated it, stop adding details, remove what you posted, and apologize directly without demanding forgiveness.',end:'You cannot always pull a rumor back, but you can stop feeding it and take responsibility for your part.'},worse:{art:'🔥 📲',cls:'school',h:'The Drama Gets Bigger',t:'More people join in. The story changes, screenshots spread, feelings are hurt, and a teacher now wants to speak with everyone involved.',end:'Drama grows when attention rewards it. Adding details can cause harm even when you call it entertainment.'},deny:{art:'🙈 🗣️',cls:'school',h:'People Have Screenshots',t:'You deny being involved, but messages and screenshots show what happened. Now the original problem also includes dishonesty.',end:'Trying to escape drama by denying your own actions can create a second problem.'}}},
values:{title:'Between Two Worlds',nodes:{start:{art:'🏠 🧭 👥',cls:'home',h:'That Is How I Was Raised',t:'Your family has conservative expectations about parties, dating, drinking, curfews, clothing, and how you carry yourself. Your friends do not live by all the same rules. Tonight they invite you somewhere your family probably would not approve of.',c:[['Go with my friends','friends'],['Do what my family expects','family'],['Think about what I believe first','self']]},friends:{art:'🎉 🧠',cls:'party',h:'Now You Have Your Own Choices',t:'You go. Your friends assume that because you came, you will do everything they are doing. But attending does not require you to abandon every boundary you have.',c:[['Do whatever the group does','pressure'],['Set my own limits','own'],['Leave when I feel uncomfortable','own']]},family:{art:'🏠 💭',cls:'home',h:'You Stayed Home',t:'You followed the rule, but later you wonder: “Do I personally believe this, or am I only afraid of disappointing my family?”',c:[['Talk with my family about why the rule matters','own'],['Never question anything','reflect'],['Secretly do the opposite next time','pressure']]},self:{art:'🧭 💬',cls:'home',h:'Whose Values Are These?',t:'You think about safety, your family’s reasons, your friends’ opinions, and the kind of person you want to become. You realize growing up means learning to make choices you can explain and live with.',c:[['Talk openly with my family','own'],['Listen to friends but set my boundaries','own'],['Lie to both sides','pressure']]},own:{art:'🌅 🧭',cls:'home',h:'Finding Your Own Path',t:'You listen to people you care about without handing them complete control of your decisions. You choose boundaries you can explain and adjust as you mature.',end:'Independence is not automatically doing the opposite of your family—or automatically copying your friends. It includes thinking about your values, safety, consequences, and goals.'},pressure:{art:'🌪️ 😕',cls:'party',h:'Someone Else Is Steering',t:'You make the choice mainly to avoid disappointing someone else. Later, you realize you still have not decided what you actually believe.',end:'Peer pressure can come from friends, family, or any group. Growing independence includes learning to think through your own choices.'},reflect:{art:'🪞 💭',cls:'home',h:'Rules Without Reflection',t:'Following expectations can keep things simple, but you may eventually need to understand why those values matter to you personally.',end:'As you approach adulthood, it can be useful to understand the reasons behind your values—not only the rules themselves.'}}}}

let ep=null,node='start',steps=1;const menu=document.querySelector('#menu'),book=document.querySelector('#book'),page=document.querySelector('#page');
function start(k){ep=k;node='start';steps=1;menu.style.display='none';book.style.display='block';render()}
function render(){const n=S[ep].nodes[node];page.classList.remove('page');void page.offsetWidth;page.classList.add('page');let choices=n.c?`<div class="choices">${n.c.map((x,i)=>`<button class="choice" onclick="go('${x[1]}')">${String.fromCharCode(65+i)} — ${x[0]}</button>`).join('')}</div>`:'';let end=n.end?`<div class="ending"><b>YOUR STORY:</b> ${n.end}</div><div class="choices"><button class="choice" onclick="start('${ep}')">🔄 Try a Different Path</button><button class="back" onclick="home()">📚 Choose Another Story</button></div>`:'';page.innerHTML=`<div class="sceneArt ${n.cls||''}">${n.art}</div><div class="story"><div class="progress">${S[ep].title} • Page ${steps}</div><h2>${n.h}</h2><p id="storytext">${n.t}</p><div class="tools"><button class="speak" onclick="speak()">🔊 Read to Me</button><button class="back" onclick="home()">← Story Library</button></div>${choices}${end}</div>`;scrollTo({top:0,behavior:'smooth'})}
function go(n){node=n;steps++;render()}function home(){speechSynthesis.cancel();book.style.display='none';menu.style.display='block';scrollTo({top:0,behavior:'smooth'})}function speak(){friendlySpeak(document.querySelector('#storytext').innerText)}
