k. He expected to finish in five minutes.", "He clicked the button. Nothing happened. He changed the code. Still nothing. He changed three more things. Now two other things were broken too.", "Nick looked over. 'You good?' Dalton stared at the screen. 'Absolutely not.'", "Clark suggested checking the instructions again. Jayden suggested testing one change at a time instead of changing everything at once.", "Dalton went back to the last version that worked. Then he checked the button carefully and found one tiny mistake in the code.", "He fixed it and clicked again. The button worked. Dalton celebrated like he'd just won a championship.", "Then his supervisor gave him another problem. Dalton groaned\u2014but this time he knew what to do first.", "He read the problem, tested it, asked a question when he got stuck, and kept track of what he changed.", "Dalton realized coding wasn't about never making mistakes. A big part of the job was figuring out WHY something wasn't working.", "TAKEAWAY: Technology careers require patience, problem-solving, testing, and asking for help. Mistakes are often part of finding the solution."];let p=0;function render(){document.getElementById('storyText').textContent=pages[p];document.getElementById('pageNo').textContent='Page '+(p+1)+' of '+pages.length;}function next(){if(p<pages.length-1){p++;render()}else location.href='../index.html'}function prev(){if(p>0){p--;render()}}render();</script></body></html>
