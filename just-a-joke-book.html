<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>It Was Just a Joke… | Transition Team</title><style>:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--paper:#fffdf7;--ink:#172033}*{box-sizing:border-box}body{margin:0;background:#e9edf5;font-family:Arial,sans-serif;color:var(--ink)}nav{background:var(--navy);padding:14px 18px}nav a{color:#fff;text-decoration:none;font-weight:800}main{max-width:980px;margin:auto;padding:24px}.cover,.book{background:var(--paper);border-radius:22px;box-shadow:0 15px 45px #102a5c25;overflow:hidden}.cover{padding:52px 34px;text-align:center;background:linear-gradient(145deg,#fffdf7,#edf3ff)}h1,h2{font-family:Georgia,serif;color:var(--navy)}h1{font-size:clamp(2.4rem,7vw,4.5rem);margin:10px}.sub{font-size:1.15rem;line-height:1.6;max-width:680px;margin:15px auto}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:25px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer;background:var(--navy);color:white}.btn.alt{background:#e7edf8;color:var(--navy)}.page{min-height:560px;padding:42px clamp(22px,6vw,70px)}.chapter{font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}.page h2{font-size:2.2rem}.page p{font-family:Georgia,serif;font-size:1.22rem;line-height:1.75}.dialogue{border-left:5px solid var(--blue);background:#f4f7fc;padding:18px 20px;margin:22px 0;border-radius:0 14px 14px 0}.voice-tag{display:inline-block;font-size:.75rem;border-radius:999px;padding:5px 9px;background:#dde8ff;color:#17376f;font-weight:900}.choicebox{margin-top:28px;padding:22px;background:#eef4ff;border-radius:16px}.choice{display:block;width:100%;text-align:left;margin:9px 0;border:2px solid #c6d4ee;background:white;padding:13px;border-radius:10px;font-weight:700;cursor:pointer}.feedback{font-weight:800;margin-top:12px}.lesson{background:#fff3d8;border:1px solid #e6c66c;padding:16px;border-radius:14px;margin:24px 0;font-weight:700;line-height:1.5}.footer{display:flex;justify-content:space-between;gap:10px;padding:18px 24px;background:#f3f6fb}.counter{align-self:center;font-weight:800;color:#53627c}@media(max-width:600px){main{padding:12px}.page{min-height:620px;padding:30px 20px}.page p{font-size:1.12rem}}</style></head><body><nav><a href="stories.html">← Interactive Stories</a></nav><main><section class="cover" id="cover"><div class="chapter">Self-Advocacy / Workplace Readiness</div><h1>It Was Just a Joke…</h1><p class="sub">A mature digital-citizenship story about group chats, bullying, accountability, and repairing harm.</p><div class="controls"><button class="btn" onclick="start(true)">🔊 Read to Me</button><button class="btn alt" onclick="start(false)">Read Myself</button></div><p><b>Multiple character voices + narrator</b></p></section><section class="book" id="book" style="display:none"><div id="page"></div><div class="footer"><button class="btn alt" onclick="prev()">← Previous</button><span class="counter" id="count"></span><button class="btn" onclick="next()">Next →</button></div></section></main><script>const pages=[["The Group Chat",[["n","A class group chat starts making fun of a student's presentation. You react with a laughing emoji because everyone else seems to be doing it."],["a","Look at this picture somebody made. I'm posting it."],["n","The joke is starting to turn into public embarrassment."]],["Share the edited picture too.","Remove your reaction and stop participating.","Add another joke so nobody thinks you're sensitive."],1,"Online actions count even when they take only one tap."],["It Gets Meaner",[["n","The edited picture starts circulating. A few students are piling on, but others have gone quiet."],["a","Relax. It's just a joke."],["n","Calling something a joke does not erase its impact."]],["Tell the group it has gone too far.","Keep watching without saying anything.","Post it somewhere else."],0,"Speaking up can interrupt a group dynamic and give other people permission to stop too."],["A Private Message",[["n","The student messages you privately."],["s","I saw the chat. I don't even want to come to school tomorrow."],["n","Now you know directly that the situation caused harm."]],["Tell them they are too sensitive.","Apologize for your part and ask how you can help.","Pretend you never saw the message."],1,"A real apology names your own behavior without excuses."],["Accountability",[["n","You admit what you did, help report the edited image, and ask people to stop sharing it."],["s","I appreciate you admitting it. I'm still upset, but thank you for helping get it down."],["n","Taking responsibility does not instantly repair trust, but it is the beginning of repair."]],null,null,"Skills practiced: digital citizenship • empathy • accountability • speaking up • repairing harm"]];pages.splice(pages.length-1,0,...[["The Screenshot Keeps Moving",[["n","Even after the original post is deleted, screenshots keep appearing in other chats."],["s","People I don't even know are sending it to me now."],["n","You cannot erase every copy, but you can decide whether you help the spread continue."]],["Forward it while telling people to stop.","Ask people to delete it and report reposts without resharing the image.","Do nothing because you already apologized."],1,"Repair often takes more than one apology. It can require action to reduce further harm."],["When Your Friend Pushes Back",[["a","Why are you acting like this is some huge deal? You're making everybody uncomfortable."],["n","Speaking up may create tension with friends who do not want to admit the joke went too far."]],["Back down so nobody is annoyed with you.","Say calmly that you participated too, but you are not continuing it.","Start insulting your friend instead."],1,"Accountability does not require attacking someone else. You can own your part and set a boundary."],["A Conversation at School",[["n","The next day, a teacher asks to speak with several students involved in the chat."],["s","I don't want everybody punished. I just want this to stop."],["n","You are asked what happened."]],["Tell the truth about your own actions without minimizing them.","Blame everything on the person who made the first image.","Delete messages and pretend you were never involved."],0,"Being truthful about your own role is part of repairing harm."],["Trust Takes Time",[["n","A week later, the student is back in class and participating again, but things are still awkward."],["s","I appreciate that you helped get the posts down. I'm not ready to joke around with everybody like nothing happened."],["n","You understand that an apology does not create a deadline for someone else's forgiveness."]],null,null,"Skills practiced: digital responsibility • accountability • empathy • speaking up • accepting that trust may take time to rebuild"]]);let i=0,auto=false;function lab(k){return k==='n'?'Narrator':({m:'Marcus',a:'Friend',s:'Student',f:'Family',r:'Friend',y:'You'}[k]||'Character')}function voices(k){let v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));if(!v.length)v=speechSynthesis.getVoices();let male=/male|david|daniel|alex|aaron|fred/i,female=/samantha|victoria|zira|ava|allison|female/i;if(['m','r','y'].includes(k))return v.find(x=>male.test(x.name))||v[0];if(['a','s','f'].includes(k))return v.find(x=>female.test(x.name))||v[v.length-1];return v.find(x=>/samantha|ava|allison|narrator/i.test(x.name))||v[0]}function render(){speechSynthesis.cancel();let p=pages[i],h='<article class="page"><div class="chapter">It Was Just a Joke…</div><h2>'+p[0]+'</h2>';p[1].forEach(x=>h+=(x[0]==='n'?'<div>':'<div class="dialogue">')+'<span class="voice-tag">'+lab(x[0])+'</span><p>'+x[1]+'</p></div>');if(p[2]){h+='<div class="choicebox"><h3>What would you do?</h3>';p[2].forEach((x,z)=>h+='<button class="choice" onclick="ans('+z+','+p[3]+')">'+String.fromCharCode(65+z)+' — '+x+'</button>');h+='<div class="feedback" id="fb"></div></div>'}if(p[4])h+='<div class="lesson">'+p[4]+'</div>';h+='</article>';document.getElementById('page').innerHTML=h;document.getElementById('count').textContent='Page '+(i+1)+' of '+pages.length;if(auto)setTimeout(read,250)}function ans(a,b){document.getElementById('fb').textContent=a===b?'✓ Strong choice. Think about why this protects your goals, safety, or relationships.':'Think it through again. What consequence could this choice create?'}function read(){speechSynthesis.cancel();let q=0,p=pages[i][1];function go(){if(q>=p.length)return;let x=p[q++],u=new SpeechSynthesisUtterance(x[1]);u.voice=voices(x[0]);u.rate=x[0]==='n'?.94:1;u.onend=go;speechSynthesis.speak(u)}go()}function start(r){auto=r;document.getElementById('cover').style.display='none';document.getElementById('book').style.display='block';render()}function next(){if(i<pages.length-1){i++;render()}else location.href='stories.html'}function prev(){if(i>0){i--;render()}}</script><script src="session.js"></script></body></html>
