 games, color pictures, and hang out with cute kids. Then their pretend first shift began.", "Aubrey wanted help finding the purple marker. Noah needed his pretend backpack. Jacob's shoe had come untied. Everybody needed something at the exact same time.", "Gia started helping Jacob while Jasmine searched for Noah's backpack. Then they noticed Adon heading toward something he definitely was not supposed to climb.", "'Adon, feet on the floor please,' Jasmine called, moving closer. Gia realized immediately that watching children meant paying attention even while doing another task.", "Aubrey asked another question. Noah found his backpack under a chair. Jacob was ready to play. For about ten seconds, everything was peaceful.", "Then the group needed a bathroom break. Jasmine counted everyone while Gia checked that nobody wandered away from the group.", "They divided the jobs instead of both trying to do everything. Jasmine supervised the activity area while Gia handled supplies and helped anyone who needed assistance.", "By snack time, the room was calm. Jasmine said, 'Okay, this is definitely more than playing with kids.' Gia laughed. 'A LOT more.'", "They realized good childcare workers plan ahead, communicate, stay patient, and put safety before convenience.", "TAKEAWAY: Childcare can be fun, but caring for children is a real responsibility. Safety, patience, teamwork, and supervision come first."];let p=0;function render(){document.getElementById('storyText').textContent=pages[p];document.getElementById('pageNo').textContent='Page '+(p+1)+' of '+pages.length;}function next(){if(p<pages.length-1){p++;render()}else location.href='../index.html'}function prev(){if(p>0){p--;render()}}render();</script></body></html>
