<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Transition Town Grocery Employee Center</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#17251d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#124c36;color:#fff;padding:14px max(14px,env(safe-area-inset-right)) 14px max(14px,env(safe-area-inset-left));display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top b{font-size:22px;margin-right:auto}.btn{border:0;border-radius:13px;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer}.gold{background:#f6c64f}.green{background:#187b4c;color:#fff}.white{background:#fff;color:#173d2c}.red{background:#a52d2d;color:#fff}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #0002}.hero img{display:block;width:100%}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.job{border:2px solid #d8d1c1;border-radius:16px;padding:16px}.badge{display:inline-block;background:#e7f2e9;border-radius:999px;padding:6px 10px;font-weight:900}.task{width:100%;text-align:left;margin:7px 0;background:#fff;border:2px solid #d8d1c1;border-radius:13px;padding:14px;font-size:16px}.note{background:#fff5cd;border:1px solid #e5c451;border-radius:14px;padding:14px}.good{background:#e8f7eb;border:1px solid #85bd8f;border-radius:14px;padding:14px}.muted{color:#66736c}.score{font-size:34px;font-weight:900}.shiftclocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.clockbox{background:#173d2c;color:#fff;border-radius:15px;padding:13px;text-align:center}.clockbox b{display:block;font-size:25px}.clockbox small{display:block;opacity:.8;margin-bottom:4px}@media(max-width:460px){.shiftclocks{grid-template-columns:1fr}.clockbox b{font-size:22px}}.hidden{display:none}.pinpad{display:grid;grid-template-columns:repeat(3,minmax(64px,92px));gap:10px;justify-content:center;margin:16px auto}.pinpad button{min-height:58px;font-size:22px;font-weight:900;border:2px solid #d8d1c1;border-radius:14px;background:#fff}.pinread{font-size:28px;letter-spacing:10px;text-align:center;font-weight:900;padding:12px;background:#f3f3f0;border-radius:12px}.belt{background:#39423e;border-radius:16px;padding:14px;color:#fff;margin:12px 0}.itemrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #ffffff33}.registerTotal{font-size:28px;font-weight:900}.drawer{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:8px}.cash{min-height:58px;border:2px solid #c8b78d;border-radius:12px;background:#fff8dc;font-weight:900;font-size:17px}.progress{height:10px;background:#e5e1d7;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#187b4c}.aisleimg{width:100%;display:block;border-radius:16px;margin:10px 0}.shelfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.shelfbtn{border:2px solid #d8d1c1;border-radius:13px;background:#fff;padding:13px;font-weight:800;min-height:62px}.shelfbtn:focus,.shelfbtn:focus-visible,.shelfbtn:active{outline:none;border:2px solid #d8d1c1;background:#fff;-webkit-tap-highlight-color:transparent}.slowmode .shelfgrid{grid-template-columns:1fr}.slowmode .shelfbtn{font-size:18px;min-height:72px}@media(max-width:600px){.wrap{padding:9px}.top b{width:100%;font-size:20px}.btn{padding:11px 13px}.card{padding:14px}}
.bagdemo{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.groceryitem{border:2px solid #d8d1c1;border-radius:14px;background:#fff;padding:12px;text-align:center;font-weight:800;min-height:80px}.bagzone{border:3px dashed #b89b58;border-radius:16px;background:#fff9e8;padding:16px;min-height:110px;text-align:center}.bagzone b{font-size:20px}.audioBtn{background:#173d2c;color:#fff;border:0;border-radius:999px;padding:10px 15px;font-weight:900;font-size:16px}.bagpic{font-size:42px;display:block;margin-bottom:5px}</style></head><body>
<header class="top"><b>Grocery Employee Center</b><button class="btn gold" onclick="location.href='grocery-store.html'">← Grocery Store</button><button class="btn white" onclick="location.href='transition-town.html'">Town Map</button></header>
<main class="wrap"><div id="app"></div></main>
<script>
const app=document.getElementById('app');
function employeeName(){return localStorage.ttCurrent||sessionStorage.ttCurrent||'Guest'}
function world(){try{return JSON.parse(localStorage.ttWorld||'{}')||{}}catch(e){return {}}}
function save(w){localStorage.ttWorld=JSON.stringify(w)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+Number(n||0).toFixed(2)}
function isKayla(){return /kayla/i.test(employeeName())||new URLSearchParams(location.search).get('manager')==='1'}
function resident(w){w.residents=w.residents||{};return w.residents[employeeName()]||null}
function employment(w){let r=resident(w);return r&&r.employment&&r.employment.grocery||null}
function profileName(){let n=employeeName();return /kayla/i.test(n)?'Miss Kayla':n}
function pinFor(n){let w=world(),r=resident(w);if(r&&r.groceryPin)return String(r.groceryPin);let base=0;for(let i=0;i<n.length;i++)base=(base+n.charCodeAt(i)*(i+7))%9000;return String(1000+base).slice(-4)}
function ensurePin(){let w=world(),r=resident(w);if(!r)return pinFor(employeeName());r.groceryPin=r.groceryPin||pinFor(employeeName());save(w);return String(r.groceryPin)}
function landing(){
 let w=world(),e=employment(w),teacher=isKayla(),access=teacher||e&&e.active!==false;
 app.innerHTML='<div class="hero"><img src="00-grocery-store-entrance-now-hiring.png" alt="Transition Town Grocery"></div><section class="card"><span class="badge">'+(teacher?'MANAGER / TEST MODE':access?'EMPLOYEE':'EMPLOYEE CENTER')+'</span><h1>Welcome, '+esc(profileName())+'</h1>'+
 (teacher?'<p>Preview the complete employee process: Training → Time Clock → Work Shift.</p><div class="grid"><div class="job"><h2>Cashier</h2><p>Training, PIN clock-in, register, customers, payments and cash handling.</p><button class="btn green" onclick="trainingHome(\'Cashier\',true)">Cashier Employee Mode</button></div><div class="job"><h2>Stocker</h2><p>Training, PIN clock-in, aisle assignments, stocking, facing and zoning.</p><button class="btn green" onclick="trainingHome(\'Stocker\',true)">Stocker Employee Mode</button></div><div class="job"><h2>Bagger / Carryout</h2><p>Audible training, grocery separation, bagging practice and carryout work.</p><button class="btn green" onclick="trainingHome(\'Bagger\',true)">Bagger / Carryout Mode</button></div></div>':
 access?'<h2>'+esc(e.position||'Grocery Employee')+'</h2><p><b>Wage:</b> '+money(e.wage||12)+'/hour</p><p><b>Scheduled shift:</b> 8:00 AM – 4:00 PM</p><p><b>Employee PIN:</b> '+esc(ensurePin())+'</p><button class="btn green" onclick="trainingHome(\''+(/bag|carry/i.test(e.position||'')?'Bagger':/stocker|produce/i.test(e.position||'')?'Stocker':'Cashier')+'\',false)">Employee Portal</button>':
 '<div class="note"><b>Employee Mode is locked.</b><p>You must apply at Transition Town Grocery and be hired by Miss Kayla before you can clock in.</p></div>')+'</section>';window.scrollTo(0,0)
}
const trainingTasks={
Cashier:[
['A customer brings items to your register. What should you do first?',['Scan one item at a time and watch the register','Guess the total','Bag everything before scanning'],0],
['An item scans twice by mistake. What should you do?',['Ignore it','Correct the duplicate before payment','Charge the customer twice'],1],
['A customer says the shelf price was lower. What is the best response?',['Argue with them','Politely verify the price or ask a supervisor','Tell them to leave'],1],
['The total is $13.25 and the customer gives you $20. What change is due?',['$6.75','$7.75','$5.75'],0],
['A customer card is declined. What should you do?',['Announce it loudly','Stay discreet and ask for another payment method','Take the groceries away immediately'],1],
['Your replacement has not arrived and your shift is ending. What should you do?',['Leave the register unattended','Tell the supervisor before leaving','Clock out without saying anything'],1],
['The total is $7.62 and the customer gives you $10. What change is due?',['$2.38','$3.38','$2.48'],0],
['Which bills make $16 using the fewest bills?',['$10 + $5 + $1','Sixteen $1 bills','$5 + $5 + six $1 bills'],0],
['How many quarters make $1.00?',['2','4','5'],1],
['A customer needs 65 cents in change. Which is correct?',['2 quarters, 1 dime, 1 nickel','1 quarter, 4 dimes','6 dimes, 1 penny'],0],
['Before accepting a large cash bill, what should you do?',['Follow store procedure and check it as trained','Put it straight in your pocket','Refuse every large bill'],0],
['When should the cash drawer be left open?',['All shift','Only while completing the cash transaction','Whenever no customer is present'],1],
['A customer gives you more cash after you already entered the amount tendered. What should you do?',['Rush and guess','Pause and carefully recalculate/follow register procedure','Keep the extra money'],1],
['Which action helps keep a register accurate?',['Count change carefully and close each transaction correctly','Let friends use your drawer','Skip receipts'],0],
['If you are unsure about a coupon or payment, what should you do?',['Make up a rule','Ask the supervisor','Argue with the customer'],1]
],
Bagger:[
 ['Where should a carton of eggs go?',['In its own bag','Under canned food','With raw meat'],0],
 ['Where should a loaf of bread go?',['In its own bag so it is not crushed','Under heavy bottles','With raw chicken'],0],
 ['Which items should be bagged together?',['Raw meat packages together and separate from other food','Meat with bread','Meat with household cleaner'],0],
 ['What should you do with produce?',['Group produce together when appropriate and protect soft produce','Put cans on top of it','Mix it with raw meat'],0],
 ['Where do heavy canned or boxed items go?',['On the bottom of a sturdy bag','On top of bread','On top of eggs'],0],
 ['What should you do with cleaning chemicals?',['Keep them separate from food','Bag them with produce','Bag them with bread'],0],
 ['A customer needs carryout help. What should you do?',['Take the correct bags/cart to the customer vehicle area and stay with the order','Leave the bags outside','Mix the order with another customer'],0]
 ],
 Stocker:[
['You are told to stock cereal. Where should you go?',['Breakfast aisle','Personal Care','Deli'],0],
['You find milk past its expiration date. What should you do?',['Move it to the front','Remove it and report it','Sell it quickly'],1],
['You see broken glass in an aisle. What should you do?',['Walk away','Secure the area and follow store cleanup procedure','Kick it under a shelf'],1],
['A frozen pizza was left in the snack aisle. What should you do?',['Leave it','Follow food-safety procedure and tell a supervisor','Put it on any shelf'],1],
['A customer asks where pasta sauce is. What is the best response?',['Point randomly','Direct them to Pasta & Sauces and help if needed','Say you do not know and walk away'],1],
['A shelf has newer cereal in front of older cereal. What should you do?',['Leave it','Rotate older product forward and newer product behind','Throw all of it away'],1]
]};
let employeeSession=null,training=null,shift=null,timerId=null,pinEntry='';
const REAL_SHIFT_SECONDS=300,WORK_SHIFT_HOURS=8;
function trainingRecord(role){let w=world(),r=resident(w);if(!r)return null;r.groceryTraining=r.groceryTraining||{};return r.groceryTraining[role]||null}
function speakTraining(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.rate=.9;u.pitch=1;window.speechSynthesis.speak(u)}
function baggerLesson(){let msg='Bagger training. Protect the groceries. Put the carton of eggs in its own bag. Put the bread in its own bag. Keep raw meats together and separate from other foods. Group produce together and protect soft produce. Put heavy items on the bottom. Keep cleaning chemicals away from food. For carryout, keep each customer order together and take the correct order to the customer.';app.innerHTML='<section class="card"><span class="badge">BAGGER TRAINING</span><h1>How to Separate Groceries</h1><button class="audioBtn" onclick="speakTraining(\''+msg+'\')">▶ Play Instructions</button><p class="muted">You can replay the instructions anytime.</p><div class="grid"><div class="bagzone"><span class="bagpic">▱</span><b>EGGS — OWN BAG</b><p>Protect the carton. Do not put heavy groceries on it.</p></div><div class="bagzone"><span class="bagpic">▱</span><b>BREAD — OWN BAG</b><p>Keep the loaf from being crushed.</p></div><div class="bagzone"><b>MEAT TOGETHER</b><p>Beef • Chicken • Pork • Sausage<br>Keep raw meat separate from other food.</p></div><div class="bagzone"><b>PRODUCE TOGETHER</b><p>Apples • Oranges • Lettuce • Tomatoes<br>Protect soft produce.</p></div></div><div class="good"><b>Remember:</b> Heavy items on the bottom. Chemicals stay away from food.</div><p><button class="btn green" onclick="beginTraining()">Practice What I Learned</button> <button class="btn white" onclick="trainingHome(\'Bagger\',employeeSession.preview)">Back</button></p></section>';window.scrollTo(0,0)}
function trainingHome(role,preview){
 employeeSession={role:role,preview:preview,pace:(localStorage.groceryWorkPace||'standard')};let count=trainingTasks[role].length,done=trainingRecord(role);
 app.innerHTML='<section class="card"><span class="badge">NEW EMPLOYEE TRAINING</span><h1>'+esc(role)+' Training</h1>'+(done?'<div class="good"><b>Training already completed.</b><p>Score: '+esc(done.score)+'% • '+esc(done.date||'Completed')+'</p></div><p><button class="btn green" onclick="timeClock()">Skip Training & Go to Time Clock</button></p><p class="muted">You can retake training anytime for practice.</p>':'<p>Complete training once before starting your work shift.</p>')+(role==='Bagger'?'<div class="good"><b>Visual + audible training included.</b><p>Learn eggs, bread, meat, produce, heavy items, chemicals and carryout.</p></div>':'<div class="grid"><div class="job"><h2>Job Skills</h2><p>Learn the skills and safety rules for this position.</p></div></div>')+'<p><b>'+count+' training questions</b></p><button class="btn '+(done?'white':'green')+'" onclick="'+(role==='Bagger'?'baggerLesson()':'beginTraining()')+'">'+(done?'Retake Training':'Start Training')+'</button> <button class="btn white" onclick="landing()">Back</button></section>'
}
function beginTraining(){training={index:0,correct:0,answers:[]};renderTraining()}
function renderTraining(){
 let list=trainingTasks[employeeSession.role];if(training.index>=list.length)return trainingComplete();
 let t=list[training.index],pct=Math.round(training.index/list.length*100);
 app.innerHTML='<section class="card"><span class="badge">NEW EMPLOYEE TRAINING</span><h1>'+esc(employeeSession.role)+' Training</h1><div class="progress"><span style="width:'+pct+'%"></span></div><p>Question '+(training.index+1)+' of '+list.length+'</p><div class="note"><h2>'+esc(t[0])+'</h2></div>'+t[1].map(function(a,i){return '<button class="task" onclick="answerTraining('+i+')">'+esc(a)+'</button>'}).join('')+'</section>'
}
function answerTraining(i){let t=trainingTasks[employeeSession.role][training.index],ok=i===t[2];if(ok)training.correct++;training.answers.push({question:t[0],correct:ok});training.index++;renderTraining()}
function trainingComplete(){let list=trainingTasks[employeeSession.role],score=Math.round(training.correct/list.length*100),w=world(),r=resident(w);if(r){r.groceryTraining=r.groceryTraining||{};r.groceryTraining[employeeSession.role]={completed:true,score:score,date:new Date().toLocaleDateString()};save(w)}app.innerHTML='<section class="card"><span class="badge">TRAINING COMPLETE</span><h1>'+score+'%</h1><div class="good"><b>Training saved.</b><p>You will not have to repeat this training before future shifts.</p></div><p>You completed '+list.length+' new-employee training questions.</p><button class="btn green" onclick="timeClock()">Continue to Time Clock</button></section>'}
function timeClock(){
 pinEntry='';let expected=employeeSession.preview?'6437':ensurePin();
 app.innerHTML='<section class="card"><span class="badge">EMPLOYEE TIME CLOCK</span><h1>Clock In</h1><p>Employee: <b>'+esc(profileName())+'</b></p><p>Scheduled shift: <b>8:00 AM – 4:00 PM</b></p>'+(employeeSession.preview?'<div class="note">Miss Kayla test PIN: <b>6437</b></div>':'<p>Enter your 4-digit employee PIN.</p>')+'<div id="pinread" class="pinread">••••</div><div class="pinpad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button onclick="pinTap(\''+n+'\')">'+n+'</button>').join('')+'<button onclick="pinClear()">Clear</button><button onclick="pinTap(\'0\')">0</button><button onclick="pinSubmit()">Enter</button></div><p id="pinmsg" class="muted"></p><button class="btn white" onclick="trainingHome(employeeSession.role,employeeSession.preview)">Back</button></section>'
}
function pinTap(n){if(pinEntry.length<4)pinEntry+=n;document.getElementById('pinread').textContent=pinEntry.padEnd(4,'•')}
function pinClear(){pinEntry='';document.getElementById('pinread').textContent='••••';document.getElementById('pinmsg').textContent=''}
function pinSubmit(){let expected=employeeSession.preview?'6437':ensurePin(),m=document.getElementById('pinmsg');if(pinEntry!==expected){m.textContent='PIN not recognized. Clear it and try again.';return}clockedInWelcome()}
function clockedInWelcome(){employeeSession.clockIn='8:00 AM';employeeSession.clockOut='4:00 PM';app.innerHTML='<section class="card"><span class="badge">CLOCKED IN</span><h1>Welcome back, '+esc(profileName())+'!</h1><div class="good"><b>Your shift today is 8:00 AM – 4:00 PM.</b><p>Five real minutes represents your full eight-hour Transition Town workday.</p></div>'+(employeeSession.role==='Cashier'?'<button class="btn green" onclick="startCashierShift()">Go to Register</button>':employeeSession.role==='Bagger'?'<button class="btn green" onclick="startBaggerShift()">Start Bagger / Carryout Shift</button>':'<button class="btn green" onclick="startLegacyShift()">Start Stocker Shift</button>')+'</section>'}
const customers=[
 {items:[['Whole Milk',3.28],['Cereal',4.98],['Bread',1.48]],pay:'cash',tender:20},
 {items:[['Ground Beef',5.47],['Hamburger Buns',1.48],['Cheddar Cheese',2.24],['Cola',1.98]],pay:'card'},
 {items:[['Cake Mix',1.38],['Eggs',2.48],['Frosting',1.68],['Cupcake Liners',2.48]],pay:'cash',tender:10},
 {items:[['Chicken Breasts',10.47],['Rice',3.98],['Broth',1.98]],pay:'card'},
 {items:[['Hot Dogs',1.98],['Hot Dog Buns',1.48],['Chips',3.48],['Lemonade',2.98]],pay:'cash',tender:20}
];
function startCashierShift(){shift={role:'Cashier',preview:employeeSession.preview,started:Date.now(),duration:REAL_SHIFT_SECONDS,hours:8,served:0,itemsScanned:0,cashCorrect:0,cashTotal:0,customerIndex:0,scanIndex:0,phase:'scan',selectedCash:0};renderRegister();timerId=setInterval(tickCashier,1000);tickCashier()}
function timing(){let elapsed=Math.max(0,Math.min(300,(Date.now()-shift.started)/1000)),left=Math.max(0,Math.ceil(300-elapsed)),sim=480+(elapsed/300)*480,h=Math.floor(sim/60),m=Math.floor(sim%60);return {left:left,work:(h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM')}}
function clocks(){let t=timing();return '<div class="shiftclocks"><div class="clockbox"><small>REAL SHIFT TIME LEFT</small><b id="realClock">'+Math.floor(t.left/60)+':'+String(t.left%60).padStart(2,'0')+'</b></div><div class="clockbox"><small>WORK CLOCK</small><b id="workClock">'+t.work+'</b><small>8:00 AM → 4:00 PM</small></div></div>'}
function currentCustomer(){let base=customers[shift.customerIndex%customers.length];if(!shift.currentCustomer){let copy={items:base.items.map(function(x){let cents=[3,7,12,19,24,31,38,43,49,56,62,67,73,81,88,94,97][Math.floor(Math.random()*17)];let whole=Math.max(1,Math.floor(x[1])+Math.floor(Math.random()*4)-1);return [x[0],whole+cents/100]})};copy.pay=Math.random()<0.55?'card':'cash';if(copy.pay==='cash'){let total=cartTotal(copy),choices=[10,20,50,100];copy.tender=choices.find(function(v){return v>=total})||100;if(Math.random()<0.45){let bigger=choices.filter(function(v){return v>copy.tender});if(bigger.length)copy.tender=bigger[Math.floor(Math.random()*bigger.length)]}}shift.currentCustomer=copy}return shift.currentCustomer}
function cartTotal(cu){return Math.round(cu.items.reduce((a,x)=>a+x[1],0)*100)/100}
function renderRegister(){
 let cu=currentCustomer(),total=cartTotal(cu),scanned=cu.items.slice(0,shift.scanIndex);
 let body='<section class="card"><span class="badge">REGISTER 1 • CASHIER</span><h1>'+esc(profileName())+' — On Shift</h1>'+clocks()+'<div class="belt"><h3>Customer '+(shift.served+1)+'</h3>'+scanned.map(x=>'<div class="itemrow"><span>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div>').join('')+(shift.scanIndex<cu.items.length?'<p>'+(cu.items.length-shift.scanIndex)+' item(s) waiting to scan</p>':'<div class="registerTotal">TOTAL '+money(total)+'</div>')+'</div>';
 if(shift.scanIndex<cu.items.length)body+='<button class="btn green" onclick="scanNext()">SCAN NEXT ITEM</button>';
 else if(shift.phase==='scan')body+='<div class="note"><b>Payment:</b> '+(cu.pay==='cash'?'Cash — customer hands you '+money(cu.tender):'Debit/Credit Card')+'</div><button class="btn green" onclick="beginPayment()">TAKE PAYMENT</button>';
 else if(shift.phase==='cash')body+=cashDrawer(cu,total);
 app.innerHTML=body+'</section>'
}
function scanNext(){if(timing().left<=0)return endCashierShift();let cu=currentCustomer();if(shift.scanIndex<cu.items.length){shift.scanIndex++;shift.itemsScanned++}renderRegister()}
function beginPayment(){let cu=currentCustomer();if(cu.pay==='card'){completeCustomer(true);return}shift.phase='cash';shift.cashTotal++;shift.selectedCash=0;renderRegister()}
function cashDrawer(cu,total){let due=Math.round((cu.tender-total)*100)/100;return '<div class="note"><h2>Count the Change</h2><p>Customer gave: <b>'+money(cu.tender)+'</b> • Change due: <b>'+money(due)+'</b></p><p>You selected: <b id="selectedCash">'+money(shift.selectedCash)+'</b></p></div><div class="drawer">'+[[20,'$20'],[10,'$10'],[5,'$5'],[1,'$1'],[.25,'25¢'],[.10,'10¢'],[.05,'5¢'],[.01,'1¢']].map(x=>'<button class="cash" onclick="addCash('+x[0]+')">'+x[1]+'</button>').join('')+'</div><p><button class="btn white" onclick="clearCash()">Clear</button> <button class="btn green" onclick="giveChange('+due+')">GIVE CHANGE</button></p>'}
function addCash(v){shift.selectedCash=Math.round((shift.selectedCash+v)*100)/100;document.getElementById('selectedCash').textContent=money(shift.selectedCash)}
function clearCash(){shift.selectedCash=0;document.getElementById('selectedCash').textContent=money(0)}
function giveChange(due){let ok=Math.abs(shift.selectedCash-due)<.001;if(ok)shift.cashCorrect++;completeCustomer(ok)}
function completeCustomer(ok){shift.served++;shift.customerIndex++;shift.currentCustomer=null;shift.scanIndex=0;shift.phase='scan';shift.selectedCash=0;app.innerHTML='<section class="card"><h1>'+(ok?'Transaction Complete':'Change Error Recorded')+'</h1><div class="'+(ok?'good':'note')+'">'+(ok?'Customer served successfully.':'The change amount did not match. The transaction is recorded for coaching.')+'</div><p>Waiting for next customer…</p></section>';setTimeout(function(){if(shift&&timing().left>0)renderRegister()},1800)}
function tickCashier(){if(!shift)return;let t=timing(),r=document.getElementById('realClock'),w=document.getElementById('workClock');if(r)r.textContent=Math.floor(t.left/60)+':'+String(t.left%60).padStart(2,'0');if(w)w.textContent=t.work;if(t.left<=0)endCashierShift()}
