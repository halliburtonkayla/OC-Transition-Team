<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Transition Town Grocery Employee Center</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#17251d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#124c36;color:#fff;padding:14px max(14px,env(safe-area-inset-right)) 14px max(14px,env(safe-area-inset-left));display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top b{font-size:22px;margin-right:auto}.btn{border:0;border-radius:13px;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer}.gold{background:#f6c64f}.green{background:#187b4c;color:#fff}.white{background:#fff;color:#173d2c}.red{background:#a52d2d;color:#fff}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #0002}.hero img{display:block;width:100%}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.job{border:2px solid #d8d1c1;border-radius:16px;padding:16px}.badge{display:inline-block;background:#e7f2e9;border-radius:999px;padding:6px 10px;font-weight:900}.task{width:100%;text-align:left;margin:7px 0;background:#fff;border:2px solid #d8d1c1;border-radius:13px;padding:14px;font-size:16px}.note{background:#fff5cd;border:1px solid #e5c451;border-radius:14px;padding:14px}.good{background:#e8f7eb;border:1px solid #85bd8f;border-radius:14px;padding:14px}.muted{color:#66736c}.score{font-size:34px;font-weight:900}.shiftclocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.clockbox{background:#173d2c;color:#fff;border-radius:15px;padding:13px;text-align:center}.clockbox b{display:block;font-size:25px}.clockbox small{display:block;opacity:.8;margin-bottom:4px}@media(max-width:460px){.shiftclocks{grid-template-columns:1fr}.clockbox b{font-size:22px}}.hidden{display:none}@media(max-width:600px){.wrap{padding:9px}.top b{width:100%;font-size:20px}.btn{padding:11px 13px}.card{padding:14px}}
</style></head><body>
<header class="top"><b>Grocery Employee Center</b><button class="btn gold" onclick="location.href='grocery-store.html'">← Grocery Store</button><button class="btn white" onclick="location.href='transition-town.html'">Town Map</button></header>
<main class="wrap"><div id="app"></div></main>
<script>
const app=document.getElementById('app');
function name(){return localStorage.ttCurrent||'Guest'}
function world(){try{return JSON.parse(localStorage.ttWorld||'{}')||{}}catch(e){return {}}}
function save(w){localStorage.ttWorld=JSON.stringify(w)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+Number(n||0).toFixed(2)}
function isKayla(){return /kayla/i.test(name())}
function resident(w){w.residents=w.residents||{};return w.residents[name()]||null}
function employment(w){let r=resident(w);return r&&r.employment&&r.employment.grocery||null}
function landing(){
 let w=world(),e=employment(w),teacher=isKayla();
 let access=teacher||e&&e.active!==false;
 app.innerHTML='<div class="hero"><img src="00-grocery-store-entrance-now-hiring.png" alt="Transition Town Grocery"></div>'+
 '<section class="card"><span class="badge">'+(teacher?'MANAGER / TEST MODE':access?'EMPLOYEE':'EMPLOYEE CENTER')+'</span><h1>Welcome, '+esc(name())+'</h1>'+
 (teacher?'<p>Choose either Grocery job to preview it exactly like an employee shift. Test shifts do not pay Miss Kayla.</p><div class="grid"><div class="job"><h2>Cashier</h2><p>Register accuracy, customer service, payment and workplace situations.</p><button class="btn green" onclick="start(\'Cashier\',true)">Test Cashier Shift</button></div><div class="job"><h2>Stocker</h2><p>Aisle knowledge, stocking, food safety, customer help and workplace situations.</p><button class="btn green" onclick="start(\'Stocker\',true)">Test Stocker Shift</button></div></div>':
 access?'<h2>'+esc(e.position||'Grocery Employee')+'</h2><p><b>Wage:</b> '+money(e.wage||12)+'/hour</p><p><b>Schedule:</b> '+esc(e.schedule||'See Miss Kayla for your schedule')+'</p><button class="btn green" onclick="start(\''+(/stocker/i.test(e.position||'')?'Stocker':'Cashier')+'\',false)">Clock In</button>':
 '<div class="note"><b>Employee Mode is locked.</b><p>You must apply at Transition Town Grocery and be hired by Miss Kayla before you can clock in.</p></div><button class="btn green" onclick="location.href=\'grocery-store.html\'">Go to Grocery Store</button>')+
 '</section>';window.scrollTo(0,0)
}
const tasks={
Cashier:[
['A customer brings items to your register. What should you do first?',['Scan one item at a time and watch the register','Guess the total','Bag everything before scanning'],0],
['An item scans twice by mistake. What should you do?',['Ignore it','Correct the duplicate before payment','Charge the customer twice'],1],
['A customer says the shelf price was lower. What is the best response?',['Argue with them','Politely verify the price or ask a supervisor','Tell them to leave'],1],
['The total is $13.25 and the customer gives you $20. What change is due?',['$6.75','$7.75','$5.75'],0],
['A customer card is declined. What should you do?',['Announce it loudly','Stay discreet and ask for another payment method','Take the groceries away immediately'],1],
['Your replacement has not arrived and your shift is ending. What should you do?',['Leave the register unattended','Tell the supervisor before leaving','Clock out without saying anything'],1]
],
Stocker:[
['You are told to stock cereal. Where should you go?',['Breakfast aisle','Personal Care','Deli'],0],
['You find milk past its expiration date. What should you do?',['Move it to the front','Remove it and report it','Sell it quickly'],1],
['You see broken glass in an aisle. What should you do?',['Walk away','Secure the area and follow store cleanup procedure','Kick it under a shelf'],1],
['A frozen pizza was left in the snack aisle. What should you do?',['Leave it','Follow food-safety procedure and tell a supervisor','Put it on any shelf'],1],
['A customer asks where pasta sauce is. What is the best response?',['Point randomly','Direct them to Pasta & Sauces and help if needed','Say you do not know and walk away'],1],
['A shelf has newer cereal in front of older cereal. What should you do?',['Leave it','Rotate older product forward and newer product behind','Throw all of it away'],1]
]};
let shift=null,timerId=null;
const REAL_SHIFT_SECONDS=300,WORK_SHIFT_HOURS=8;
function start(role,preview){
 if(timerId){clearInterval(timerId);timerId=null}
 shift={role:role,preview:preview,index:0,correct:0,answers:[],started:Date.now(),duration:REAL_SHIFT_SECONDS,hours:WORK_SHIFT_HOURS};
 renderTask();timerId=setInterval(tickShift,1000);tickShift()
}
function shiftTiming(){
 if(!shift)return {left:0,work:'4:00 PM'};
 let elapsed=Math.max(0,Math.min(shift.duration,(Date.now()-shift.started)/1000)),left=Math.max(0,Math.ceil(shift.duration-elapsed));
 let startMinutes=8*60,totalWork=8*60,simMinutes=startMinutes+(elapsed/shift.duration)*totalWork;
 let rounded=Math.min(16*60,Math.floor(simMinutes)),h24=Math.floor(rounded/60),m=rounded%60,ampm=h24>=12?'PM':'AM',h=h24%12||12;
 return {left:left,work:h+':'+String(m).padStart(2,'0')+' '+ampm}
}
function clockMarkup(){
 let t=shiftTiming(),mm=Math.floor(t.left/60),ss=t.left%60;
 return '<div class="shiftclocks"><div class="clockbox"><small>REAL SHIFT TIME LEFT</small><b id="realClock">'+mm+':'+String(ss).padStart(2,'0')+'</b></div><div class="clockbox"><small>TRANSITION TOWN WORK CLOCK</small><b id="workClock">'+t.work+'</b><small>8:00 AM → 4:00 PM</small></div></div>'
}
function tickShift(){
 if(!shift)return;
 let t=shiftTiming(),rc=document.getElementById('realClock'),wc=document.getElementById('workClock');
 if(rc){let mm=Math.floor(t.left/60),ss=t.left%60;rc.textContent=mm+':'+String(ss).padStart(2,'0')}
 if(wc)wc.textContent=t.work;
 if(t.left<=0){clearInterval(timerId);timerId=null;finish()}
}
function renderTask(){
 if(!shift)return landing();
 let t=tasks[shift.role][shift.index%tasks[shift.role].length];
 app.innerHTML='<section class="card"><span class="badge">'+esc(shift.role)+' SHIFT</span><h1>Five-Minute Work Shift</h1>'+clockMarkup()+'<div class="note"><h2>'+esc(t[0])+'</h2></div>'+t[1].map(function(a,i){return '<button class="task" onclick="answer('+i+')">'+esc(a)+'</button>'}).join('')+'<p class="muted">Keep working until the real timer reaches 0:00. The work clock represents a full eight-hour day.</p></section>';window.scrollTo(0,0)
}
function answer(i){
 if(!shift||shiftTiming().left<=0)return;
 let list=tasks[shift.role],t=list[shift.index%list.length],ok=i===t[2];if(ok)shift.correct++;
 shift.answers.push({task:t[0],answer:t[1][i],correct:ok});shift.index++;renderTask()
}
function finish(){
 if(!shift)return;
 if(timerId){clearInterval(timerId);timerId=null}
 let total=shift.answers.length,score=total?Math.round(shift.correct/total*100):0,w=world(),e=employment(w),wage=Number(e&&e.wage||12),gross=Math.round(WORK_SHIFT_HOURS*wage*100)/100;
 app.innerHTML='<section class="card"><span class="badge">8-HOUR SHIFT COMPLETE</span><h1>'+esc(shift.role)+' Shift Report</h1><div class="grid"><div class="job"><div class="score">'+score+'%</div><p>Workplace readiness</p></div><div class="job"><div class="score">'+total+'</div><p>Tasks/transactions completed</p></div><div class="job"><div class="score">8</div><p>Transition Town work hours</p></div><div class="job"><div class="score">'+money(gross)+'</div><p>'+(shift.preview?'Practice gross pay':'Gross pay earned')+'</p></div></div>'+(shift.preview?'<div class="note">Miss Kayla test mode: '+money(gross)+' is practice earnings only. No deposit will be made.</div>':'<div class="good">Your five real minutes represented a full 8-hour workday. Clock out to submit the report and deposit your earned pay.</div>')+'<p><button class="btn green" onclick="clockOut()">'+(shift.preview?'Finish Test Shift':'Clock Out & Submit Shift')+'</button> <button class="btn white" onclick="landing()">Cancel</button></p></section>';window.scrollTo(0,0)
}
function clockOut(){
 if(!shift)return;
 let w=world(),r=resident(w),e=employment(w),total=shift.answers.length,score=total?Math.round(shift.correct/total*100):0,wage=Number(e&&e.wage||12),gross=Math.round(WORK_SHIFT_HOURS*wage*100)/100,report={employee:name(),employer:'Transition Town Grocery',position:shift.role,realMinutes:5,hours:WORK_SHIFT_HOURS,wage:wage,gross:gross,score:score,transactions:total,answers:shift.answers,date:new Date().toLocaleString(),preview:shift.preview};
 w.employeeShiftReports=w.employeeShiftReports||[];w.employeeShiftReports.unshift(report);
 if(!shift.preview&&r){r.checking=Math.round((Number(r.checking||0)+gross)*100)/100;r.history=r.history||[];r.notifications=r.notifications||[];r.history.push('Completed an 8-hour Transition Town Grocery shift +'+money(gross));r.notifications.push('PAYDAY: Transition Town Grocery deposited '+money(gross)+' for your 8-hour shift.');if(e){e.shifts=e.shifts||[];e.shifts.unshift(report)}}
 save(w);app.innerHTML='<section class="card"><h1>Clocked Out</h1><div class="good">'+(shift.preview?'Test shift complete. '+money(gross)+' was practice earnings only; no money was deposited.':'Your 5-minute simulation counted as 8 work hours. Your shift report was sent to Miss Kayla and '+money(gross)+' was deposited into your Transition Town checking account.')+'</div><p><button class="btn green" onclick="landing()">Employee Center</button> <button class="btn white" onclick="location.href=\'grocery-store.html\'">Grocery Store</button></p></section>';shift=null
}
landing();
</script></body></html>
