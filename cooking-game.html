<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen Challenge | Transition Team</title><style>:root{--navy:#102a5c;--red:#e1192f;--blue:#0751bd;--pink:#f5c5d8;--paper:#fbfafb;--ink:#25324a}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}header a{color:white;text-decoration:none;font-weight:800}main{max-width:1000px;margin:auto;padding:24px}.panel{background:white;border:1px solid #dde5ef;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #102a5c12}h1,h2{font-family:Georgia,serif;color:var(--navy)}button,.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--blue);color:white;text-decoration:none;display:inline-block;margin:4px}button.alt{background:var(--red)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.choice{width:100%;text-align:left}.muted{color:#66758a}.big{font-size:42px}.status{padding:12px;border-radius:12px;background:#edf4fc;margin:12px 0}.meter{height:18px;background:#e6eaf0;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--blue)}select,input{font-size:16px;padding:11px;border:2px solid #cbd6e7;border-radius:10px;width:100%}@media(max-width:600px){main{padding:14px}}</style><link rel="stylesheet" href="assets/session.css"><link rel="stylesheet" href="assets/game-ui.css">
</head><body class="game-ui"><header><a href="index.html">← Transition Team Home</a><strong>Kitchen Challenge</strong></header><main><h1>🍳 Kitchen Challenge</h1><p class="muted">Build the spaghetti dinner. Your choices are scored together at the end—just like a real recipe.</p><div class="panel"><div class="big">🍝</div><h2 id="stepTitle">Step 1 of 5: Water</h2><p id="prompt">How much water will you put in the pot?</p><div id="choices" class="grid"></div><div id="progress" class="status">Nothing added yet.</div></div><div class="panel" id="result" hidden></div></main><script>const steps=[{k:'water',t:'Water',q:'How much water will you put in the pot?',o:['2 cups','4 cups','8 cups','12 cups'],best:'8 cups'},{k:'pasta',t:'Pasta',q:'How much dry spaghetti for about 4 servings?',o:['4 oz','8 oz','12 oz','1 lb'],best:'8 oz'},{k:'sauce',t:'Sauce',q:'How much pasta sauce will you use?',o:['1/2 cup','1 cup','2 cups','4 cups'],best:'2 cups'},{k:'salt',t:'Salt',q:'How much salt will you add to the finished sauce?',o:['None','1/4 tsp','1 tsp','2 Tbsp'],best:'1/4 tsp'},{k:'pepper',t:'Pepper',q:'How much black pepper?',o:['None','1/4 tsp','1 tsp','1 Tbsp'],best:'1/4 tsp'}];let i=0,a={};const c=document.querySelector('#choices'),r=document.querySelector('#result');function draw(){let s=steps[i];document.querySelector('#stepTitle').textContent=`Step ${i+1} of ${steps.length}: ${s.t}`;document.querySelector('#prompt').textContent=s.q;c.innerHTML='';s.o.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{a[s.k]=x;i++;if(i<steps.length)draw();else finish()};c.appendChild(b)});document.querySelector('#progress').textContent=Object.entries(a).map(([k,v])=>`${k}: ${v}`).join(' • ')||'Nothing added yet.'}function finish(){document.querySelector('.panel').hidden=true;let score=steps.filter(s=>a[s.k]===s.best).length;let msg=score===5?'🍝 PERFECT! Great balance and measurements.':score>=3?'🙂 PRETTY GOOD — a few measurements need adjusting.':'👩‍🍳 BACK TO THE KITCHEN — your ratios need some work.';if(a.salt==='2 Tbsp')msg='🧂 WAY TOO SALTY — that amount of salt would overpower the dish.';else if(a.sauce==='1/2 cup')msg='🥫 TOO DRY — there is not enough sauce for this pasta.';else if(a.sauce==='4 cups')msg='🥫 SAUCE OVERLOAD — the pasta-to-sauce ratio is off.';r.hidden=false;r.innerHTML=`<h2>${msg}</h2><p>You matched ${score} of 5 target measurements.</p><div class="status">${steps.map(s=>`<b>${s.t}:</b> ${a[s.k]} ${a[s.k]===s.best?'✓':`→ try ${s.best}`}`).join('<br>')}</div><button onclick="location.reload()">Cook Again</button><a class="btn" href="index.html#games">Back to Games</a>`}draw();</script><script src="assets/session.js"></script></body></html>
