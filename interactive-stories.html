<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Would YOU Do? | Transition Team</title><style>:root{--navy:#102a5c;--red:#e1192f;--blue:#0751bd;--pink:#f5c5d8;--paper:#fbfafb;--ink:#25324a}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}header a{color:white;text-decoration:none;font-weight:800}main{max-width:1000px;margin:auto;padding:24px}.panel{background:white;border:1px solid #dde5ef;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #102a5c12}h1,h2{font-family:Georgia,serif;color:var(--navy)}button,.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--blue);color:white;text-decoration:none;display:inline-block;margin:4px}button.alt{background:var(--red)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.choice{width:100%;text-align:left}.muted{color:#66758a}.big{font-size:42px}.status{padding:12px;border-radius:12px;background:#edf4fc;margin:12px 0}.meter{height:18px;background:#e6eaf0;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--blue)}select,input{font-size:16px;padding:11px;border:2px solid #cbd6e7;border-radius:10px;width:100%}@media(max-width:600px){main{padding:14px}}</style><link rel="stylesheet" href="assets/session.css"><link rel="stylesheet" href="assets/game-ui.css">
</head><body class="game-ui"><header><a href="index.html">← Transition Team Home</a><strong>What Would YOU Do?</strong></header><main><h1>🎬 What Would YOU Do?</h1><p class="muted">Interactive episodes: watch the story unfold, make a choice, and see how your decisions shape the ending.</p><div id="menu" class="grid"></div><div id="player" hidden><div class="panel" style="background:#111;color:white;min-height:300px;display:flex;align-items:center;justify-content:center;text-align:center"><div><div id="sceneIcon" style="font-size:72px"></div><h2 id="sceneTitle" style="color:white"></h2><p id="sceneText" style="font-size:20px;max-width:650px"></p></div></div><div class="panel"><h2>⏸️ What do you do?</h2><div id="storyChoices" class="grid"></div></div></div><div id="ending" class="panel" hidden></div></main><script>const stories=[{"icon": "\ud83c\udfd6\ufe0f", "title": "Beach House Party", "nodes": [{"q": "A friend brings alcohol to a beach-house party. Your crush offers you a beer.", "a": ["Take the beer", "Say, \u201cNo thanks, I\u2019m good.\u201d"]}, {"q": "A friend who has been drinking offers to drive everyone to the store.", "a": ["Ride with them", "Find a sober ride / stay put"]}, {"q": "Later, a friend feels sick and is hard to wake.", "a": ["Keep it quiet so nobody gets in trouble", "Get a trusted adult/emergency help"]}]}, {"icon": "\ud83d\udcf1", "title": "The Group Chat Blew Up", "nodes": [{"q": "A screenshot says someone was talking about you.", "a": ["Post a response immediately", "Ask what was actually said"]}, {"q": "A friend asks you to forward a private screenshot.", "a": ["Forward it", "Do not forward it"]}, {"q": "Messages turn threatening.", "a": ["Threaten them back", "Save evidence and get help"]}]}, {"icon": "\ud83e\udd4a", "title": "Meet Me After School", "nodes": [{"q": "Someone messages, \u201cMeet me after school.\u201d", "a": ["Agree to fight", "Do not agree to fight"]}, {"q": "Friends start hyping it up and filming.", "a": ["Play along", "Leave and get help"]}, {"q": "The person approaches you angry.", "a": ["Argue back", "Create space and seek an adult"]}]}, {"icon": "\u2764\ufe0f", "title": "It\u2019s Complicated", "nodes": [{"q": "Someone you are dating asks for your phone password.", "a": ["Give it to them", "Keep your password private"]}, {"q": "They get angry because you liked someone\u2019s post.", "a": ["Apologize and let them control it", "State a boundary"]}, {"q": "They keep messaging after you ask for space.", "a": ["Keep arguing", "Stop engaging and get support if needed"]}]}, {"icon": "\ud83d\ude97", "title": "Riding With Friends", "nodes": [{"q": "Your friend is speeding and looking at their phone.", "a": ["Say nothing", "Ask them to slow down and put the phone away"]}, {"q": "They laugh and speed up.", "a": ["Stay in the car no matter what", "Ask to be let out somewhere safe"]}, {"q": "You need another ride home.", "a": ["Ride with another unsafe driver", "Call a safe/trusted ride"]}]}, {"icon": "\ud83d\udcbc", "title": "First Week at Work", "nodes": [{"q": "You realize you may be late for your shift.", "a": ["Show up late without saying anything", "Contact your supervisor as soon as possible"]}, {"q": "A coworker asks you to clock them in.", "a": ["Do it for them", "Refuse"]}, {"q": "Your supervisor corrects your work.", "a": ["Get defensive", "Listen, ask questions, and fix it"]}]}, {"icon": "\ud83d\udde3\ufe0f", "title": "I Heard She Said\u2026", "nodes": [{"q": "A friend says someone is talking about you, but did not hear it firsthand.", "a": ["Confront the person immediately", "Ask for facts before reacting"]}, {"q": "Someone suggests posting a shady status.", "a": ["Post it", "Do not post it"]}, {"q": "You learn the story was exaggerated.", "a": ["Keep the drama going", "Clear up the misunderstanding"]}]}, {"icon": "\ud83c\udf89", "title": "The After-Game Party", "nodes": [{"q": "At a party, someone offers you a vape.", "a": ["Take it", "Decline it"]}, {"q": "Someone starts recording an embarrassed student.", "a": ["Join the recording", "Do not participate / help them get privacy"]}, {"q": "Your ride changes plans.", "a": ["Get in with whoever is leaving", "Arrange a safe ride"]}]}, {"icon": "\ud83d\udcb5", "title": "Easy Money", "nodes": [{"q": "A friend says you can make quick money by letting them use your payment account.", "a": ["Agree", "Ask questions and refuse suspicious activity"]}, {"q": "They pressure you to keep it secret.", "a": ["Keep the secret", "Step away and talk to a trusted adult"]}, {"q": "They ask for your password/code.", "a": ["Give it to them", "Do not share security information"]}]}, {"icon": "\ud83d\ude21", "title": "Worst Shift Ever", "nodes": [{"q": "A customer speaks rudely to you.", "a": ["Argue with them", "Stay calm and use workplace procedure"]}, {"q": "A coworker laughs at the situation.", "a": ["Start coworker drama", "Stay focused / address it appropriately"]}, {"q": "Your supervisor asks what happened.", "a": ["Blame everyone else", "Explain the facts calmly"]}]}];let current=null,step=0,picks=[];const menu=document.querySelector('#menu');stories.forEach((s,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span style="font-size:32px">${s.icon}</span><br>${s.title}`;b.onclick=()=>start(i);menu.appendChild(b)});function start(i){current=stories[i];step=0;picks=[];menu.parentElement.querySelector('p').hidden=true;menu.hidden=true;document.querySelector('#player').hidden=false;draw()}function draw(){let n=current.nodes[step];document.querySelector('#sceneIcon').textContent=current.icon;document.querySelector('#sceneTitle').textContent=current.title+` • Scene ${step+1}`;document.querySelector('#sceneText').textContent=n.q;let c=document.querySelector('#storyChoices');c.innerHTML='';n.a.forEach((x,j)=>{let b=document.createElement('button');b.className='choice '+(j?'':'alt');b.textContent=(j?'B. ':'A. ')+x;b.onclick=()=>{picks.push({q:n.q,a:x,safer:j===1});step++;if(step<current.nodes.length)draw();else end()};c.appendChild(b)})}function end(){document.querySelector('#player').hidden=true;let safer=picks.filter(x=>x.safer).length;let label=safer===3?'You consistently chose lower-risk options.':safer===2?'You made several lower-risk choices and one choice worth discussing.':'Your choices created several points worth discussing and replaying.';let e=document.querySelector('#ending');e.hidden=false;e.innerHTML=`<h2>🎞️ Your Ending: ${current.title}</h2><p>${label}</p><div class="status">${picks.map((x,i)=>`<b>Scene ${i+1}:</b> ${x.a}`).join('<br>')}</div><h3>Talk About It</h3><p>Which choice changed the story most? What pressure did the character face? What might happen next in real life?</p><button onclick="location.reload()">Choose Another Episode</button>`}</script><script src="assets/session.js"></script></body></html>
