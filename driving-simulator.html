<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behind the Wheel Simulator | Transition Team</title><style>:root{--navy:#102a5c;--red:#e1192f;--blue:#0751bd;--pink:#f5c5d8;--paper:#fbfafb;--ink:#25324a}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}header a{color:white;text-decoration:none;font-weight:800}main{max-width:1000px;margin:auto;padding:24px}.panel{background:white;border:1px solid #dde5ef;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #102a5c12}h1,h2{font-family:Georgia,serif;color:var(--navy)}button,.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--blue);color:white;text-decoration:none;display:inline-block;margin:4px}button.alt{background:var(--red)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.choice{width:100%;text-align:left}.muted{color:#66758a}.big{font-size:42px}.status{padding:12px;border-radius:12px;background:#edf4fc;margin:12px 0}.meter{height:18px;background:#e6eaf0;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--blue)}select,input{font-size:16px;padding:11px;border:2px solid #cbd6e7;border-radius:10px;width:100%}@media(max-width:600px){main{padding:14px}}</style></head><body><header><a href="index.html">← Transition Team Home</a><strong>Behind the Wheel Simulator</strong></header><main><h1>🚘 Behind the Wheel Simulator</h1><p class="muted">First-person practice for safe vehicle-start sequencing. This is educational practice, not a substitute for supervised driver training.</p><div class="panel" style="background:linear-gradient(#bfe2ff 0 48%,#5e6b72 48%);min-height:330px;position:relative;overflow:hidden"><div style="text-align:center;font-size:70px;margin-top:55px">🛣️</div><div style="position:absolute;left:0;right:0;bottom:0;background:#263746;color:white;padding:18px;border-radius:30px 30px 0 0"><div class="grid"><button id="belt">🔒 Seat Belt</button><button id="mirrors">🪞 Check Mirrors</button><button id="zones">👀 Check Zones</button><button id="brake">🦶 Hold Brake</button><button id="start">🔘 Start Car</button><button id="signal">↔️ Signal</button><button id="gear">⚙️ Shift to Drive</button><button id="move" class="alt">🚗 Move</button></div></div></div><div class="panel"><h2>Driving Log</h2><div id="log" class="status">You are sitting in the driver's seat. What do you do first?</div><button id="report" hidden>See My Driving Report</button></div><div class="panel" id="result" hidden></div></main><script>const target=['belt','mirrors','zones','brake','start','signal','gear','move'];let actions=[];let done=new Set();const names={belt:'Seat belt',mirrors:'Mirrors',zones:'Surroundings/blind zones',brake:'Brake',start:'Start vehicle',signal:'Turn signal',gear:'Shift to Drive',move:'Move vehicle'};target.forEach(id=>document.querySelector('#'+id).onclick=()=>{if(done.has(id))return;done.add(id);actions.push(id);document.querySelector('#'+id).disabled=true;document.querySelector('#log').innerHTML=actions.map((x,n)=>`${n+1}. ${names[x]}`).join('<br>');if(id==='move'||actions.length===target.length)document.querySelector('#report').hidden=false});document.querySelector('#report').onclick=()=>{let points=0;target.forEach((x,n)=>{if(actions.indexOf(x)===n)points++});let safety=[];if(actions[0]!=='belt')safety.push('Secure your seat belt before preparing to move.');if(actions.indexOf('brake')>actions.indexOf('start'))safety.push('Practice holding the brake before starting/shifting.');if(actions.indexOf('zones')>actions.indexOf('gear'))safety.push('Check the area around the vehicle before shifting/moving.');if(actions.indexOf('signal')>actions.indexOf('move'))safety.push('Signal before moving into traffic when the situation calls for it.');document.querySelector('#result').hidden=false;document.querySelector('#result').innerHTML=`<h2>🚦 Driving Report</h2><p>Sequence match: <b>${points}/8</b></p><div class="status">${safety.length?safety.join('<br>'):'Strong safety sequence. Keep practicing with a qualified supervising driver.'}</div><button onclick="location.reload()">Try Again</button>`}</script></body></html>
