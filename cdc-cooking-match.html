<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CDC Make It! Cooking Match</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7fbff;color:#17324d}header{background:linear-gradient(135deg,#123f73,#2876b9);color:#fff;padding:24px;text-align:center}.wrap{max-width:1050px;margin:auto;padding:18px}.choose,.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choose button,.action{border:0;border-radius:14px;padding:13px 18px;background:#123f73;color:#fff;font-size:17px;font-weight:800;cursor:pointer;min-height:48px}.choose button.active{outline:5px solid #ffd54f;background:#b3262d}.game{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;margin-top:18px}.panel{background:#fff;border-radius:20px;padding:18px;box-shadow:0 5px 18px #123f7318}.ingredients{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.food{background:#fff8d9;border:3px solid #f0c84b;border-radius:18px;padding:12px;text-align:center;font-weight:800;cursor:grab;min-height:112px}.pic{font-size:48px;display:block}.plate{min-height:350px;border:5px dashed #7bb6e8;border-radius:30px;background:#eef8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}.plate.over{background:#dff7e8;border-color:#29985b}.built{font-size:54px;min-height:130px}.message{font-size:20px;font-weight:800;text-align:center;min-height:55px;margin-top:12px}.progress{text-align:center;font-weight:700}.action.alt{background:#b3262d}.hint{background:#fff4c7;border-radius:12px;padding:10px;margin-top:12px;text-align:center}.done{font-size:25px;color:#177245}@media(max-width:700px){.game{grid-template-columns:1fr}.plate{min-height:280px}}</style></head><body><header><a href="cdc-center.html" style="color:white;font-weight:bold">← CDC Center</a><h1>Make It! Cooking Match</h1><p>Pick a food. Match the ingredients. Drag them to the plate — or tap an ingredient and then tap the plate.</p></header><main class="wrap"><div class="choose" id="choose"></div><div class="game"><section class="panel"><h2>Ingredients</h2><div id="ingredients" class="ingredients"></div><div class="hint">Match the picture and ingredient name.</div></section><section class="panel"><h2 id="makeTitle"></h2><div id="plate" class="plate" tabindex="0"><div id="built" class="built">🍽️</div><div>DROP OR TAP HERE</div></div><div id="message" class="message" aria-live="polite"></div><div id="progress" class="progress"></div><div class="actions"><button class="action" id="hintBtn">Show Me What I Need</button><button class="action alt" id="resetBtn">Start Over</button></div></section></div></main><script>
const recipes={pizza:{name:'Pizza',icon:'🍕',steps:[['Dough','🫓'],['Sauce','🍅'],['Cheese','🧀'],['Pepperoni','🔴']]},burger:{name:'Burger',icon:'🍔',steps:[['Bottom Bun','🍞'],['Burger Patty','🥩'],['Cheese','🧀'],['Lettuce','🥬'],['Top Bun','🍞']]},sandwich:{name:'Sandwich',icon:'🥪',steps:[['Bread','🍞'],['Turkey','🍗'],['Cheese','🧀'],['Lettuce','🥬'],['Bread','🍞']]},taco:{name:'Taco',icon:'🌮',steps:[['Taco Shell','🌮'],['Meat','🥩'],['Cheese','🧀'],['Lettuce','🥬'],['Tomato','🍅']]},fruit:{name:'Fruit Bowl',icon:'🍓',steps:[['Strawberries','🍓'],['Banana','🍌'],['Apple','🍎'],['Grapes','🍇']]},breakfast:{name:'Breakfast Plate',icon:'🍳',steps:[['Egg','🍳'],['Toast','🍞'],['Bacon','🥓'],['Fruit','🍓']]}};
const distractors=[['Cookie','🍪'],['Ice Cream','🍦'],['Broccoli','🥦'],['French Fries','🍟'],['Candy','🍬'],['Carrot','🥕']];let key='pizza',step=0,selected=null;const choose=document.getElementById('choose'),ings=document.getElementById('ingredients'),plate=document.getElementById('plate'),msg=document.getElementById('message'),built=document.getElementById('built'),prog=document.getElementById('progress');Object.entries(recipes).forEach(([k,r])=>{const b=document.createElement('button');b.textContent=r.icon+' '+r.name;b.dataset.key=k;b.onclick=()=>start(k);choose.appendChild(b)});function shuffled(a){return [...a].sort(()=>Math.random()-.5)}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.speak(u)}}function start(k){key=k;step=0;selected=null;document.querySelectorAll('#choose button').forEach(b=>b.classList.toggle('active',b.dataset.key===k));document.getElementById('makeTitle').textContent='Make a '+recipes[k].name;msg.textContent='Choose the first ingredient.';render()}function render(){const r=recipes[key],pool=shuffled([...r.steps.slice(step),...shuffled(distractors).slice(0,3)]);ings.innerHTML='';pool.forEach(([n,p])=>{const d=document.createElement('button');d.className='food';d.draggable=true;d.innerHTML='<span class="pic">'+p+'</span>'+n;d.ondragstart=()=>selected=[n,p];d.onclick=()=>{selected=[n,p];document.querySelectorAll('.food').forEach(x=>x.style.outline='');d.style.outline='5px solid #4b8fe2';msg.textContent=n+' selected. Now tap the plate.';speak(n+' selected. Tap the plate.')};ings.appendChild(d)});built.innerHTML=step?r.steps.slice(0,step).map(x=>x[1]).join(' '):'🍽️';prog.textContent=step+' of '+r.steps.length+' ingredients matched';if(step===r.steps.length){built.innerHTML=r.icon;msg.innerHTML='<span class="done">Great job! You made the '+r.name+'!</span>';speak('Great job! You made the '+r.name);ings.innerHTML=''}}function tryAdd(){if(!selected||step>=recipes[key].steps.length)return;const want=recipes[key].steps[step];if(selected[0]===want[0]&&selected[1]===want[1]){msg.textContent='Yes! '+want[0]+' goes next.';speak(msg.textContent);step++;selected=null;render()}else{msg.textContent='Try again. Find '+want[0]+'.';speak(msg.textContent);selected=null}}plate.ondragover=e=>{e.preventDefault();plate.classList.add('over')};plate.ondragleave=()=>plate.classList.remove('over');plate.ondrop=e=>{e.preventDefault();plate.classList.remove('over');tryAdd()};plate.onclick=tryAdd;document.getElementById('hintBtn').onclick=()=>{if(step<recipes[key].steps.length){msg.textContent='Find: '+recipes[key].steps[step][0];speak(msg.textContent)}};document.getElementById('resetBtn').onclick=()=>start(key);start('pizza');</script><script src="session.js"></script></body></html>
