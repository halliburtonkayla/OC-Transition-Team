href="session.css"></head><body><header><a href="index.html">← Home</a><a href="life-stories.html">Life Stories</a><strong>Payday: Can You Make It 14 Days?</strong></header><main><div class="book"><div class="bar"><span id="pg">Page 1 of 20</span><span id="status">Choices shape your story</span></div><div id="scene" class="scene"></div></div></main><script>function friendlySpeak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices();
  const en=voices.filter(v=>/^en(-|_)/i.test(v.lang||''));
  const preferred=['Ava','Samantha','Zoe','Aria','Jenny','Emma','Joanna','Allison','Serena','Tessa','Victoria','Karen','Moira','Fiona','Siri Female'];
  let voice=preferred.map(n=>en.find(v=>(v.name||'').toLowerCase().includes(n.toLowerCase()))).find(Boolean);
  if(!voice) voice=en.find(v=>/female|woman|girl|natural|premium|enhanced/i.test(v.name||''));
  if(!voice) voice=en[0]||voices[0];
  if(voice) u.voice=voice;

  speechSynthesis.speak(u);
}

t?'}</h1><p id="copy" style="font-size:19px;line-height:1.55">${i===0?intro+' ':''}${s.text}</p><div class="choices"><button class="read" id="read">🔊 READ TO ME</button>${buttons}</div>`;document.getElementById('read').onclick=speak;document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>pick(+b.dataset.q,b.textContent));}function pick(q,label){choices.push({scene:i+1,choice:label,quality:q});if(q===0)score+=2;else if(q===1)score+=1;if(window.TTSession)TTSession.recordChoice({activity:title,scene:i+1,prompt:S[i].text,choice:label,quality:q});i++;if(i>=S.length)finish();else draw();}function finish(){let level=score>=S.length*1.45?'You consistently protected your priorities and handled problems early.':score>=S.length*.9?'You made a mix of strong choices and choices that created extra challenges.':'Several early choices created harder consequences later. Replay and see how a different decision changes the story.';document.getElementById('pg').textContent='THE END';document.getElementById('scene').innerHTML=`<div class="art">🏁</div><h1>Here’s How Your Story Turned Out</h1><div class="result"><p style="font-size:19px">${level}</p><p>You completed <b>${S.length} scenes</b>. Your decisions—not a single pass/fail answer—shaped this ending.</p></div><div class="choices"><button id="again">🔄 WRITE A DIFFERENT STORY</button><button class="read" id="readEnd">🔊 READ RESULTS</button><button onclick="print()">🖨 PRINT RESULTS</button></div>`;document.getElementById('again').onclick=()=>{i=0;score=0;choices=[];draw()};document.getElementById('readEnd').onclick=speak;}draw();</script><script src="session.js"></script>
<script>
(function(){
  const KEY='tt_sound_on';
  let ctx=null;
  function enabled(){ return localStorage.getItem(KEY)!=='0'; }
  function tone(freq,dur,type='sine',vol=.035){
    if(!enabled()) return;
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.setValueAtTime(vol,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
    }catch(e){}
  }
  window.TTSound={
    click:()=>tone(520,.055,'sine',.025),
    success:()=>{tone(660,.10,'sine',.035);setTimeout(()=>tone(880,.13,'sine',.03),90)},
    consequence:()=>tone(330,.11,'triangle',.025)
  };
  document.addEventListener('click',e=>{
    const b=e.target.closest('button,.choice,.option,[role="button"]');
    if(b && !b.id?.startsWith('ttSound')) TTSound.click();
  },true);
  function addToggle(){
    if(document.getElementById('ttSoundToggle')) return;
    const b=document.createElement('button');
    b.id='ttSoundToggle';
    b.type='button';
    b.setAttribute('aria-label','Turn website sounds on or off');
    b.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99998;border:0;border-radius:999px;padding:10px 14px;background:#111827;color:white;font-weight:800;box-shadow:0 3px 12px #0003';
    function label(){b.textContent=enabled()?'🔊 Sound On':'🔇 Sound Off'}
    label();
    b.onclick=()=>{localStorage.setItem(KEY,enabled()?'0':'1');label();if(enabled())TTSound.success();}
    document.body.appendChild(b);
  }
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',addToggle):addToggle();
})();
</script>



<script id="ttUniversalChoiceShuffle">
(function(){
  const selectors=[
    '.choices','.options','.choice-grid','.answer-grid','.answers',
    '.decision-options','.response-options','.scenario-options',
    '#choices','#options','#answers'
  ];
  const itemSel='button,.choice,.option,.answer,[role="button"],label';

  function shuffleArray(a){
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function signature(c){
    return [...c.children].map(x=>(x.textContent||'').trim()).join('|');
  }
  function shuffleContainer(c){
    const kids=[...c.children].filter(x=>x.matches(itemSel));
    if(kids.length<2) return;
    const sig=signature(c);
    if(c.dataset.ttShuffleSig===sig) return;
    shuffleArray(kids).forEach(k=>c.appendChild(k));
    c.dataset.ttShuffleSig=signature(c);
  }
  function scan(root=document){
    selectors.forEach(sel=>root.querySelectorAll(sel).forEach(shuffleContainer));
    // Also detect ordinary containers holding 2–6 answer buttons.
    root.querySelectorAll('div,section,article,form').forEach(c=>{
      const kids=[...c.children].filter(x=>x.matches('button'));
      if(kids.length>=2 && kids.length<=6){
        const txt=(c.className+' '+c.id).toLowerCase();
        if(/choice|answer|option|decision|response|scenario|quiz|question/.test(txt))
          shuffleContainer(c);
      }
    });
  }
  let queued=false;
  function queue(){
    if(queued)return; queued=true;
    requestAnimationFrame(()=>{queued=false;scan();});
  }
  document.addEventListener('DOMContentLoaded',()=>{scan();});
  new MutationObserver(queue).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
