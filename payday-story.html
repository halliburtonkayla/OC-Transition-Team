<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payday: Can You Make It 14 Days?</title><style>:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--paper:#f7f9fc;--ink:#24324a;--green:#16794b}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink)}header{background:var(--navy);color:white;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header a{color:white;text-decoration:none;font-weight:800}main{max-width:980px;margin:auto;padding:18px}.book{background:white;border:1px solid #dce3ed;border-radius:22px;padding:24px;box-shadow:0 8px 24px #102a5c12;min-height:520px}.scene{animation:turn .35s ease}@keyframes turn{from{opacity:.2;transform:rotateY(-8deg) translateX(16px)}to{opacity:1;transform:none}}h1,h2{font-family:Georgia,serif;color:var(--navy)}.art{background:#eef5ff;border-radius:18px;margin:12px 0;overflow:hidden}.art img{display:block;width:100%;max-height:430px;object-fit:cover;object-position:center}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.choices button,.btn{border:0;border-radius:13px;padding:14px 16px;background:var(--blue);color:white;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none}.choices button:nth-child(even){background:var(--navy)}.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#eef3fa;padding:10px 14px;border-radius:12px;margin-bottom:12px}.read{background:var(--green)!important}.muted{color:#66758a}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #dce3ed;border-radius:16px;padding:18px}.card a{display:inline-block;margin-top:8px}.result{background:#eef8f2;border-radius:14px;padding:14px;margin:12px 0}@media(max-width:600px){main{padding:10px}.book{padding:16px}.art{font-size:48px;padding:20px}}</style></head><body><header><a href="index.html">← Home</a><a href="life-stories.html">Life Stories</a><strong>Payday: Can You Make It 14 Days?</strong></header><main><div class="book"><div class="bar"><span id="pg">Page 1 of 20</span><span id="status">Choices shape your story</span></div><div id="scene" class="scene"></div></div></main><script>function friendlySpeak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices();
  const en=voices.filter(v=>/^en(-|_)/i.test(v.lang||''));
  const preferred=['Ava','Samantha','Zoe','Aria','Jenny','Emma','Joanna','Allison','Serena','Tessa','Victoria','Karen','Moira','Fiona','Siri Female'];
  let voice=preferred.map(n=>en.find(v=>(v.name||'').toLowerCase().includes(n.toLowerCase()))).find(Boolean);
  if(!voice) voice=en.find(v=>/female|woman|girl|natural|premium|enhanced/i.test(v.name||''));
  if(!voice) voice=en[0]||voices[0];
  if(voice) u.voice=voice;
  u.rate=1.03; u.pitch=1.12; u.volume=1;
  speechSynthesis.speak(u);
}
const title="Payday: Can You Make It 14 Days?",icon="\ud83d\udcb5",intro="You have $2,000 and two weeks until the next paycheck.",S=[{"text": "Your $2,000 paycheck just hit. Your next payday is 14 days away. What gets your attention first?", "choices": ["\ud83d\udcb3 Check bills and due dates", "\ud83d\uded2 Go grocery shopping", "\ud83d\udc55 Go buy clothes"]}, {"text": "You see rent, electric, phone, insurance and transportation costs. What do you do?", "choices": ["Pay bills that are due first", "Pay only the smallest bill", "Ignore them until next week"]}, {"text": "Now you need food for two weeks.", "choices": ["Make a meal plan and grocery budget", "Buy whatever looks good", "Order delivery tonight"]}, {"text": "Your friends invite you out for dinner.", "choices": ["Check what fun money is available", "Spend $80 without checking", "Pay for everybody"]}, {"text": "Day 3: your gas light comes on.", "choices": ["Budget for enough gas to get to work/school", "Put in a little and hope", "Spend the gas money on a game"]}, {"text": "A paid app you want is on sale for $12.", "choices": ["Check wants money before buying", "Download it immediately", "Start several subscriptions"]}, {"text": "Day 5: the electric bill reminder arrives.", "choices": ["Confirm it is paid/scheduled", "Wait and spend the money", "Ignore the notice"]}, {"text": "Your shoes are worn but still usable. A new pair is $95.", "choices": ["Decide whether it can wait", "Buy them plus another pair", "Use grocery money"]}, {"text": "Day 7: halfway to payday.", "choices": ["Check balance and remaining needs", "Avoid looking at balance", "Go shopping because it is the weekend"]}, {"text": "A streaming subscription renews tomorrow.", "choices": ["Keep/cancel based on budget", "Add another service too", "Forget all subscriptions"]}, {"text": "Day 9: you need lunch away from home.", "choices": ["Pack food you already bought", "Spend $25 on delivery", "Skip planning and buy snacks"]}, {"text": "A friend asks to borrow $50.", "choices": ["Check whether you can afford it and set a boundary", "Give it from bill money", "Give $100 instead"]}, {"text": "Day 10: an unexpected $40 expense comes up.", "choices": ["Use planned cushion/savings if available", "Ignore the expense", "Use money needed for a bill"]}, {"text": "You notice groceries are running low.", "choices": ["Use the remaining grocery plan", "Order expensive takeout", "Buy unrelated items instead"]}, {"text": "Day 11: someone invites you to shop for clothes.", "choices": ["Go only if your budget allows", "Spend the rest of your balance", "Use a pay-later app without a plan"]}, {"text": "Day 12: transportation costs more than expected.", "choices": ["Adjust the remaining budget", "Pretend it did not happen", "Spend normally anyway"]}, {"text": "Day 13: one day until payday.", "choices": ["Review bills, food and transportation", "Spend whatever is left", "Start a new monthly subscription"]}, {"text": "You have some money remaining.", "choices": ["Put part in savings and keep a cushion", "Spend every dollar tonight", "Commit it to several new payments"]}, {"text": "Before the next paycheck, what do you review?", "choices": ["What worked and what needs changing", "Only what you bought for fun", "Nothing"]}, {"text": "Payday arrives again. What is your new plan?", "choices": ["Needs, savings, then planned wants", "Spend first and figure it out later", "Avoid making a plan"]}];let i=0,score=0,choices=[];function speak(){friendlySpeak(document.getElementById('copy').innerText)}function draw(){let s=S[i];document.getElementById('pg').textContent='Page '+(i+1)+' of '+S.length;let buttons=s.choices.map((c,j)=>`<button data-j="${j}">${c}</button>`).join('');document.getElementById('scene').innerHTML=`<div class="art"><img src="images/payday/scene-${String(i+1).padStart(2,'0')}.jpg" alt="Illustration for scene ${i+1}"></div><h1>${i===0?title:'What happens next?'}</h1><p id="copy" style="font-size:19px;line-height:1.55">${i===0?intro+' ':''}${s.text}</p><div class="choices"><button class="read" id="read">🔊 READ TO ME</button>${buttons}</div>`;document.getElementById('read').onclick=speak;document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>pick(+b.dataset.j));}function pick(j){choices.push(j); if(j===0)score+=2; else if(j===1)score+=1; i++; if(i>=S.length)finish(); else draw();}function finish(){let level=score>=S.length*1.45?'You consistently protected your priorities and handled problems early.':score>=S.length*.9?'You made a mix of strong choices and choices that created extra challenges.':'Several early choices created harder consequences later. Replay and see how a different decision changes the story.';document.getElementById('pg').textContent='THE END';document.getElementById('scene').innerHTML=`<div class="art">🏁</div><h1>Here’s How Your Story Turned Out</h1><div class="result"><p style="font-size:19px">${level}</p><p>You completed <b>${S.length} scenes</b>. Your decisions—not a single pass/fail answer—shaped this ending.</p></div><div class="choices"><button id="again">🔄 WRITE A DIFFERENT STORY</button><button class="read" id="readEnd">🔊 READ RESULTS</button><button onclick="print()">🖨 PRINT RESULTS</button></div>`;document.getElementById('again').onclick=()=>{i=0;score=0;choices=[];draw()};document.getElementById('readEnd').onclick=speak;}draw();</script></body></html>
