<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payday Story</title><style>
:root{--navy:#12346b;--blue:#0d5bd7;--red:#e51f3f;--ink:#10254d;--soft:#f6f8fc;--line:#dbe3ef;--green:#138a55;--gold:#f2b544}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#182848;background:#f6f8fc;line-height:1.45}
header{background:linear-gradient(135deg,var(--navy),#0b57c9);color:#fff;padding:28px 20px}.wrap{max-width:1100px;margin:auto;padding:22px}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}nav a,.btn{display:inline-block;background:var(--navy);color:white!important;text-decoration:none;border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.light{background:#fff;color:var(--navy)!important;border:2px solid var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 7px 20px rgba(20,45,90,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card h2,.card h3{color:var(--navy);margin-top:0}.tag{display:inline-block;background:#eaf1ff;color:var(--navy);padding:4px 9px;border-radius:999px;font-weight:700;margin:2px}
.choice{display:block;width:100%;text-align:left;background:#fff;border:2px solid #cbd7ea;border-radius:12px;padding:12px;margin:8px 0;font-size:1rem;cursor:pointer}.choice:hover{border-color:var(--blue);background:#f3f7ff}
.feedback{padding:12px;border-radius:12px;background:#eef7ff;margin-top:12px;display:none}.score{font-weight:900;color:var(--navy)}
input,select,textarea{width:100%;padding:10px;border:1px solid #aebed6;border-radius:9px;font:inherit;margin:6px 0 12px}textarea{min-height:88px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.print-sheet{background:#fff;border:2px solid #182848;border-radius:10px;padding:18px;margin:18px 0}.line{border-bottom:1px solid #444;min-height:28px;margin:8px 0}.bigline{border:1px solid #777;min-height:70px;margin:8px 0;padding:6px}
small.muted,.muted{color:#5d6d86}.pill{display:inline-block;border:1px solid #c9d7ef;background:#f5f8ff;padding:5px 9px;border-radius:999px;margin:3px}
@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:14px}header{padding:22px 14px}}
@media print{header,nav,.no-print,.btn{display:none!important}body{background:#fff}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:0;padding:0}.print-sheet{break-inside:avoid;border:1px solid #000}.only-print{display:block!important}}
</style></head><body>
<header><div class="wrap"><h1 style="margin:0">Payday Story</h1><p style="margin:6px 0 0">Budgeting decision simulator</p><nav><a href="index.html">⌂ Home</a><a href="index.html#staff">🧰 Staff</a><a href="worksheets.html">📝 Worksheets</a><a href="group-projects.html">👥 Group Projects</a><a href="simulators.html">🎮 Simulators</a></nav></div></header>
<main class="wrap"><div class="card"><p><span class="tag">Workplace Readiness Training</span></p><h2 id="sceneTitle"></h2><p id="sceneText"></p><div id="storyChoices"></div></div><div class="print-sheet"><h2>Student Reflection</h2><p>Name: __________________ Date: __________</p><p>What choice did you make?</p><div class="bigline"></div><p>What happened because of that choice?</p><div class="bigline"></div><p>What would you do in real life?</p><div class="bigline"></div><button class="btn no-print" onclick="window.print()">🖨️ Print Reflection</button></div></main><script>const scenes={"start": {"title": "Your First $500 Paycheck", "text": "You have $500. You need transportation, phone service, food, and you want new shoes.", "choices": [["Pay needs first, set aside savings, then decide about shoes", "good"], ["Spend $250 on shoes first", "tight"]]}, "good": {"title": "Money Left for Choices", "text": "You covered important needs and still know what is available for wants.", "choices": []}, "tight": {"title": "Budget Is Tight", "text": "Now required expenses are harder to cover.", "choices": [["Return/rethink the purchase and rebuild the budget", "good"], ["Ignore the bills", "bad"]]}, "bad": {"title": "Bills Are Due", "text": "Ignoring required expenses creates bigger problems. Replay and try a different plan.", "choices": []}}; let i=0; function show(id){let s=scenes[id]; document.getElementById('sceneTitle').textContent=s.title;document.getElementById('sceneText').textContent=s.text;let c=document.getElementById('storyChoices');c.innerHTML='';(s.choices||[]).forEach(ch=>{let b=document.createElement('button');b.className='choice';b.textContent=ch[0];b.onclick=()=>show(ch[1]);c.appendChild(b)});if(!s.choices||!s.choices.length){c.innerHTML='<p><b>Story complete.</b> Use the reflection below or replay.</p><button class="btn" onclick="show('start')">Replay</button>';}}; show('start');</script></body></html>
