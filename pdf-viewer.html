<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transition Team PDF Viewer</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#14213d}.bar{background:#0b2e63;color:white;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar a{background:white;color:#0b2e63;text-decoration:none;padding:10px 14px;border-radius:9px;font-weight:700}.bar .download{background:#d71920;color:white}.title{font-weight:800;flex:1}.note{padding:10px 14px;background:#fff0f5;border-bottom:1px solid #ddd;font-size:14px}iframe{display:block;width:100%;height:calc(100vh - 112px);border:0;background:white}@media(max-width:600px){iframe{height:calc(100vh - 150px)}} </style><link rel="stylesheet" href="session.css"></head><body><div class="bar"><a href="index.html">← Resources</a><div class="title" id="title">PDF Viewer</div><a id="open" target="_blank">Open PDF</a><a class="download" id="download" download>Download PDF</a></div><div class="note">If the preview does not appear on your phone, tap <b>Open PDF</b>. Use <b>Download PDF</b> only when you want to save a copy.</div><iframe id="frame" title="PDF preview"></iframe><script>const p=new URLSearchParams(location.search);const f=p.get('file')||'';if(!/^Transition_Team_[A-Za-z0-9_$.-]+\.pdf$/.test(f)){document.body.innerHTML='<p style="padding:20px">PDF not found.</p>';}else{document.getElementById('title').textContent=f.replace(/^Transition_Team_/,'').replace(/_/g,' ').replace(/\.pdf$/,'');document.getElementById('frame').src=f+'#view=FitH';document.getElementById('open').href=f;document.getElementById('download').href=f;}</script><script src="session.js"></script></body></html>
