<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pizza Shop Employee Center</title><style>*{box-sizing:border-box}body{margin:0;background:#f1e8da;color:#2a211d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#24201e;color:#fff;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top b{font-size:20px;margin-right:auto}.top button{border:0;border-radius:12px;padding:10px 13px;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:14px}.card{background:#fffdf7;border-radius:19px;padding:17px;margin:13px 0;box-shadow:0 7px 24px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.job{border:2px solid #d7c8b4;border-radius:16px;padding:15px;background:#fff}.badge{display:inline-block;background:#f2bd55;padding:6px 10px;border-radius:999px;font-weight:950}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:900;min-height:46px}.red{background:#9f241f;color:#fff}.green{background:#28583d;color:#fff}.white{background:#eee5d8;color:#2a211d}.field{width:100%;padding:11px;border:1px solid #cdbda8;border-radius:11px;margin:5px 0 11px}.order{border-left:6px solid #9f241f;background:#fff7e7;padding:12px;border-radius:12px;margin:8px 0}.ticket{font-family:ui-monospace,monospace;background:#fff;border:1px dashed #777;padding:10px;margin:7px 0}.notice{background:#fff0bf;border:1px solid #dfbc59;border-radius:13px;padding:12px}.good{background:#e7f5e8;border:1px solid #9bc9a0;border-radius:13px;padding:12px}.status{font-weight:950;color:#9f241f}.arch{background:#25211f;color:#fff3d3;border-radius:16px;padding:15px}.arch code{color:#f3cc72}.appgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.wrap{padding:8px}.appgrid{grid-template-columns:1fr}.top b{width:100%}}</style></head><body><header class="top"><b>Pizza Shop Employee Center</b><button onclick="location.href='pizza-shop.html'">Pizza Shop</button><button onclick="PizzaShop.returnToTown()">Town Map</button></header><main id="app" class="wrap"></main><script src="pizza-shop-data.js"></script><script>'use strict';const app=document.getElementById('app'),PS=PizzaShop;let queueTimer=null;function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function isKayla(){return /kayla/i.test(PS.residentName())||new URLSearchParams(location.search).get('manager')==='1'}function resident(w){return w.residents&&w.residents[PS.residentName()]||null}function employment(w){let r=resident(w);return r&&r.employment&&r.employment.pizza||null}function landing(){if(queueTimer){clearInterval(queueTimer);queueTimer=null}let w=PS.world(),e=employment(w),manager=isKayla(),hash=location.hash;if(hash==='#apply'&&!manager&&!e)return application();app.innerHTML=`<section class="card"><span class="badge">${manager?'MANAGER / TEST MODE':e?'PIZZA SHOP EMPLOYEE':'EMPLOYEE ENTRANCE'}</span><h1>Welcome, ${esc(/kayla/i.test(PS.residentName())?'Miss Kayla':PS.residentName())}</h1>${manager?managerHome():e?employeeHome(e):lockedHome()}</section>`}function managerHome(){return `<p>The customer restaurant is live. These employee stations are intentionally being built as full simulations in the next phase rather than shallow click-through activities.</p><div class="grid"><div class="job"><h2>Cashier / Order Taker</h2><p>Future spoken-customer orders, realistic POS categories, modifiers, payment and change.</p></div><div class="job"><h2>Pizza Maker / Kitchen</h2><p>Future multi-ticket make line, dough, sauce, toppings, oven timing, slicing, boxing and order matching.</p></div><div class="job"><h2>Dishwasher</h2><p>Future accumulating dish queue with scrape → wash → rinse → sanitize → dry/store sequencing.</p></div></div><p><button class="btn green" onclick="orderBoard()">Open Live Restaurant Order Board</button> <button class="btn white" onclick="applicationList()">Pizza Applications</button></p><div class="arch"><b>Prepared shared restaurant data:</b><p><code>ttWorld.pizzaOrders[]</code> stores customer, order number, menu items, modifiers, payment state, kitchen tickets, timestamps and status. The future POS and kitchen stations can read the same active orders without changing the customer format.</p><p>Shift target remains <b>5 real minutes = 8 simulated hours</b>. Audio controls will use explicit Play/Replay actions for iPhone Safari compatibility.</p></div>`}function employeeHome(e){return `<h2>${esc(e.position||'Pizza Shop Employee')}</h2><p><b>Wage:</b> $${Number(e.wage||12).toFixed(2)}/hour</p><p><b>Schedule:</b> ${esc(e.schedule||'See Miss Kayla')}</p><div class="notice"><b>Station build in progress.</b> Your employment record, future PIN/time clock, training record, 5-minute shift configuration and shift-report location are reserved now. The full ${esc(e.position||'restaurant')} game will be added in the employee phase.</div>`}function lockedHome(){return `<div class="notice"><b>Employee access is locked.</b><p>Apply for a Pizza Shop position. Miss Kayla can review the application in Transition Town.</p></div><button class="btn red" onclick="application()">Apply to the Pizza Shop</button>`}function application(){app.innerHTML=`<section class="card"><span class="badge">NOW HIRING</span><h1>Pizza Shop Employment Application</h1><p>Practice application. Do not enter real private financial information.</p><form onsubmit="submitApplication(event)"><div class="appgrid"><label>Name<input class="field" name="name" required value="${esc(PS.residentName())}"></label><label>Position<select class="field" name="position"><option>Cashier / Order Taker</option><option>Pizza Maker / Kitchen</option><option>Dishwasher</option><option>Restaurant Crew - Any Station</option></select></label><label>Desired Hours<input class="field" name="hours" type="number" min="1" max="40"></label><label>Can you arrive on time?<select class="field" name="attendance"><option>Yes</option><option>No</option></select></label></div><label>Why would you be a good Pizza Shop employee?<textarea class="field" name="why" rows="3" required></textarea></label><label>A restaurant gets busy and several orders arrive at once. What should you do?<textarea class="field" name="busy" rows="3" required></textarea></label><label>What should you do before handling food or clean dishes?<textarea class="field" name="sanitation" rows="3" required></textarea></label><button class="btn red" type="submit">Submit to Miss Kayla</button> <button class="btn white" type="button" onclick="landing()">Back</button></form></section>`}function submitApplication(ev){ev.preventDefault();let fd=new FormData(ev.target),a={};fd.forEach((v,k)=>a[k]=v);a.resident=PS.residentName();a.employer='Transition Town Pizza Shop';a.status='Pending Ms. Kayla Review';a.submitted=new Date().toISOString();let w=PS.world();w.pizzaApplications=w.pizzaApplications||[];w.pizzaApplications.push(a);PS.saveWorld(w);app.innerHTML='<section class="card"><div class="good"><b>Application submitted!</b><p>Your Pizza Shop application was sent to Miss Kayla for review on this device.</p></div><button class="btn green" onclick="landing()">Employee Center</button></section>'}function applicationList(){let w=PS.world(),a=w.pizzaApplications||[];app.innerHTML=`<section class="card"><h1>Pizza Shop Applications</h1>${a.length?a.slice().reverse().map(x=>`<div class="order"><b>${esc(x.resident||x.name)}</b> — ${esc(x.position)}<br><small>${esc(x.status)} • ${esc(x.submitted||'')}</small></div>`).join(''):'<div class="notice">No Pizza Shop applications yet.</div>'}<button class="btn white" onclick="landing()">Back</button></section>`}function orderBoard(){renderOrderBoard();queueTimer=setInterval(renderOrderBoard,1000)}function renderOrderBoard(){let w=PS.world(),orders=(w.pizzaOrders||[]).filter(o=>!o.completed).map(o=>PS.syncOrderStatus(o.id)||o);app.innerHTML=`<section class="card"><span class="badge">LIVE RESTAURANT BOARD</span><h1>Active Orders</h1><p>This board proves the customer side is creating reusable orders for the future cashier and kitchen games.</p>${orders.length?orders.map(o=>`<div class="order"><b>ORDER #${o.id}</b> • <span class="status">${esc(o.status)}</span><br><small>${esc(o.resident)} • ${o.items.length} item(s) • ${PS.money(o.total)} • ${esc(o.paymentStatus)}</small>${(o.kitchen&&o.kitchen.tickets||[]).map(t=>`<div class="ticket">KITCHEN TICKET ${t.ticket}<br>${esc(t.orderItem.name)}<br>STATUS: ${esc(t.status)}</div>`).join('')}</div>`).join(''):'<div class="notice">No active customer orders right now.</div>'}<button class="btn white" onclick="landing()">Back</button></section>`}landing();</script></body></html>
