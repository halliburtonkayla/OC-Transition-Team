<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pizza Shop Employee Center</title><style>*{box-sizing:border-box}body{margin:0;background:#f1e8da;color:#2a211d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#24201e;color:#fff;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top b{font-size:20px;margin-right:auto}.top button{border:0;border-radius:12px;padding:10px 13px;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:14px}.card{background:#fffdf7;border-radius:19px;padding:17px;margin:13px 0;box-shadow:0 7px 24px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.job{border:2px solid #d7c8b4;border-radius:16px;padding:15px;background:#fff}.badge{display:inline-block;background:#f2bd55;padding:6px 10px;border-radius:999px;font-weight:950}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:900;min-height:46px}.red{background:#9f241f;color:#fff}.green{background:#28583d;color:#fff}.white{background:#eee5d8;color:#2a211d}.field{width:100%;padding:11px;border:1px solid #cdbda8;border-radius:11px;margin:5px 0 11px}.order{border-left:6px solid #9f241f;background:#fff7e7;padding:12px;border-radius:12px;margin:8px 0}.ticket{font-family:ui-monospace,monospace;background:#fff;border:1px dashed #777;padding:10px;margin:7px 0}.notice{background:#fff0bf;border:1px solid #dfbc59;border-radius:13px;padding:12px}.good{background:#e7f5e8;border:1px solid #9bc9a0;border-radius:13px;padding:12px}.status{font-weight:950;color:#9f241f}.arch{background:#25211f;color:#fff3d3;border-radius:16px;padding:15px}.arch code{color:#f3cc72}.appgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.clock{font-size:42px;font-weight:1000;text-align:center}.shiftbar{height:16px;background:#ddd;border-radius:999px;overflow:hidden}.shiftbar i{display:block;height:100%;background:#28583d}.makegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.makegrid button{min-height:56px}.ovenbar{height:22px;background:#ddd;border-radius:999px;overflow:hidden}.ovenbar i{display:block;height:100%;background:#9f241f}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.statgrid div{background:#f5eee4;padding:10px;border-radius:12px}@media(max-width:600px){.wrap{padding:8px}.appgrid{grid-template-columns:1fr}.top b{width:100%}}</style><link rel="stylesheet" href="pizza-employee-game.css?v=20261004-5"></head><body><header class="top"><b>Pizza Shop Employee Center</b><button onclick="location.href='pizza-shop.html'">Pizza Shop</button><button onclick="PizzaShop.returnToTown()">Town Map</button></header><main id="app" class="wrap"></main><script src="pizza-shop-data.js"></script><script>'use strict';const app=document.getElementById('app'),PS=PizzaShop;let queueTimer=null,shiftTimer=null,shift=null;const REAL_SHIFT=300,WORK_HOURS=8;function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function isKayla(){return /kayla/i.test(PS.residentName())||new URLSearchParams(location.search).get('manager')==='1'}function resident(w){return w.residents&&w.residents[PS.residentName()]||null}function employment(w){let r=resident(w);return r&&r.employment&&r.employment.pizza||null}function landing(){stopTimers();let w=PS.world(),e=employment(w),manager=isKayla(),hash=location.hash;if(hash==='#apply'&&!manager&&!e)return application();app.innerHTML=`<section class="card"><span class="badge">${manager?'MANAGER / TEST MODE':e?'PIZZA SHOP EMPLOYEE':'EMPLOYEE ENTRANCE'}</span><h1>Welcome, ${esc(/kayla/i.test(PS.residentName())?'Miss Kayla':PS.residentName())}</h1>${manager?managerHome():e?employeeHome(e):lockedHome()}</section>`}function managerHome(){return `<p>Choose a Pizza Shop station to test. Miss Kayla test shifts do not deposit wages or overwrite student employment.</p><div class="grid"><div class="job"><h2>Cashier / Order Taker</h2><p>Spoken orders and POS/change gameplay is the next detailed station build.</p><button class="btn white" onclick="training('Cashier / Order Taker')">Training</button></div><div class="job"><h2>Pizza Maker / Kitchen</h2><p>Work live tickets, build pizzas, manage the oven, box them and send them to pickup.</p><button class="btn green" onclick="training('Pizza Maker / Kitchen')">Training / Clock In</button></div><div class="job"><h2>Dishwasher</h2><p>Sanitation station is reserved for the next detailed build.</p><button class="btn white" onclick="training('Dishwasher')">Training</button></div><div class="job"><h2>Order Pickup / Counter</h2><p>Pickup station is reserved and will share the same restaurant orders.</p><button class="btn white" onclick="training('Order Pickup / Counter')">Training</button></div></div><p><button class="btn green" onclick="orderBoard()">Open Live Restaurant Order Board</button> <button class="btn white" onclick="applicationList()">Pizza Applications</button></p><div class="arch"><b>Shared restaurant system:</b><p><code>ttWorld.pizzaOrders[]</code> is used across customer, cashier, kitchen and pickup. Pizza Maker shifts use the same ticket objects instead of unrelated practice orders.</p><p><b>Shift clock:</b> 5 real minutes = 8 simulated hours (8:00 AM–4:00 PM).</p></div>`}function employeeHome(e){let role=e.position||'Pizza Shop Employee';return `<h2>${esc(role)}</h2><p><b>Wage:</b> ${Number(e.wage||12).toFixed(2)}/hour</p><p><b>Schedule:</b> ${esc(e.schedule||'See Miss Kayla')}</p><button class="btn green" onclick="training('${esc(role).replace(/'/g,"\\'")}')">TRAINING / TIME CLOCK</button>`}function lockedHome(){return `<div class="notice"><b>Employee access is locked.</b><p>Apply for a Pizza Shop position. Miss Kayla can review the application in Transition Town.</p></div><button class="btn red" onclick="application()">Apply to the Pizza Shop</button>`}function stopTimers(){if(queueTimer){clearInterval(queueTimer);queueTimer=null}if(shiftTimer){clearInterval(shiftTimer);shiftTimer=null}}
function roleKey(role){return /pizza maker|kitchen/i.test(role)?'kitchen':/cashier/i.test(role)?'cashier':/dish/i.test(role)?'dishwasher':'pickup'}
function empPin(){let w=PS.world(),r=resident(w),e=employment(w);if(isKayla())return '6437';if(e&&e.pin)return String(e.pin);let n=PS.residentName(),sum=0;for(let i=0;i<n.length;i++)sum+=n.charCodeAt(i)*(i+3);let pin=String(1000+(sum%9000));if(e){e.pin=pin;PS.saveWorld(w)}return pin}
function training(role){stopTimers();let k=roleKey(role),lesson=k==='kitchen'?'<b>Kitchen training:</b> Read the ticket first. Start the correct dough, follow sauce/cheese/topping modifiers, use oven time wisely, and work on another ticket while food cooks. Match every finished item to the correct order number before sending it to pickup.':k==='cashier'?'<b>Cashier training:</b> Listen carefully, enter exactly what the customer says, read the order back, handle payment accurately, then send the same order to the kitchen.':'<b>Station training:</b> Follow food-safety procedures, keep your station organized, and match work to the correct order.';app.innerHTML=`<section class="card"><span class="badge">${esc(role)} TRAINING</span><h1>Before You Clock In</h1><div class="good">${lesson}</div><p><button class="btn white" onclick="PS.speak('${k==='kitchen'?'Read every kitchen ticket before starting. Work efficiently, but accuracy and food safety come before speed. While one pizza is cooking, begin the next safe task. Match every order number before sending food to pickup.':'Listen carefully to instructions, work accurately, and ask a supervisor when you are unsure.'}')">▶ PLAY AUDIO INSTRUCTIONS</button></p><p><button class="btn green" onclick="timeClock('${esc(role).replace(/'/g,"\\'")}')">GO TO TIME CLOCK</button> <button class="btn white" onclick="landing()">Back</button></p></section>`}
function timeClock(role){let pin=empPin();app.innerHTML=`<section class="card"><span class="badge">EMPLOYEE TIME CLOCK</span><h1>Clock In</h1><p>Shift: <b>8:00 AM–4:00 PM</b> • 5 real minutes</p>${isKayla()?'<div class="notice">Miss Kayla Test PIN: <b>6437</b></div>':'<div class="notice">Your Pizza Shop PIN is shown on your employee profile: <b>'+esc(pin)+'</b></div>'}<label>Enter PIN<input id="pin" class="field" inputmode="numeric" maxlength="4" type="password"></label><p id="pinmsg"></p><button class="btn green" onclick="clockIn('${esc(role).replace(/'/g,"\\'")}')">CLOCK IN</button> <button class="btn white" onclick="landing()">Cancel</button></section>`}
function clockIn(role){let v=document.getElementById('pin').value;if(v!==empPin()){document.getElementById('pinmsg').innerHTML='<span class="notice">Incorrect PIN. Try again.</span>';return}let now=Date.now();shift={role,start:now,end:now+REAL_SHIFT*1000,completed:0,correct:0,mistakes:0,oven:null,current:null,service:0,safety:0,cleanliness:0};let k=roleKey(role);if(k==='kitchen')startKitchen();else if(k==='cashier'&&typeof startCashier==='function')startCashier();else if(k==='dishwasher'&&typeof startCleanup==='function')startCleanup();else if(typeof startPickup==='function')startPickup();else throw new Error('Pizza employee game did not load. Refresh this page.')}
function stationPlaceholder(role){let k=roleKey(role);if(k==='cashier'&&typeof startCashier==='function')return startCashier();if(k==='dishwasher'&&typeof startCleanup==='function')return startCleanup();if(k==='pickup'&&typeof startPickup==='function')return startPickup();if(k==='kitchen')return startKitchen();app.innerHTML='<section class="card"><div class="notice"><b>The employee game did not load.</b><p>Refresh the page so Safari loads the newest Pizza Shop files.</p></div></section>'}
function activeKitchenOrders(){let w=PS.world(),a=(w.pizzaOrders||[]).filter(o=>!o.completed&&o.items&&o.items.some(i=>i.type==='pizza'));return a.slice(0,3)}
function seedKitchenOrder(){let samples=[{name:'Large Hand Tossed Pepperoni • Light Sauce • Extra Cheese',details:{size:'Large',crust:'Hand Tossed',pizza:'Pepperoni',sauce:'Light',modifiers:{Pepperoni:'Regular','Extra Cheese':'Extra'}}},{name:'Medium Thin Crust Sausage • No Onions',details:{size:'Medium',crust:'Thin Crust',pizza:'Sausage',sauce:'Regular',modifiers:{Sausage:'Regular',Onions:'No'}}},{name:'Large Pan Supreme',details:{size:'Large',crust:'Pan',pizza:'Supreme',sauce:'Regular',modifiers:{Pepperoni:'Regular',Sausage:'Regular',Mushrooms:'Regular',Onions:'Regular','Green Peppers':'Regular','Black Olives':'Regular'}}}];let s=samples[Math.floor(Math.random()*samples.length)];return PS.addOrder({resident:'Restaurant Customer',items:[{type:'pizza',name:s.name,price:15.99,details:s.details}],total:15.99,paymentStatus:'PAID',source:'restaurant-rush',queue:'kitchen',kitchen:{tickets:[{ticket:1,orderItem:{type:'pizza',name:s.name,details:s.details},status:'QUEUED'}]}})}
function ensureRush(){let a=activeKitchenOrders();while(a.length<Math.min(3,1+Math.floor(shift.completed/2))){seedKitchenOrder();a=activeKitchenOrders()}return a}
function shiftClock(){let left=Math.max(0,shift.end-Date.now()),pct=Math.min(100,100-(left/(REAL_SHIFT*1000)*100)),workMin=Math.round(pct/100*480),h=8+Math.floor(workMin/60),m=workMin%60,amp=h>=12?'PM':'AM',hh=h>12?h-12:h;return {left:Math.ceil(left/1000),pct,time:hh+':'+String(m).padStart(2,'0')+' '+amp}}
function startKitchen(){ensureRush();renderKitchen();shiftTimer=setInterval(()=>{let t=shiftClock();if(t.left<=0)return clockOutPrompt();if(shift.oven&&Date.now()>=shift.oven.readyAt&&!shift.oven.ready){shift.oven.ready=true}renderKitchen(false)},500)}
function renderKitchen(scroll=true){let t=shiftClock(),orders=ensureRush();let cards=orders.map(o=>{let p=o.items.find(i=>i.type==='pizza');return `<div class="ticket"><b>ORDER #${o.id}</b><br>${esc(p.name)}<br><button class="btn green" onclick="selectTicket(${o.id})">${shift.current&&shift.current.id===o.id?'WORKING':'START ORDER'}</button></div>`}).join('');let work=shift.current?makeStation(shift.current):'<div class="notice">Select a kitchen ticket to begin. As your shift progresses, more orders will overlap.</div>';app.innerHTML=`<section class="card"><span class="badge">PIZZA MAKER • CLOCKED IN</span><div class="clock">${t.time}</div><div class="shiftbar"><i style="width:${t.pct}%"></i></div><p>${Math.floor(t.left/60)}:${String(t.left%60).padStart(2,'0')} real time remaining</p><div class="statgrid"><div><b>${shift.completed}</b><br>Orders</div><div><b>${shift.correct}</b><br>Correct Steps</div><div><b>${shift.mistakes}</b><br>Corrections</div></div></section><section class="card"><h2>Kitchen Tickets</h2>${cards}</section><section class="card">${work}</section>`;if(scroll)window.scrollTo(0,0)}
function selectTicket(id){let o=PS.getOrder(id),p=o&&o.items.find(i=>i.type==='pizza');if(!p)return;shift.current={id,step:'dough',pizza:p,chosen:{}};renderKitchen()}
function makeStation(x){let d=x.pizza.details||{},step=x.step;if(step==='dough')return `<h2>Order #${x.id} — Dough</h2><p>Select the correct dough/size.</p><div class="makegrid">${['Personal','Small','Medium','Large','Extra Large'].map(v=>`<button class="btn white" onclick="kitchenChoice('dough','${v}')">${v}</button>`).join('')}</div>`;if(step==='crust')return `<h2>Crust</h2><div class="makegrid">${['Hand Tossed','Thin Crust','Pan','Stuffed Crust'].map(v=>`<button class="btn white" onclick="kitchenChoice('crust','${v}')">${v}</button>`).join('')}</div>`;if(step==='sauce')return `<h2>Spread Sauce</h2><p>Ticket calls for <b>${esc(d.sauce||'Regular')} Sauce</b>.</p><div class="makegrid">${['Light','Regular','Extra'].map(v=>`<button class="btn white" onclick="kitchenChoice('sauce','${v}')">${v} Sauce</button>`).join('')}</div>`;if(step==='toppings')return toppingStation(x);if(step==='oven')return ovenStation(x);if(step==='cut')return `<h2>Cut & Box</h2><p>The pizza is cooked. Cut it evenly, then box it.</p><button class="btn green" onclick="kitchenAdvance('box')">CUT PIZZA</button>`;if(step==='box')return `<h2>Box & Match</h2><p>Match this pizza to its order number.</p><div class="makegrid">${[x.id,x.id+1,x.id+2].sort(()=>Math.random()-.5).map(n=>`<button class="btn white" onclick="matchOrder(${n})">ORDER #${n}</button>`).join('')}</div>`;return ''}
function kitchenChoice(kind,v){let d=shift.current.pizza.details||{},correct=kind==='dough'?d.size:kind==='crust'?d.crust:(d.sauce||'Regular');if(String(v).toLowerCase()===String(correct).toLowerCase()){shift.correct++;shift.current.step=kind==='dough'?'crust':kind==='crust'?'sauce':'toppings'}else shift.mistakes++;renderKitchen()}
function toppingStation(x){let d=x.pizza.details||{},mods=d.modifiers||{},need=Object.entries(mods).filter(([k,v])=>!/no/i.test(v)).map(([k,v])=>k),done=x.chosen.toppings||[];return `<h2>Add Cheese & Toppings</h2><p>Read the ticket. Tap ingredients to add them. Then check your pizza.</p><div class="ticket">${esc(x.pizza.name)}</div><div class="makegrid">${PS.menu.toppings.map(v=>`<button class="btn ${done.includes(v)?'green':'white'}" onclick="toggleTop('${esc(v).replace(/'/g,"\\'")}')">${esc(v)}</button>`).join('')}</div><p><button class="btn green" onclick="checkToppings()">CHECK TOPPINGS</button></p>`}
function toggleTop(v){let a=shift.current.chosen.toppings||(shift.current.chosen.toppings=[]),i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);renderKitchen(false)}
function checkToppings(){let d=shift.current.pizza.details||{},mods=d.modifiers||{},need=Object.entries(mods).filter(([k,v])=>!/no/i.test(v)).map(([k])=>k).sort(),got=(shift.current.chosen.toppings||[]).slice().sort();if(JSON.stringify(need)===JSON.stringify(got)){shift.correct++;shift.current.step='oven'}else shift.mistakes++;renderKitchen()}
function ovenStation(x){if(!shift.oven)return `<h2>Oven</h2><p>Put Order #${x.id} into the accelerated oven. Correct cook time is about <b>12–18 seconds</b>.</p><button class="btn green" onclick="putInOven()">PUT PIZZA IN OVEN</button>`;let sec=(Date.now()-shift.oven.inAt)/1000,level=Math.min(100,sec/22*100),label=sec<12?'UNDERCOOKED':sec<=18?'READY WINDOW':'BURNING';return `<h2>Order #${x.id} — IN OVEN</h2><div class="ovenbar"><i style="width:${level}%"></i></div><p><b>${label}</b> • ${sec.toFixed(1)} sec</p><p>While this cooks, you may select another ticket above to see what is waiting, but remember which order is in the oven.</p><button class="btn red" onclick="removeOven()">REMOVE FROM OVEN</button>`}
function putInOven(){shift.oven={id:shift.current.id,inAt:Date.now(),readyAt:Date.now()+12000};renderKitchen()}
function removeOven(){if(!shift.oven)return;let sec=(Date.now()-shift.oven.inAt)/1000;if(sec<12||sec>18){shift.mistakes++;let msg=sec<12?'UNDERCOOKED — remake required.':'BURNED — remake required.';shift.oven=null;shift.current.step='sauce';app.innerHTML=`<section class="card"><div class="notice"><b>${msg}</b><p>Food quality matters. Start the remake and keep the ticket.</p></div><button class="btn green" onclick="renderKitchen()">REMAKE</button></section>`;return}shift.correct++;shift.oven=null;shift.current.step='cut';renderKitchen()}
function kitchenAdvance(step){shift.correct++;shift.current.step=step;renderKitchen()}
function matchOrder(n){if(n!==shift.current.id){shift.mistakes++;renderKitchen();return}let o=PS.getOrder(n);if(o){let k=o.kitchen||{};(k.tickets||[]).forEach(t=>t.status='READY FOR PICKUP');PS.patchOrder(n,{kitchen:k,status:'READY FOR PICKUP',readyAt:Date.now()})}shift.completed++;shift.correct++;shift.current=null;ensureRush();renderKitchen()}
function clockOutPrompt(){stopTimers();app.innerHTML=`<section class="card"><span class="badge">END OF SHIFT</span><h1>4:00 PM</h1><p>Your 8-hour simulated shift is complete.</p><label>Enter your PIN to clock out<input id="pin" class="field" inputmode="numeric" maxlength="4" type="password"></label><p id="pinmsg"></p><button class="btn red" onclick="clockOut()">CLOCK OUT</button></section>`}
function clockOut(){if(document.getElementById('pin').value!==empPin()){document.getElementById('pinmsg').innerHTML='<span class="notice">Incorrect PIN.</span>';return}let preview=isKayla(),w=PS.world(),e=employment(w),wage=Number(e&&e.wage||12),gross=Math.round(wage*WORK_HOURS*100)/100,report={business:'Transition Town Pizza Shop',employee:PS.residentName(),position:shift.role,clockIn:'8:00 AM',clockOut:'4:00 PM',hours:8,ordersCompleted:shift.completed,correctSteps:shift.correct,corrections:shift.mistakes,gross,preview,date:new Date().toISOString()};w.employeeShiftReports=w.employeeShiftReports||[];w.employeeShiftReports.push(report);if(!preview){let r=resident(w);if(r){r.checking=Math.round((Number(r.checking||0)+gross)*100)/100;e.shifts=e.shifts||[];e.shifts.push(report)}}PS.saveWorld(w);app.innerHTML=`<section class="card"><div class="good"><h1>Clocked Out at 4:00 PM</h1><p>Timecard: 8:00 AM–4:00 PM • 8.0 hours</p></div><div class="statgrid"><div><b>${shift.completed}</b><br>Orders</div><div><b>${shift.correct}</b><br>Correct Steps</div><div><b>${shift.mistakes}</b><br>Corrections</div></div><p><b>Gross pay:</b> ${gross.toFixed(2)} ${preview?'(Manager preview — not deposited)':''}</p><button class="btn green" onclick="landing()">EMPLOYEE CENTER</button></section>`}
function application(){app.innerHTML=`<section class="card"><span class="badge">NOW HIRING</span><h1>Pizza Shop Employment Application</h1><p>Practice application. Do not enter real private financial information.</p><form onsubmit="submitApplication(event)"><div class="appgrid"><label>Name<input class="field" name="name" required value="${esc(PS.residentName())}"></label><label>Position<select class="field" name="position"><option>Cashier / Order Taker</option><option>Pizza Maker / Kitchen</option><option>Dishwasher</option><option>Restaurant Crew - Any Station</option></select></label><label>Desired Hours<input class="field" name="hours" type="number" min="1" max="40"></label><label>Can you arrive on time?<select class="field" name="attendance"><option>Yes</option><option>No</option></select></label></div><label>Why would you be a good Pizza Shop employee?<textarea class="field" name="why" rows="3" required></textarea></label><label>A restaurant gets busy and several orders arrive at once. What should you do?<textarea class="field" name="busy" rows="3" required></textarea></label><label>What should you do before handling food or clean dishes?<textarea class="field" name="sanitation" rows="3" required></textarea></label><button class="btn red" type="submit">Submit to Miss Kayla</button> <button class="btn white" type="button" onclick="landing()">Back</button></form></section>`}function submitApplication(ev){ev.preventDefault();let fd=new FormData(ev.target),a={};fd.forEach((v,k)=>a[k]=v);a.resident=PS.residentName();a.employer='Transition Town Pizza Shop';a.status='Pending Ms. Kayla Review';a.submitted=new Date().toISOString();let w=PS.world();w.pizzaApplications=w.pizzaApplications||[];w.pizzaApplications.push(a);PS.saveWorld(w);app.innerHTML='<section class="card"><div class="good"><b>Application submitted!</b><p>Your Pizza Shop application was sent to Miss Kayla for review on this device.</p></div><button class="btn green" onclick="landing()">Employee Center</button></section>'}function applicationList(){let w=PS.world(),a=w.pizzaApplications||[];app.innerHTML=`<section class="card"><h1>Pizza Shop Applications</h1>${a.length?a.slice().reverse().map(x=>`<div class="order"><b>${esc(x.resident||x.name)}</b> — ${esc(x.position)}<br><small>${esc(x.status)} • ${esc(x.submitted||'')}</small></div>`).join(''):'<div class="notice">No Pizza Shop applications yet.</div>'}<button class="btn white" onclick="landing()">Back</button></section>`}function orderBoard(){renderOrderBoard();queueTimer=setInterval(renderOrderBoard,1000)}function renderOrderBoard(){let w=PS.world(),orders=(w.pizzaOrders||[]).filter(o=>!o.completed).map(o=>PS.syncOrderStatus(o.id)||o);app.innerHTML=`<section class="card"><span class="badge">LIVE RESTAURANT BOARD</span><h1>Active Orders</h1><p>This board proves the customer side is creating reusable orders for the future cashier and kitchen games.</p>${orders.length?orders.map(o=>`<div class="order"><b>ORDER #${o.id}</b> • <span class="status">${esc(o.status)}</span><br><small>${esc(o.resident)} • ${o.items.length} item(s) • ${PS.money(o.total)} • ${esc(o.paymentStatus)}</small>${(o.kitchen&&o.kitchen.tickets||[]).map(t=>`<div class="ticket">KITCHEN TICKET ${t.ticket}<br>${esc(t.orderItem.name)}<br>STATUS: ${esc(t.status)}</div>`).join('')}</div>`).join(''):'<div class="notice">No active customer orders right now.</div>'}<button class="btn white" onclick="landing()">Back</button></section>`}landing();</script><script src="pizza-employee-game.js?v=20261004-5"></script><script src="tt-notifications.js?v=20261005-shared1"></script>
</body></html>
