<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Reading Room | Transition Team</title><style>
:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--paper:#fffdf7}*{box-sizing:border-box}body{margin:0;background:#eef2f8;font-family:Arial,sans-serif;color:#1d2a40}nav{background:var(--navy);padding:15px 20px}nav a{color:#fff;text-decoration:none;font-weight:900}main{max-width:1050px;margin:auto;padding:24px}.hero,.reader{background:#fff;border-radius:22px;padding:28px;box-shadow:0 8px 28px #102a5c18}.hero h1,.reader h1,h2{font-family:Georgia,serif;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin-top:22px}.card{background:#fff;border:1px solid #dbe3ef;border-top:7px solid var(--blue);border-radius:16px;padding:20px;box-shadow:0 5px 18px #102a5c12}.card:nth-child(even){border-top-color:var(--red)}button{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:11px 14px;font-weight:900;cursor:pointer}.reader{display:none}.roles{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.role{background:#e9f0ff;border-radius:999px;padding:8px 11px;font-weight:800}.line{padding:15px 18px;margin:11px 0;border-left:6px solid #b8c8e8;background:#f8faff;border-radius:0 12px 12px 0;font-size:1.1rem;line-height:1.55}.line b{color:var(--navy)}.narrator{border-left-color:#d49b00;background:#fff8e7}.prompt{background:#eef8f1;border:1px solid #b8ddc3;border-radius:13px;padding:15px;margin:20px 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.alt{background:#e5ebf5;color:#102a5c}@media print{nav,.hero,.toolbar{display:none!important}.reader{display:block!important;box-shadow:none;padding:0}body{background:white}}</style></head><body>
<nav><a href="group-projects.html">← Group Projects</a></nav><main><section class="hero" id="library"><h1>Group Reading Room</h1><p>Give each student a character. Students read their own lines while one student or staff member reads the narrator. These are group readings—not performances—so students can focus on communication, listening, workplace language, and problem-solving.</p><div class="grid" id="cards"></div></section><section class="reader" id="reader"><h1 id="title"></h1><p id="skill"></p><div class="roles" id="roles"></div><div id="script"></div><div class="toolbar"><button onclick="window.print()">Print Group Reading</button><button class="alt" onclick="back()">Choose Another Reading</button></div></section></main>
<script>
const readings=[
{t:"The Busy Lunch Rush",skill:"Workplace Readiness — teamwork, customer service, and correcting mistakes",roles:["Narrator","Tasha — Server","Devin — Cook","Mia — Cashier","Mr. Lee — Manager","Customer"],lines:[["Narrator","The restaurant is busier than expected. Tasha brings an order to the kitchen."],["Tasha","Table three needs a burger with no cheese and fries."],["Devin","I heard burger, cheese, and fries."],["Tasha","Wait—I said no cheese. Let me make sure the ticket says it clearly."],["Mia","I also have a customer waiting because their total looks wrong."],["Mr. Lee","Let's handle one problem at a time. Tasha, confirm table three. Mia, show me the receipt. Devin, hold that burger until Tasha confirms it."],["Customer","Thank you. I have an allergy, so I really do need it without cheese."],["Tasha","Thank you for telling me. I marked the ticket and told the kitchen directly."],["Devin","Got it. I'll remake it and keep it separate."],["Narrator","The team slows down just enough to communicate clearly instead of letting the rush create a bigger mistake."]],q:"Discuss: What did the team do that prevented the mistake from getting worse?"},
{t:"The Schedule Mix-Up",skill:"Self-Advocacy — asking for clarification and communicating about work schedules",roles:["Narrator","Jordan — Employee","Ms. Carter — Manager","Alyssa — Coworker"],lines:[["Narrator","Jordan checks next week's schedule and notices he is listed for Tuesday at 3:00, but he had previously told Ms. Carter about a school appointment."],["Jordan","Alyssa, do you think I should just find somebody to cover it?"],["Alyssa","I'd talk to Ms. Carter first. She may not remember the appointment."],["Jordan","Ms. Carter, can I ask you about Tuesday's schedule? I have the school appointment I mentioned last week."],["Ms. Carter","Thanks for reminding me. Did you submit the availability form too?"],["Jordan","Yes. I can show you the confirmation if you need it."],["Ms. Carter","Perfect. This was my mistake. I'll correct the schedule. Next time, keep doing exactly what you did—tell me early and keep your documentation."],["Narrator","Jordan solved the problem without getting angry, skipping work, or assuming the manager would remember."]],q:"Discuss: What could have happened if Jordan simply did not show up?"},
{t:"The Group Project Deadline",skill:"Workplace Readiness — teamwork, accountability, and handling an unfinished task",roles:["Narrator","Cam — Team Lead","Nia — Designer","Eli — Researcher","Sam — Presenter"],lines:[["Narrator","A four-person team has one class period left to finish a business presentation."],["Cam","We still need the final slide and somebody has to check the numbers."],["Nia","I'm still working on the logo. I thought Eli was checking the numbers."],["Eli","I researched them, but nobody told me I was supposed to check the final slide."],["Sam","We can argue about whose fault it is, or we can divide what's left."],["Cam","Okay. Eli, check the numbers. Nia, finish the logo but stop in ten minutes. Sam, practice the presentation. I'll finish the last slide."],["Nia","That works. If I'm not done in ten minutes, I'll use the simpler logo."],["Narrator","The group stops blaming each other and makes a specific plan with a deadline for each task."]],q:"Discuss: Which line changed the direction of the group? Why?"},
{t:"The Customer Is Upset",skill:"Workplace Readiness — customer service, staying calm, and knowing when to get a supervisor",roles:["Narrator","Keisha — Cashier","Customer","Andre — Coworker","Ms. Patel — Supervisor"],lines:[["Narrator","A customer returns to the register holding a receipt."],["Customer","I was charged twice for this. I need you to fix it right now."],["Keisha","I can see why you'd want that corrected. Let me look at the receipt."],["Customer","I don't have time to stand here all day."],["Andre","Keisha, do you want me to call Ms. Patel?"],["Keisha","Yes, please. I can check the receipt, but I need a supervisor to approve a refund."],["Ms. Patel","Thank you for waiting. I found the duplicate charge and I can correct it."],["Customer","Okay. Thank you."],["Narrator","Keisha did not argue, promise something she could not authorize, or take the customer's frustration personally."]],q:"Discuss: When should an employee get a supervisor instead of trying to solve everything alone?"},
{t:"First Apartment Meeting",skill:"Independent Living — budgeting, shared responsibilities, and respectful communication",roles:["Narrator","Maya — Roommate","Chris — Roommate","Aunt Renee — Trusted Adult"],lines:[["Narrator","Maya and Chris are thinking about sharing an apartment after graduation. They sit down to talk about money before signing anything."],["Maya","The rent is eight hundred dollars, so that's four hundred each."],["Chris","Right. That sounds affordable."],["Aunt Renee","What about electricity, water, internet, groceries, deposits, furniture, and transportation?"],["Chris","I didn't add all of that."],["Maya","And we need to decide what happens if one of us can't pay our part one month."],["Aunt Renee","Exactly. Being able to afford half the rent is not the same as being able to afford the apartment."],["Chris","Let's make the full monthly budget before we apply."],["Narrator","They decide to calculate the entire cost and agree on responsibilities before making a commitment."]],q:"Discuss: What expenses besides rent should someone consider before moving out?"},
{t:"The Training Choice",skill:"Postsecondary Education — comparing training paths and asking questions",roles:["Narrator","Avery — Student","Mom","Mr. Davis — Counselor","Taylor — Friend"],lines:[["Narrator","Avery wants to become an automotive technician. Taylor plans to attend a four-year university and wants Avery to come too."],["Taylor","We could room together. You can figure out your major later."],["Mom","I just want you to choose something that leads to a job."],["Avery","I want to compare the university with the technical program before I decide."],["Mr. Davis","Good. Let's compare program length, cost, credentials, hands-on training, and employment options."],["Avery","Can we also check whether either program has internships or employer partnerships?"],["Mr. Davis","Absolutely. That's the kind of question that helps you compare programs based on your career goal."],["Narrator","Avery listens to other people's opinions but gathers information before making the decision."]],q:"Discuss: What information would you want before choosing a college or training program?"}
];
function renderCards(){document.getElementById('cards').innerHTML=readings.map((r,i)=>'<article class="card"><h2>'+r.t+'</h2><p>'+r.skill+'</p><p><b>'+r.roles.length+' reading parts</b></p><button onclick="openR('+i+')">Open Group Reading</button></article>').join('')}
function openR(i){let r=readings[i];document.getElementById('library').style.display='none';document.getElementById('reader').style.display='block';document.getElementById('title').textContent=r.t;document.getElementById('skill').innerHTML='<b>'+r.skill+'</b>';document.getElementById('roles').innerHTML=r.roles.map(x=>'<span class="role">'+x+'</span>').join('');document.getElementById('script').innerHTML=r.lines.map(x=>'<div class="line '+(x[0]==='Narrator'?'narrator':'')+'"><b>'+x[0]+':</b> '+x[1]+'</div>').join('')+'<div class="prompt"><b>'+r.q+'</b></div>';window.scrollTo(0,0)}
function back(){document.getElementById('reader').style.display='none';document.getElementById('library').style.display='block';window.scrollTo(0,0)}renderCards();
</script><script src="session.js"></script></body></html>
