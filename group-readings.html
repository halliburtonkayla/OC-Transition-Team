<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Reading Room | Transition Team</title><style>
:root{--navy:#102a5c;--blue:#0751bd;--red:#e1192f;--paper:#fffdf7}*{box-sizing:border-box}body{margin:0;background:#eef2f8;font-family:Arial,sans-serif;color:#1d2a40}nav{background:var(--navy);padding:15px 20px}nav a{color:#fff;text-decoration:none;font-weight:900}main{max-width:1050px;margin:auto;padding:24px}.hero,.reader{background:#fff;border-radius:22px;padding:28px;box-shadow:0 8px 28px #102a5c18}.hero h1,.reader h1,h2{font-family:Georgia,serif;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;margin-top:22px}.card{background:#fff;border:1px solid #dbe3ef;border-top:7px solid var(--blue);border-radius:16px;padding:20px;box-shadow:0 5px 18px #102a5c12}.card:nth-child(even){border-top-color:var(--red)}button{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:11px 14px;font-weight:900;cursor:pointer}.reader{display:none}.roles{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.role{background:#e9f0ff;border-radius:999px;padding:8px 11px;font-weight:800}.line{padding:15px 18px;margin:11px 0;border-left:6px solid #b8c8e8;background:#f8faff;border-radius:0 12px 12px 0;font-size:1.1rem;line-height:1.55}.line b{color:var(--navy)}.narrator{border-left-color:#d49b00;background:#fff8e7}.prompt{background:#eef8f1;border:1px solid #b8ddc3;border-radius:13px;padding:15px;margin:20px 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.alt{background:#e5ebf5;color:#102a5c}@media print{nav,.hero,.toolbar{display:none!important}.reader{display:block!important;box-shadow:none;padding:0}body{background:white}}</style></head><body>
<nav><a href="group-projects.html">← Group Projects</a></nav><main><section class="hero" id="library"><h1>Group Reading Room</h1><p>Give each student a character. Students read their own lines while one student or staff member reads the narrator. These are group readings—not performances—so students can focus on communication, listening, workplace language, and problem-solving.</p><div class="grid" id="cards"></div></section><section class="reader" id="reader"><h1 id="title"></h1><p id="skill"></p><div class="roles" id="roles"></div><div id="script"></div><div class="toolbar"><button onclick="window.print()">Print Group Reading</button><button class="alt" onclick="back()">Choose Another Reading</button></div></section></main>
<script>
const readings=[
{t:"The Shift That Went Sideways",skill:"Workplace Readiness — communication, teamwork, mistakes, and accountability",roles:["Narrator","Jordan — New Employee","Ms. Carter — Manager","Tiana — Coworker","Mr. Brooks — Customer"],lines:[
["Narrator","It is Jordan's third week at the grocery store. Friday evening is packed. Carts are everywhere, the checkout lines are long, and Ms. Carter has asked Jordan to restock bottled water before the dinner rush."],
["Ms. Carter","Jordan, aisle six is almost empty. Start with the bottled water, then come find me when you're finished."],
["Jordan","Got it. Water first, then I come back to you."],
["Narrator","Halfway to the stockroom, Jordan's coworker Tiana waves him over. She looks stressed."],
["Tiana","Jordan, can you help me bring these carts in? I'm way behind."],
["Jordan","Ms. Carter told me to stock water first."],
["Tiana","It'll only take a minute. Come on."],
["Narrator","Jordan wants to help, but he also knows he was given a specific assignment. He decides not to guess."],
["Jordan","Let me check with Ms. Carter so I don't leave my assignment unfinished."],
["Ms. Carter","Good call. Finish the water first. I'll send somebody else to help Tiana."],
["Narrator","Twenty minutes later, a customer stops Jordan in aisle six."],
["Mr. Brooks","I've been looking everywhere for sugar-free lemonade. Your website says you have it."],
["Jordan","I haven't learned where everything is yet, but I can help you find out. Let me check instead of sending you around the store."],
["Narrator","Jordan checks the store device, but he accidentally reads the shelf number for a different product."],
["Jordan","It should be on aisle nine, section four."],
["Mr. Brooks","I already checked aisle nine. It's not there."],
["Jordan","I'm sorry. I may have read that wrong. Let me fix it instead of making you keep searching."],
["Narrator","Jordan asks Tiana, who shows him how to read the inventory screen correctly."],
["Tiana","See this number? That's the quantity. The location is underneath it."],
["Jordan","Ohhh. I see what I did. Thank you."],
["Jordan","Mr. Brooks, I found it. It's actually on aisle twelve. I'll walk you there."],
["Mr. Brooks","Thank you for actually checking."],
["Narrator","At the end of the shift, Jordan tells Ms. Carter about the mistake before she even asks."],
["Jordan","I sent a customer to the wrong aisle because I read the inventory screen wrong. Tiana showed me how to read it correctly, and I went back and helped him."],
["Ms. Carter","Mistakes happen. What matters is that you corrected it, learned from it, and didn't hide it. Next shift, I'll give you five minutes to practice with the inventory system."],
["Narrator","Jordan leaves work realizing that being a good employee does not mean never making mistakes. It means communicating, correcting them, and learning what to do differently next time."]
],q:"Group discussion: Jordan faced three workplace decisions. Where could the shift have gone badly if he had guessed, hidden the mistake, or ignored his original assignment?"},
{t:"The Lunch Table Screenshot",skill:"Self-Advocacy — friendship, digital choices, peer pressure, and repairing harm",roles:["Narrator","Maya","Keisha","Lena","Darius"],lines:[
["Narrator","At lunch, Maya tells Keisha and Lena that she is thinking about applying to a training program after graduation instead of going to the same college as their friend group."],
["Maya","I haven't told everybody yet. I just want to look at the program first."],
["Keisha","That actually sounds like a good fit for you."],
["Lena","Wait, so you're really not coming with us?"],
["Maya","I don't know yet. That's why I don't want everybody talking about it."],
["Narrator","Later that afternoon, Lena sends Darius a screenshot of the conversation with the message, 'Guess Maya thinks she's too good for our plan now.'"],
["Darius","Why'd you send me this if she said she didn't want everybody knowing?"],
["Lena","It's not that serious. I only sent it to you."],
["Narrator","By the next morning, Maya has heard that people are saying she is abandoning her friends."],
["Maya","Keisha, how did everybody find out?"],
["Keisha","I didn't tell anybody. But I think we need to figure out what happened instead of starting another rumor."],
["Narrator","Lena hears them talking and has a choice: stay quiet or admit what she did."],
["Lena","Maya... I sent Darius the screenshot. I didn't think he'd say anything."],
["Darius","I didn't post it, but I did mention it to somebody. I shouldn't have."],
["Maya","I trusted y'all with something I wasn't ready to share."],
["Lena","You're right. Saying I only sent it to one person doesn't make it okay. I'm sorry."],
["Narrator","Maya does not immediately say everything is fine."],
["Maya","I appreciate the apology, but I'm still mad. I need some space. And please stop talking about my plans with other people."],
["Keisha","That's fair."],
["Narrator","The conversation is uncomfortable, but nobody turns it into another argument. Lena and Darius begin correcting the rumor without sharing more of Maya's private information."],
["Darius","If somebody asks me, I'm just going to say we shouldn't be discussing somebody else's plans."],
["Narrator","The friendship is not magically repaired by the end of lunch. Trust takes longer than an apology. But the group finally understands that screenshots, private conversations, and 'only telling one person' can have real consequences."]
],q:"Group discussion: Who had responsibility in this situation? Was Maya required to accept the apology immediately? What would rebuilding trust actually look like?"},
{t:"The Apartment Nobody Could Afford",skill:"Independent Living — budgeting, roommates, leases, and difficult conversations",roles:["Narrator","Chris","Maya","Devon","Aunt Renee","Leasing Agent"],lines:[
["Narrator","Chris, Maya, and Devon are excited about getting their first apartment after graduation. They find a place online for $1,050 a month."],
["Chris","That's only $350 each. We can definitely do that."],
["Maya","The pictures are nice too. We should apply before somebody else gets it."],
["Devon","I make about nine hundred dollars a month right now, so three-fifty isn't bad."],
["Narrator","Before they pay the application fee, Maya asks her Aunt Renee to look over the listing."],
["Aunt Renee","Where are the utilities?"],
["Chris","Utilities?"],
["Aunt Renee","Electricity, water, internet. What about the security deposit? Application fees? Furniture? Groceries? Transportation?"],
["Narrator","The three friends become quieter."],
["Maya","Okay. Maybe we need the real numbers."],
["Narrator","They call the leasing office together."],
["Leasing Agent","The security deposit is $1,050. Water is included, but electricity and internet are not. Everyone over eighteen who lives there must be on the lease."],
["Devon","What happens if one roommate can't pay their part one month?"],
["Leasing Agent","The full rent is still due according to the lease."],
["Narrator","That answer changes the conversation."],
["Chris","So if one of us doesn't have the money, the other two can't just tell the landlord it wasn't our part?"],
["Aunt Renee","That's why you read the lease before signing it."],
["Devon","I need to be real with y'all. My hours change every week. Some months I don't make nine hundred."],
["Maya","I'm glad you said that now instead of after we moved in."],
["Chris","Maybe we're not ready for this apartment yet."],
["Narrator","They are disappointed. They had already pictured the furniture and who would get which bedroom."],
["Maya","What if we don't give up on moving out? What if we figure out what income we'd actually need and make it a goal?"],
["Aunt Renee","Now you're planning instead of just shopping for apartments."],
["Narrator","They leave without applying. It feels less exciting than signing a lease that day, but they now have a savings goal, a list of monthly expenses, and a better understanding of what living independently actually costs."]
],q:"Group discussion: At what point did the apartment stop looking affordable? What questions should roommates answer before they ever sign a lease together?"},
{t:"The Customer Who Wouldn't Calm Down",skill:"Workplace Readiness — de-escalation, boundaries, supervisors, and professionalism",roles:["Narrator","Keisha — Cashier","Mr. Allen — Customer","Andre — Coworker","Ms. Patel — Supervisor"],lines:[
["Narrator","Keisha is working the service desk when Mr. Allen walks up holding a receipt and a bag."],
["Mr. Allen","I was charged twice. I've already been standing in line for fifteen minutes. Fix it."],
["Keisha","I can check the receipt for you. Let me see what happened."],
["Narrator","Keisha finds two charges, but store policy requires a supervisor to approve this type of refund."],
["Keisha","I do see the duplicate charge. I need my supervisor to approve the refund, so I'm going to call her over."],
["Mr. Allen","Why can't you just do your job?"],
["Narrator","Keisha feels embarrassed because other customers can hear him."],
["Andre","Keisha, you okay?"],
["Keisha","Yes. Can you please call Ms. Patel to the desk?"],
["Mr. Allen","I want my money back now."],
["Keisha","I understand you want this corrected quickly. I can't authorize the refund myself, but my supervisor is on the way."],
["Narrator","Mr. Allen continues complaining, but Keisha does not argue or promise something outside her authority."],
["Ms. Patel","Good afternoon. I'm Ms. Patel. Keisha showed me the duplicate charge. I can correct that for you."],
["Mr. Allen","Finally."],
["Ms. Patel","I'll process it now. Keisha followed the correct procedure by calling me because this refund requires supervisor approval."],
["Narrator","After the customer leaves, Keisha looks frustrated."],
["Keisha","I knew I was doing it right, but when he said I couldn't do my job, I started second-guessing myself."],
["Ms. Patel","You stayed calm, explained what you could do, and got help when you reached the limit of your authority. That's exactly what I needed you to do."],
["Andre","And you didn't match his attitude. I probably would've wanted to."],
["Keisha","Oh, I wanted to. I just didn't."],
["Narrator","They laugh, but the lesson sticks: professionalism is not about never feeling irritated. It is about choosing what you do with that feeling while you are at work."]
],q:"Group discussion: Which parts of Keisha's response were professional? Where is the line between helping a customer and accepting disrespect?"},
{t:"The Decision After Graduation",skill:"Postsecondary Education — career goals, family expectations, cost, and self-advocacy",roles:["Narrator","Avery — Student","Mom","Taylor — Friend","Mr. Davis — Counselor"],lines:[
["Narrator","Avery wants to work on cars for a living. Graduation is five months away, and suddenly everyone seems to have an opinion about what Avery should do next."],
["Taylor","Come to the university with me. We can room together and you can pick a major later."],
["Mom","Four-year college isn't the only option. I just don't want you taking on a bunch of debt with no plan."],
["Avery","Everybody keeps telling me what not to do. I need to figure out what actually gets me where I want to go."],
["Narrator","Avery schedules a meeting with Mr. Davis."],
["Mr. Davis","Start with the career goal, not the school name. What do you want to be able to do?"],
["Avery","Automotive repair. Maybe eventually have my own shop."],
["Mr. Davis","Then let's compare programs that actually train for that."],
["Narrator","They look at a technical program, a community-college automotive program, and the university Taylor likes."],
["Avery","The university costs more, and it doesn't have the automotive program I want."],
["Mr. Davis","That doesn't make the university bad. It means you need to ask whether it matches your goal."],
["Narrator","That evening, Avery talks with Mom."],
["Avery","The technical program is shorter and has hands-on training. The community college takes longer but includes more general education and an associate degree. I want to visit both."],
["Mom","That's different from just saying you don't want college. You're showing me you've actually researched it."],
["Avery","I still want your opinion. I just want the decision to make sense for the job I want."],
["Narrator","Taylor is disappointed when Avery explains the plan."],
["Taylor","So we won't be at the same school?"],
["Avery","Maybe not. But I can't pick my training just so we can stay together."],
["Taylor","Yeah. I get it. I don't love it, but I get it."],
["Narrator","Avery has not made the final decision yet. But now the decision is based on cost, training, credentials, and career fit—not simply pressure from the loudest person in the room."]
],q:"Group discussion: How did Avery disagree with people without disrespecting them? What facts should matter when comparing training options?"},
{t:"The Coworker Who Keeps Asking",skill:"Self-Advocacy — coworker boundaries, teamwork, and asking a supervisor for help",roles:["Narrator","Nia — Employee","Caleb — Coworker","Ms. Green — Supervisor","Tori — Coworker"],lines:[
["Narrator","Nia and Caleb work the same evening shift at a retail store. For the third time this week, Caleb asks Nia to finish part of his closing work."],
["Caleb","Can you straighten my section again? I need to leave right at nine."],
["Nia","I still have my own section and returns to finish."],
["Caleb","You're faster than me. It'll take you like ten minutes."],
["Narrator","Nia helped the first two times because she wanted to be a good teammate. Now she is starting to fall behind on her own work."],
["Tori","You know you can tell him no, right?"],
["Nia","I don't want everybody thinking I'm not a team player."],
["Tori","Helping sometimes is teamwork. Doing his job every shift is different."],
["Narrator","Caleb asks again near closing."],
["Caleb","So can you get my section?"],
["Nia","I can't take your whole section tonight. I have to finish the work Ms. Green assigned me."],
["Caleb","Wow. Okay. I thought we helped each other here."],
["Narrator","Nia feels guilty, but she sticks to the boundary."],
["Nia","I can show you how I straighten mine quickly, but I can't finish yours for you."],
["Narrator","Later, Ms. Green notices tension between them."],
["Ms. Green","Everything okay?"],
["Nia","I want to be helpful, but I've been doing part of Caleb's closing work several nights and then rushing my own tasks. I told him I can't keep doing that."],
["Ms. Green","Thank you for telling me. I'll handle the job assignments. You should help coworkers when it's reasonable, but you are still responsible for completing your own assigned work."],
["Narrator","Nia learns that a workplace boundary can be respectful and still be firm. Being dependable does not mean saying yes to every request."]
],q:"Group discussion: When does helping a coworker become taking responsibility for their job? How could Nia set the boundary without creating unnecessary conflict?"}
];
function renderCards(){document.getElementById('cards').innerHTML=readings.map((r,i)=>'<article class="card"><h2>'+r.t+'</h2><p>'+r.skill+'</p><p><b>'+r.roles.length+' reading parts</b></p><button onclick="openR('+i+')">Open Group Reading</button></article>').join('')}
function openR(i){let r=readings[i];document.getElementById('library').style.display='none';document.getElementById('reader').style.display='block';document.getElementById('title').textContent=r.t;document.getElementById('skill').innerHTML='<b>'+r.skill+'</b>';document.getElementById('roles').innerHTML=r.roles.map(x=>'<span class="role">'+x+'</span>').join('');document.getElementById('script').innerHTML=r.lines.map(x=>'<div class="line '+(x[0]==='Narrator'?'narrator':'')+'"><b>'+x[0]+':</b> '+x[1]+'</div>').join('')+'<div class="prompt"><b>'+r.q+'</b></div>';window.scrollTo(0,0)}
function back(){document.getElementById('reader').style.display='none';document.getElementById('library').style.display='block';window.scrollTo(0,0)}renderCards();
</script><script src="session.js"></script></body></html>
